BRE ela.","A 3ª edição dispensou ‘digníssimo’ e o superlativo ‘ilustríssimo’; ‘doutor’ não é forma de tratamento, é título acadêmico.","Decreto 9.758/2019: na comunicação com agentes públicos da administração pública federal, o tratamento é ‘senhor/senhora’, sendo vedado usar ‘Vossa Excelência’, ‘Vossa Senhoria’, ‘doutor’, ‘ilustríssimo’, ‘digníssimo’ etc.","O e-mail é aceito como comunicação oficial; deve ter campo ‘assunto’ claro e linguagem formal. Fonte recomendada no padrão ofício: Calibri ou Carlito, corpo 12."],"pegadinhas":["Dizer que ainda existem três expedientes distintos (aviso, ofício e memorando) com diagramação própria.","Inverter os fechos: ‘Atenciosamente’ para superior e ‘Respeitosamente’ para inferior.","Concordar o pronome de tratamento na 2ª pessoa (‘Vossa Excelência estais’, ‘vosso’): o correto é 3ª pessoa.","Aplicar ‘Excelentíssimo Senhor’ a qualquer autoridade (é reservado aos chefes de Poder)."],"base_legal":"Manual de Redação da Presidência da República, 3ª edição (2018); Decreto 9.758/2019 (formas de tratamento na administração pública federal).","questoes":[]},{"id":"rlm-01","disciplina":"Raciocínio Lógico-Matemático","topico":"Estruturas lógicas e lógica de argumentação (analogias, inferências, deduções)","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Argumento é um conjunto de premissas que leva a uma conclusão. Ele é VÁLIDO quando, se as premissas forem verdadeiras, a conclusão for necessariamente verdadeira. Validade é sobre a forma do raciocínio, não sobre a verdade das frases.","pontos":["Proposição: frase declarativa que pode ser julgada como V ou F. NÃO são proposições: perguntas, exclamações, ordens, sentenças abertas (‘x + 2 = 5’, ‘ele é servidor’) e paradoxos (‘esta frase é falsa’).","Sentença aberta: tem variável (sujeito indeterminado); vira proposição quando a variável é definida ou quantificada (P22-046).","Argumento válido: não existe caso com premissas todas V e conclusão F. Argumento inválido (falácia): existe ao menos um caso assim.","Modus ponens (válido): Se p, então q. Ocorreu p. Logo, q.","Modus tollens (válido): Se p, então q. Não ocorreu q. Logo, não p.","Falácia de afirmar o consequente (inválido): Se p, então q. Ocorreu q. Logo, p. Falácia de negar o antecedente (inválido): Se p, então q. Não p. Logo, não q.","Silogismo disjuntivo (válido): p ou q. Não p. Logo, q.","Silogismo categórico: use diagramas de Euler-Venn. ‘Todo A é B’ = A dentro de B; ‘Nenhum A é B’ = círculos separados; ‘Algum A é B’ = círculos com interseção não vazia.","Método prático para testar validade: suponha a conclusão FALSA e premissas VERDADEIRAS; se der contradição, o argumento é válido.","Um argumento pode ser válido com premissas falsas e conclusão falsa; e pode ser inválido com conclusão verdadeira."],"pegadinhas":["Dizer que o argumento é inválido porque uma premissa é falsa no mundo real: validade só depende da forma.","Apresentar afirmação do consequente como se fosse modus ponens.","Tratar sentença aberta ou pergunta como proposição.","Concluir ‘Todo B é A’ a partir de ‘Todo A é B’ (a recíproca não vale)."],"base_legal":"Não se aplica (conteúdo de Raciocínio Lógico).","questoes":["RLM-001","P22-046"]},{"id":"rlm-02","disciplina":"Raciocínio Lógico-Matemático","topico":"Lógica proposicional: conectivos e tabelas-verdade","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Proposições simples são ligadas por conectivos (não, e, ou, ou...ou, se...então, se e somente se) formando proposições compostas. A tabela-verdade mostra o valor da composta para cada combinação de valores das simples.","pontos":["Número de linhas da tabela-verdade = 2^n, em que n é o número de proposições simples DISTINTAS. 2 → 4 linhas; 3 → 8; 4 → 16.","Negação (~p, ‘não p’): inverte o valor.","Conjunção (p ∧ q, ‘p e q’): só é V quando as duas são V. ‘Mas’, ‘nem’ (= e não) e vírgula aditiva também indicam conjunção.","Disjunção inclusiva (p ∨ q, ‘p ou q’): só é F quando as duas são F.","Disjunção exclusiva (p ⊻ q, ‘ou p ou q’): é V quando os valores são DIFERENTES; F quando iguais.","Condicional (p → q, ‘se p, então q’): só é F quando p é V e q é F (V → F = F). Nos demais casos é V. Tabela: VV=V; VF=F; FV=V; FF=V.","Formas do condicional: ‘Se p, q’; ‘p implica q’; ‘quando p, q’; ‘p é condição suficiente para q’; ‘q é condição necessária para p’; ‘p somente se q’.","Bicondicional (p ↔ q, ‘p se e somente se q’): é V quando os valores são IGUAIS; F quando diferentes.","Ordem de precedência sem parênteses: ~, depois ∧, ∨, depois →, por último ↔.","Exemplo: P = ‘Se me mandou mensagem, (meu filho lembrou-se de mim) e (quer ser lembrado por mim)’ tem 3 proposições simples → 8 linhas (P22-047)."],"pegadinhas":["Contar como 4 proposições simples quando uma se repete ou contar errado as simples (P22-047: são 3, logo 8 linhas, não 16).","Achar que o condicional com antecedente falso é falso (F → qualquer coisa é V).","Confundir ‘ou’ inclusivo com ‘ou... ou’ exclusivo.","Inverter condição suficiente e necessária."],"base_legal":"Não se aplica (conteúdo de Raciocínio Lógico).","questoes":["RLM-002","P22-047","P22-046"]},{"id":"rlm-03","disciplina":"Raciocínio Lógico-Matemático","topico":"Equivalências lógicas, negação de proposições e tautologia","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Duas proposições são equivalentes quando têm a mesma tabela-verdade. Negar uma proposição é escrever outra que tenha sempre o valor oposto. É um dos assuntos que MAIS caem em provas Cebraspe.","pontos":["Negação de ‘e’ (De Morgan): ~(p ∧ q) ≡ ~p ∨ ~q. ‘Não é verdade que estudou e passou’ = ‘Não estudou OU não passou’.","Negação de ‘ou’ (De Morgan): ~(p ∨ q) ≡ ~p ∧ ~q. ‘Não é verdade que estuda ou trabalha’ = ‘Não estuda E não trabalha’ (= ‘nem estuda nem trabalha’).","Negação de ‘se...então’: ~(p → q) ≡ p ∧ ~q. ‘Se chove, levo guarda-chuva’ → negação: ‘Chove E não levo guarda-chuva’. (A negação do condicional NÃO é outro condicional.)","Negação do bicondicional: ~(p ↔ q) ≡ ‘ou p ou q’ (disjunção exclusiva) ≡ p ↔ ~q.","Equivalências do condicional: p → q ≡ ~q → ~p (contrapositiva) ≡ ~p ∨ q. ‘Se é servidor, é concursado’ ≡ ‘Se não é concursado, não é servidor’ ≡ ‘Não é servidor ou é concursado’.","NÃO são equivalentes a p → q: a recíproca (q → p) e a inversa (~p → ~q).","Bicondicional: p ↔ q ≡ (p → q) ∧ (q → p).","Negação com quantificadores: ~(Todo A é B) = Algum A não é B; ~(Algum A é B) = Nenhum A é B; ~(Nenhum A é B) = Algum A é B; ~(Algum A não é B) = Todo A é B.","Tautologia: sempre V em todas as linhas (ex.: p ∨ ~p; (p ∧ q) → p). Contradição: sempre F (ex.: p ∧ ~p). Contingência: às vezes V, às vezes F.","Dupla negação: ~(~p) ≡ p. ‘Não é verdade que ele não veio’ = ‘Ele veio’."],"pegadinhas":["Negar ‘p e q’ com ‘não p e não q’ / ‘nem p nem q’ (P22-048: o correto é ‘não p OU não q’).","Negar ‘Todo A é B’ com ‘Nenhum A é B’ (o correto é ‘Algum A não é B’).","Negar ‘Se p, então q’ com ‘Se p, então não q’ ou com ‘Se não p, então não q’.","Apresentar a recíproca (q → p) como equivalente ao condicional."],"base_legal":"Não se aplica (conteúdo de Raciocínio Lógico).","questoes":["P22-048","RLM-002"]},{"id":"rlm-04","disciplina":"Raciocínio Lógico-Matemático","topico":"Lógica de conjuntos","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Conjuntos organizam elementos com características comuns. Na prova, aparecem em problemas com diagramas de Venn (‘quantos gostam de A e B?’), muitas vezes misturados com porcentagem.","pontos":["União (A ∪ B): elementos de A OU de B. Interseção (A ∩ B): elementos de A E de B. Diferença (A − B): só de A. Complementar: o que falta para o universo.","Fórmula da união: n(A ∪ B) = n(A) + n(B) − n(A ∩ B).","Para 3 conjuntos: n(A ∪ B ∪ C) = n(A) + n(B) + n(C) − n(A∩B) − n(A∩C) − n(B∩C) + n(A∩B∩C).","Método do diagrama: preencha SEMPRE de dentro para fora: primeiro a interseção, depois as partes ‘só A’, ‘só B’, por último ‘nenhum’.","‘Desses’ indica percentual sobre um SUBCONJUNTO: 65% gostam de atendimento e, desses, 30% gostam também de administrativo → ambos = 30% de 65% = 19,5% do total (P22-050).","Se todos gostam de pelo menos uma modalidade: administrativo = 100% − 65% + 19,5% = 54,5% (P22-049).","Número de subconjuntos de um conjunto com n elementos = 2^n. O conjunto vazio é subconjunto de qualquer conjunto.","Pertinência (∈) relaciona elemento com conjunto; inclusão (⊂) relaciona conjunto com conjunto.","Conjuntos numéricos: N ⊂ Z ⊂ Q ⊂ R; irracionais (√2, π) não são racionais."],"pegadinhas":["Somar n(A) + n(B) sem subtrair a interseção (contagem dupla).","Tratar ‘30% desses’ como 30% do total (P22-050: são 19,5%, menos de 20%).","Confundir ‘só A’ com ‘A’ (que inclui a interseção)."],"base_legal":"Não se aplica (conteúdo de Raciocínio Lógico).","questoes":["P22-049","P22-050"]},{"id":"rlm-05","disciplina":"Raciocínio Lógico-Matemático","topico":"Princípios de contagem (análise combinatória)","recorrencia":"media","provas":[2012,2016,2022],"resumo":"Contagem calcula de quantas maneiras algo pode acontecer sem listar todas as possibilidades. A pergunta-chave é: a ORDEM dos elementos importa? Se importa, é arranjo/permutação; se não importa, é combinação.","pontos":["Princípio fundamental da contagem (PFC): etapas sucessivas e independentes se MULTIPLICAM. 3 camisas e 4 calças → 3 × 4 = 12 combinações de roupa.","Princípio aditivo: casos que se excluem (‘ou’) se SOMAM.","Fatorial: n! = n × (n−1) × ... × 1. 0! = 1; 3! = 6; 4! = 24; 5! = 120; 6! = 720.","Permutação simples (todos os elementos, ordem importa): P(n) = n!. Anagramas de AMOR = 4! = 24.","Permutação com repetição: n! / (a! × b! × ...). Anagramas de ARARA = 5! / (3! × 2!) = 10.","Arranjo (escolher p de n, ordem importa): A(n,p) = n! / (n−p)!. Presidente e vice entre 10 pessoas: 10 × 9 = 90.","Combinação (escolher p de n, ordem NÃO importa): C(n,p) = n! / [p! × (n−p)!]. Comissão de 2 entre 10 pessoas: 45.","Permutação circular (pessoas em volta de uma mesa): (n − 1)!.","Teste prático: troque a ordem de dois escolhidos; se o resultado muda (cargos diferentes, senhas, filas), é arranjo; se não muda (comissões, grupos), é combinação.","Restrições (‘começar com vogal’, ‘duas pessoas sempre juntas’): resolva primeiro a posição com restrição; para ‘juntas’, trate o par como um bloco e multiplique por 2!."],"pegadinhas":["Usar combinação em problema em que os cargos são diferentes (deveria ser arranjo).","Esquecer de dividir pelas repetições em anagramas com letras repetidas.","Somar quando deveria multiplicar (etapas sucessivas)."],"base_legal":"Não se aplica (conteúdo de Raciocínio Lógico).","questoes":[]},{"id":"rlm-06","disciplina":"Raciocínio Lógico-Matemático","topico":"Probabilidade","recorrencia":"media","provas":[2012,2016,2022],"resumo":"Probabilidade mede a chance de um evento acontecer: casos favoráveis divididos por casos possíveis. Usa os mesmos princípios de contagem e de conjuntos.","pontos":["P(A) = número de casos favoráveis / número de casos possíveis. Sempre 0 ≤ P(A) ≤ 1 (0% a 100%).","Evento complementar: P(não A) = 1 − P(A).","‘Pelo menos um’: calcule 1 − P(nenhum). Ex.: lançar 2 moedas, P(pelo menos uma cara) = 1 − 1/4 = 3/4.","União (‘A ou B’): P(A ∪ B) = P(A) + P(B) − P(A ∩ B). Se mutuamente exclusivos, P(A ∩ B) = 0.","Eventos independentes (‘A e B’): P(A ∩ B) = P(A) × P(B). Ex.: dois dados, P(dois seis) = 1/6 × 1/6 = 1/36.","Sem reposição, o espaço amostral diminui: urna com 3 bolas azuis e 2 vermelhas, P(2 azuis seguidas) = 3/5 × 2/4 = 3/10.","Probabilidade condicional: P(A | B) = P(A ∩ B) / P(B): a chance de A sabendo que B ocorreu (o ‘universo’ passa a ser B).","Exemplo com conjuntos: se 65% gostam de atendimento e 19,5% gostam de ambos, P(gostar de administrativo | gosta de atendimento) = 19,5 / 65 = 30%.","Um dado tem 6 faces; uma moeda, 2; um baralho comum, 52 cartas (4 naipes × 13).","Probabilidade não tem ‘memória’ em eventos independentes: depois de 5 caras, a chance de cara continua 1/2."],"pegadinhas":["Somar probabilidades de eventos que deveriam ser multiplicados (‘e’ sucessivo).","Esquecer que sem reposição o total diminui.","Confundir P(A | B) com P(B | A)."],"base_legal":"Não se aplica (conteúdo de Raciocínio Lógico).","questoes":["P22-049","P22-050"]},{"id":"rlm-07","disciplina":"Raciocínio Lógico-Matemático","topico":"Porcentagem, razão e proporção","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Porcentagem é uma razão com denominador 100. Razão compara duas grandezas por divisão; proporção é a igualdade entre duas razões. São a base de vários itens ‘disfarçados’ em situações do INSS (percentual de segurados, reajustes, descontos).","pontos":["x% = x/100. 30% de 65% = 0,30 × 0,65 = 0,195 = 19,5%.","Aumento de i%: multiplique por (1 + i). Desconto de i%: multiplique por (1 − i). Aumento de 10% → × 1,10; desconto de 31% → × 0,69.","Aumentos/descontos sucessivos se MULTIPLICAM, não se somam: +10% e depois −10% = 1,1 × 0,9 = 0,99 → perda de 1%.","Dois aumentos de 10% = 1,1 × 1,1 = 1,21 → aumento total de 21% (não 20%).","Variação percentual = (valor final − valor inicial) / valor inicial. Ex.: de R$ 2.074 para R$ 1.434 → queda de cerca de 31%.","Pontos percentuais x porcentagem: taxa que passa de 10% para 12% subiu 2 pontos percentuais, mas 20% em termos relativos.","Razão a/b: comparação por divisão (3 em cada 4 = 3/4 = 75%). Escala = distância no mapa / distância real.","Proporção a/b = c/d: produto dos meios = produto dos extremos (a × d = b × c).","Grandezas diretamente proporcionais: uma dobra, a outra dobra (regra de três direta). Inversamente proporcionais: uma dobra, a outra cai pela metade (mais trabalhadores → menos dias).","Divisão proporcional: para dividir 900 na proporção 2:3:4, some as partes (9) → cada parte vale 100 → 200, 300 e 400."],"pegadinhas":["Somar porcentagens sucessivas (10% + 10% = 20%) em vez de multiplicar os fatores.","Calcular a porcentagem sobre a base errada (‘desses’ x ‘do total’).","Confundir pontos percentuais com variação percentual.","Tratar grandezas inversamente proporcionais com regra de três direta."],"base_legal":"Não se aplica (conteúdo de Raciocínio Lógico).","questoes":["P22-049","P22-050","P22-002"]},{"id":"rlm-08","disciplina":"Raciocínio Lógico-Matemático","topico":"Relações arbitrárias entre pessoas, lugares, objetos ou eventos fictícios (dedução de novas informações)","recorrencia":"media","provas":[2012,2016,2022],"resumo":"São os ‘problemas de lógica’ com pistas: quem mora onde, quem fala a verdade, qual a ordem de chegada. O segredo é organizar as informações numa tabela e eliminar possibilidades até sobrar uma.","pontos":["Monte uma tabela de dupla entrada (pessoas × características) e marque X (impossível) e O (confirmado). Cada linha e cada coluna tem apenas um O.","Comece pelas pistas mais diretas (afirmações categóricas: ‘Ana é a médica’) e depois use as negativas (‘Bruno não mora em Recife’).","Quando uma linha tem todas as opções eliminadas menos uma, ela é a resposta: e elimina aquela opção nas outras linhas.","Problemas de verdade e mentira: suponha que uma pessoa diz a verdade e veja se há contradição; se houver, ela mente. Quem diz a verdade fala sempre a verdade; quem mente, sempre mente.","Afirmações contraditórias (uma é a negação da outra) não podem ser ambas verdadeiras nem ambas falsas: exatamente uma é verdadeira. Use isso para começar.","Ordenação (filas, alturas, chegada): desenhe uma linha e posicione os elementos; ‘imediatamente antes’ é diferente de ‘antes’.","Sequências lógicas: procure padrão de soma, multiplicação, alternância ou posição de letras no alfabeto (A=1, B=2...).","Analogias: identifique a relação do primeiro par (parte/todo, causa/efeito, função) e aplique ao segundo.","No Cebraspe, o item costuma afirmar uma conclusão (‘necessariamente Carlos é o mais alto’): verifique se ela vale em TODOS os cenários possíveis, não só em um."],"pegadinhas":["Marcar Certo para algo que é possível, quando o item afirma que é necessário (‘necessariamente’, ‘certamente’).","Confundir ‘imediatamente à esquerda’ com ‘à esquerda’.","Esquecer que a negação de uma pista também é informação útil."],"base_legal":"Não se aplica (conteúdo de Raciocínio Lógico).","questoes":["RLM-001","P22-046"]},{"id":"inf-01","disciplina":"Informática","topico":"Hardware e software (conceitos básicos)","recorrencia":"media","provas":[2012,2016,2022],"resumo":"Hardware é a parte física do computador (o que se toca); software são os programas (instruções). Questões cobram tipos de memória, dispositivos de entrada e saída e classificações de software.","pontos":["CPU (processador): executa as instruções; tem Unidade de Controle (UC), Unidade Lógica e Aritmética (ULA) e registradores. Núcleos (cores) permitem processamento paralelo.","Memória RAM: principal, de trabalho, VOLÁTIL (perde dados sem energia). Memória ROM: só leitura, NÃO volátil (guarda o firmware). Cache: pequena e muito rápida, entre CPU e RAM.","Armazenamento (memória secundária, não volátil): HD (disco magnético, mais lento), SSD (memória flash, sem partes móveis, mais rápido), pendrive, cartão de memória.","Dispositivos de entrada: teclado, mouse, scanner, microfone, webcam. Saída: monitor, impressora, caixa de som. Entrada e saída (híbridos): tela touchscreen, multifuncional, modem, pendrive.","Unidades: 1 byte = 8 bits; 1 KB = 1.024 bytes; 1 MB = 1.024 KB; 1 GB = 1.024 MB; 1 TB = 1.024 GB.","Firmware/BIOS/UEFI: software gravado na placa-mãe que inicializa o hardware e carrega o sistema operacional.","Software básico: sistema operacional (Windows, Linux, macOS, Android). Aplicativos: editores, navegadores. Utilitários: antivírus, compactadores, ferramentas de manutenção. Driver: faz o SO ‘conversar’ com um dispositivo.","Software livre: garante as 4 liberdades (executar, estudar o código-fonte, redistribuir, modificar e distribuir as melhorias): pode ser pago. Freeware: gratuito, mas com código fechado. Shareware: versão de avaliação limitada.","Software proprietário: código fechado e licença restritiva (ex.: Microsoft Office). LibreOffice e Linux são exemplos de software livre."],"pegadinhas":["Dizer que a memória ROM é volátil ou que a RAM guarda dados com o computador desligado.","Igualar software livre a software gratuito.","Classificar impressora multifuncional ou touchscreen apenas como dispositivo de saída."],"base_legal":"Não se aplica (conteúdo de Informática).","questoes":[]},{"id":"inf-02","disciplina":"Informática","topico":"Sistema operacional Windows 10/11","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"O Windows é o sistema operacional mais cobrado. Em 2026, o Windows 11 é a versão atual (o suporte gratuito do Windows 10 terminou em 14/10/2025), mas provas ainda citam o Windows 10: os recursos cobrados são praticamente os mesmos.","pontos":["Atalhos: Win + E (Explorador de Arquivos), Win + D (mostrar área de trabalho), Win + L (bloquear), Win + I (Configurações), Win + V (histórico da área de transferência), Win + Shift + S (captura de tela), Ctrl + Shift + Esc (Gerenciador de Tarefas), Alt + Tab (alternar janelas), F2 (renomear), Shift + Delete (excluir definitivamente, sem Lixeira).","Ctrl + C (copiar), Ctrl + X (recortar), Ctrl + V (colar), Ctrl + Z (desfazer), Ctrl + A (selecionar tudo no Windows/Explorador).","Arrastar arquivo com o mouse: na MESMA unidade, move; para OUTRA unidade, copia. Ctrl + arrastar força cópia; Shift + arrastar força mover.","Lixeira: guarda itens excluídos de discos locais; itens de pendrive/rede ou excluídos com Shift + Delete não vão para a Lixeira.","Segurança do Windows: central que reúne o Microsoft Defender Antivírus (proteção contra vírus e ameaças em tempo real), Firewall e proteção de rede, controle de aplicativos/navegador e segurança do dispositivo.","Windows Defender Firewall: filtra o tráfego de rede (bloqueia/permite conexões). NÃO criptografa arquivos e NÃO é antivírus.","Criptografia de arquivos no Windows: BitLocker (criptografa a unidade inteira, edições Pro/Enterprise; ‘Criptografia do dispositivo’ em algumas edições Home) e EFS (criptografia de arquivos/pastas, em Propriedades > Avançados).","Manutenção de disco: ‘Desfragmentar e Otimizar Unidades’ (o antigo ‘Desfragmentador de Disco’ mudou de nome); em SSD, a ferramenta faz otimização (TRIM), não desfragmentação tradicional. ‘Limpeza de Disco’ e ‘Sensor de Armazenamento’ liberam espaço.","Histórico de Arquivos e Ponto de Restauração: o primeiro faz cópias de arquivos pessoais; o segundo restaura configurações do sistema (não é backup de documentos).","Sistema de arquivos padrão: NTFS (permissões, criptografia EFS, arquivos grandes). Pendrives costumam usar FAT32 (limite de 4 GB por arquivo) ou exFAT.","Windows 11: menu Iniciar centralizado, Layouts de Ajuste (Win + Z), Widgets, área de trabalho virtual (Win + Ctrl + D cria; Win + Tab mostra a Visão de Tarefas)."],"pegadinhas":["Dizer que o Firewall do Windows criptografa arquivos (P22-043) ou que ele remove vírus.","Afirmar que arquivo apagado com Shift + Delete pode ser recuperado da Lixeira.","Afirmar que o Windows 10 não tem antivírus nativo (tem: Microsoft Defender Antivírus: P22-041).","Usar nomes antigos de ferramentas (‘Desfragmentador de Disco’): o item 42 de 2022 foi anulado justamente por esse tipo de ambiguidade."],"base_legal":"Documentação oficial da Microsoft (Windows 10 e Windows 11).","questoes":["P22-041","P22-043"]},{"id":"inf-03","disciplina":"Informática","topico":"Edição de textos (Microsoft Word e LibreOffice Writer)","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Word (Microsoft 365) e Writer (LibreOffice, software livre) fazem praticamente as mesmas tarefas, mas têm atalhos e formatos padrão diferentes: e a banca adora trocar um pelo outro.","pontos":["Formato padrão: Word = .docx; Writer = .odt (ODF, formato aberto). Ambos abrem e salvam no formato do outro; ambos exportam para PDF.","Atalhos Word (português): Ctrl + N negrito, Ctrl + I itálico, Ctrl + S sublinhado, Ctrl + B salvar, Ctrl + O novo documento, Ctrl + A abrir, Ctrl + T selecionar tudo, Ctrl + P imprimir, Ctrl + L localizar, Ctrl + U substituir.","Alinhamento no Word: Ctrl + E centralizar, Ctrl + J justificar, Ctrl + Q esquerda, Ctrl + G direita.","Atalhos Writer: Ctrl + B negrito, Ctrl + I itálico, Ctrl + U sublinhado, Ctrl + S salvar, Ctrl + N novo, Ctrl + O abrir, Ctrl + A selecionar tudo, Ctrl + H localizar e substituir; alinhamento Ctrl + L (esquerda), Ctrl + R (direita), Ctrl + E (centralizar), Ctrl + J (justificar).","F7: verificação de ortografia e gramática (Word e Writer). F12 no Word: Salvar Como. Ctrl + Enter: quebra de página (ambos).","Word organiza comandos na Faixa de Opções (guias Página Inicial, Inserir, Layout, Referências, Correspondências, Revisão, Exibir). Writer usa menus tradicionais (Arquivo, Editar, Formatar...) ou interface em abas opcional.","Estilos (Título 1, Título 2...) permitem gerar sumário automático (Word: guia Referências > Sumário; Writer: Inserir > Sumário e índice).","Mala direta (Word: guia Correspondências) mescla um documento-modelo com uma lista de dados para gerar várias cartas personalizadas.","Controlar Alterações (Word, guia Revisão) / Rastrear alterações (Writer, menu Editar) registra edições para aceitar ou rejeitar depois.","Cabeçalho e rodapé, quebras de seção (orientações diferentes na mesma página), colunas, numeração de páginas e marcas d’água estão em Inserir/Layout."],"pegadinhas":["Atribuir ao Writer os atalhos do Word em português (ex.: Ctrl + N para negrito no Writer: lá é Ctrl + B).","Dizer que o Writer não abre arquivos .docx ou não exporta PDF.","Afirmar que Ctrl + S salva no Word em português (no Word PT-BR, Ctrl + S é sublinhado; salvar é Ctrl + B)."],"base_legal":"Documentação oficial Microsoft 365 e LibreOffice.","questoes":[]},{"id":"inf-04","disciplina":"Informática","topico":"Planilhas eletrônicas (Microsoft Excel e LibreOffice Calc)","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Planilhas organizam dados em células (coluna + linha, ex.: B8) e fazem cálculos com fórmulas e funções. É o item de Informática mais frequente em provas Cebraspe, quase sempre com uma figura de planilha.","pontos":["Toda fórmula começa com = (também aceitam + ou −). Operadores: + − * / ^ (potência) e & (concatenar texto). Comparação: = > < >= <= <>.","Referências: relativa (A1, muda ao copiar), absoluta ($A$1, não muda), mista ($A1 ou A$1). F4 alterna entre elas no Excel (Shift + F4 no Calc).","Intervalo com dois-pontos (A1:A5 = de A1 até A5); união com ponto e vírgula (A1;A5 = só A1 e A5).","Funções básicas: SOMA, MÉDIA, MÁXIMO, MÍNIMO, CONT.NÚM (conta números), CONT.VALORES (conta células não vazias), CONTAR.VAZIO, ARRED.","SE(teste; valor_se_verdadeiro; valor_se_falso). Ex.: =SE(B2>=7;\"Aprovado\";\"Reprovado\").","CONT.SE(intervalo; critério) e SOMASE(intervalo; critério; [intervalo_soma]). Critérios aceitam curingas: * (qualquer sequência) e ? (um caractere). Ex.: =SOMASE(A2:A7;\"auxílio*\";B2:B7) soma B quando A começa com ‘auxílio’.","PROCV(valor; tabela; nº_coluna; [FALSO/0 para correspondência exata]) busca na primeira coluna da tabela. PROCX (Excel 365) busca em qualquer direção.","Erros: #DIV/0! (divisão por zero), #NOME? (função escrita errada), #REF! (referência inválida), #VALOR! (tipo de dado errado), #N/D (valor não encontrado), ##### (coluna estreita).","Formato padrão: Excel = .xlsx; Calc = .ods. Referência a outra planilha: Excel Planilha2!A1; Calc Planilha2.A1 (ou $Planilha2.A1).","Recursos: Classificar e Filtrar, Formatação Condicional, Tabela Dinâmica, Gráficos, Validação de Dados, Congelar Painéis, Preenchimento Automático (alça de preenchimento)."],"pegadinhas":["Confundir intervalo (:) com união (;) ao calcular o resultado.","Esquecer que o curinga * no critério do SOMASE/CONT.SE faz a busca por ‘começa com’.","Dizer que, ao copiar uma fórmula, a referência absoluta $A$1 se altera.","Confundir CONT.NÚM (só números) com CONT.VALORES (qualquer conteúdo)."],"base_legal":"Documentação oficial Microsoft 365 e LibreOffice.","questoes":["INF-001"]},{"id":"inf-05","disciplina":"Informática","topico":"Apresentações (Microsoft PowerPoint e LibreOffice Impress)","recorrencia":"baixa","provas":[2012,2016,2022],"resumo":"Programas de apresentação montam slides com texto, imagens, animações e transições. Cai menos que Word e Excel, mas costuma cobrar atalhos de exibição e a diferença entre transição e animação.","pontos":["Formatos: PowerPoint = .pptx (editável) e .ppsx (abre direto no modo apresentação); Impress = .odp.","F5 inicia a apresentação do primeiro slide (PowerPoint e Impress); Shift + F5 inicia do slide atual (PowerPoint). Esc encerra.","Transição: efeito ENTRE um slide e outro. Animação: efeito em um OBJETO dentro do slide (texto, imagem).","Slide mestre (PowerPoint: guia Exibir > Slide Mestre; Impress: Exibir > Slide mestre): define o layout e a formatação padrão de todos os slides: mudar o mestre altera todos de uma vez.","Modos de exibição do PowerPoint: Normal, Estrutura de Tópicos, Classificação de Slides, Anotações, Modo de Exibição de Leitura e Apresentação de Slides.","Modo do Apresentador: o apresentador vê anotações e o próximo slide; a plateia vê só o slide atual.","Ocultar slide: ele continua no arquivo, mas não aparece na apresentação.","Ambos exportam para PDF e permitem inserir áudio, vídeo, tabelas e gráficos."],"pegadinhas":["Trocar transição por animação.","Dizer que excluir e ocultar slide têm o mesmo efeito.","Afirmar que F5 começa do slide atual (isso é Shift + F5 no PowerPoint)."],"base_legal":"Documentação oficial Microsoft 365 e LibreOffice.","questoes":[]},{"id":"inf-06","disciplina":"Informática","topico":"Redes de computadores, Internet e intranet","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Rede é a interligação de dispositivos para trocar dados. A Internet é a rede mundial pública baseada em TCP/IP; a intranet usa as mesmas tecnologias, mas é privada, restrita a uma organização.","pontos":["Por alcance: PAN (pessoal, ex.: Bluetooth), LAN (local, prédio), MAN (cidade), WAN (países/continentes: a Internet é a maior WAN).","Intranet: rede privada que usa os protocolos da Internet (TCP/IP, HTTP, navegador), acesso restrito a membros da organização. Extranet: parte da intranet liberada a parceiros externos autorizados (fornecedores, clientes).","Intranet pode ser acessada de fora da organização por VPN (rede privada virtual, túnel criptografado): ela não precisa estar fisicamente isolada.","Protocolos e portas: HTTP (80, páginas web), HTTPS (443, web com criptografia TLS: cadeado), FTP (20/21, transferência de arquivos), SMTP (25/587, envio de e-mail), POP3 (110), IMAP (143), DNS (53, traduz nomes em IP), DHCP (atribui IP automaticamente), SSH (22, acesso remoto seguro).","Modelo TCP/IP: TCP é confiável (confirma entrega, ordena pacotes); UDP é mais rápido e sem confirmação (streaming, voz).","Endereço IP: IPv4 tem 32 bits (ex.: 192.168.0.1); IPv6 tem 128 bits (hexadecimal). DNS converte www.gov.br em endereço IP.","URL: protocolo://domínio/caminho (https://www.gov.br/inss). Domínio .gov.br é de órgãos públicos brasileiros.","Equipamentos: roteador (interliga redes diferentes e escolhe caminhos), switch (interliga dispositivos na LAN), modem (converte sinal da operadora), access point (Wi-Fi).","Navegadores (Edge, Chrome, Firefox): navegação anônima/InPrivate não salva histórico e cookies no computador, mas NÃO esconde a navegação do provedor, do empregador ou dos sites.","Cookies: pequenos arquivos que sites gravam no navegador (sessão, preferências). Cache: cópia local de páginas para carregar mais rápido."],"pegadinhas":["Dizer que intranet não usa os protocolos da Internet ou que só pode ser acessada de dentro do prédio.","Afirmar que navegação anônima torna o usuário invisível na Internet.","Trocar a função do DNS (nomes → IP) pela do DHCP (distribui IPs).","Afirmar que HTTPS garante que o site é confiável: garante a criptografia da conexão, não a honestidade do site."],"base_legal":"Não se aplica (conteúdo de Informática).","questoes":[]},{"id":"inf-07","disciplina":"Informática","topico":"Correio eletrônico (e-mail)","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"O e-mail permite trocar mensagens e anexos pela Internet, usando protocolos próprios para enviar e para receber. A banca cobra protocolos, campos de destinatário e funções de clientes como o Outlook.","pontos":["Endereço: usuario@dominio (ex.: maria@inss.gov.br). O @ separa o nome do usuário do domínio do provedor.","SMTP: ENVIA mensagens (cliente → servidor e servidor → servidor). POP3: BAIXA as mensagens para o computador (em geral, apaga do servidor). IMAP: SINCRONIZA, mantendo as mensagens no servidor e acessíveis de vários dispositivos.","Campos: Para (destinatário principal), Cc (cópia, todos veem quem recebeu), Cco (cópia oculta, os demais não veem quem está em Cco).","Responder: só ao remetente, SEM os anexos originais. Responder a todos: ao remetente e a todos em Para e Cc (não inclui quem estava em Cco), sem anexos. Encaminhar: para novo destinatário, COM os anexos.","Webmail (Gmail, Outlook.com) funciona no navegador; cliente de e-mail (Microsoft Outlook, Mozilla Thunderbird) é programa instalado.","Outlook: Lixo Eletrônico (spam), Sinalizar (marcar para acompanhamento: não envia nada para o lixo), Bloquear remetente, Regras (mover mensagens automaticamente), Arquivar.","Spam: mensagem não solicitada em massa. Phishing: e-mail falso que imita bancos/órgãos (como o INSS) para roubar senhas ou dados; desconfie de links e anexos inesperados.","Anexos executáveis (.exe, .bat, .js, .scr) são vetores comuns de malware; muitos provedores os bloqueiam.","Assinatura digital no e-mail garante autenticidade e integridade; criptografia garante sigilo do conteúdo."],"pegadinhas":["Trocar as funções de SMTP (envio) e POP3/IMAP (recebimento).","Dizer que destinatários em Cc não são vistos pelos demais (isso é Cco).","Afirmar que ‘Responder a todos’ inclui os destinatários em Cco ou reenvia os anexos.","Confundir Sinalizador (lembrete de acompanhamento) com bloquear remetente/mover para Lixo Eletrônico."],"base_legal":"Não se aplica (conteúdo de Informática).","questoes":[]},{"id":"inf-08","disciplina":"Informática","topico":"Segurança da informação: princípios, malware e ataques","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Segurança da informação protege dados contra acesso indevido, alteração e indisponibilidade. A banca cobra os princípios básicos e, principalmente, a diferença entre os tipos de malware e de golpes.","pontos":["Princípios (tríade CID): Confidencialidade (só quem pode acessa), Integridade (dado não alterado indevidamente), Disponibilidade (acessível quando necessário). Complementares: Autenticidade (origem verdadeira) e Irretratabilidade/não repúdio.","Vírus: código que se anexa a um arquivo/programa hospedeiro e precisa ser EXECUTADO para agir e se espalhar.","Worm (verme): se autorreplica e se espalha sozinho pela rede, explorando vulnerabilidades, SEM precisar de hospedeiro nem de execução pelo usuário.","Cavalo de Troia (trojan): programa que parece útil, mas executa funções maliciosas escondidas (muitas vezes instala outros malwares).","Ransomware: criptografa os dados da vítima e exige resgate (geralmente em criptomoeda). Melhor defesa: backup atualizado e desconectado.","Spyware (espiona), keylogger (captura teclas digitadas), screenlogger (captura telas/cliques), adware (propaganda), backdoor (porta dos fundos para acesso remoto), rootkit (esconde a presença do invasor), bot/botnet (máquinas ‘zumbis’ controladas remotamente, usadas em ataques DDoS).","Phishing: mensagem falsa que induz a vítima a fornecer dados. Pharming: falsificação do DNS que leva a site falso mesmo digitando o endereço correto. Engenharia social: manipulação psicológica da pessoa.","Antivírus (ex.: Microsoft Defender) detecta e remove malware; firewall filtra tráfego de rede; um não substitui o outro.","Boas práticas: atualizar sistema e programas, autenticação em dois fatores (2FA/MFA), senhas fortes e diferentes, não abrir anexos/links suspeitos, desconfiar de urgência em mensagens.","Ataque DoS/DDoS afeta a DISPONIBILIDADE; vazamento de dados afeta a CONFIDENCIALIDADE; adulteração afeta a INTEGRIDADE."],"pegadinhas":["Dizer que o worm precisa ser executado pelo usuário ou de um arquivo hospedeiro (isso é o vírus).","Afirmar que firewall remove vírus ou que antivírus bloqueia portas de rede.","Confundir phishing (isca por mensagem) com pharming (redirecionamento por DNS).","Associar ransomware a roubo de senhas (ele sequestra os dados por criptografia)."],"base_legal":"Cartilha de Segurança para Internet (CERT.br); ABNT NBR ISO/IEC 27001 e 27002.","questoes":["P22-041","P22-043"]},{"id":"inf-09","disciplina":"Informática","topico":"Segurança da informação: backup, criptografia e certificação digital","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Backup é a cópia de segurança que permite recuperar dados perdidos; criptografia embaralha os dados para que só quem tem a chave os leia. São as defesas mais cobradas, ao lado do antivírus.","pontos":["Backup completo (full/normal): copia TUDO e desmarca o atributo de arquivamento. Mais lento para fazer, mais simples para restaurar.","Backup incremental: copia só o que mudou desde o ÚLTIMO BACKUP DE QUALQUER TIPO (completo ou incremental) e desmarca o atributo. Rápido e pequeno; para restaurar precisa do último completo + TODOS os incrementais seguintes.","Backup diferencial: copia o que mudou desde o ÚLTIMO BACKUP COMPLETO e NÃO desmarca o atributo (cresce a cada dia). Para restaurar: último completo + o ÚLTIMO diferencial.","Regra 3-2-1: 3 cópias dos dados, em 2 mídias diferentes, sendo 1 fora do local (offsite/nuvem). Teste periodicamente a restauração.","Sincronização na nuvem NÃO é backup completo: se você apaga ou um ransomware criptografa o arquivo, a alteração também é sincronizada (salvo histórico de versões/lixeira do serviço).","Criptografia simétrica: UMA chave secreta compartilhada para cifrar e decifrar (rápida; ex.: AES).","Criptografia assimétrica: par de chaves: pública (divulgada) e privada (secreta). Para SIGILO, cifra-se com a chave PÚBLICA do destinatário, que decifra com sua chave privada (ex.: RSA).","Assinatura digital: o remetente assina com sua chave PRIVADA e qualquer um verifica com a chave PÚBLICA dele. Garante autenticidade, integridade e não repúdio: mas NÃO garante sigilo.","Hash (resumo): gera uma ‘impressão digital’ de tamanho fixo do arquivo; qualquer alteração muda o hash (verifica integridade). Não é reversível.","Certificado digital: documento eletrônico que vincula uma chave pública a uma pessoa/entidade, emitido por Autoridade Certificadora; no Brasil, a ICP-Brasil (MP 2.200-2/2001) dá validade jurídica aos documentos assinados.","No Windows, criptografia de arquivos é feita por BitLocker ou EFS: não pelo Firewall."],"pegadinhas":["Trocar incremental (desde o último backup de qualquer tipo) por diferencial (desde o último completo).","Dizer que a assinatura digital garante confidencialidade.","Afirmar que na criptografia assimétrica se cifra com a chave privada do destinatário.","Dizer que o Firewall do Windows criptografa arquivos (P22-043)."],"base_legal":"MP 2.200-2/2001 (ICP-Brasil); Lei 14.063/2020 (assinaturas eletrônicas em interações com entes públicos); Cartilha de Segurança para Internet (CERT.br).","questoes":["INF-002","P22-043"]},{"id":"inf-10","disciplina":"Informática","topico":"Computação em nuvem","recorrencia":"media","provas":[2012,2016,2022],"resumo":"Computação em nuvem é o uso de recursos de TI (armazenamento, processamento, programas) pela Internet, sob demanda, pagando conforme o uso. Ex.: OneDrive, Google Drive, Microsoft 365 online.","pontos":["Características essenciais: autoatendimento sob demanda, amplo acesso pela rede, pool de recursos compartilhados, elasticidade rápida (aumenta/diminui conforme a necessidade) e serviço medido (paga pelo uso).","IaaS (Infraestrutura como Serviço): aluga servidores, redes e armazenamento virtuais (ex.: máquinas virtuais na AWS, Azure).","PaaS (Plataforma como Serviço): ambiente pronto para desenvolver e hospedar aplicações, sem gerenciar a infraestrutura.","SaaS (Software como Serviço): o usuário só usa o programa pelo navegador ou app (ex.: Gmail, Microsoft 365 online, Google Docs).","Modelos de implantação: nuvem pública (provedor atende vários clientes), privada (exclusiva de uma organização), híbrida (combina pública e privada) e comunitária (compartilhada por organizações com interesses comuns).","Armazenamento em nuvem (OneDrive, Google Drive, Dropbox, iCloud): acesso de qualquer dispositivo, compartilhamento por link, sincronização e histórico de versões.","Vantagens: dispensa infraestrutura própria, escalabilidade, acesso remoto. Riscos: depende de Internet, privacidade/sigilo dos dados (LGPD), dependência do fornecedor.","OneDrive vem integrado ao Windows 10/11 e ao Microsoft 365; ‘arquivos sob demanda’ mostram o arquivo no Explorador sem ocupar espaço até ser aberto."],"pegadinhas":["Confundir SaaS (usa o software pronto) com PaaS (plataforma para desenvolver).","Dizer que a nuvem funciona plenamente sem conexão com a Internet.","Afirmar que nuvem privada é a mesma coisa que intranet ou que nuvem pública é ‘aberta a qualquer um ver os dados’."],"base_legal":"Definição NIST SP 800-145; Lei 13.709/2018 (LGPD) quanto a dados pessoais armazenados.","questoes":[]},{"id":"dc-01","disciplina":"Direito Constitucional","topico":"Constituição: conceito, classificações e eficácia das normas","recorrencia":"baixa","provas":[],"resumo":"Constituição é a lei fundamental e suprema do Estado: organiza o poder, define a forma de Estado e de governo e garante os direitos fundamentais. Todas as outras normas devem ser compatíveis com ela (supremacia constitucional). Para a prova, importa saber classificar a CF/1988 e entender a eficácia das normas constitucionais.","pontos":["CF/1988 quanto à forma: escrita (codificada em um único texto).","Quanto à origem: promulgada (democrática, popular), feita por Assembleia Nacional Constituinte eleita: diferente da outorgada (imposta, ex.: 1937).","Quanto à estabilidade: rígida: exige processo de alteração mais difícil que o da lei comum (art. 60). Parte da doutrina a chama de super-rígida por causa das cláusulas pétreas.","Quanto à extensão: analítica (prolixa, detalhista); quanto ao modo de elaboração: dogmática; quanto ao conteúdo: formal; quanto à ideologia: eclética/compromissória; quanto à finalidade: dirigente (traça programas e metas para o Estado).","Emenda constitucional (art. 60): proposta por 1/3 da Câmara ou do Senado, pelo Presidente da República ou por mais da metade das Assembleias Legislativas (cada uma pela maioria relativa); aprovação em dois turnos, em cada Casa, por 3/5 dos votos.","A CF não pode ser emendada na vigência de intervenção federal, estado de defesa ou estado de sítio (limite circunstancial).","Cláusulas pétreas (art. 60, § 4º): forma federativa de Estado; voto direto, secreto, universal e periódico; separação dos Poderes; direitos e garantias individuais. Não podem ser objeto de emenda TENDENTE A ABOLIR.","Matéria de proposta de emenda rejeitada ou prejudicada não pode ser objeto de nova proposta na mesma sessão legislativa.","Eficácia das normas (José Afonso da Silva): plena (aplicação imediata e integral), contida (aplicação imediata, mas a lei pode restringir: ex.: art. 5º, XIII, liberdade de profissão) e limitada (depende de lei para produzir todos os efeitos: ex.: normas programáticas).","Tratados internacionais de direitos humanos aprovados em cada Casa, em dois turnos, por 3/5 dos votos equivalem a emendas constitucionais (art. 5º, § 3º); os demais tratados de direitos humanos têm status supralegal (STF)."],"pegadinhas":["Dizer que a CF/1988 é flexível ou semirrígida: ela é rígida.","Afirmar que cláusula pétrea impede QUALQUER emenda sobre o tema: o que se proíbe é a emenda tendente a abolir; emendas que ampliam ou aperfeiçoam são possíveis.","Incluir o voto obrigatório entre as cláusulas pétreas: a lista protege o voto direto, secreto, universal e periódico: a obrigatoriedade não está lá.","Trocar o quórum de emenda (3/5, dois turnos, nas duas Casas) pelo de lei complementar (maioria absoluta)."],"base_legal":"CF/1988, arts. 1º a 4º e art. 60; art. 5º, §§ 1º a 3º.","questoes":[]},{"id":"dc-02","disciplina":"Direito Constitucional","topico":"Direitos e garantias fundamentais: direitos individuais e coletivos (art. 5º)","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"O art. 5º da CF lista os direitos individuais e coletivos: vida, liberdade, igualdade, segurança e propriedade, com dezenas de incisos. É o tema de Constitucional que mais cai, quase sempre cobrando a literalidade dos incisos e as exceções que eles trazem.","pontos":["Titulares: brasileiros e estrangeiros residentes no país (texto do art. 5º); o STF estende a proteção também aos estrangeiros não residentes que estejam no território.","As normas definidoras de direitos fundamentais têm aplicação imediata (art. 5º, § 1º). Nenhum direito fundamental é absoluto: eles podem ser ponderados entre si.","Casa é asilo inviolável: sem consentimento do morador, só se entra em flagrante delito, desastre ou para prestar socorro (a qualquer hora) ou por determinação judicial (somente durante o dia).","Sigilo das comunicações telefônicas: só pode ser quebrado por ordem judicial, nas hipóteses da lei, para investigação criminal ou instrução processual penal.","Reunião: pacífica, sem armas, em locais abertos ao público, independentemente de autorização, exigido apenas prévio aviso à autoridade competente.","Associação para fins lícitos: criação independe de autorização, vedada a interferência estatal; dissolução compulsória só por decisão judicial transitada em julgado; suspensão das atividades exige decisão judicial (não precisa de trânsito em julgado). Vedada associação de caráter paramilitar.","Direito de petição aos Poderes Públicos e obtenção de certidões para defesa de direitos e esclarecimento de situações de interesse pessoal: assegurados a todos, independentemente do pagamento de taxas (art. 5º, XXXIV).","A lei não excluirá da apreciação do Poder Judiciário lesão ou ameaça a direito (inafastabilidade, XXXV) e não prejudicará o direito adquirido, o ato jurídico perfeito e a coisa julgada (XXXVI).","Inafiançáveis e imprescritíveis: racismo e ação de grupos armados contra a ordem constitucional e o Estado Democrático. Inafiançáveis e insuscetíveis de graça ou anistia: tortura, tráfico de drogas, terrorismo e crimes hediondos.","Prisão civil por dívida: só a do devedor de alimentos; a do depositário infiel é ilícita (Súmula Vinculante 25).","Extradição: brasileiro nato nunca; naturalizado só por crime comum praticado antes da naturalização ou por comprovado envolvimento em tráfico de drogas; estrangeiro não será extraditado por crime político ou de opinião.","O Judiciário pode determinar a implementação de políticas públicas ligadas a direitos fundamentais em casos de omissão, sem violar a separação dos Poderes (jurisprudência do STF)."],"pegadinhas":["Dizer que a entrada em casa por ordem judicial pode ocorrer à noite: por ordem judicial, só durante o dia.","Exigir autorização prévia para reunião ou para criação de associação: basta aviso prévio (reunião) e nenhuma autorização (associação).","Trocar inafiançável e imprescritível (racismo e grupos armados) com inafiançável e insuscetível de graça ou anistia (tortura, tráfico, terrorismo, hediondos: os 3 T + hediondos).","Afirmar que certidões em repartições públicas dependem do pagamento de taxa.","Dizer que a quebra de sigilo telefônico pode ser determinada por autoridade administrativa ou para processo civil."],"base_legal":"CF/1988, art. 5º (especialmente incisos XI, XII, XVI a XXI, XXXIV a XXXVI, XLII a XLIV, LI, LII, LXVII); Súmula Vinculante 25.","questoes":["CONST-004","P22-021","P22-022","P22-040"]},{"id":"dc-03","disciplina":"Direito Constitucional","topico":"Remédios constitucionais (habeas corpus, habeas data, mandado de segurança, mandado de injunção, ação popular)","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Remédios constitucionais são ações previstas na própria CF para proteger direitos fundamentais quando eles são violados ou ameaçados. A banca cobra qual remédio serve para cada situação, quem pode propor e quais são gratuitos.","pontos":["Habeas corpus: protege a liberdade de locomoção contra ilegalidade ou abuso de poder; pode ser impetrado por qualquer pessoa, sem advogado; é gratuito.","Habeas data: assegura o conhecimento ou a retificação de informações relativas à PESSOA DO IMPETRANTE constantes de registros ou bancos de dados de entidades governamentais ou de caráter público; é gratuito. Exige prova da recusa administrativa prévia (Lei 9.507/1997).","Mandado de segurança: protege direito líquido e certo (provado de plano, por documentos) não amparado por habeas corpus ou habeas data, contra ilegalidade ou abuso de poder de autoridade pública ou agente de pessoa jurídica no exercício de atribuições públicas. Prazo de 120 dias da ciência do ato (Lei 12.016/2009).","Mandado de segurança coletivo: pode ser impetrado por partido político com representação no Congresso Nacional e por organização sindical, entidade de classe ou associação legalmente constituída e em funcionamento há pelo menos um ano, em defesa de seus membros ou associados.","Mandado de injunção: cabe quando a FALTA de norma regulamentadora torna inviável o exercício de direitos e liberdades constitucionais e das prerrogativas inerentes à nacionalidade, à soberania e à cidadania (Lei 13.300/2016).","Ação popular: qualquer CIDADÃO (eleitor) pode propor para anular ato lesivo ao patrimônio público, à moralidade administrativa, ao meio ambiente e ao patrimônio histórico e cultural; o autor fica isento de custas e do ônus da sucumbência, salvo comprovada má-fé.","São gratuitas as ações de habeas corpus e habeas data e, na forma da lei, os atos necessários ao exercício da cidadania (art. 5º, LXXVII).","O Estado prestará assistência jurídica integral e gratuita aos que comprovarem insuficiência de recursos (LXXIV) e indenizará o condenado por erro judiciário e quem ficar preso além do tempo fixado na sentença (LXXV)."],"pegadinhas":["Usar habeas data para obter informações de TERCEIROS ou informações de interesse geral: o habeas data é para dados da própria pessoa (para o resto, cabe mandado de segurança ou pedido de informação).","Dizer que estrangeiro ou pessoa jurídica pode propor ação popular: só o cidadão (eleitor).","Exigir o requisito de um ano de funcionamento também do partido político ou do sindicato no mandado de segurança coletivo: no texto, ele se refere à associação.","Confundir mandado de injunção (falta de norma) com mandado de segurança (ato ilegal de autoridade)."],"base_legal":"CF/1988, art. 5º, LXVIII a LXXVII; Lei 9.507/1997 (habeas data); Lei 12.016/2009 (mandado de segurança); Lei 13.300/2016 (mandado de injunção); Lei 4.717/1965 (ação popular).","questoes":["CONST-003"]},{"id":"dc-04","disciplina":"Direito Constitucional","topico":"Nacionalidade e direitos políticos","recorrencia":"media","provas":[2022],"resumo":"Ainda dentro dos direitos fundamentais, a CF define quem é brasileiro nato ou naturalizado (art. 12) e regula o voto, as condições de elegibilidade e as inelegibilidades (arts. 14 a 16). A banca adora prazos, idades e exceções.","pontos":["Brasileiro nato: nascido no Brasil, ainda que de pais estrangeiros, desde que estes não estejam a serviço de seu país; nascido no estrangeiro de pai ou mãe brasileiros a serviço do Brasil; nascido no estrangeiro de pai ou mãe brasileiros, registrado em repartição brasileira competente ou que venha a residir no Brasil e opte, a qualquer tempo, depois de atingida a maioridade, pela nacionalidade brasileira.","Naturalização ordinária de originários de países de língua portuguesa: residência por um ano ininterrupto e idoneidade moral. Estrangeiros de qualquer nacionalidade: residência há mais de 15 anos ininterruptos e sem condenação penal, DESDE QUE REQUEIRAM (não é de ofício).","Cargos privativos de brasileiro nato: Presidente e Vice-Presidente da República, Presidente da Câmara, Presidente do Senado, Ministro do STF, carreira diplomática, oficial das Forças Armadas e Ministro de Estado da Defesa.","Perda da nacionalidade (redação da EC 131/2023): cancelamento da naturalização por sentença judicial em caso de fraude no processo de naturalização ou de atentado contra a ordem constitucional e o Estado Democrático; ou pedido expresso de perda perante autoridade brasileira, ressalvadas situações que acarretem apatridia.","Voto obrigatório para maiores de 18 anos; facultativo para analfabetos, maiores de 70 anos e maiores de 16 e menores de 18 anos.","Inalistáveis: estrangeiros e, durante o serviço militar obrigatório, os conscritos. Inelegíveis: os inalistáveis e os analfabetos.","Idades mínimas: 35 anos (Presidente, Vice e Senador); 30 (Governador e Vice); 21 (Deputado Federal, Estadual ou Distrital, Prefeito, Vice-Prefeito e juiz de paz); 18 (Vereador).","Desincompatibilização: Presidente, Governadores e Prefeitos devem renunciar até 6 meses antes do pleito para concorrer a OUTROS cargos. Parlamentares (ex.: senador) não precisam renunciar para concorrer a outro cargo.","É vedada a cassação de direitos políticos; perda ou suspensão só por: cancelamento da naturalização por sentença transitada em julgado, incapacidade civil absoluta, condenação criminal transitada em julgado (enquanto durarem seus efeitos), recusa de cumprir obrigação a todos imposta ou prestação alternativa e improbidade administrativa.","Princípio da anterioridade eleitoral: a lei que alterar o processo eleitoral entra em vigor na data de sua publicação, mas não se aplica à eleição que ocorra até um ano da data de sua vigência (art. 16)."],"pegadinhas":["Dizer que a naturalização do estrangeiro residente há mais de 15 anos é concedida de ofício: ela depende de requerimento.","Incluir Ministro do STJ, Senador comum ou Deputado entre os cargos privativos de nato: só os da lista do art. 12, § 3º.","Exigir que senador ou deputado renuncie para disputar outro cargo: a regra dos 6 meses é para chefes do Executivo.","Afirmar que a CF admite cassação de direitos políticos: ela veda a cassação e admite apenas perda ou suspensão nos casos listados."],"base_legal":"CF/1988, arts. 12 a 16 (art. 12, § 4º com redação da EC 131/2023).","questoes":["P22-025","P22-026"]},{"id":"dc-05","disciplina":"Direito Constitucional","topico":"Direitos sociais (arts. 6º a 11)","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Direitos sociais são direitos a prestações do Estado e garantias dos trabalhadores. O art. 6º traz a lista geral e o art. 7º os direitos dos trabalhadores urbanos e rurais; os arts. 8º a 11 tratam de sindicato e greve. Cai muito a literalidade do art. 7º e do art. 8º.","pontos":["Art. 6º: educação, saúde, alimentação, trabalho, moradia, transporte, lazer, segurança, previdência social, proteção à maternidade e à infância e assistência aos desamparados. Parágrafo único (EC 114/2021): todo brasileiro em situação de vulnerabilidade social tem direito a uma renda básica familiar garantida pelo poder público.","O art. 7º vale igualmente para trabalhadores URBANOS e RURAIS (ex.: FGTS, seguro-desemprego, 13º salário, salário mínimo).","Salário mínimo fixado em lei, nacionalmente unificado, vedada sua vinculação para qualquer fim.","Jornada de até 8 horas diárias e 44 semanais (facultada compensação e redução por acordo ou convenção coletiva); turnos ininterruptos de revezamento: 6 horas, salvo negociação coletiva.","Repouso semanal remunerado, preferencialmente aos domingos; férias anuais remuneradas com pelo menos 1/3 a mais; licença à gestante de 120 dias, sem prejuízo do emprego e do salário; aviso prévio proporcional de, no mínimo, 30 dias.","Prescrição trabalhista: 5 anos para os créditos, até o limite de 2 anos após a extinção do contrato de trabalho.","Proibido trabalho noturno, perigoso ou insalubre a menores de 18 anos e qualquer trabalho a menores de 16, salvo na condição de aprendiz, a partir de 14 anos.","Art. 8º: livre associação sindical; vedada a criação de mais de um sindicato da mesma categoria na mesma base territorial, que não pode ser inferior à área de um Município (unicidade sindical); ninguém é obrigado a filiar-se ou manter-se filiado.","É OBRIGATÓRIA a participação dos sindicatos nas negociações coletivas de trabalho; o aposentado filiado tem direito a votar e ser votado.","Vedada a dispensa do empregado sindicalizado a partir do registro da candidatura a cargo de direção sindical e, se eleito, até um ano após o final do mandato, salvo falta grave.","Greve (art. 9º): assegurada aos trabalhadores, que decidem sobre a oportunidade e os interesses a defender; a lei define serviços essenciais e o atendimento das necessidades inadiáveis."],"pegadinhas":["Dizer que FGTS ou outro direito do art. 7º é só do trabalhador urbano: o caput abrange urbanos e rurais.","Afirmar que a participação do sindicato na negociação coletiva pode ser dispensada pelos filiados: é obrigatória.","Trocar a ordem dos prazos de prescrição: são 5 anos de créditos, limitados a 2 anos após o fim do contrato.","Dizer que o repouso semanal é obrigatoriamente aos domingos: é preferencialmente.","Licença-paternidade: a CF remete à lei e o ADCT fixa 5 dias enquanto não houver regulamentação; cuidado com afirmações de prazo maior sem base legal expressa (o STF reconheceu a omissão do Congresso na ADO 20)."],"base_legal":"CF/1988, arts. 6º a 11; ADCT, art. 10.","questoes":["P22-023","P22-024"]},{"id":"dc-06","disciplina":"Direito Constitucional","topico":"Organização político-administrativa do Estado e repartição de competências","recorrencia":"baixa","provas":[],"resumo":"O Brasil é uma federação formada por União, Estados, Distrito Federal e Municípios, todos autônomos. A CF reparte as competências entre eles; a banca costuma cobrar se uma competência é exclusiva, privativa, comum ou concorrente: e previdência social é exemplo clássico.","pontos":["Art. 18: a organização político-administrativa compreende União, Estados, DF e Municípios, todos AUTÔNOMOS (não há hierarquia entre eles). Soberania é da República Federativa do Brasil, não da União.","Brasília é a Capital Federal. Territórios Federais integram a União; sua criação, transformação em Estado ou reintegração ao Estado de origem dependem de lei complementar.","Estados podem incorporar-se, subdividir-se ou desmembrar-se mediante aprovação da população diretamente interessada, por plebiscito, e do Congresso Nacional, por lei complementar.","Municípios: criação, incorporação, fusão e desmembramento por lei estadual, dentro do período determinado por lei complementar federal, após consulta prévia por plebiscito às populações dos Municípios envolvidos e Estudos de Viabilidade Municipal.","Art. 19: é vedado aos entes estabelecer cultos religiosos ou igrejas, subvencioná-los ou embaraçar-lhes o funcionamento (ressalvada a colaboração de interesse público), recusar fé aos documentos públicos e criar distinções entre brasileiros ou preferências entre si.","Competência exclusiva da União (art. 21): administrativa/material, indelegável. Competência privativa da União (art. 22): legislativa, delegável aos Estados por lei complementar sobre questões específicas.","Competência comum (art. 23): administrativa, de todos os entes (ex.: cuidar da saúde e assistência pública, proteger o meio ambiente).","Competência concorrente (art. 24): legislativa da União, Estados e DF; a União edita normas gerais, os Estados suplementam; sem lei federal, os Estados exercem competência plena, e a lei federal superveniente suspende a eficácia da lei estadual no que lhe for contrário. Municípios não estão no caput do art. 24.","Seguridade social: competência legislativa PRIVATIVA da União (art. 22, XXIII). Previdência social, proteção e defesa da saúde: competência legislativa CONCORRENTE (art. 24, XII).","Municípios legislam sobre assuntos de interesse local e suplementam a legislação federal e estadual no que couber (art. 30). O DF acumula competências de Estado e de Município e não pode ser dividido em Municípios."],"pegadinhas":["Dizer que a União é soberana ou que há hierarquia entre União, Estados e Municípios: todos são autônomos; soberana é a República Federativa.","Trocar 'seguridade social' (privativa da União) por 'previdência social' (concorrente): a banca explora exatamente essa diferença.","Afirmar que competência exclusiva (art. 21) pode ser delegada: quem pode ser delegada por lei complementar é a privativa (art. 22).","Dizer que a criação de Município depende de lei federal: é por lei estadual, respeitada a lei complementar federal."],"base_legal":"CF/1988, arts. 18 a 33.","questoes":[]},{"id":"dc-07","disciplina":"Direito Constitucional","topico":"Administração pública na CF (arts. 37 a 41)","recorrencia":"media","provas":[2022],"resumo":"Os arts. 37 a 41 trazem as regras constitucionais básicas para quem trabalha no serviço público: princípios, concurso, acumulação de cargos, teto, mandato eletivo, regime de previdência e estabilidade. É matéria que interessa diretamente ao futuro servidor do INSS.","pontos":["Princípios expressos do art. 37, caput (LIMPE): legalidade, impessoalidade, moralidade, publicidade e eficiência: para a administração direta e indireta de todos os Poderes e de todos os entes.","Cargos, empregos e funções são acessíveis aos brasileiros que preencham os requisitos legais e aos ESTRANGEIROS, na forma da lei (art. 37, I).","Concurso público de provas ou de provas e títulos, salvo cargos em comissão de livre nomeação e exoneração. Validade de até 2 anos, prorrogável uma vez por igual período; aprovados no prazo improrrogável do edital têm prioridade sobre novos concursados.","Funções de confiança: exclusivamente por ocupantes de cargo efetivo. Cargos em comissão: preenchidos por servidores de carreira nos percentuais mínimos da lei. Ambos só para direção, chefia e assessoramento.","Servidor civil tem direito à associação sindical; greve nos termos de lei específica (o STF manda aplicar a Lei 7.783/1989 enquanto ela não existe). Militares: vedadas sindicalização e greve.","Os vencimentos dos cargos do Legislativo e do Judiciário não podem ser superiores aos pagos pelo Executivo (art. 37, XII). Teto geral: subsídio dos Ministros do STF.","Acumulação remunerada vedada, salvo, com compatibilidade de horários e respeitado o teto: dois cargos de professor; um de professor com outro técnico ou científico; dois cargos ou empregos privativos de profissionais de saúde com profissões regulamentadas. A vedação alcança autarquias, fundações, empresas públicas, sociedades de economia mista e subsidiárias.","Servidor em mandato eletivo (art. 38): mandato federal, estadual ou distrital, afastado do cargo; Prefeito, afastado, podendo optar pela remuneração; Vereador, havendo compatibilidade de horários, recebe as vantagens do cargo sem prejuízo da remuneração do mandato; sem compatibilidade, aplica-se a regra do Prefeito.","Ocupante exclusivamente de cargo em comissão, de outro cargo temporário (inclusive mandato eletivo) ou de emprego público está vinculado ao RGPS (art. 40, § 13).","Estabilidade (art. 41): após 3 anos de efetivo exercício, para nomeados em cargo efetivo por concurso, condicionada a avaliação especial de desempenho por comissão.","O estável perde o cargo por: sentença judicial transitada em julgado; processo administrativo com ampla defesa; procedimento de avaliação periódica de desempenho, na forma de lei complementar (e, ainda, para cumprir o limite de despesa com pessoal: art. 169).","Responsabilidade objetiva do Estado e das prestadoras de serviço público, com regresso contra o agente em caso de dolo ou culpa (art. 37, § 6º); atos de improbidade importam suspensão dos direitos políticos, perda da função pública, indisponibilidade dos bens e ressarcimento ao erário (art. 37, § 4º)."],"pegadinhas":["Dizer que estrangeiros não podem ocupar cargos públicos: podem, na forma da lei.","Inverter o art. 37, XII: os vencimentos do Legislativo e do Judiciário não podem SUPERAR os do Executivo.","Confundir função de confiança (só para efetivos) com cargo em comissão (pode ser ocupado por pessoa sem vínculo, respeitado o percentual mínimo).","Dizer que vereador sempre precisa se afastar do cargo: havendo compatibilidade de horários, acumula.","Afirmar que ocupante de cargo temporário ou só comissionado está no regime próprio (RPPS): está no RGPS."],"base_legal":"CF/1988, arts. 37, 38, 40 (§ 13) e 41; art. 169.","questoes":["P22-027","P22-028","P22-029","P22-030"]},{"id":"dc-08","disciplina":"Direito Constitucional","topico":"Seguridade social na CF: conceito, objetivos e financiamento (arts. 194 e 195)","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"A seguridade social é o conjunto integrado de ações dos Poderes Públicos e da sociedade para assegurar saúde, previdência e assistência social. O art. 194 traz os objetivos (cobrados como 'princípios') e o art. 195 diz quem paga a conta. É o ponto de encontro entre Constitucional e Previdenciário: cai em toda prova.","pontos":["Tripé da seguridade: SAÚDE (para todos), PREVIDÊNCIA (contributiva) e ASSISTÊNCIA SOCIAL (para quem dela necessitar, sem contribuição).","Objetivos (art. 194, parágrafo único): universalidade da cobertura e do atendimento; uniformidade e equivalência dos benefícios e serviços às populações urbanas e rurais; seletividade e distributividade na prestação dos benefícios e serviços; irredutibilidade do valor dos benefícios; equidade na forma de participação no custeio; diversidade da base de financiamento; caráter democrático e descentralizado da administração.","Diversidade da base de financiamento: com a EC 103/2019, identificando-se em rubricas contábeis específicas as receitas e despesas de saúde, previdência e assistência, preservado o caráter contributivo da previdência.","Gestão quadripartite: participação dos trabalhadores, dos empregadores, dos aposentados e do Governo nos órgãos colegiados.","Financiamento (art. 195): por TODA a sociedade, de forma direta e indireta, com recursos dos orçamentos da União, dos Estados, do DF e dos Municípios e com contribuições sociais.","Contribuições sociais: do empregador/empresa (sobre folha e rendimentos do trabalho, receita ou faturamento e lucro); do trabalhador e demais segurados (podendo ter alíquotas progressivas; não incide sobre aposentadoria e pensão do RGPS); sobre receita de concursos de prognósticos; do importador; e, desde a EC 132/2023 (reforma tributária), a contribuição sobre bens e serviços (CBS).","Regra da contrapartida (§ 5º): nenhum benefício ou serviço pode ser criado, majorado ou estendido sem a correspondente fonte de custeio total.","Anterioridade nonagesimal (§ 6º): as contribuições só podem ser exigidas 90 dias após a publicação da lei que as instituiu ou modificou (não se aplica a anterioridade do exercício financeiro).","Entidades beneficentes de assistência social que atendam aos requisitos de lei complementar (hoje LC 187/2021) são isentas (na verdade, imunes) de contribuições para a seguridade (§ 7º).","Segurado especial contribui com alíquota sobre o resultado da comercialização da produção (§ 8º).","Pessoa jurídica em débito com a seguridade não pode contratar com o Poder Público nem dele receber benefícios ou incentivos fiscais ou creditícios (§ 3º). Novas fontes de custeio (competência residual) exigem lei complementar (§ 4º)."],"pegadinhas":["Trocar 'seletividade e distributividade' por 'universalidade' ou dizer 'uniformização' em vez de 'uniformidade e equivalência'.","Incluir objetivos que não existem (ex.: 'supremacia da rentabilidade', 'gestão tripartite'): a gestão é QUADRIPARTITE.","Afirmar que só os segurados (ou só o poder público) financiam a seguridade: é toda a sociedade, direta e indiretamente.","Dizer que os benefícios da seguridade são exclusivos de quem contribui: só a previdência é contributiva; saúde é universal e assistência é para quem necessitar.","Aplicar anterioridade anual às contribuições sociais: vale apenas a noventena."],"base_legal":"CF/1988, arts. 194 e 195 (redação das EC 20/1998, EC 103/2019 e EC 132/2023); LC 187/2021.","questoes":["CONST-001","P22-053","P22-054","P22-106","P22-110"]},{"id":"dc-09","disciplina":"Direito Constitucional","topico":"Saúde, previdência e assistência social na CF (arts. 196 a 204)","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Cada perna da seguridade tem regras próprias na CF: saúde é direito de todos e dever do Estado; a previdência é contributiva, de filiação obrigatória e busca equilíbrio financeiro e atuarial; a assistência social é prestada a quem precisar, sem contribuição. A banca troca as características de uma pela outra.","pontos":["Saúde (art. 196): direito de todos e dever do Estado, garantido mediante políticas sociais e econômicas, com acesso universal e igualitário às ações e serviços. Independe de contribuição.","SUS (art. 198): rede regionalizada e hierarquizada; diretrizes: descentralização (direção única em cada esfera), atendimento integral com prioridade para atividades preventivas e participação da comunidade.","Assistência à saúde é livre à iniciativa privada, que participa do SUS de forma complementar, com preferência para entidades filantrópicas e sem fins lucrativos; vedados auxílios ou subvenções públicas a instituições privadas com fins lucrativos.","Previdência (art. 201): RGPS de caráter contributivo e filiação obrigatória, observando o equilíbrio financeiro e atuarial. Cobre incapacidade temporária ou permanente, idade avançada, maternidade (especialmente gestante), desemprego involuntário, salário-família e auxílio-reclusão para dependentes de segurados de baixa renda e pensão por morte.","Nenhum benefício que substitua o salário de contribuição ou o rendimento do trabalho terá valor mensal inferior ao salário mínimo; benefícios são reajustados para preservar o valor real.","Aposentadoria no RGPS (pós-EC 103/2019): 65 anos (homem) e 62 anos (mulher), com tempo mínimo de contribuição; trabalhadores rurais e segurados em regime de economia familiar: 60 anos (homem) e 55 anos (mulher).","É vedada a filiação ao RGPS, como facultativo, de pessoa participante de regime próprio (art. 201, § 5º); é vedada a contagem de tempo de contribuição fictício (§ 14).","Previdência complementar privada (art. 202): caráter complementar, autônomo em relação ao RGPS e facultativo, baseada na constituição de reservas.","Assistência social (art. 203): prestada a quem dela necessitar, independentemente de contribuição. Objetivos: proteção à família, maternidade, infância, adolescência e velhice; amparo a crianças e adolescentes carentes; integração ao mercado de trabalho; habilitação e reabilitação de pessoas com deficiência; garantia de um salário mínimo mensal à pessoa com deficiência e ao idoso que comprovem não ter meios de se manter (BPC); redução da vulnerabilidade de famílias em pobreza ou extrema pobreza (EC 114/2021).","Art. 204: assistência financiada com recursos do orçamento da seguridade e outras fontes; descentralização político-administrativa: coordenação e normas gerais na esfera federal; coordenação e execução dos programas nas esferas estadual e municipal e por entidades beneficentes; participação da população por organizações representativas."],"pegadinhas":["Dizer que a previdência protege 'todos os cidadãos' ou garante proteção independentemente de contribuição: ela protege os segurados que contribuem.","Afirmar que a assistência social exige contribuição ou visa a rentabilidade econômica.","Dizer que o setor privado participa do SUS de forma substitutiva ou prioritária: é complementar.","Trocar as idades: 65/62 (regra geral urbana) x 60/55 (rural); ou dizer que o BPC é benefício previdenciário: é assistencial."],"base_legal":"CF/1988, arts. 196 a 204 (redação da EC 103/2019 e da EC 114/2021).","questoes":["CONST-002","P22-055","P22-107","P22-108","P22-109"]},{"id":"da-01","disciplina":"Direito Administrativo","topico":"Estado, governo e administração pública","recorrencia":"media","provas":[2022],"resumo":"Antes de estudar atos e poderes, é preciso diferenciar Estado (a pessoa jurídica soberana), governo (quem define as políticas) e administração pública (quem executa). A banca cobra principalmente os sentidos subjetivo e objetivo da expressão 'administração pública'.","pontos":["Estado: pessoa jurídica de direito público formada por povo, território e governo soberano. Funções do Estado: legislativa, executiva (administrativa) e jurisdicional: cada Poder exerce funções típicas e, de forma atípica, as dos outros.","Governo: atividade política e discricionária de comando e de fixação de objetivos e diretrizes. Administração: atividade neutra, normalmente vinculada à lei, hierarquizada, de execução.","Administração em sentido SUBJETIVO (orgânico ou formal): o conjunto de órgãos, entidades e agentes que exercem a função administrativa: responde 'quem'.","Administração em sentido OBJETIVO (material ou funcional): a atividade administrativa em si: responde 'o quê'. Um ato praticado por agente no exercício da função expressa o sentido objetivo.","Atividades da administração em sentido material: serviço público, polícia administrativa, fomento (incentivo à iniciativa privada de interesse público) e intervenção (regulamentação e fiscalização da atividade econômica privada e atuação direta do Estado na economia).","Regime jurídico-administrativo apoiado em duas ideias: supremacia do interesse público sobre o privado (prerrogativas) e indisponibilidade do interesse público (sujeições/limites).","Fontes do Direito Administrativo: lei (fonte primária), doutrina, jurisprudência e costumes (fontes secundárias).","O Brasil adota o sistema de jurisdição única (sistema inglês): decisões administrativas podem ser revistas pelo Judiciário (art. 5º, XXXV, CF)."],"pegadinhas":["Dizer que o ato praticado por agente expressa o sentido orgânico/subjetivo: a atividade é sentido objetivo/material.","Afirmar que governo e administração são sinônimos ou que a administração pública pratica atos políticos de forma típica.","Dizer que o Brasil adota o contencioso administrativo (sistema francês) com coisa julgada administrativa definitiva.","Classificar a regulamentação e fiscalização de atividade econômica privada como fomento: é intervenção."],"base_legal":"Doutrina (Di Pietro, Hely Lopes Meirelles); CF/1988, arts. 2º, 5º, XXXV, e 37.","questoes":["P22-032","P22-033"]},{"id":"da-02","disciplina":"Direito Administrativo","topico":"Princípios da administração pública","recorrencia":"media","provas":[],"resumo":"Princípios são as regras-mãe que orientam toda a atuação administrativa. Os expressos estão no art. 37 da CF (LIMPE); outros estão em leis, como a Lei 9.784/1999, ou são reconhecidos pela doutrina e pelo STF. Servem de base para resolver quase toda questão de Administrativo.","pontos":["Legalidade: o administrador só pode fazer o que a lei permite ou determina (para o particular, pode tudo o que a lei não proíbe).","Impessoalidade: atuação voltada ao interesse público, sem favoritismos ou perseguições; os atos são imputados ao órgão, não ao agente; é vedada promoção pessoal em publicidade oficial (art. 37, § 1º, CF).","Moralidade: exige ética, boa-fé e probidade. Súmula Vinculante 13 proíbe o nepotismo (parentes até o 3º grau da autoridade nomeante ou de servidor em cargo de direção): em regra não se aplica a cargos de natureza política, salvo fraude ou falta de qualificação.","Publicidade: divulgação oficial dos atos; é requisito de eficácia (não de validade) e comporta exceções por sigilo (segurança da sociedade e do Estado, intimidade). Regulada também pela Lei 12.527/2011 (LAI).","Eficiência: incluída pela EC 19/1998; busca resultados com qualidade, rapidez e economicidade.","Princípios do art. 2º da Lei 9.784/1999: legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público e eficiência.","Autotutela: a administração pode anular seus atos ilegais e revogar os inconvenientes ou inoportunos, respeitados os direitos adquiridos e ressalvada a apreciação judicial (Súmulas 346 e 473 do STF).","Outros princípios reconhecidos: supremacia e indisponibilidade do interesse público, continuidade do serviço público, segurança jurídica e proteção da confiança, especialidade, tutela (controle sobre a indireta) e hierarquia.","Os princípios do art. 37 valem para a administração direta e indireta de QUALQUER dos Poderes da União, Estados, DF e Municípios."],"pegadinhas":["Afirmar que a legalidade administrativa permite fazer tudo o que a lei não proíbe: isso vale para o particular.","Dizer que a publicidade é requisito de validade do ato ou que não admite exceções.","Dizer que os princípios do art. 37 se aplicam só ao Poder Executivo ou só à administração direta.","Confundir revogação (mérito, ex nunc) e anulação (ilegalidade, ex tunc) dentro da autotutela."],"base_legal":"CF/1988, art. 37, caput e § 1º; Lei 9.784/1999, art. 2º; Súmulas 346 e 473 do STF; Súmula Vinculante 13.","questoes":["ADM-002"]},{"id":"da-03","disciplina":"Direito Administrativo","topico":"Poderes administrativos (vinculado, discricionário, hierárquico, disciplinar, regulamentar e de polícia)","recorrencia":"alta","provas":[2012,2022],"resumo":"Poderes administrativos são instrumentos que a lei dá à administração para cumprir o interesse público: são poderes-deveres, não faculdades. A banca cobra a definição de cada um e os limites (abuso de poder).","pontos":["Vinculado: a lei define todos os elementos do ato, sem margem de escolha. Discricionário: a lei deixa margem de conveniência e oportunidade (mérito administrativo), sempre dentro dos limites legais; o Judiciário controla a legalidade, não o mérito.","Hierárquico: distribuir e escalonar funções, dar ordens, fiscalizar, rever atos dos subordinados, delegar e avocar competências. Não existe hierarquia entre a administração direta e as entidades da indireta (há apenas tutela/supervisão ministerial).","Disciplinar: apurar infrações e aplicar penalidades aos servidores e a outras pessoas sujeitas à disciplina administrativa (ex.: particulares contratados). Não se confunde com o poder punitivo penal do Estado.","Regulamentar (normativo): editar atos gerais para complementar a lei e permitir sua fiel execução (art. 84, IV, CF): não pode inovar contra a lei ou além dela; o Congresso pode sustar atos normativos do Executivo que exorbitem do poder regulamentar (art. 49, V).","Decreto autônomo (art. 84, VI, CF): dispor sobre organização e funcionamento da administração federal, quando não implicar aumento de despesa nem criação ou extinção de órgãos, e extinguir funções ou cargos públicos quando vagos.","Poder de polícia: condicionar e restringir o uso de bens, atividades e direitos individuais em benefício da coletividade (art. 78 do CTN). Atributos: discricionariedade (em regra), autoexecutoriedade e coercibilidade. Ciclo: ordem, consentimento, fiscalização e sanção.","STF (Tema 532): é possível delegar fases do poder de polícia (consentimento, fiscalização e sanção) a pessoas jurídicas de direito privado da administração indireta, de capital majoritariamente público, que prestem exclusivamente serviço público em regime não concorrencial: a fase de ordem (legislar) é indelegável.","O exercício regular do poder de polícia pode fundamentar a cobrança de taxa (art. 145, II, CF).","Abuso de poder: excesso de poder (o agente vai além da sua competência) ou desvio de finalidade/de poder (age dentro da competência, mas para fim diverso do interesse público)."],"pegadinhas":["Dizer que o poder regulamentar autoriza criar direitos e obrigações não previstos em lei.","Afirmar que há hierarquia entre ministério e autarquia vinculada.","Confundir poder disciplinar (sobre quem tem vínculo especial com a administração) com poder de polícia (sobre a coletividade em geral).","Afirmar que todo o ciclo do poder de polícia pode ser delegado a particulares: a ordem não pode e há requisitos para as demais fases."],"base_legal":"CF/1988, arts. 49, V, e 84, IV e VI; CTN, art. 78; Lei 9.784/1999, arts. 11 a 15; STF, RE 633.782 (Tema 532).","questoes":["P22-035","P22-037"]},{"id":"da-04","disciplina":"Direito Administrativo","topico":"Ato administrativo: conceito, requisitos (elementos) e atributos","recorrencia":"alta","provas":[2012,2022],"resumo":"Ato administrativo é a manifestação unilateral de vontade da administração, sob regime de direito público, que produz efeitos jurídicos. Para ser válido precisa de cinco elementos e, por ser da administração, tem atributos que os atos privados não têm.","pontos":["Elementos/requisitos (Lei 4.717/1965, art. 2º): competência (sujeito), finalidade, forma, motivo e objeto.","Competência, finalidade e forma são sempre vinculados; motivo e objeto podem ser discricionários e compõem o mérito do ato discricionário.","Finalidade: em sentido amplo, sempre o interesse público; em sentido estrito, o resultado específico previsto em lei. Desvio de finalidade gera nulidade.","Motivo é a situação de fato e de direito que leva ao ato; motivação é a exposição escrita desses motivos. Teoria dos motivos determinantes: se os motivos declarados forem falsos ou inexistentes, o ato é inválido, mesmo que a motivação não fosse obrigatória.","Atributos (PATI): Presunção de legitimidade e veracidade (relativa: admite prova em contrário); Autoexecutoriedade; Tipicidade; Imperatividade.","Autoexecutoriedade: a administração executa suas decisões diretamente, sem precisar de ordem judicial, quando a lei autoriza
