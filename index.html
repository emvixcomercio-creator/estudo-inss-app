987) é personalíssima: não é transmissível a dependentes, cônjuge ou herdeiros, extinguindo-se com a morte do beneficiário.","legislacao":"Lei 9.425/1996.","pegadinha":"Afirmou a transmissibilidade de uma pensão personalíssima, citando 'cônjuge sobrevivente ou herdeiros' para parecer técnico.","resumo_flash":"As vítimas do acidente radioativo com césio-137 em Goiânia recebem pensão especial vitalícia da União, cujo valor varia conforme o grau de lesão. Ela é personalíssima: não passa para viúvo(a) nem para herdeiros.","dica_padrao":"Mesma lógica do item de Caruaru: pensões especiais indenizatórias, em regra, não se transmitem. Se o item disser que se transmite, desconfie.","recorrencia":"media","tags":["legislação especial","Goiânia","césio-137","pensão especial"],"origem":"INSS 2022 · Cebraspe · Técnico · item 101","prova":2022,"desatualizada":false},{"id":"P22-102","disciplina":"Direito Previdenciário","assunto":"Regime do anistiado político","enunciado":"Acerca dos benefícios decorrentes de legislações especiais e do seguro-defeso: o regime do anistiado político compreende, entre outros, o direito à reparação econômica, de caráter indenizatório, em prestação única ou mensal, permanente e continuada, sendo vedadas a readmissão e a promoção na inatividade.","gabarito":"Errado","comentario":"A primeira parte está correta: o regime do anistiado político inclui reparação econômica de caráter indenizatório, em prestação única ou em prestação mensal, permanente e continuada. O erro está no final: a lei e o ADCT ASSEGURAM as promoções na inatividade e preveem a reintegração/readmissão de servidores e empregados punidos, em vez de vedá-las.","legislacao":"ADCT, art. 8º; Lei 10.559/2002.","pegadinha":"Começou com a literalidade correta e acrescentou, no fim, uma vedação inexistente ('sendo vedadas a readmissão e a promoção na inatividade').","resumo_flash":"O anistiado político (perseguido por motivação exclusivamente política entre 1946 e 1988) tem direito, entre outros pontos, a: declaração da condição de anistiado; reparação econômica (prestação única ou mensal); contagem do tempo de afastamento; conclusão de curso; reintegração ou readmissão; e promoções na inatividade.","dica_padrao":"Cuidado com a 'cauda' do item: a Cebraspe começa com texto legal correto e coloca o erro na última oração.","recorrencia":"media","tags":["legislação especial","anistiado político","reparação econômica"],"origem":"INSS 2022 · Cebraspe · Técnico · item 102","prova":2022,"desatualizada":false},{"id":"P22-103","disciplina":"Direito Previdenciário","assunto":"Pensão especial: hanseníase (isolamento compulsório)","enunciado":"Acerca dos benefícios decorrentes de legislações especiais e do seguro-defeso: a pensão especial concedida às pessoas atingidas pela hanseníase, ressalvado o direito à opção, não é acumulável com indenizações que a União venha a pagar em decorrência de responsabilização civil sobre os mesmos fatos, bem como não impede a fruição de qualquer benefício previdenciário.","gabarito":"Certo","comentario":"Correto. A Lei 11.520/2007 garante pensão especial, mensal e vitalícia, às pessoas atingidas pela hanseníase que foram submetidas a isolamento e internação compulsórios em hospitais-colônia até 31/12/1986. Ressalvado o direito de opção, ela não se acumula com indenizações da União sobre os mesmos fatos, mas não impede o recebimento de benefício previdenciário. (A Lei 14.736/2023 estendeu a pensão aos filhos separados dos pais nessas internações; isso não altera o item.)","legislacao":"Lei 11.520/2007 (alterada pela Lei 14.736/2023).","pegadinha":"Mistura duas regras (não acumula com indenização da União; acumula com benefício previdenciário) para confundir quem decorou só uma delas.","resumo_flash":"Pessoas com hanseníase que foram isoladas compulsoriamente em hospitais-colônia até 1986 recebem pensão especial vitalícia da União. Ela não se soma a indenização da União pelos mesmos fatos (deve-se optar), mas pode ser recebida junto com aposentadoria ou outro benefício previdenciário.","dica_padrao":"Separe 'indenização da União pelo mesmo fato' (não acumula) de 'benefício previdenciário' (acumula). A banca troca um pelo outro.","recorrencia":"media","tags":["legislação especial","hanseníase","pensão especial","acumulação"],"origem":"INSS 2022 · Cebraspe · Técnico · item 103","prova":2022,"desatualizada":false},{"id":"P22-104","disciplina":"Direito Previdenciário","assunto":"Pensão especial: síndrome congênita do zika vírus","enunciado":"Acerca dos benefícios decorrentes de legislações especiais e do seguro-defeso: a pensão especial destinada às crianças com síndrome congênita do zika vírus nascidas entre 1º de janeiro de 2015 e 31 de dezembro de 2019 e beneficiárias do benefício de prestação continuada é mensal, vitalícia e intransferível, tendo o valor de um salário mínimo.","gabarito":"Certo","comentario":"Gabarito oficial: Certo, pois o item reproduz a Lei 13.985/2020 (pensão mensal, vitalícia e intransferível, de um salário mínimo, para crianças nascidas de 2015 a 2019 que recebiam BPC). ATENÇÃO (atualização): a Lei 15.156/2025 instituiu uma NOVA pensão especial, mensal e vitalícia, para a pessoa com deficiência permanente decorrente da síndrome congênita do zika, no valor do teto do RGPS (maior salário de benefício), sem o recorte de datas de nascimento, acumulável com o BPC, além de indenização por dano moral de R$ 50 mil. A Lei 13.985/2020 não foi expressamente revogada, de modo que o item continua correto como descrição daquela lei, mas uma questão nova sobre 'a pensão do zika' tende a cobrar as regras de 2025.","legislacao":"Lei 13.985/2020; Lei 15.156/2025 (nova pensão especial no valor do teto do RGPS e indenização por dano moral).","pegadinha":"Na época, a dúvida era sobre detalhes (datas de nascimento, exigência de BPC, valor de um salário mínimo). Hoje, o risco é confundir a pensão da Lei 13.985/2020 (1 salário mínimo) com a da Lei 15.156/2025 (teto do RGPS).","resumo_flash":"Crianças com síndrome congênita do zika (microcefalia, entre outras sequelas) receberam primeiro uma pensão de 1 salário mínimo (Lei 13.985/2020), que exigia nascimento entre 2015 e 2019 e recebimento do BPC. Em 2025, a Lei 15.156 criou uma pensão vitalícia no valor do teto do RGPS, acumulável com o BPC, e uma indenização por dano moral de R$ 50 mil.","dica_padrao":"Em legislação especial, verifique se o item fala da lei antiga ou da nova. Valores e requisitos que mudaram recentemente são alvo preferido da banca.","recorrencia":"media","tags":["legislação especial","zika vírus","pensão especial","Lei 13.985/2020","Lei 15.156/2025","atualização"],"origem":"INSS 2022 · Cebraspe · Técnico · item 104","prova":2022,"desatualizada":false},{"id":"P22-105","disciplina":"Direito Previdenciário","assunto":"Seguro-desemprego do pescador artesanal (seguro-defeso)","enunciado":"Acerca dos benefícios decorrentes de legislações especiais e do seguro-defeso: o seguro-desemprego concedido, durante o período de defeso, ao pescador profissional que exerce a atividade pesqueira de forma artesanal é transferível a outrem.","gabarito":"Errado","comentario":"O seguro-defeso, pago ao pescador artesanal durante o período em que a pesca é proibida para preservar as espécies, é benefício PESSOAL e INTRANSFERÍVEL. Seu valor é de um salário mínimo mensal durante o defeso.","legislacao":"Lei 10.779/2003.","pegadinha":"Afirmou a transferibilidade de um benefício expressamente pessoal e intransferível.","resumo_flash":"Seguro-defeso é o seguro-desemprego do pescador profissional artesanal durante o defeso (época em que a pesca é proibida). Vale um salário mínimo por mês, é pessoal e intransferível e é operacionalizado pelo INSS.","dica_padrao":"Benefícios assistenciais ou de substituição de renda dificilmente são 'transferíveis'. Desconfie de itens que dizem que um benefício pode ser repassado a outra pessoa.","recorrencia":"media","tags":["seguro-defeso","pescador artesanal","seguro-desemprego"],"origem":"INSS 2022 · Cebraspe · Técnico · item 105","prova":2022,"desatualizada":false},{"id":"P22-106","disciplina":"Direito Previdenciário","assunto":"Princípios da seguridade social (art. 194 CF)","enunciado":"Considerando que a seguridade social compreende um conjunto integrado de ações de iniciativa dos poderes públicos e da sociedade, destinado a assegurar os direitos relativos à saúde, à previdência e à assistência social: são princípios da seguridade social a universalidade da cobertura e do atendimento, a seletividade e distributividade na prestação dos benefícios e serviços e a progressividade na forma de participação no custeio.","gabarito":"Errado","comentario":"Os dois primeiros princípios estão corretos, mas a Constituição fala em EQUIDADE na forma de participação no custeio, e não em 'progressividade'. Progressividade é técnica tributária (alíquotas que sobem conforme a base) e não figura entre os objetivos do art. 194.","legislacao":"CF, art. 194, parágrafo único, I, III e V.","pegadinha":"Trocou uma única palavra ('equidade' por 'progressividade') em uma lista em que os demais itens estão corretos.","resumo_flash":"Princípios/objetivos da seguridade (art. 194, parágrafo único, CF): universalidade da cobertura e do atendimento; uniformidade e equivalência dos benefícios e serviços às populações urbanas e rurais; seletividade e distributividade; irredutibilidade do valor dos benefícios; equidade na forma de participação no custeio; diversidade da base de financiamento; caráter democrático e descentralizado da administração (gestão quadripartite).","dica_padrao":"Em listas de princípios, leia cada palavra: a Cebraspe troca um único termo por um sinônimo aparente (equidade/progressividade, uniformidade/uniformização, diversidade/unicidade).","recorrencia":"alta","tags":["seguridade social","princípios","art. 194 CF","equidade no custeio"],"origem":"INSS 2022 · Cebraspe · Técnico · item 106","prova":2022,"desatualizada":false},{"id":"P22-107","disciplina":"Direito Previdenciário","assunto":"Saúde: acesso universal e igualitário (arts. 196 e 198 CF)","enunciado":"Considerando que a seguridade social compreende um conjunto integrado de ações de iniciativa dos poderes públicos e da sociedade, destinado a assegurar os direitos relativos à saúde, à previdência e à assistência social: o direito à saúde deve ser garantido mediante políticas sociais e econômicas que assegurem o acesso universal e igualitário às ações e aos serviços voltados para sua promoção, proteção e recuperação, promovidos por meio de rede regionalizada e hierarquizada e integrados em sistema único.","gabarito":"Certo","comentario":"Correto. O item combina o art. 196 (saúde é direito de todos e dever do Estado, garantido por políticas sociais e econômicas, com acesso universal e igualitário às ações de promoção, proteção e recuperação) com o art. 198 (ações e serviços integram rede regionalizada e hierarquizada e constituem sistema único: o SUS).","legislacao":"CF, arts. 196 e 198.","pegadinha":"A fusão de dois artigos pode dar impressão de texto adulterado, mas ambos estão reproduzidos fielmente.","resumo_flash":"Dos três ramos da seguridade, a saúde é o mais amplo: é para todos, independentemente de contribuição. O SUS é organizado em rede regionalizada e hierarquizada, com descentralização, atendimento integral e participação da comunidade.","dica_padrao":"Lembre-se do 'tripé' de acesso: saúde = todos; assistência = quem dela necessitar; previdência = quem contribui. Itens que trocam esses públicos são Errados.","recorrencia":"alta","tags":["seguridade social","saúde","SUS","art. 196 CF"],"origem":"INSS 2022 · Cebraspe · Técnico · item 107","prova":2022,"desatualizada":false},{"id":"P22-108","disciplina":"Direito Previdenciário","assunto":"Previdência social: riscos cobertos (art. 201 CF)","enunciado":"Considerando que a seguridade social compreende um conjunto integrado de ações de iniciativa dos poderes públicos e da sociedade, destinado a assegurar os direitos relativos à saúde, à previdência e à assistência social: a previdência social tem a finalidade de assegurar aos seus contribuintes a proteção em face de eventos como incapacidade, idade avançada, desemprego voluntário e reclusão ou morte daqueles de quem dependam economicamente.","gabarito":"Errado","comentario":"A Constituição protege o trabalhador em situação de desemprego INVOLUNTÁRIO, e não voluntário. Quem pede demissão não tem direito ao seguro-desemprego. Os demais eventos (incapacidade, idade avançada, reclusão e morte) estão corretamente listados no art. 201.","legislacao":"CF, art. 201, I a V (redação da EC 103/2019); Decreto 3.048/1999, art. 5º.","pegadinha":"Trocou 'involuntário' por 'voluntário' no meio de uma lista correta.","resumo_flash":"A previdência cobre: incapacidade temporária ou permanente e idade avançada; proteção à maternidade (gestante); desemprego involuntário; salário-família e auxílio-reclusão para dependentes de segurados de baixa renda; e pensão por morte.","dica_padrao":"Em listas longas, procure a palavra que inverte o sentido (voluntário/involuntário, temporário/permanente, alta/baixa renda).","recorrencia":"alta","tags":["previdência social","riscos cobertos","art. 201 CF","desemprego involuntário"],"origem":"INSS 2022 · Cebraspe · Técnico · item 108","prova":2022,"desatualizada":false},{"id":"P22-109","disciplina":"Direito Previdenciário","assunto":"Assistência social: objetivos (art. 203 CF)","enunciado":"Considerando que a seguridade social compreende um conjunto integrado de ações de iniciativa dos poderes públicos e da sociedade, destinado a assegurar os direitos relativos à saúde, à previdência e à assistência social: a assistência social será prestada a quem dela necessitar, independentemente de contribuição, a fim de garantir, entre outros objetivos, a proteção à maternidade, à infância e à pessoa com deficiência.","gabarito":"Certo","comentario":"Correto. O art. 203 da CF diz que a assistência social será prestada a quem dela necessitar, independentemente de contribuição à seguridade social, e lista como objetivos, entre outros, a proteção à família, à maternidade, à infância, à adolescência e à velhice, e a habilitação/reabilitação e a integração da pessoa com deficiência.","legislacao":"CF, art. 203, I e IV.","pegadinha":"O item resumiu a lista do art. 203 com 'entre outros', o que é correto. O risco seria afirmar que a assistência exige contribuição.","resumo_flash":"Assistência social é o ramo da seguridade voltado a quem precisa, sem exigir contribuição. Seu principal benefício é o BPC: um salário mínimo mensal à pessoa com deficiência ou à pessoa idosa (65 anos ou mais) de baixa renda.","dica_padrao":"Itens com 'entre outros' que citam apenas elementos verdadeiros costumam ser Certos. Confira se algum elemento citado não pertence à lista.","recorrencia":"alta","tags":["seguridade social","assistência social","art. 203 CF"],"origem":"INSS 2022 · Cebraspe · Técnico · item 109","prova":2022,"desatualizada":false},{"id":"P22-110","disciplina":"Direito Previdenciário","assunto":"Financiamento da seguridade social (art. 195 CF)","enunciado":"Considerando que a seguridade social compreende um conjunto integrado de ações de iniciativa dos poderes públicos e da sociedade, destinado a assegurar os direitos relativos à saúde, à previdência e à assistência social: a seguridade social será financiada por toda a sociedade, de forma direta e indireta, mediante recursos provenientes da União, dos estados, do Distrito Federal, dos municípios e de contribuições sociais como as incidentes sobre a receita de concursos de prognósticos.","gabarito":"Certo","comentario":"Correto. O art. 195 da CF determina que a seguridade é financiada por toda a sociedade, de forma direta e indireta, com recursos dos orçamentos da União, dos estados, do DF e dos municípios e com contribuições sociais: entre elas a incidente sobre a receita de concursos de prognósticos (loterias), prevista no inciso III.","legislacao":"CF, art. 195, caput e III.","pegadinha":"Mencionar 'concursos de prognósticos', expressão pouco conhecida, para fazer o candidato duvidar.","resumo_flash":"Fontes de custeio da seguridade (art. 195): orçamentos dos entes federativos (financiamento indireto) e contribuições sociais (diretas): do empregador/empresa (folha, receita/faturamento, lucro), do trabalhador, sobre concursos de prognósticos (loterias) e do importador.","dica_padrao":"Itens que afirmam que o custeio é exclusivo do poder público ou só dos trabalhadores são Errados: o financiamento é de toda a sociedade.","recorrencia":"alta","tags":["seguridade social","custeio","art. 195 CF","concursos de prognósticos"],"origem":"INSS 2022 · Cebraspe · Técnico · item 110","prova":2022,"desatualizada":false},{"id":"P22-111","disciplina":"Direito Previdenciário","assunto":"Segurados obrigatórios: cargo em comissão e contribuinte individual","enunciado":"Quanto ao Regime Geral de Previdência Social (RGPS), seus segurados e respectivos dependentes: são segurados obrigatórios da previdência social o servidor público ocupante de cargo em comissão, sem vínculo efetivo com a União, com autarquias, inclusive em regime especial, e com fundações públicas federais, e a pessoa física que exerce, por conta própria, com finalidade de lucro, atividade econômica de natureza urbana.","gabarito":"Certo","comentario":"Correto. O ocupante exclusivamente de cargo em comissão (sem vínculo efetivo) é segurado obrigatório do RGPS na categoria de EMPREGADO; e a pessoa física que exerce, por conta própria, atividade econômica de natureza urbana, com fins lucrativos ou não, é CONTRIBUINTE INDIVIDUAL. O fato de o item mencionar apenas 'com finalidade de lucro' não o torna errado, pois a lei abrange ambas as hipóteses.","legislacao":"Lei 8.213/1991, art. 11, I, 'g', e V, 'h'; CF, art. 40, § 13.","pegadinha":"Juntou duas categorias diferentes de segurado obrigatório (empregado e contribuinte individual) em uma só frase, e citou só 'com finalidade de lucro' (a lei diz 'com fins lucrativos ou não').","resumo_flash":"Servidor com cargo efetivo vai para o regime próprio (RPPS), se houver. Já quem ocupa SÓ cargo em comissão, sem vínculo efetivo, é segurado empregado do RGPS. O trabalhador autônomo urbano é contribuinte individual.","dica_padrao":"Item incompleto não é necessariamente errado para a Cebraspe: se o que foi dito é verdade, tende a ser Certo.","recorrencia":"alta","tags":["segurados obrigatórios","cargo em comissão","contribuinte individual","empregado"],"origem":"INSS 2022 · Cebraspe · Técnico · item 111","prova":2022,"desatualizada":false},{"id":"P22-112","disciplina":"Direito Previdenciário","assunto":"Segurado facultativo: vedação a participante de RPPS","enunciado":"Quanto ao Regime Geral de Previdência Social (RGPS), seus segurados e respectivos dependentes: é vedada a filiação ao RGPS, na qualidade de segurado facultativo, de pessoa participante de regime próprio de previdência social, salvo na hipótese de afastamento sem vencimento e desde que não permitida, nesta condição, contribuição ao respectivo regime próprio.","gabarito":"Certo","comentario":"Correto. A Constituição proíbe a filiação ao RGPS, como facultativo, de pessoa participante de regime próprio. O regulamento admite a exceção do servidor afastado sem vencimentos, desde que o RPPS não permita contribuição nessa condição.","legislacao":"CF, art. 201, § 5º; Lei 8.213/1991, art. 13; Decreto 3.048/1999, art. 11, § 2º.","pegadinha":"A exceção (afastamento sem vencimento) parece invenção, mas está no Regulamento da Previdência Social.","resumo_flash":"Segurado facultativo é quem não exerce atividade remunerada que o torne obrigatório, tem 16 anos ou mais e decide contribuir (ex.: dona de casa, estudante). Quem já está em regime próprio não pode ser facultativo no RGPS, salvo se estiver afastado sem vencimento e o RPPS não aceitar contribuições.","dica_padrao":"Exceções muito específicas, redigidas com detalhes técnicos, geralmente vêm do decreto: não as descarte como invenção.","recorrencia":"alta","tags":["segurado facultativo","RPPS","art. 201 § 5º CF"],"origem":"INSS 2022 · Cebraspe · Técnico · item 112","prova":2022,"desatualizada":false},{"id":"P22-113","disciplina":"Direito Previdenciário","assunto":"Dependentes: filho universitário maior de 21 anos","enunciado":"Quanto ao Regime Geral de Previdência Social (RGPS), seus segurados e respectivos dependentes: é beneficiário do RGPS, na condição de dependente do segurado, o filho não emancipado, de qualquer condição, menor de 24 anos de idade, desde que esteja matriculado em curso de ensino superior ou de escola técnica.","gabarito":"Errado","comentario":"O filho não emancipado, de qualquer condição, é dependente até os 21 anos, ou em qualquer idade se for inválido ou tiver deficiência intelectual, mental ou grave. Não existe prorrogação até 24 anos por estar cursando faculdade ou escola técnica (regra do imposto de renda, não da previdência). O STJ também nega a extensão da pensão ao universitário.","legislacao":"Lei 8.213/1991, art. 16, I; STJ, Tema 643 (REsp 1.369.832).","pegadinha":"Importou a regra dos 24 anos do imposto de renda/planos de saúde para o RGPS.","resumo_flash":"Dependentes de 1ª classe: cônjuge, companheiro(a) e filho não emancipado menor de 21 anos ou inválido ou com deficiência intelectual, mental ou grave. A dependência econômica deles é presumida. Fazer faculdade não estende a condição de dependente.","dica_padrao":"A banca importa números de outros ramos do Direito (24 anos do IR, 18 anos da maioridade civil). No RGPS, a idade do filho dependente é 21 anos.","recorrencia":"alta","tags":["dependentes","filho","21 anos","universitário"],"origem":"INSS 2022 · Cebraspe · Técnico · item 113","prova":2022,"desatualizada":false},{"id":"P22-114","disciplina":"Direito Previdenciário","assunto":"Dependentes: equiparados a filho (enteado, tutelado, menor sob guarda)","enunciado":"Quanto ao Regime Geral de Previdência Social (RGPS), seus segurados e respectivos dependentes: o enteado, o menor sob guarda e o menor tutelado equiparam-se a filho do segurado, mediante declaração deste, desde que comprovada a dependência econômica.","gabarito":"Errado","comentario":"Pela Lei 8.213/1991 e pela EC 103/2019, equiparam-se a filho, mediante declaração do segurado e comprovação da dependência econômica, APENAS o enteado e o menor tutelado. O menor sob guarda foi excluído do rol desde a Lei 9.528/1997, e a EC 103/2019 (art. 23, § 6º) reforçou que só esses dois se equiparam. Atenção: em 2021, o STF (ADIs 4.878 e 5.083) admitiu o menor sob guarda como dependente na redação legal anterior à EC 103/2019, mas, para provas, vale a literalidade atual da lei e da EC 103, que excluem o menor sob guarda.","legislacao":"Lei 8.213/1991, art. 16, § 2º; EC 103/2019, art. 23, § 6º; STF, ADIs 4.878 e 5.083.","pegadinha":"Inseriu o 'menor sob guarda' no rol, aproveitando a polêmica jurisprudencial sobre o tema.","resumo_flash":"Equiparados a filho = enteado + menor tutelado. Requisitos: declaração do segurado + comprovação da dependência econômica (que, para eles, NÃO é presumida). O menor sob guarda está fora do rol na lei e na EC 103/2019.","dica_padrao":"Em listas de equiparação, conte os elementos: a Cebraspe adiciona um a mais (menor sob guarda) ou retira um dos corretos.","recorrencia":"alta","tags":["dependentes","enteado","menor tutelado","menor sob guarda","EC103"],"origem":"INSS 2022 · Cebraspe · Técnico · item 114","prova":2022,"desatualizada":false},{"id":"P22-115","disciplina":"Direito Previdenciário","assunto":"LOAS: princípios da assistência social","enunciado":"No que diz respeito ao benefício de prestação continuada (BPC) e ao auxílio-inclusão, conforme a Lei Orgânica da Assistência Social (LOAS): a assistência social é regida pelo princípio da supremacia das exigências de rentabilidade econômica sobre o atendimento às necessidades sociais.","gabarito":"Errado","comentario":"A LOAS diz exatamente o contrário: a assistência social rege-se pela supremacia do atendimento às necessidades sociais sobre as exigências de rentabilidade econômica. A lógica da assistência é atender a quem precisa, não gerar lucro.","legislacao":"Lei 8.742/1993 (LOAS), art. 4º, I.","pegadinha":"Inverteu os termos da comparação ('rentabilidade sobre necessidades' no lugar de 'necessidades sobre rentabilidade').","resumo_flash":"Princípios da LOAS (art. 4º): supremacia das necessidades sociais sobre a rentabilidade econômica; universalização dos direitos sociais; respeito à dignidade e à autonomia do cidadão; igualdade de direitos no acesso ao atendimento, sem discriminação; e divulgação ampla dos benefícios, serviços, programas e projetos.","dica_padrao":"Cuidado com inversões 'A sobre B' x 'B sobre A'. Pergunte-se qual é a lógica do ramo: assistência social prioriza a necessidade, nunca o lucro.","recorrencia":"alta","tags":["LOAS","assistência social","princípios"],"origem":"INSS 2022 · Cebraspe · Técnico · item 115","prova":2022,"desatualizada":false},{"id":"P22-116","disciplina":"Direito Previdenciário","assunto":"BPC: critério de renda per capita","enunciado":"No que diz respeito ao benefício de prestação continuada (BPC) e ao auxílio-inclusão, conforme a Lei Orgânica da Assistência Social (LOAS): observados os demais critérios de elegibilidade definidos na LOAS, terão direito ao benefício de prestação continuada a pessoa com deficiência ou a pessoa idosa com renda familiar mensal per capita igual ou inferior a um quarto do salário mínimo.","gabarito":"Certo","comentario":"Correto. Desde a Lei 14.176/2021, a LOAS fixa como critério de renda a renda familiar mensal per capita IGUAL OU INFERIOR a 1/4 do salário mínimo (antes, a lei dizia 'inferior a 1/4'). O critério continua vigente em 2026, com as alterações procedimentais da Lei 15.077/2024 (como exigência de inscrição atualizada no CadÚnico e biometria). A lei ainda permite outros elementos probatórios da miserabilidade e prevê a possibilidade de ampliar o limite para até 1/2 salário mínimo, conforme regulamento.","legislacao":"Lei 8.742/1993, art. 20, caput e § 3º (redação da Lei 14.176/2021); §§ 11 e 11-A; Lei 15.077/2024.","pegadinha":"Quem estudou por material antigo lembra de 'inferior a 1/4' e pode estranhar o 'igual ou inferior'; outra pegadinha comum é trocar 1/4 por 1/2.","resumo_flash":"O BPC/LOAS paga 1 salário mínimo por mês à pessoa com deficiência ou à pessoa idosa (65 anos ou mais) que comprove não ter meios de se manter nem de ser mantida pela família. Critério básico de renda: renda familiar por pessoa igual ou inferior a 1/4 do salário mínimo. Não exige contribuição e não gera 13º nem pensão por morte.","dica_padrao":"Em BPC, a banca troca a fração (1/4 x 1/2), a idade (65 x 60) ou diz que o benefício exige contribuição. Memorize: 1/4, 65 anos, 1 salário mínimo.","recorrencia":"alta","tags":["BPC","LOAS","renda per capita","1/4 do salário mínimo"],"origem":"INSS 2022 · Cebraspe · Técnico · item 116","prova":2022,"desatualizada":false},{"id":"P22-117","disciplina":"Direito Previdenciário","assunto":"Auxílio-inclusão: inacumulabilidade com o BPC","enunciado":"No que diz respeito ao benefício de prestação continuada (BPC) e ao auxílio-inclusão, conforme a Lei Orgânica da Assistência Social (LOAS): o pagamento do auxílio-inclusão não será acumulado com o pagamento do benefício de prestação continuada.","gabarito":"Certo","comentario":"Correto. O auxílio-inclusão, criado pela Lei 14.176/2021, é pago à pessoa com deficiência que recebia o BPC e passa a exercer atividade remunerada (com remuneração de até 2 salários mínimos). Ao começar a trabalhar, o BPC é suspenso e passa a ser pago o auxílio-inclusão, no valor de meio salário mínimo; por isso os dois não se acumulam. A lei também veda a acumulação com aposentadorias, pensões, benefícios por incapacidade e seguro-desemprego.","legislacao":"Lei 8.742/1993, arts. 26-A a 26-H (incluídos pela Lei 14.176/2021); CF, art. 203.","pegadinha":"Quem imagina o auxílio-inclusão como um 'adicional' ao BPC marca Errado; na verdade, ele substitui o BPC quando a pessoa começa a trabalhar.","resumo_flash":"Auxílio-inclusão: incentivo para a pessoa com deficiência que recebe BPC entrar no mercado de trabalho. Valor de 1/2 salário mínimo, pago enquanto ela trabalha com remuneração de até 2 salários mínimos. O BPC fica suspenso nesse período, por isso não há acumulação.","dica_padrao":"Benefícios 'de transição' (que substituem outro quando a situação muda) não se acumulam com o benefício que substituem.","recorrencia":"alta","tags":["auxílio-inclusão","BPC","LOAS","acumulação","Lei 14.176/2021"],"origem":"INSS 2022 · Cebraspe · Técnico · item 117","prova":2022,"desatualizada":false},{"id":"P22-118","disciplina":"Direito Previdenciário","assunto":"BPC: operacionalização pelo INSS","enunciado":"No que diz respeito ao benefício de prestação continuada (BPC) e ao auxílio-inclusão, conforme a Lei Orgânica da Assistência Social (LOAS): compete ao INSS a operacionalização do benefício de prestação continuada.","gabarito":"Certo","comentario":"Correto. Embora o BPC seja benefício da ASSISTÊNCIA social (custeado com recursos da União e coordenado pelo ministério responsável pela assistência social), sua operacionalização, recebimento de requerimentos, análise, concessão, manutenção e revisão, cabe ao INSS.","legislacao":"Lei 8.742/1993, art. 29, parágrafo único; Decreto 6.214/2007, art. 3º.","pegadinha":"O candidato pode raciocinar que, por ser assistencial e não previdenciário, o BPC não seria administrado pelo INSS.","resumo_flash":"O BPC não é benefício previdenciário (não exige contribuição), mas quem o concede e mantém é o INSS. O financiamento vem do Fundo Nacional de Assistência Social, e a coordenação geral é do ministério da área de assistência social.","dica_padrao":"Distinga natureza do benefício (assistencial) de quem o administra (INSS). A banca explora essa confusão para os dois lados.","recorrencia":"alta","tags":["BPC","INSS","operacionalização","LOAS"],"origem":"INSS 2022 · Cebraspe · Técnico · item 118","prova":2022,"desatualizada":false},{"id":"P22-119","disciplina":"Direito Previdenciário","assunto":"Certidão de tempo de contribuição: períodos posteriores à aposentadoria","enunciado":"Em relação à certidão de tempo de contribuição, à contagem recíproca e à compensação previdenciária: é vedada a emissão de certidão de tempo de contribuição referente a períodos de contribuição posteriores à data da aposentadoria no RGPS.","gabarito":"Errado","comentario":"O Regulamento da Previdência Social ADMITE a emissão de certidão de tempo de contribuição (CTC) para períodos de contribuição posteriores à data da aposentadoria no RGPS. O que se veda é emitir CTC de período que já foi utilizado para a concessão de aposentadoria em qualquer regime (para evitar uso em dobro do mesmo tempo).","legislacao":"Decreto 3.048/1999, art. 125, § 3º, e art. 130 (vedação de certificar período já usado em aposentadoria); Lei 8.213/1991, art. 96.","pegadinha":"Transformou uma permissão em vedação, aproveitando-se de que existe uma vedação parecida (período já utilizado em aposentadoria).","resumo_flash":"A CTC é o documento que leva o tempo de contribuição de um regime para outro (ex.: do RGPS para o regime próprio de um servidor). Um aposentado do RGPS que continuou contribuindo pode obter CTC desse tempo posterior à aposentadoria. O que não pode é certificar tempo já usado para se aposentar.","dica_padrao":"Diferencie 'período posterior à aposentadoria' (pode certificar) de 'período já utilizado na aposentadoria' (não pode). A banca troca essas ideias.","recorrencia":"media","tags":["certidão de tempo de contribuição","CTC","contagem recíproca"],"origem":"INSS 2022 · Cebraspe · Técnico · item 119","prova":2022,"desatualizada":false},{"id":"P22-120","disciplina":"Direito Previdenciário","assunto":"Compensação financeira entre regimes","enunciado":"Em relação à certidão de tempo de contribuição, à contagem recíproca e à compensação previdenciária: a compensação financeira entre os regimes de previdência será realizada exclusivamente na contagem recíproca de tempo de contribuição não concomitante utilizado na concessão da aposentadoria.","gabarito":"Certo","comentario":"Correto. A compensação financeira é o acerto de contas entre o regime que recebeu as contribuições (regime de origem) e o regime que concede o benefício (regime instituidor). Pelas normas da compensação previdenciária, ela ocorre exclusivamente na contagem recíproca de tempo de contribuição NÃO concomitante, utilizado na concessão da aposentadoria (e de pensão dela decorrente). Tempo concomitante não pode ser contado em duplicidade.","legislacao":"CF, art. 201, § 9º; Lei 9.796/1999; Decreto 10.188/2019; Decreto 3.048/1999, art. 125.","pegadinha":"A palavra 'exclusivamente' leva muitos a marcar Errado por reflexo, mas aqui ela está correta.","resumo_flash":"Contagem recíproca: o tempo de contribuição de um regime (RGPS ou RPPS) pode ser somado no outro para aposentadoria. Depois, os regimes se compensam financeiramente. Só entra nessa compensação o tempo não concomitante (que não se sobrepõe), porque não se conta duas vezes o mesmo período.","dica_padrao":"Palavras absolutas ('exclusivamente', 'somente') não são sempre erro: verifique se a lei de fato restringe. Em contagem recíproca, 'não concomitante' é a palavra-chave.","recorrencia":"media","tags":["compensação previdenciária","contagem recíproca","tempo concomitante"],"origem":"INSS 2022 · Cebraspe · Técnico · item 120","prova":2022,"desatualizada":false}]</script>

7,"materia":"Ética","assunto":"Código de Ética do Servidor (Decreto 1.171/1994)","questoes":["ADM-003"]},{"dia":28,"materia":"Direito Previdenciário","assunto":"Cálculo da RMI (renda mensal inicial) pós-EC 103","questoes":["DP-005"]},{"dia":29,"materia":"Ética","assunto":"Sistema de Gestão da Ética (Decreto 6.029/2007)","questoes":["ADM-004"]},{"dia":30,"materia":"Revisão","assunto":"Revisão da semana + simulado misto","questoes":[],"revisao":true},{"dia":31,"materia":"Direito Previdenciário","assunto":"Classes de dependentes e presunção de dependência","questoes":["DP-030","DP-031"]},{"dia":32,"materia":"Português","assunto":"Regência verbal/nominal e pontuação","questoes":["PT-005","PT-006"]},{"dia":33,"materia":"Direito Previdenciário","assunto":"Pensão por morte: cota familiar e duração do benefício","questoes":["DP-016","DP-017"]},{"dia":34,"materia":"Direito Previdenciário","assunto":"BPC/LOAS e auxílio-inclusão","questoes":["DP-006","DP-018"]},{"dia":35,"materia":"Revisão","assunto":"Revisão da semana + simulado misto","questoes":[],"revisao":true},{"dia":36,"materia":"Direito Previdenciário","assunto":"Custeio da seguridade social: contribuições e alíquotas","questoes":["DP-032","DP-033"]},{"dia":37,"materia":"Direito Previdenciário","assunto":"Crimes previdenciários: sonegação x apropriação indébita","questoes":["DP-014","DP-015"]},{"dia":38,"materia":"Direito Previdenciário","assunto":"RPPS x RGPS: contagem recíproca e contribuição extraordinária","questoes":["DP-022"]},{"dia":39,"materia":"Direito Previdenciário","assunto":"Legislação especial: pensões especiais (seringueiros, Caruaru, Goiânia, talidomida, hanseníase, zika, anistiados)","questoes":["DP-007","DP-008","DP-009","DP-010","DP-011","DP-012","DP-013"]},{"dia":40,"materia":"Simulado geral","assunto":"Simulado geral: todas as questões do banco, todas as matérias","questoes":[],"simulado_geral":true}]}</script>
<script id="dados-teoria" type="application/json">[{"id":"dp-01","disciplina":"Direito Previdenciário","topico":"Seguridade Social: conceito e as três áreas (saúde, previdência e assistência)","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"A Seguridade Social é o conjunto integrado de ações de iniciativa dos Poderes Públicos e da sociedade destinado a assegurar os direitos relativos à saúde, à previdência social e à assistência social (art. 194 da CF). É a base de toda a matéria: a prova cobra muito a diferença entre as três áreas, principalmente quem precisa contribuir para ser protegido.","pontos":["Conceito (art. 194 CF): conjunto INTEGRADO de ações de iniciativa dos Poderes Públicos E da sociedade: não é só do Estado.","Saúde (art. 196): direito de todos e dever do Estado; acesso universal e igualitário; NÃO depende de contribuição; executada pelo SUS.","Previdência social (art. 201): caráter CONTRIBUTIVO e filiação OBRIGATÓRIA, observando critérios que preservem o equilíbrio financeiro e atuarial.","Assistência social (art. 203): prestada a quem dela necessitar, INDEPENDENTEMENTE de contribuição (ex.: BPC de 1 salário mínimo ao idoso de 65+ e à pessoa com deficiência em situação de miserabilidade).","Eventos cobertos pela previdência (art. 201): incapacidade temporária ou permanente para o trabalho e idade avançada; proteção à maternidade, especialmente à gestante; desemprego INVOLUNTÁRIO; salário-família e auxílio-reclusão para dependentes de segurados de baixa renda; pensão por morte.","Objetivos da assistência (art. 203): proteção à família, à maternidade, à infância, à adolescência e à velhice; amparo a crianças e adolescentes carentes; integração ao mercado de trabalho; habilitação e reabilitação da pessoa com deficiência; garantia de 1 salário mínimo ao idoso e à pessoa com deficiência sem meios de se manter.","Assistência social (art. 204): descentralização político-administrativa: coordenação e normas gerais na esfera FEDERAL; coordenação e execução dos programas nas esferas ESTADUAL e MUNICIPAL e por entidades beneficentes e de assistência social; participação da população.","Nenhum benefício que substitua o salário de contribuição ou o rendimento do trabalho do segurado terá valor mensal inferior ao salário mínimo (art. 201, §2º).","Previdência complementar privada (art. 202) é facultativa, autônoma em relação ao RGPS e baseada na constituição de reservas."],"pegadinhas":["Dizer que os benefícios da seguridade são exclusivos de quem contribui: só a PREVIDÊNCIA é contributiva; saúde e assistência não exigem contribuição (P22-053: Errado).","Trocar 'desemprego involuntário' por 'desemprego voluntário' entre os eventos cobertos pela previdência (P22-108: Errado).","Afirmar que a seguridade é composta só por ações do Poder Público, omitindo a sociedade.","Dizer que a execução dos programas de assistência é da União: a execução é estadual e municipal (e de entidades beneficentes); à União cabem coordenação e normas gerais (P22-055: Certo)."],"base_legal":"CF/1988, arts. 194, 196, 201, 202, 203 e 204; Lei 8.212/1991, arts. 1º a 5º; Lei 8.742/1993 (LOAS).","questoes":["CONST-002","P22-053","P22-055","P22-107","P22-108","P22-109"]},{"id":"dp-02","disciplina":"Direito Previdenciário","topico":"Princípios (objetivos) da Seguridade Social","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"O parágrafo único do art. 194 da CF lista sete objetivos que funcionam como princípios da Seguridade Social. A banca cobra a redação literal e costuma trocar uma palavra para tornar o item errado.","pontos":["I - Universalidade da cobertura (todos os riscos sociais) e do atendimento (todas as pessoas).","II - Uniformidade e equivalência dos benefícios e serviços às populações urbanas e rurais.","III - Seletividade e distributividade na prestação dos benefícios e serviços (o legislador escolhe quem mais precisa; distribui renda).","IV - Irredutibilidade do valor dos benefícios (no RGPS, o art. 201, §4º garante ainda o reajuste para preservar o valor REAL).","V - EQUIDADE na forma de participação no custeio: contribui mais quem tem mais capacidade contributiva.","VI - Diversidade da base de financiamento, identificando-se, em rubricas contábeis específicas para cada área, as receitas e despesas de saúde, previdência e assistência, preservado o caráter contributivo da previdência (redação da EC 103/2019).","VII - Caráter democrático e descentralizado da administração, mediante gestão QUADRIPARTITE: trabalhadores, empregadores, aposentados e Governo nos órgãos colegiados.","Outros princípios cobrados: solidariedade (art. 3º, I, CF), preexistência do custeio / contrapartida (art. 195, §5º: nenhum benefício criado, majorado ou estendido sem a correspondente fonte de custeio total) e anterioridade nonagesimal das contribuições (art. 195, §6º).","Dica de memorização: 'UNI-UNI-SEL-IRRE-EQUI-DIVER-DEMO'."],"pegadinhas":["Trocar 'equidade na forma de participação no custeio' por 'progressividade' ou 'igualdade' (P22-106: Errado por isso).","Dizer que a gestão é 'tripartite': na CF é QUADRIPARTITE (inclui os aposentados).","Confundir universalidade (alcançar todos) com seletividade (escolher prioridades): os dois coexistem.","Trocar 'uniformidade e equivalência' por 'igualdade' ou 'identidade' dos benefícios urbanos e rurais.","Dizer que a irredutibilidade garante reajuste real (acima da inflação): ela garante não reduzir; no RGPS, preservar o valor real."],"base_legal":"CF/1988, art. 194, parágrafo único; art. 195, §§5º e 6º; art. 201, §4º; Lei 8.212/1991, art. 1º, parágrafo único.","questoes":["CONST-001","P22-054","P22-106"]},{"id":"dp-03","disciplina":"Direito Previdenciário","topico":"Financiamento da Seguridade Social (art. 195 da CF)","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"A Seguridade é financiada por toda a sociedade, de forma direta (contribuições sociais) e indireta (recursos dos orçamentos da União, Estados, DF e Municípios). É tema certo de prova porque mistura texto constitucional, regras de criação de novas fontes e exceções como a imunidade das entidades beneficentes.","pontos":["Financiamento DIRETO: contribuições sociais; INDIRETO: recursos orçamentários da União, dos Estados, do DF e dos Municípios (art. 195, caput).","Contribuições do art. 195: I - do empregador/empresa/equiparada sobre (a) folha de salários e demais rendimentos pagos a pessoa física, mesmo sem vínculo, (b) receita ou faturamento, (c) lucro; II - do trabalhador e demais segurados (alíquotas podem ser progressivas; não incide sobre aposentadoria e pensão do RGPS); III - receita de concursos de prognósticos; IV - do importador de bens ou serviços; V - sobre bens e serviços (CBS, incluída pela EC 132/2023).","Novas fontes de custeio (competência residual, art. 195, §4º): exigem LEI COMPLEMENTAR, não cumulatividade e fato gerador/base de cálculo diferentes dos já previstos (art. 154, I).","Anterioridade NONAGESIMAL (art. 195, §6º): contribuições só podem ser exigidas 90 dias após a publicação da lei que as instituiu ou modificou; não se aplica a anterioridade de exercício financeiro.","Regra da contrapartida (§5º): nenhum benefício ou serviço pode ser criado, majorado ou estendido sem a correspondente fonte de custeio total.","Imunidade (§7º): são 'isentas' (na verdade, imunes) de contribuição para a seguridade as entidades beneficentes de assistência social que atendam às exigências da lei complementar (LC 187/2021).","Pessoa jurídica em débito com a seguridade não pode contratar com o Poder Público nem receber benefícios ou incentivos fiscais ou creditícios (§3º).","Segurado especial (§8º): contribui com alíquota sobre o resultado da comercialização da produção.","EC 103/2019 (§11): proibidos moratória e parcelamento das contribuições em prazo superior a 60 meses; remissão/anistia das contribuições sobre folha e dos segurados limitadas por lei complementar.","Recursos das contribuições sobre folha e dos segurados (art. 195, I, 'a', e II) só podem pagar benefícios do RGPS (art. 167, XI).","A União é responsável por cobrir eventuais insuficiências financeiras da Seguridade decorrentes do pagamento de benefícios de prestação continuada (Lei 8.212, art. 16, parágrafo único).","Outras receitas (Lei 8.212, art. 27): multas, juros e atualização monetária; doações e legados; 40% do resultado dos leilões de bens apreendidos pela Receita Federal; parte dos bens confiscados do tráfico (art. 243 CF), entre outras."],"pegadinhas":["Dizer que o custeio é exclusivo do Poder Público ou só dos trabalhadores: é de toda a sociedade (P22-110: Certo).","Afirmar que igrejas e templos são isentos de contribuições para a seguridade: a imunidade do art. 150, VI, 'b' é de IMPOSTOS; a do §7º é só para entidades beneficentes de assistência social que cumpram a lei (P22-067: Errado).","Dizer que nova fonte de custeio pode ser criada por lei ordinária, medida provisória ou decreto: exige lei complementar (residual): e majoração de alíquota exige lei, nunca decreto.","Aplicar a anterioridade anual (1º de janeiro) às contribuições sociais: vale só a noventena.","Dizer que incide contribuição sobre aposentadoria e pensão do RGPS: é vedado (art. 195, II)."],"base_legal":"CF/1988, arts. 149, 154, I, 167, XI, e 195 (com EC 103/2019 e EC 132/2023); Lei 8.212/1991, arts. 10 a 27; LC 187/2021.","questoes":["CONST-001","DP-032","P22-060","P22-067","P22-068","P22-070","P22-110"]},{"id":"dp-04","disciplina":"Direito Previdenciário","topico":"Fontes, aplicação, interpretação e evolução histórica do Direito Previdenciário","recorrencia":"media","provas":[2012,2022],"resumo":"Fontes são as normas de onde nasce o Direito Previdenciário: a Constituição e as leis (primárias) e os atos infralegais (secundárias). A banca também cobra como a norma se aplica no tempo, como suprir lacunas e os marcos históricos: sobretudo a Lei Eloy Chaves.","pontos":["Fontes formais PRIMÁRIAS (inovam no ordenamento): Constituição Federal, emendas constitucionais (ex.: EC 103/2019), leis complementares, leis ordinárias (Lei 8.212/1991, custeio; Lei 8.213/1991, benefícios; Lei 8.742/1993, LOAS) e medidas provisórias.","Fontes formais SECUNDÁRIAS (só regulamentam, não podem criar direito ou obrigação): decretos (Decreto 3.048/1999: Regulamento da Previdência Social), portarias, instruções normativas (ex.: IN PRES/INSS 128/2022), orientações internas.","Princípio da legalidade: decreto não pode criar benefício nem aumentar contribuição; é preciso lei (e lei complementar para nova fonte residual).","Tempus regit actum: aplica-se a lei vigente na data do fato gerador do benefício (Súmula 340 do STJ: a lei aplicável à pensão por morte é a vigente na data do óbito).","Integração (lacunas): analogia, costumes e princípios gerais do direito (LINDB, art. 4º); a equidade só quando a lei autorizar.","Interpretação: a regra geral é a sistemática/teleológica; o 'in dubio pro misero' é usado com cautela na análise de PROVAS, não para criar direito sem lei; isenções e benefícios fiscais se interpretam literalmente (CTN, art. 111).","Marco histórico: Lei Eloy Chaves (Decreto Legislativo 4.682/1923): criou as Caixas de Aposentadorias e Pensões (CAPs) dos ferroviários.","Outros marcos: CF/1934 (custeio tríplice: Estado, empregador e empregado); CF/1946 (primeira a usar 'previdência social'); LOPS: Lei 3.807/1960 (unificou a legislação); INPS (1966); SINPAS (1977); CF/1988 (cria a Seguridade Social); INSS (1990, fusão INPS + IAPAS).","Leis previdenciárias têm aplicação territorial (no Brasil), com exceções para trabalhadores no exterior previstas em lei e em acordos internacionais."],"pegadinhas":["Dizer que a Constituição de 1937 (Polaca) é o marco da previdência: o marco é a Lei Eloy Chaves, de 1923 (P22-052: Errado).","Tratar instrução normativa ou decreto como fonte primária, ou dizer que podem criar benefício (P22-060: Errado).","Dizer que a CF não é fonte do Direito Previdenciário: é a principal fonte formal primária (P22-051: Certo).","Negar o uso de analogia, costumes e princípios gerais para suprir lacunas (P22-056: Certo)."],"base_legal":"CF/1988, arts. 5º, II, 59, 84, IV, 194 a 204; Decreto-Lei 4.657/1942 (LINDB), art. 4º; Lei 8.212/1991; Lei 8.213/1991; Decreto 3.048/1999; Súmula 340 do STJ.","questoes":["DP-023","P22-051","P22-052","P22-056","P22-060"]},{"id":"dp-05","disciplina":"Direito Previdenciário","topico":"Organização da Previdência Social e do INSS","recorrencia":"baixa","provas":[2022],"resumo":"O RGPS é administrado pelo INSS, autarquia federal vinculada ao Ministério da Previdência Social, que concede e mantém benefícios. Já a arrecadação e a fiscalização das contribuições são da Receita Federal. Saber 'quem faz o quê' resolve muitos itens.","pontos":["Sistema previdenciário brasileiro: RGPS (Regime Geral, obrigatório, gerido pelo INSS), RPPS (Regimes Próprios dos servidores efetivos) e Previdência Complementar (facultativa: fechada, fundos de pensão, fiscalizada pela PREVIC; aberta, bancos/seguradoras, fiscalizada pela SUSEP).","INSS: autarquia federal criada em 1990 (Lei 8.029/1990 e Decreto 99.350/1990), pela fusão do INPS com o IAPAS; vinculada ao Ministério da Previdência Social (recriado pela Lei 14.600/2023).","Compete ao INSS: reconhecer direitos, conceder, manter e pagar benefícios do RGPS e prestar serviços (serviço social e reabilitação profissional); também operacionaliza o BPC/LOAS.","Compete à Secretaria Especial da Receita Federal do Brasil (Lei 11.457/2007: 'Super-Receita'): planejar, executar, acompanhar e avaliar a tributação, fiscalização, arrecadação, cobrança e recolhimento das contribuições previdenciárias.","Dívida ativa das contribuições: inscrita e cobrada pela Procuradoria-Geral da Fazenda Nacional (PGFN).","CNPS: Conselho Nacional de Previdência Social: órgão superior de deliberação colegiada; 15 membros (6 do Governo Federal e 9 da sociedade civil: 3 aposentados/pensionistas, 3 trabalhadores em atividade e 3 empregadores); mandato de 2 anos, permitida 1 recondução.","CRPS: Conselho de Recursos da Previdência Social: órgão colegiado do Ministério que julga os recursos contra decisões do INSS (Juntas de Recursos, Câmaras de Julgamento e Conselho Pleno).","DATAPREV: empresa pública de tecnologia que processa os dados da previdência (CNIS, folha de benefícios).","O Conselho Nacional de Seguridade Social foi extinto (MP 2.216-37/2001)."],"pegadinhas":["Dizer que o INSS arrecada e fiscaliza contribuições: desde 2007 isso é da Receita Federal (P22-072: Errado).","Chamar o INSS de órgão da administração direta ou de empresa pública: é AUTARQUIA federal.","Inverter a composição do CNPS (mais membros do governo que da sociedade).","Confundir CRPS (recursos de benefícios) com CARF (recursos sobre crédito tributário/lançamento de contribuições)."],"base_legal":"Lei 8.029/1990; Lei 8.213/1991, arts. 3º e 126; Lei 11.457/2007; Lei 14.600/2023; Decreto 3.048/1999, arts. 295 a 305.","questoes":["P22-072","P22-084"]},{"id":"dp-06","disciplina":"Direito Previdenciário","topico":"Segurados obrigatórios I: empregado e empregado doméstico","recorrencia":"alta","provas":[2012,2022],"resumo":"Segurado obrigatório é quem exerce atividade remunerada abrangida pelo RGPS: a filiação decorre automaticamente do trabalho. O empregado é a categoria mais ampla, e a lei inclui nela vários casos especiais (servidor comissionado, temporário, mandato eletivo). O doméstico tem regras próprias (LC 150/2015).","pontos":["Empregado: presta serviço de natureza urbana ou rural a empresa, em caráter NÃO EVENTUAL, sob SUBORDINAÇÃO e mediante REMUNERAÇÃO, inclusive como diretor empregado.","Também são empregados: o trabalhador temporário (Lei 6.019/1974); o brasileiro ou estrangeiro domiciliado e contratado no Brasil para trabalhar no exterior em sucursal/agência de empresa nacional; o brasileiro civil que trabalha para a União no exterior em organismos oficiais.","Empregado também: servidor ocupante de cargo em COMISSÃO SEM vínculo efetivo com a União, autarquias e fundações federais; servidor contratado por tempo determinado; exercente de mandato eletivo federal, estadual ou municipal, desde que não vinculado a RPPS.","Servidor EFETIVO amparado por RPPS fica excluído do RGPS: mesmo que nomeado para cargo em comissão, continua no regime próprio de origem.","Idade mínima: 16 anos, salvo aprendiz, a partir de 14 anos (CF, art. 7º, XXXIII).","Empregado doméstico (LC 150/2015): presta serviço de forma contínua, subordinada, onerosa e pessoal e de finalidade NÃO LUCRATIVA à pessoa ou à família, no âmbito residencial destas, por MAIS de 2 dias por semana.","Doméstico: idade mínima de 18 anos (LC 150/2015, art. 1º, parágrafo único).","Empregador doméstico: pessoa ou família que admite empregado doméstico sem finalidade lucrativa.","Se a atividade do empregador tem fim lucrativo (ex.: fazenda que vende leite e gado), quem trabalha ali é empregado (rural), e não doméstico.","Aposentado do RGPS que volta a trabalhar é segurado obrigatório e contribui, mas só tem direito a salário-família e reabilitação profissional, quando empregado (Lei 8.213, art. 18, §2º)."],"pegadinhas":["Caseiro/gestor de fazenda com produção para o comércio: o contratante NÃO é empregador doméstico, porque há finalidade lucrativa (P22-062: Errado).","Servidor efetivo de outro ente nomeado para comissão em órgão federal que opta pela remuneração do cargo efetivo: continua no RPPS, não vira segurado do RGPS (P22-061: Errado).","Dizer que agente público temporário não está no RGPS: está, como empregado (P22-030: Errado).","Diarista que trabalha até 2 dias por semana na mesma casa NÃO é empregada doméstica (é contribuinte individual)."],"base_legal":"CF/1988, arts. 7º, XXXIII, e 40, §13; Lei 8.213/1991, arts. 11, I e II, 12 e 18, §2º; Lei 8.212/1991, art. 12, I e II; LC 150/2015, art. 1º; Decreto 3.048/1999, art. 9º.","questoes":["P22-030","P22-061","P22-062","P22-111"]},{"id":"dp-07","disciplina":"Direito Previdenciário","topico":"Segurados obrigatórios II: contribuinte individual e trabalhador avulso","recorrencia":"alta","provas":[2012,2022],"resumo":"Contribuinte individual é, em regra, quem trabalha por conta própria ou presta serviço eventual sem vínculo de emprego (autônomos, empresários, sócios remunerados, MEI). Trabalhador avulso presta serviço a várias empresas, sem vínculo, com intermediação obrigatória do OGMO ou do sindicato. Itens com situação hipotética pedem para classificar a pessoa.","pontos":["Contribuinte individual (CI): pessoa física que exerce, por conta própria, atividade econômica de natureza urbana, com fins lucrativos ou não (autônomo, profissional liberal).","CI: quem presta serviço de natureza urbana ou rural, em caráter EVENTUAL, a uma ou mais empresas, sem relação de emprego (ex.: diarista que trabalha até 2 dias por semana na mesma residência).","CI: titular de firma individual, diretor NÃO empregado, membro de conselho de administração de S.A., sócio-gerente e sócio cotista que recebam remuneração pelo trabalho na empresa, síndico ou administrador eleito que receba remuneração.","CI: ministro de confissão religiosa e membro de instituto de vida consagrada, de congregação ou de ordem religiosa.","CI: produtor rural pessoa física que explora atividade agropecuária em área SUPERIOR a 4 módulos fiscais, ou em área menor com empregados permanentes/prepostos; garimpeiro (extração mineral).","CI: Microempreendedor Individual (MEI) e motorista de aplicativo (Decreto 9.792/2019): mesmo que a pessoa seja servidora pública, a atividade privada a filia ao RGPS.","Trabalhador avulso: presta serviço a DIVERSAS empresas, sem vínculo empregatício, com intermediação OBRIGATÓRIA do OGMO (portuário, Lei 12.815/2013) ou do sindicato da categoria (não portuário, Lei 12.023/2009).","Avulso não recolhe por conta própria: a contribuição é descontada e recolhida pela empresa tomadora/OGMO, como no caso do empregado.","Quem exerce mais de uma atividade abrangida pelo RGPS é segurado obrigatório em relação a CADA uma delas (Lei 8.213, art. 11, §2º)."],"pegadinhas":["Confundir avulso (intermediação obrigatória de OGMO/sindicato) com empregado ou com CI.","Dizer que servidor público com RPPS que trabalha como motorista de aplicativo não é segurado do RGPS: ele é segurado obrigatório como CI nessa atividade (P22-063: Certo).","Dizer que o produtor rural é sempre segurado especial: acima de 4 módulos fiscais ou com empregados permanentes, ele é CI.","Dizer que sócio cotista é sempre CI: só se receber remuneração (pró-labore) pelo trabalho na empresa."],"base_legal":"Lei 8.213/1991, art. 11, V e VI, e §2º; Lei 8.212/1991, art. 12, V e VI; Decreto 3.048/1999, art. 9º, V e VI e §15; Lei 12.815/2013; Lei 12.023/2009; LC 123/2006 (MEI).","questoes":["DP-020","P22-063","P22-071","P22-111"]},{"id":"dp-08","disciplina":"Direito Previdenciário","topico":"Segurado especial (economia familiar, pesca artesanal)","recorrencia":"media","provas":[2012,2022],"resumo":"Segurado especial é o pequeno produtor rural, o pescador artesanal e o extrativista que trabalham individualmente ou em regime de economia familiar, sem empregados permanentes. Ele contribui sobre a venda da produção e tem proteção mínima garantida, sendo muito cobrado em situações hipotéticas.","pontos":["Quem é: pessoa física residente no imóvel rural ou em aglomerado urbano ou rural próximo que, individualmente ou em regime de economia familiar, ainda que com auxílio EVENTUAL de terceiros, seja:","(a) produtor rural (proprietário, usufrutuário, possuidor, assentado, parceiro, meeiro, comodatário ou arrendatário) em área de até 4 módulos fiscais, ou seringueiro/extrativista vegetal que faça disso o principal meio de vida; (b) pescador artesanal ou assemelhado que faça da pesca profissão habitual ou principal meio de vida; (c) cônjuge/companheiro e filho maior de 16 anos (ou equiparado) que trabalhem comprovadamente com o grupo familiar.","Regime de economia familiar: trabalho dos membros da família indispensável à subsistência e ao desenvolvimento socioeconômico do núcleo, em mútua dependência e colaboração, SEM empregados permanentes.","Pode contratar empregados por prazo determinado ou CI na safra até 120 pessoas/dia no ano civil (corridos ou intercalados) sem perder a condição.","Não perde a condição, entre outros: exercer outra atividade remunerada por até 120 dias no ano civil; receber pensão por morte, auxílio-acidente ou auxílio-reclusão de até 1 salário mínimo; ser dirigente sindical ou vereador no município da atividade rural; turismo rural com hospedagem até 120 dias/ano; artesanato com matéria-prima própria; ceder até 50% do imóvel em parceria/meação/comodato (área total até 4 módulos).","Contribuição: 1,2% sobre a receita bruta da comercialização da produção + 0,1% (RAT): recolhida em regra pelo adquirente (sub-rogação); pode ainda contribuir facultativamente como CI (20%) para ter benefícios acima do mínimo.","Benefícios: aposentadoria por idade (60 anos homem / 55 anos mulher), por incapacidade, auxílios, salário-maternidade e pensão no valor de 1 salário mínimo, mediante comprovação da atividade rural pelo número de meses igual à carência.","Comprovação: autodeclaração ratificada por entidades públicas credenciadas e cadastro no CNIS (Lei 8.213, arts. 38-A e 38-B, redação da Lei 13.846/2019); início de prova material, não basta prova só testemunhal (Súmula 149 do STJ).","Indígena que exerce atividade rural em economia familiar também pode ser segurado especial."],"pegadinhas":["Dizer que o pescador artesanal pode se inscrever como segurado FACULTATIVO: quem exerce atividade abrangida pelo RGPS é obrigatório, e o pescador artesanal é segurado especial (P22-065: Errado).","Afirmar que qualquer empregado contratado descaracteriza o segurado especial: só empregados PERMANENTES (ou acima de 120 pessoas/dia na safra).","Trocar a idade do filho: é maior de 16 anos (não 14 nem 18).","Trocar o limite de área: até 4 módulos FISCAIS (não 'hectares' nem 'módulos rurais')."],"base_legal":"CF/1988, art. 195, §8º; Lei 8.213/1991, arts. 11, VII e §§6º a 12, 38-A, 38-B, 39 e 48, §1º; Lei 8.212/1991, arts. 12, VII, e 25; Decreto 3.048/1999, art. 9º, VII; Súmula 149 do STJ.","questoes":["DP-019","P22-065"]},{"id":"dp-09","disciplina":"Direito Previdenciário","topico":"Segurado facultativo","recorrencia":"alta","provas":[2012,2022],"resumo":"Facultativo é quem NÃO exerce atividade que o torne segurado obrigatório, mas decide contribuir para ter proteção previdenciária (dona de casa, estudante, desempregado). A filiação depende da vontade e do pagamento, e há regras próprias de idade, vedações e alíquotas.","pontos":["Requisitos: ter pelo menos 16 anos e não estar enquadrado como segurado obrigatório do RGPS nem de RPPS.","Exemplos (Decreto 3.048, art. 11): quem se dedica exclusivamente ao trabalho doméstico na própria residência (dona/dono de casa); síndico de condomínio NÃO remunerado; estudante; quem deixou de ser segurado obrigatório; brasileiro que acompanha cônjuge no exterior; bolsista e estagiário (Lei 11.788/2008); bolsista de pós-graduação em dedicação exclusiva; presidiário que não exerce atividade remunerada.","É VEDADA a filiação como facultativo de participante de RPPS, salvo afastamento sem vencimento em que não seja permitida contribuição ao regime próprio (CF, art. 201, §5º).","Filiação: produz efeitos a partir da inscrição E do primeiro recolhimento sem atraso; não pode recolher contribuições de competências anteriores à inscrição.","Depois de inscrito, só pode recolher em atraso se ainda não tiver perdido a qualidade de segurado.","Alíquotas: 20% sobre o salário de contribuição declarado (entre o mínimo e o teto); 11% sobre o salário mínimo no plano simplificado (sem aposentadoria por tempo de contribuição, salvo complementação de 9%); 5% sobre o salário mínimo para o facultativo de baixa renda.","Facultativo de baixa renda (5%): sem renda própria, dedicação exclusiva ao trabalho doméstico na própria residência, família inscrita no CadÚnico com renda mensal de até 2 salários mínimos.","Período de graça do facultativo: 6 meses após a cessação das contribuições.","Quem perde o emprego e passa a cuidar da casa pode manter vínculo com o RGPS contribuindo como facultativo."],"pegadinhas":["Admitir a inscrição de adolescente de 15 anos como facultativo: a idade mínima é 16 anos (P22-059: Certo que NÃO é possível).","Admitir que servidor com RPPS em atividade contribua como facultativo do RGPS (P22-112: Certo que é vedado, salvo afastamento sem vencimento).","Dizer que o facultativo mantém a qualidade de segurado por 3 meses (P22-093: Errado: são 6 meses) ou por 12 meses.","Classificar como facultativo quem exerce atividade remunerada (ex.: pescador artesanal, motorista de aplicativo): é obrigatório."],"base_legal":"CF/1988, art. 201, §5º; Lei 8.213/1991, arts. 13 e 15, VI; Lei 8.212/1991, arts. 14 e 21; Decreto 3.048/1999, art. 11.","questoes":["P22-059","P22-064","P22-065","P22-093","P22-112"]},{"id":"dp-10","disciplina":"Direito Previdenciário","topico":"Filiação e inscrição","recorrencia":"media","provas":[2022],"resumo":"Filiação é o vínculo jurídico entre a pessoa e o RGPS, que gera direitos e obrigações; inscrição é o cadastro dessa pessoa no sistema (CNIS). Para o segurado obrigatório, a filiação nasce automaticamente do trabalho; para o facultativo, da inscrição com o primeiro pagamento.","pontos":["Filiação do segurado obrigatório: AUTOMÁTICA, decorre do exercício de atividade remunerada, mesmo sem inscrição ou recolhimento.","Filiação do facultativo: decorre da inscrição formalizada com o pagamento da primeira contribuição em dia.","Inscrição = cadastro com dados pessoais e outros elementos para identificação (no CNIS).","Quem faz a inscrição: do empregado e do avulso, a empresa/OGMO (via eSocial); do doméstico, o empregador doméstico; do CI e do facultativo, o próprio segurado; do segurado especial, o próprio, no grupo familiar.","Dependente: faz sua inscrição no momento do requerimento do benefício a que tiver direito (Lei 8.213, art. 17, §1º).","NÃO é admitida a inscrição post mortem de segurado CONTRIBUINTE INDIVIDUAL e de segurado FACULTATIVO (Lei 8.213, art. 17, §7º, incluído pela Lei 13.846/2019).","Para o segurado especial, a inscrição após a morte é possível, porque a filiação decorre da atividade rural comprovada.","Idade mínima para filiação: 16 anos (14 anos como aprendiz).","Exercício de atividades concomitantes: o segurado é filiado obrigatoriamente em relação a cada atividade.","Período de atividade de CI sem recolhimento na época só é reconhecido mediante comprovação e indenização das contribuições (Lei 8.212, art. 45-A)."],"pegadinhas":["Inverter a regra do post mortem: a vedação é para CI e facultativo, não para o segurado especial (P22-058: Errado).","Dizer que o dependente precisa se inscrever em vida do segurado: ele se inscreve ao requerer o benefício (P22-057: Certo).","Confundir filiação (vínculo) com inscrição (cadastro): o empregado sem registro já é filiado.","Dizer que o facultativo pode pagar meses anteriores à inscrição para 'comprar' tempo."],"base_legal":"Lei 8.213/1991, arts. 11, §2º, 13, 17 e 20; Lei 8.212/1991, art. 45-A; Decreto 3.048/1999, arts. 18 a 24.","questoes":["P22-057","P22-058","P22-059","P22-064"]},{"id":"dp-11","disciplina":"Direito Previdenciário","topico":"Salário de contribuição","recorrencia":"alta","provas":[2012,2022],"resumo":"Salário de contribuição é a base de cálculo da contribuição do segurado: sobre ele incide a alíquota. Ele também alimenta, mais tarde, o cálculo do salário de benefício. A prova cobra o que integra e o que não integra essa base e os limites mínimo e máximo.","pontos":["Empregado e avulso: remuneração total recebida no mês, destinada a retribuir o trabalho, inclusive gorjetas, ganhos habituais em utilidades e adiantamentos de reajuste.","Doméstico: remuneração registrada na CTPS; CI: remuneração auferida no mês (por conta própria ou de empresas); facultativo: valor que ele declarar.","Limite MÍNIMO: salário mínimo (ou piso da categoria); limite MÁXIMO: teto do RGPS, atualizado anualmente por portaria (consulte o valor do ano da prova).","Integram: 13º salário (mas não entra no cálculo do benefício) e salário-maternidade (único benefício que é salário de contribuição).","NÃO integram (art. 28, §9º): demais benefícios previdenciários; férias indenizadas e seu terço; licença-prêmio indenizada; abono de férias (arts. 143/144 CLT); FGTS e multa de 40%; PLR paga conforme lei; vale-transporte; diárias para viagem; ajuda de custo; auxílio-alimentação (não em dinheiro); prêmios e abonos; bolsa de estágio; assistência médica/odontológica; reembolso-creche.","Salário de contribuição e benefícios do RGPS são reajustados na mesma época e com os mesmos índices (Lei 8.212, art. 20, §1º).","Salário de contribuição NÃO é igual à renda mensal do benefício: o benefício é calculado pela média e por coeficientes.","EC 103/2019, art. 29: se a remuneração do mês ficar abaixo do salário mínimo, o segurado pode complementar, usar o excedente de outra competência ou agrupar competências; sem ajuste, o mês não conta para tempo, carência nem qualidade de segurado.","Admissão, afastamento ou demissão no curso do mês: salário de contribuição proporcional aos dias trabalhados."],"pegadinhas":["Afirmar que licença-prêmio indenizada integra o salário de contribuição (P22-066: Errado).","Dizer que o valor do salário de contribuição é igual à renda do benefício (P22-073: Errado).","Dizer que salário de contribuição e benefícios têm índices ou datas de reajuste diferentes (P22-074: Certo que são iguais).","Dizer que nenhum benefício integra o salário de contribuição: o salário-maternidade integra."],"base_legal":"Lei 8.212/1991, arts. 20, §1º, e 28; EC 103/2019, art. 29; Decreto 3.048/1999, arts. 214 e 216.","questoes":["DP-033","P22-066","P22-073","P22-074"]},{"id":"dp-12","disciplina":"Direito Previdenciário","topico":"Salário de benefício","recorrencia":"media","provas":[2022],"resumo":"Salário de benefício (SB) é o valor-base usado para calcular a renda mensal da maioria dos benefícios. Desde a EC 103/2019, corresponde à média de 100% dos salários de contribuição desde julho de 1994; sobre ele se aplica um coeficiente (ex.: 60% + 2% por ano extra nas aposentadorias).","pontos":["Regra atual (EC 103/2019, art. 26): média aritmética simples de 100% dos salários de contribuição desde julho de 1994 (ou desde o início das contribuições, se posterior), corrigidos monetariamente.","Regra anterior (Lei 9.876/1999): média dos 80% maiores salários de contribuição, com fator previdenciário em alguns casos.","Limites: o SB não pode ser inferior a 1 salário mínimo nem superior ao teto do salário de contribuição na data de início do benefício (Lei 8.213, art. 29, §2º).","O 13º salário NÃO entra no cálculo do salário de benefício.","É possível excluir da média contribuições que a reduzam, desde que mantido o tempo mínimo exigido; o período excluído não pode ser usado para outro fim (EC 103, art. 26, §6º).","Atividades concomitantes: SB calculado com base na SOMA dos salários de contribuição das atividades, respeitado o teto (Lei 8.213, art. 32, redação da Lei 13.846/2019).","Benefício por incapacidade recebido entre períodos de atividade: o SB que serviu de base conta como salário de contribuição (art. 29, §5º).","Auxílio por incapacidade temporária: 91% do SB, sem exceder a média dos 12 últimos salários de contribuição (art. 29, §10).","Coeficientes sobre o SB (aposentadorias pós-EC 103): 60% + 2% por ano que exceder 20 anos de contribuição (homem) ou 15 anos (mulher); auxílio-acidente: 50%.","'Revisão da vida toda': o STF (ADIs 2.110 e 2.111, 2024) validou a regra de transição da Lei 9.876/1999 como obrigatória, afastando a tese."],"pegadinhas":["Dizer que o SB pode ser inferior ao salário mínimo ou superior ao teto (P22-089: Certo que não pode).","Dizer que em atividades concomitantes se usa só a atividade principal: hoje se SOMAM os salários de contribuição (P22-091: Certo).","Manter a regra antiga dos 80% maiores salários como se ainda valesse para novos benefícios.","Confundir salário de benefício (base) com renda mensal inicial (valor final pago)."],"base_legal":"EC 103/2019, art. 26; Lei 8.213/1991, arts. 28 a 32; Lei 9.876/1999; Decreto 3.048/1999, art. 32.","questoes":["DP-005","P22-089","P22-091"]},{"id":"dp-13","disciplina":"Direito Previdenciário","topico":"Carência","recorrencia":"alta","provas":[2012,2022],"resumo":"Carência é o número mínimo de contribuições mensais indispensáveis para que o segurado tenha direito a certos benefícios. Ela protege o equilíbrio financeiro e atuarial do sistema. A prova cobra os números de cada benefício e, principalmente, as hipóteses de dispensa.","pontos":["Conceito: número mínimo de contribuições mensais, contadas a partir do 1º dia dos meses das suas competências (Lei 8.213, art. 24).","12 contribuições: auxílio por incapacidade temporária e aposentadoria por incapacidade permanente.","180 contribuições: aposentadorias programadas (idade/programada, tempo de contribuição pelas regras de transição e especial).","24 contribuições: auxílio-reclusão (Lei 13.846/2019).","Salário-maternidade: a lei prevê 10 contribuições para CI, facultativa e segurada especial, mas o STF (ADI 2.110, 2024) declarou essa exigência inconstitucional; hoje basta ter qualidade de segurada.","Independem de carência: pensão por morte, salário-família e auxílio-acidente; salário-maternidade de empregada, avulsa e doméstica; serviço social e reabilitação profissional.","Independem de carência: auxílio por incapacidade temporária e aposentadoria por incapacidade permanente em caso de acidente de qualquer natureza, doença profissional ou do trabalho ou doença grave da lista (tuberculose ativa, hanseníase, alienação mental, esclerose múltipla, neoplasia maligna, cegueira, cardiopatia grave, Parkinson, nefropatia grave, aids, hepatopatia grave, entre outras), se surgida APÓS a filiação.","Empregado, doméstico e avulso: carência conta da filiação (o recolhimento é responsabilidade do empregador). CI, facultativo e especial: conta a partir do 1º pagamento SEM atraso; contribuições atrasadas de competências anteriores não contam (art. 27, II).","Perdeu a qualidade de segurado? Para auxílio por incapacidade temporária, aposentadoria por incapacidade permanente, salário-maternidade e auxílio-reclusão, precisa cumprir METADE da carência após a nova filiação (art. 27-A).","Segurado especial: em vez de contribuições, comprova atividade rural pelo número de meses igual à carência.","O período em gozo de benefício por incapacidade intercalado com atividade conta como carência (STF, Tema 1.125).","Pensão por morte não tem carência, mas o cônjuge/companheiro só recebe por mais de 4 meses se houver 18 contribuições e 2 anos de casamento/união estável (salvo acidente ou doença profissional)."],"pegadinhas":["Dizer que acidente de trabalho dispensa carência e o acidente comum não: QUALQUER acidente dispensa (para incapacidade).","Dizer que pensão por morte exige 12 ou 18 contribuições de carência: não exige carência (os 18 meses afetam só a duração para o cônjuge).","Contar contribuições pagas em atraso pelo CI para carência.","Doença da lista preexistente à filiação também dispensaria carência: errado, precisa surgir depois da filiação.","Negar a finalidade atuarial da carência (P22-090: Certo que visa o equilíbrio financeiro e atuarial)."],"base_legal":"Lei 8.213/1991, arts. 24 a 27-A e 151; Decreto 3.048/1999, arts. 26 a 30; STF, ADIs 2.110 e 2.111 (2024); STF, Tema 1.125.","questoes":["DP-024","DP-025","P22-090"]},{"id":"dp-14","disciplina":"Direito Previdenciário","topico":"Manutenção, perda e restabelecimento da qualidade de segurado (período de graça)","recorrencia":"alta","provas":[2012,2022],"resumo":"Qualidade de segurado é a condição de quem está protegido pelo RGPS. Mesmo sem contribuir, a pessoa a mantém por um tempo, o chamado período de graça, com todos os direitos. Depois disso, perde a proteção, mas pode recuperá-la voltando a contribuir.","pontos":["Sem limite de prazo: quem está em gozo de benefício, EXCETO auxílio-acidente (Lei 13.846/2019).","Até 12 meses: após a cessação das contribuições, quem deixa de exercer atividade remunerada, está suspenso ou licenciado sem remuneração ou teve cessado benefício por incapacidade.","Até 12 meses: após cessar a segregação, quem tem doença de segregação compulsória; após o livramento, o segurado retido ou recluso.","Até 3 meses: após o licenciamento, o incorporado às Forças Armadas para prestar serviço militar.","Até 6 meses: após a cessação das contribuições, o segurado FACULTATIVO.","+12 meses (total de até 24): se já pagou mais de 120 contribuições mensais sem interrupção que tenha causado perda da qualidade.","+12 meses: desempregado que comprove a situação pelo registro no órgão do Ministério do Trabalho (a jurisprudência aceita outros meios de prova). Máximo possível: 36 meses.","Durante o período de graça, o segurado conserva TODOS os direitos perante a previdência (art. 15, §3º).","A perda ocorre no dia seguinte ao do término do prazo para recolhimento da contribuição referente ao mês imediatamente posterior ao fim do período de graça (art. 15, §4º; vencimento do CI/facultativo no dia 15).","Perda NÃO afeta: aposentadoria cujos requisitos já tinham sido cumpridos (direito adquirido); aposentadorias por tempo de contribuição e especial; aposentadoria por idade se já houver a carência (Lei 10.666/2003, art. 3º).","Pensão por morte não é devida se o falecido havia perdido a qualidade, salvo se já tivesse cumprido os requisitos de uma aposentadoria.","Restabelecimento: com nova filiação/contribuição; para os benefícios do art. 27-A, cumpre metade da carência."],"pegadinhas":["Dizer que o beneficiário de auxílio-acidente mantém a qualidade sem limite de prazo, ou inverter a regra afirmando que quem recebe benefício PERDE a qualidade (P22-092: Errado).","Trocar o prazo do facultativo: são 6 meses, não 3 nem 12 (P22-093: Errado).","Dizer que no período de graça o segurado tem só alguns direitos: conserva todos (P22-094: Certo).","Somar errado as prorrogações: 12 + 12 (mais de 120 contribuições) + 12 (desemprego) = até 36 meses.","Dizer que, perdida a qualidade, o segurado perde a aposentadoria cujos requisitos já tinha preenchido."],"base_legal":"Lei 8.213/1991, arts. 15, 27-A e 102; Lei 10.666/2003, art. 3º; Decreto 3.048/1999, arts. 13 e 14.","questoes":["DP-026","DP-027","P22-064","P22-092","P22-093","P22-094"]},{"id":"dp-15","disciplina":"Direito Previdenciário","topico":"Custeio I: contribuições dos segurados e alíquotas","recorrencia":"alta","provas":[2012,2022],"resumo":"Cada categoria de segurado contribui de um jeito: empregado, doméstico e avulso têm alíquotas progressivas descontadas na fonte; contribuinte individual e facultativo pagam por conta própria (20%, 11% ou 5%); o segurado especial paga sobre a venda da produção.","pontos":["Empregado, doméstico e avulso (EC 103/2019, art. 28): alíquotas PROGRESSIVAS por faixa: 7,5% (até 1 salário mínimo), 9%, 12% e 14% (até o teto), cada alíquota incidindo só sobre a parcela dentro da faixa; os limites das faixas são reajustados anualmente.","Contribuinte individual por conta própria: 20% sobre a remuneração (entre o mínimo e o teto).","CI que presta serviço a EMPRESA: 11% descontados e recolhidos pela empresa (Lei 10.666/2003, art. 4º; Lei 8.212, art. 30, §4º).","Plano simplificado: 11% sobre o salário mínimo para CI que trabalha por conta própria sem relação com empresa e para o facultativo: exclui aposentadoria por tempo de contribuição e contagem recíproca, salvo complementação de 9% com juros.","5% sobre o salário mínimo: MEI e facultativo de baixa renda (CadÚnico, renda familiar até 2 salários mínimos, sem renda própria).","Facultativo: 20% sobre o valor declarado (ou 11%/5% nas hipóteses acima).","Segurado especial: 1,2% + 0,1% (RAT) sobre a receita bruta da comercialização da produção, além de 0,2% ao SENAR (não é seguridade).","Não incide contribuição sobre aposentadoria e pensão do RGPS; o aposentado que volta a trabalhar contribui normalmente.","Recolhimento: empregado e avulso não recolhem por conta própria: a empresa/OGMO desconta e recolhe; CI (sem empresa) e facultativo recolhem por iniciativa própria."],"pegadinhas":["Dizer que o avulso recolhe por conta própria como o CI e o facultativo (P22-071: Errado).","Aplicar a alíquota de 14% sobre todo o salário: a progressividade é por faixas (alíquota efetiva menor).","Dizer que o plano simplificado de 11% dá direito a todas as aposentadorias.","Afirmar que o aposentado que volta a trabalhar está isento de contribuição."],"base_legal":"CF/1988, art. 195, II e §8º; EC 103/2019, art. 28; Lei 8.212/1991, arts. 20, 21, 25 e 30; Lei 10.666/2003, art. 4º; LC 123/2006, art. 18-A.","questoes":["DP-033","P22-071"]},{"id":"dp-16","disciplina":"Direito Previdenciário","topico":"Custeio II: contribuições das empresas, empregadores e outras fontes","recorrencia":"alta","provas":[2012,2022],"resumo":"As empresas são as principais financiadoras da Seguridade: pagam sobre a folha de salários, sobre o faturamento/receita e sobre o lucro. Além disso, há contribuição do empregador doméstico, do importador, dos concursos de prognósticos e outras receitas previstas em lei.","pontos":["Empresa: 20% sobre o total das remunerações pagas a empregados e avulsos; 20% sobre o que paga a contribuintes individuais que lhe prestam serviço (Lei 8.212, art. 22, I e III).","RAT/GILRAT (antigo SAT): 1% (risco leve), 2% (médio) ou 3% (grave), podendo ser reduzido à metade ou dobrado pelo FAP (0,5 a 2,0).","Adicional para financiar aposentadoria especial: 12%, 9% ou 6% (exposição que dá aposentadoria com 15, 20 ou 25 anos), só sobre a remuneração dos expostos.","Bancos e instituições financeiras: adicional de 2,5% sobre a folha (art. 22, §1º).","Cessão de mão de obra/empreitada: a contratante retém 11% do valor bruto da nota fisca
