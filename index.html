eto ou instrução normativa é fonte primária, a resposta tende a ser Errado: ato infralegal não cria direito novo, apenas regulamenta.","recorrencia":"media","tags":["fontes","fonte primária","Constituição Federal"],"origem":"INSS 2022 · Cebraspe · Técnico · item 51","prova":2022,"desatualizada":false},{"id":"P22-052","disciplina":"Direito Previdenciário","assunto":"Evolução histórica da previdência no Brasil","enunciado":"Acerca da evolução histórica da legislação previdenciária, julgue o item. A Constituição outorgada por Getúlio Vargas em 1937, conhecida como Constituição Polaca, é considerada o marco do direito previdenciário brasileiro, pois foi ela que consolidou a legislação previdenciária no Brasil.","gabarito":"Errado","comentario":"O marco inicial da previdência social brasileira é a Lei Eloy Chaves (Decreto Legislativo 4.682/1923), que criou as Caixas de Aposentadorias e Pensões dos ferroviários. A consolidação (unificação) da legislação previdenciária veio com a Lei Orgânica da Previdência Social (LOPS, Lei 3.807/1960). A Constituição de 1937 foi pouco relevante no tema, limitando-se a mencionar o 'seguro social'.","legislacao":"Decreto Legislativo 4.682/1923 (Lei Eloy Chaves); Lei 3.807/1960 (LOPS).","pegadinha":"Atribuir o marco histórico e a consolidação à Constituição de 1937, quando o marco é a Lei Eloy Chaves (1923) e a consolidação é a LOPS (1960).","resumo_flash":"Linha do tempo essencial: 1923 Lei Eloy Chaves (marco, CAPs dos ferroviários); 1934 CF prevê custeio tríplice (governo, empregador, trabalhador); 1960 LOPS unifica a legislação; 1966 criação do INPS; 1988 CF cria a seguridade social (saúde, previdência e assistência); 1990 criação do INSS.","dica_padrao":"Em história da previdência, Cebraspe costuma trocar datas e documentos: decore o par 'marco = Eloy Chaves 1923' e 'unificação legislativa = LOPS 1960'.","recorrencia":"media","tags":["evolução histórica","Lei Eloy Chaves","LOPS"],"origem":"INSS 2022 · Cebraspe · Técnico · item 52","prova":2022,"desatualizada":false},{"id":"P22-053","disciplina":"Direito Previdenciário","assunto":"Seguridade social: conceito e abrangência","enunciado":"Acerca da organização da seguridade social, julgue o item. Os benefícios e serviços prestados pela seguridade social são exclusivos daqueles que participam do seu custeio.","gabarito":"Errado","comentario":"Só a previdência social é contributiva (art. 201 da CF). A saúde é direito de todos, independentemente de contribuição (art. 196), e a assistência social é prestada a quem dela necessitar, também sem exigir contribuição (art. 203). Portanto, a seguridade como um todo não é exclusiva de quem contribui.","legislacao":"CF/1988, arts. 194, 196, 201 e 203.","pegadinha":"Estender para toda a seguridade social a característica contributiva que pertence apenas à previdência.","resumo_flash":"Seguridade social = saúde + previdência + assistência social. Saúde: para todos, sem contribuição. Assistência: para quem precisar, sem contribuição. Previdência: só para quem contribui (caráter contributivo e filiação obrigatória).","dica_padrao":"Palavras como 'exclusivo', 'somente' e 'apenas' aplicadas à seguridade inteira costumam tornar o item Errado: verifique se a regra vale para os três ramos ou só para a previdência.","recorrencia":"alta","tags":["seguridade social","caráter contributivo","saúde","assistência social"],"origem":"INSS 2022 · Cebraspe · Técnico · item 53","prova":2022,"desatualizada":false},{"id":"P22-054","disciplina":"Direito Previdenciário","assunto":"Princípios da seguridade social: equidade no custeio","enunciado":"Em relação aos princípios da seguridade social, julgue o item. O princípio da seguridade social que estabelece que a contribuição social para o custeio do regime geral de previdência social deve ser proporcional à condição financeira dos seus contribuintes denomina-se equidade na forma de participação no custeio.","gabarito":"Certo","comentario":"O art. 194, parágrafo único, V, da CF prevê a 'equidade na forma de participação no custeio': quem tem mais capacidade contributiva contribui mais. É por isso que existem alíquotas progressivas para o empregado e alíquotas adicionais para bancos e empresas com maior risco de acidente.","legislacao":"CF/1988, art. 194, parágrafo único, V; art. 195, §9º.","pegadinha":"Fazer o candidato confundir equidade no custeio com 'diversidade da base de financiamento' (várias fontes de custeio) ou com 'seletividade e distributividade' (escolha dos benefícios).","resumo_flash":"Objetivos do art. 194, parágrafo único, da CF: universalidade da cobertura e do atendimento; uniformidade e equivalência entre populações urbanas e rurais; seletividade e distributividade; irredutibilidade do valor dos benefícios; equidade no custeio; diversidade da base de financiamento; gestão democrática e descentralizada. Equidade = cada um contribui conforme sua capacidade.","dica_padrao":"Cebraspe cobra a definição de um princípio e troca o nome. Associe: capacidade contributiva = equidade; várias fontes = diversidade da base; escolher quem mais precisa = seletividade.","recorrencia":"alta","tags":["princípios","equidade no custeio","art. 194 CF"],"origem":"INSS 2022 · Cebraspe · Técnico · item 54","prova":2022,"desatualizada":false},{"id":"P22-055","disciplina":"Direito Previdenciário","assunto":"Assistência social: organização e execução","enunciado":"Em relação ao conceito de seguridade social, julgue o item. A assistência social integra a seguridade social, cujos programas são coordenados e executados pelas esferas estadual e municipal, com recursos do orçamento da seguridade social, bem como por entidades beneficentes e de assistência social.","gabarito":"Certo","comentario":"O art. 204 da CF determina que as ações de assistência social sejam financiadas com recursos do orçamento da seguridade social (além de outras fontes) e organizadas de forma descentralizada: à esfera federal cabem a coordenação e as normas gerais, e às esferas estadual e municipal, bem como a entidades beneficentes e de assistência social, cabem a coordenação e a execução dos programas. O item reproduz essa regra.","legislacao":"CF/1988, arts. 194 e 204, I; Lei 8.742/1993 (LOAS).","pegadinha":"Parece incompleto por não citar a União, o que leva o candidato a marcar Errado; mas a execução dos programas realmente cabe a estados, municípios e entidades beneficentes.","resumo_flash":"Assistência social: descentralização político-administrativa. União = coordenação e normas gerais. Estados e municípios (e entidades beneficentes) = coordenação e execução dos programas. Dinheiro vem do orçamento da seguridade social e de outras fontes.","dica_padrao":"Item incompleto não é item errado para o Cebraspe: se o que foi afirmado é verdadeiro, mesmo sem citar tudo, tende a ser Certo.","recorrencia":"alta","tags":["assistência social","descentralização","art. 204 CF"],"origem":"INSS 2022 · Cebraspe · Técnico · item 55","prova":2022,"desatualizada":false},{"id":"P22-056","disciplina":"Direito Previdenciário","assunto":"Integração da legislação previdenciária","enunciado":"Em relação à integração da legislação previdenciária, julgue o item. Caso haja lacuna na legislação, o intérprete poderá valer-se de analogia, costumes e princípios gerais do direito como instrumentos integrativos para resolver questões referentes a matéria previdenciária.","gabarito":"Certo","comentario":"Integração é o preenchimento de lacunas da lei. O art. 4º da LINDB determina que, quando a lei for omissa, o juiz decida conforme a analogia, os costumes e os princípios gerais de direito, e essa regra também se aplica ao direito previdenciário. A equidade também é usada como técnica integrativa em alguns ramos.","legislacao":"Decreto-Lei 4.657/1942 (LINDB), art. 4º.","pegadinha":"Fazer o candidato pensar que, por ser ramo de direito público, o previdenciário não admitiria analogia ou costumes. Atenção: no custeio (tributo), a analogia não pode criar tributo (CTN, art. 108, §1º).","resumo_flash":"Interpretar = descobrir o sentido da lei que existe. Integrar = preencher a lacuna quando não há lei. Ferramentas de integração (LINDB, art. 4º): analogia, costumes e princípios gerais do direito.","dica_padrao":"Não confunda interpretação (literal, sistemática, teleológica) com integração (analogia, costumes, princípios gerais): a banca troca um conceito pelo outro.","recorrencia":"media","tags":["integração","LINDB","analogia","lacuna"],"origem":"INSS 2022 · Cebraspe · Técnico · item 56","prova":2022,"desatualizada":false},{"id":"P22-057","disciplina":"Direito Previdenciário","assunto":"Inscrição do dependente","enunciado":"No que se refere à filiação e à inscrição no regime geral de previdência social (RGPS), julgue o item. O dependente do segurado do RGPS pode, nessa condição, efetuar a sua inscrição junto ao INSS no momento em que tiver de se habilitar ao recebimento do benefício a que faz jus.","gabarito":"Certo","comentario":"Pela Lei 8.213/1991, cabe ao próprio dependente promover a sua inscrição quando do requerimento do benefício a que estiver habilitado (por exemplo, pensão por morte ou auxílio-reclusão). Ou seja, a inscrição do dependente ocorre no momento do pedido do benefício, e não necessariamente antes.","legislacao":"Lei 8.213/1991, art. 17, §1º; Decreto 3.048/1999, art. 22.","pegadinha":"Levar o candidato a achar que o dependente precisa ser inscrito previamente pelo segurado, ainda em vida.","resumo_flash":"Filiação = vínculo jurídico com a previdência (automática para o segurado obrigatório quando começa a trabalhar). Inscrição = cadastro no INSS. Para o dependente, a inscrição é feita por ele mesmo quando requer o benefício.","dica_padrao":"Diferencie sempre filiação (vínculo) de inscrição (cadastro). Muitos itens trocam um pelo outro.","recorrencia":"alta","tags":["inscrição","dependente","filiação"],"origem":"INSS 2022 · Cebraspe · Técnico · item 57","prova":2022,"desatualizada":false},{"id":"P22-058","disciplina":"Direito Previdenciário","assunto":"Inscrição post mortem","enunciado":"No que se refere à filiação e à inscrição no RGPS, julgue o item. Presentes os pressupostos da filiação, é admitida a inscrição post mortem de segurado contribuinte individual e de segurado facultativo, mas não é admitida a inscrição post mortem de segurado especial.","gabarito":"Errado","comentario":"É o contrário. A Lei 8.213/1991 (incluído pela Lei 13.846/2019) proíbe a inscrição post mortem do contribuinte individual e do facultativo, pois eles dependem do próprio recolhimento. Já o Decreto 3.048/1999 admite a inscrição post mortem do segurado especial, presentes os pressupostos da filiação, porque ele contribui sobre a comercialização da produção e sua filiação decorre do exercício da atividade.","legislacao":"Lei 8.213/1991, art. 17, §7º; Decreto 3.048/1999, art. 18, §5º.","pegadinha":"Inverter as categorias: a banca diz que é permitido para quem é proibido (CI e facultativo) e proibido para quem é permitido (segurado especial).","resumo_flash":"Inscrição post mortem = fazer o cadastro do segurado depois que ele morreu, geralmente para os dependentes pedirem pensão. Não pode para contribuinte individual nem facultativo (que precisam recolher em vida). Pode para o segurado especial, se comprovado o exercício da atividade rural/pesqueira.","dica_padrao":"Cebraspe adora itens 'invertidos': a estrutura 'é admitida para A, mas não para B' muitas vezes troca A por B. Confira cada categoria separadamente.","recorrencia":"alta","tags":["inscrição post mortem","segurado especial","contribuinte individual","facultativo"],"origem":"INSS 2022 · Cebraspe · Técnico · item 58","prova":2022,"desatualizada":false},{"id":"P22-059","disciplina":"Direito Previdenciário","assunto":"Segurado facultativo: idade mínima","enunciado":"No que se refere à filiação e à inscrição no RGPS, julgue o item. Suponha que um estudante de quinze anos de idade pretenda se inscrever no RGPS na condição de segurado facultativo. Nessa situação, a inscrição não será possível em decorrência da idade do estudante.","gabarito":"Certo","comentario":"A idade mínima para se filiar como segurado facultativo é 16 anos, em harmonia com a proibição constitucional de trabalho para menores de 16 anos (salvo aprendiz, a partir de 14). O estudante de 15 anos, portanto, ainda não pode ser facultativo; poderá se inscrever ao completar 16.","legislacao":"Lei 8.213/1991, art. 13; Decreto 3.048/1999, art. 11; CF/1988, art. 7º, XXXIII.","pegadinha":"Confundir com o menor aprendiz, que pode trabalhar (e ser segurado empregado) a partir dos 14 anos; essa exceção não se aplica ao facultativo.","resumo_flash":"Segurado facultativo = pessoa com 16 anos ou mais, sem atividade que a torne segurada obrigatória, que decide contribuir por vontade própria (ex.: estudante, dona de casa, desempregado). Menor de 16 não pode ser facultativo.","dica_padrao":"Memorize os números de idade: 14 (aprendiz), 16 (trabalho em geral e facultativo), 18 (trabalho noturno, perigoso ou insalubre). A banca troca esses valores.","recorrencia":"alta","tags":["segurado facultativo","idade mínima","estudante"],"origem":"INSS 2022 · Cebraspe · Técnico · item 59","prova":2022,"desatualizada":false},{"id":"P22-060","disciplina":"Direito Previdenciário","assunto":"Aplicação da norma previdenciária: legalidade e anterioridade nonagesimal","enunciado":"No que se refere à aplicação da norma previdenciária, julgue o item. Suponha que o Executivo federal tenha editado um decreto para regular matéria referente à criação de um novo benefício previdenciário e ao aumento da contribuição para arcar com o custeio do benefício criado. Nesse caso, tanto o segurado pode exigir a imediata concessão do benefício instituído quanto a previdência pode exigir o imediato pagamento da alíquota majorada.","gabarito":"Errado","comentario":"Decreto não pode criar benefício nem aumentar contribuição: ambas as matérias exigem lei (princípio da legalidade). Além disso, contribuição social para a seguridade criada ou majorada só pode ser cobrada 90 dias depois da publicação da lei (anterioridade nonagesimal), então nunca seria exigível 'imediatamente'. E nenhum benefício pode ser criado sem a correspondente fonte de custeio total.","legislacao":"CF/1988, art. 5º, II; art. 150, I; art. 195, §§5º e 6º.","pegadinha":"Juntar duas ideias que parecem 'equilibradas' (cria benefício e cria custeio) para disfarçar dois vícios: uso de decreto no lugar de lei e cobrança imediata sem os 90 dias.","resumo_flash":"Regra da contrapartida (art. 195, §5º): nenhum benefício pode ser criado, aumentado ou estendido sem fonte de custeio total. Anterioridade nonagesimal (art. 195, §6º): contribuição nova ou majorada só pode ser cobrada após 90 dias da publicação da lei. Benefício e contribuição dependem de lei, não de decreto.","dica_padrao":"Sempre que aparecer 'decreto' criando direito ou tributo, desconfie. E contribuição social para a seguridade tem noventena (90 dias), não anterioridade do exercício seguinte.","recorrencia":"alta","tags":["legalidade","anterioridade nonagesimal","contrapartida","decreto"],"origem":"INSS 2022 · Cebraspe · Técnico · item 60","prova":2022,"desatualizada":false},{"id":"P22-061","disciplina":"Direito Previdenciário","assunto":"Servidor efetivo em cargo em comissão: regime de vinculação","enunciado":"No que se refere à aplicação da norma previdenciária, julgue o item. Suponha que um servidor público de carreira do Poder Judiciário de determinada unidade da Federação tenha sido nomeado para exercer um cargo em comissão junto a uma fundação pública federal, momento em que tenha optado por continuar recebendo remuneração do órgão em que exerça cargo efetivo. Nessa situação hipotética, em decorrência do cargo que passou a exercer na fundação pública, o referido servidor passa a integrar a condição de segurado obrigatório do RGPS.","gabarito":"Errado","comentario":"Somente o ocupante de cargo em comissão SEM vínculo efetivo com a administração é segurado obrigatório do RGPS (como empregado). O servidor efetivo amparado por regime próprio que é cedido ou nomeado para cargo em comissão em outro ente continua vinculado ao seu regime de origem (RPPS), ainda mais se continua recebendo pelo órgão de origem.","legislacao":"Lei 8.213/1991, art. 11, I, 'g', e art. 12; Lei 9.717/1998, art. 1º-A; CF/1988, art. 40, §13.","pegadinha":"A palavra 'cargo em comissão' induz o candidato a lembrar da regra do comissionado puro (que é RGPS), ignorando que este servidor já tem vínculo efetivo e RPPS.","resumo_flash":"Comissionado puro (sem cargo efetivo) = RGPS, como segurado empregado. Servidor efetivo com RPPS que vai ocupar cargo em comissão ou é cedido = continua no RPPS de origem.","dica_padrao":"Em situações hipotéticas com servidor público, pergunte primeiro: ele tem cargo efetivo com regime próprio? Se sim, a regra é permanecer no RPPS.","recorrencia":"alta","tags":["servidor público","cargo em comissão","RPPS","segurado empregado"],"origem":"INSS 2022 · Cebraspe · Técnico · item 61","prova":2022,"desatualizada":false},{"id":"P22-062","disciplina":"Direito Previdenciário","assunto":"Empregador doméstico: atividade sem fins lucrativos","enunciado":"No que se refere ao empregador doméstico, julgue o item. Suponha que o proprietário de uma fazenda de produção de leite e gado de corte para o comércio local tenha contratado um indivíduo para exercer as funções de caseiro e gestor da fazenda. Nesse caso hipotético, para efeito previdenciário, o referido contratante é considerado empregador doméstico.","gabarito":"Errado","comentario":"Empregador doméstico é a pessoa ou família que admite empregado para serviço de natureza contínua, no âmbito residencial e SEM finalidade lucrativa. A fazenda que produz leite e gado para venda exerce atividade econômica; o caseiro/gestor trabalha para essa atividade lucrativa e é empregado rural, não doméstico. O proprietário, nesse caso, é equiparado a empresa (empregador rural).","legislacao":"LC 150/2015, art. 1º; Lei 8.212/1991, art. 15, II; Lei 8.213/1991, art. 11, II; Lei 5.889/1973.","pegadinha":"Usar a palavra 'caseiro', que o candidato associa automaticamente ao doméstico, quando o que decide é a finalidade lucrativa da atividade.","resumo_flash":"Doméstico = trabalho contínuo para pessoa ou família, no âmbito residencial, sem fins lucrativos, por mais de 2 dias por semana. Se o trabalho serve a uma atividade econômica (venda de leite, hotel, sítio comercial), o trabalhador é empregado comum ou rural.","dica_padrao":"A chave do doméstico é 'sem finalidade lucrativa'. Procure no enunciado qualquer sinal de comércio ou produção para venda: se houver, não é doméstico.","recorrencia":"alta","tags":["empregador doméstico","empregado rural","finalidade lucrativa"],"origem":"INSS 2022 · Cebraspe · Técnico · item 62","prova":2022,"desatualizada":false},{"id":"P22-063","disciplina":"Direito Previdenciário","assunto":"Contribuinte individual: motorista de aplicativo e atividades concomitantes","enunciado":"A respeito do contribuinte individual, julgue o item. Suponha-se que, para complementar a renda familiar, Flávio, servidor público federal, exerça eventualmente atividade como motorista de aplicativo. Nessa situação hipotética, na condição de motorista de aplicativo, Flávio é considerado segurado obrigatório do RGPS.","gabarito":"Certo","comentario":"O servidor vinculado a regime próprio fica excluído do RGPS apenas quanto ao cargo público; se exercer, ao mesmo tempo, atividade abrangida pelo RGPS, torna-se segurado obrigatório em relação a essa atividade. O motorista de aplicativo é enquadrado como contribuinte individual (Decreto 3.048/1999, com a redação do Decreto 9.792/2019), logo Flávio é segurado obrigatório do RGPS nessa atividade.","legislacao":"Lei 8.213/1991, art. 11, V, e §2º, e art. 12, §1º; Decreto 3.048/1999, art. 9º, V (redação do Decreto 9.792/2019).","pegadinha":"Fazer o candidato achar que, por já ter regime próprio, o servidor não pode ser segurado do RGPS, ou que a eventualidade da atividade afasta a filiação.","resumo_flash":"Quem exerce várias atividades remuneradas é filiado obrigatoriamente em relação a cada uma. Servidor com RPPS que também trabalha na iniciativa privada (ex.: motorista de aplicativo, professor particular) é segurado obrigatório do RGPS nessa outra atividade.","dica_padrao":"Atividade remunerada = filiação obrigatória. Não existe 'opção' de não contribuir sobre atividade remunerada abrangida pelo RGPS.","recorrencia":"alta","tags":["contribuinte individual","motorista de aplicativo","atividades concomitantes","servidor público"],"origem":"INSS 2022 · Cebraspe · Técnico · item 63","prova":2022,"desatualizada":false},{"id":"P22-064","disciplina":"Direito Previdenciário","assunto":"Segurado facultativo: dono(a) de casa","enunciado":"A respeito do segurado facultativo, julgue o item. Suponha-se que Pedro, após ter trabalhado como empregado contratado em determinada empresa privada por cerca de 20 anos, tenha deixado de exercer atividade remunerada e passado a se dedicar exclusivamente ao lar e a seus filhos, em razão de seu companheiro possuir renda para arcar com as despesas da família. Nesse caso hipotético, Pedro poderá manter o vínculo com o RGPS após o período de graça, desde que proceda à sua filiação na condição de segurado facultativo.","gabarito":"Certo","comentario":"Ao deixar o emprego, Pedro mantém a qualidade de segurado durante o período de graça. Depois disso, como não exerce atividade remunerada, só continuará vinculado ao RGPS se passar a contribuir como segurado facultativo. Quem se dedica exclusivamente ao trabalho doméstico na própria residência está expressamente previsto como facultativo, independentemente do sexo.","legislacao":"Lei 8.213/1991, arts. 13 e 15; Decreto 3.048/1999, art. 11, §1º, I; Lei 8.212/1991, art. 21, §2º, II, 'b' (alíquota de 5% do facultativo de baixa renda).","pegadinha":"Usar um homem como 'dono de casa' para o candidato estranhar; a regra do facultativo vale para qualquer pessoa que se dedique ao lar.","resumo_flash":"Período de graça = tempo em que a pessoa mantém a qualidade de segurado mesmo sem contribuir (em regra 12 meses após parar de trabalhar, podendo ser ampliado). Depois dele, quem não trabalha só continua no RGPS contribuindo como facultativo.","dica_padrao":"Cebraspe usa nomes e gêneros inesperados para gerar dúvida; a lei previdenciária não distingue sexo para enquadrar o facultativo dono(a) de casa.","recorrencia":"alta","tags":["segurado facultativo","período de graça","dono de casa"],"origem":"INSS 2022 · Cebraspe · Técnico · item 64","prova":2022,"desatualizada":false},{"id":"P22-065","disciplina":"Direito Previdenciário","assunto":"Segurado especial: pescador artesanal","enunciado":"A respeito do segurado especial e do segurado facultativo, julgue o item. Suponha que Matilde, moradora no interior da Amazônia, utilizando-se de embarcação de pequeno porte, faça da pesca artesanal seu principal meio de vida. Nesse caso hipotético, para se filiar ao RGPS, Matilde poderá fazer a sua inscrição como segurada facultativa.","gabarito":"Errado","comentario":"Quem faz da pesca artesanal sua profissão habitual ou principal meio de vida é segurado especial, uma categoria de segurado OBRIGATÓRIO. Não pode ser facultativo quem exerce atividade que o torna segurado obrigatório. Matilde é filiada automaticamente pelo exercício da atividade e deve ser inscrita como segurada especial.","legislacao":"Lei 8.213/1991, art. 11, VII, 'b', e art. 13; Decreto 3.048/1999, art. 9º, VII, e art. 11.","pegadinha":"Apresentar a filiação de quem tem atividade obrigatória como se fosse opcional (facultativa).","resumo_flash":"Segurado especial = produtor rural, pescador artesanal (ou assemelhado) e seus familiares que trabalham em regime de economia familiar, individualmente ou com ajuda eventual de terceiros. É segurado obrigatório e contribui sobre a receita da comercialização da produção.","dica_padrao":"Facultativo é só para quem NÃO exerce atividade remunerada abrangida pelo RGPS. Se o enunciado descreve um trabalho, o facultativo está descartado.","recorrencia":"media","tags":["segurado especial","pescador artesanal","segurado facultativo"],"origem":"INSS 2022 · Cebraspe · Técnico · item 65","prova":2022,"desatualizada":false},{"id":"P22-066","disciplina":"Direito Previdenciário","assunto":"Salário de contribuição: parcelas não integrantes","enunciado":"A respeito do financiamento da seguridade social, julgue o item. A licença-prêmio indenizada integra o salário de contribuição, nos termos da legislação.","gabarito":"Errado","comentario":"A Lei 8.212/1991 lista expressamente as parcelas que NÃO integram o salário de contribuição, e entre elas está a importância recebida a título de licença-prêmio indenizada. Por ter natureza indenizatória (e não de pagamento pelo trabalho), não sofre incidência de contribuição previdenciária.","legislacao":"Lei 8.212/1991, art. 28, §9º, 'e', item 8.","pegadinha":"Cobrar decoreba da lista de exclusões do art. 28, §9º, contando que o candidato pense que todo valor pago ao trabalhador integra a base de cálculo.","resumo_flash":"Salário de contribuição = base sobre a qual incide a contribuição do segurado. Em regra, verbas remuneratórias entram; verbas indenizatórias saem (ex.: férias indenizadas e seu terço, licença-prêmio indenizada, diárias de viagem, vale-transporte, abono de férias).","dica_padrao":"Palavra 'indenizada/indenizatória' no item é forte sinal de que a verba NÃO integra o salário de contribuição.","recorrencia":"alta","tags":["salário de contribuição","licença-prêmio indenizada","custeio"],"origem":"INSS 2022 · Cebraspe · Técnico · item 66","prova":2022,"desatualizada":false},{"id":"P22-067","disciplina":"Direito Previdenciário","assunto":"Imunidade e contribuições sociais: templos religiosos","enunciado":"A respeito do financiamento da seguridade social, julgue o item. As igrejas e os templos de qualquer culto são isentos de contribuições para a seguridade social.","gabarito":"Errado","comentario":"A imunidade dos templos de qualquer culto (art. 150, VI, 'b', da CF) alcança apenas IMPOSTOS, não as contribuições sociais. Para a seguridade social, a igreja é equiparada a empresa em relação aos empregados que contratar e deve recolher as contribuições normalmente. A única imunidade de contribuições para a seguridade prevista na CF é a das entidades beneficentes de assistência social que cumpram os requisitos da lei (art. 195, §7º, regulamentado pela LC 187/2021).","legislacao":"CF/1988, art. 150, VI, 'b', e art. 195, §7º; Lei 8.212/1991, art. 15, parágrafo único; LC 187/2021.","pegadinha":"Estender a imunidade de impostos dos templos para as contribuições previdenciárias. Detalhe técnico: o art. 195, §7º fala em 'isenção', mas é na verdade imunidade.","resumo_flash":"Imunidade dos templos = só impostos (IPTU, IR etc.). Contribuições sociais continuam devidas. Quem tem imunidade de contribuições para a seguridade são as entidades beneficentes de assistência social certificadas (CEBAS), na forma da LC 187/2021.","dica_padrao":"Imposto é espécie de tributo; contribuição social é outra espécie. Imunidade de imposto não se estende automaticamente às contribuições.","recorrencia":"alta","tags":["imunidade","templos","contribuições sociais","entidade beneficente"],"origem":"INSS 2022 · Cebraspe · Técnico · item 67","prova":2022,"desatualizada":false},{"id":"P22-068","disciplina":"Direito Previdenciário","assunto":"Débito com a seguridade social: restrições","enunciado":"A respeito do financiamento da seguridade social, julgue o item. Os devedores da previdência social não podem receber benefícios ou incentivos fiscais ou creditícios do Estado.","gabarito":"Certo","comentario":"O art. 195, §3º, da CF estabelece que a pessoa jurídica em débito com o sistema da seguridade social, como estabelecido em lei, não poderá contratar com o Poder Público nem dele receber benefícios ou incentivos fiscais ou creditícios. A banca generalizou para 'devedores', mas manteve a essência da regra e considerou o item Certo.","legislacao":"CF/1988, art. 195, §3º; Lei 8.212/1991, art. 47 (exigência de certidão negativa de débito).","pegadinha":"O texto não repete a expressão 'pessoa jurídica' da Constituição, o que pode levar o candidato a marcar Errado por excesso de rigor.","resumo_flash":"Empresa em débito com a seguridade social: não pode contratar com o Poder Público nem receber benefícios ou incentivos fiscais ou creditícios. Por isso se exige a certidão negativa de débito (CND) em licitações e financiamentos públicos.","dica_padrao":"Cebraspe costuma aceitar paráfrases que preservam o núcleo da norma. Só marque Errado se a mudança alterar o sentido (ex.: trocar 'não poderá' por 'poderá').","recorrencia":"alta","tags":["débito previdenciário","incentivos fiscais","art. 195 CF","CND"],"origem":"INSS 2022 · Cebraspe · Técnico · item 68","prova":2022,"desatualizada":false},{"id":"P22-070","disciplina":"Direito Previdenciário","assunto":"Outras receitas da seguridade social","enunciado":"A respeito do financiamento da seguridade social, julgue o item. O percentual incidente sobre o resultado dos leilões dos bens apreendidos pelo Departamento da Receita Federal é fonte de receita da seguridade social, segundo a legislação.","gabarito":"Certo","comentario":"A Lei 8.212/1991 lista as 'outras receitas' da seguridade social e inclui 40% do resultado dos leilões dos bens apreendidos pela Receita Federal. Também figuram nessa lista multas, juros e atualização monetária, receitas patrimoniais, doações e legados, entre outras.","legislacao":"Lei 8.212/1991, art. 27, VII.","pegadinha":"Fonte de receita pouco conhecida, que parece 'estranha' ao custeio previdenciário e leva o candidato a marcar Errado.","resumo_flash":"Além das contribuições sociais, a seguridade tem outras receitas (Lei 8.212, art. 27): multas, juros e atualização monetária; receitas patrimoniais e financeiras; doações e legados; 40% do resultado dos leilões de bens apreendidos pela Receita Federal; entre outras.","dica_padrao":"Nas listas legais de receitas, guarde os percentuais: a banca pode manter a fonte correta e trocar o número (ex.: 40% por 50%).","recorrencia":"alta","tags":["outras receitas","custeio","leilões"],"origem":"INSS 2022 · Cebraspe · Técnico · item 70","prova":2022,"desatualizada":false},{"id":"P22-071","disciplina":"Direito Previdenciário","assunto":"Arrecadação e recolhimento das contribuições","enunciado":"Acerca do recolhimento das contribuições, julgue o item. Os trabalhadores avulsos que prestam serviços a empresas e os contribuintes individual e facultativo devem recolher as contribuições à previdência social por conta própria.","gabarito":"Errado","comentario":"A empresa é obrigada a arrecadar a contribuição dos segurados empregados e trabalhadores avulsos a seu serviço, descontando-a da remuneração. Desde a Lei 10.666/2003, a empresa também desconta e recolhe a contribuição do contribuinte individual que lhe presta serviço. Só recolhem por conta própria o facultativo e o contribuinte individual que trabalha por conta própria ou para pessoa física.","legislacao":"Lei 8.212/1991, art. 30, I e II; Lei 10.666/2003, art. 4º.","pegadinha":"Juntar o avulso (que tem a contribuição descontada pela empresa) e o CI que presta serviço a empresa com o facultativo, que de fato recolhe sozinho.","resumo_flash":"Quem desconta e recolhe: a empresa, para empregado, avulso e CI que lhe preste serviço; o empregador doméstico, para o doméstico. Quem recolhe sozinho: facultativo e CI que trabalha por conta própria ou para pessoa física.","dica_padrao":"Itens que agrupam várias categorias numa mesma regra costumam estar errados por causa de uma delas. Teste a regra categoria por categoria.","recorrencia":"alta","tags":["recolhimento","trabalhador avulso","contribuinte individual","facultativo"],"origem":"INSS 2022 · Cebraspe · Técnico · item 71","prova":2022,"desatualizada":false},{"id":"P22-072","disciplina":"Direito Previdenciário","assunto":"Competência da Receita Federal x INSS","enunciado":"Acerca das competências do INSS e da Secretaria da Receita Federal do Brasil, julgue o item. Compete ao INSS planejar, executar, acompanhar e avaliar as atividades relativas à tributação, à fiscalização, à arrecadação, à cobrança e ao recolhimento das contribuições previdenciárias.","gabarito":"Errado","comentario":"Desde a Lei 11.457/2007 (criação da 'Super-Receita'), essa competência é da Secretaria da Receita Federal do Brasil. O INSS cuida da concessão, manutenção e revisão de benefícios e serviços; a Receita cuida da tributação, fiscalização, arrecadação e cobrança das contribuições previdenciárias.","legislacao":"Lei 11.457/2007, art. 2º.","pegadinha":"Atribuir ao INSS uma competência que ele já teve no passado, mas que foi transferida para a Receita Federal em 2007.","resumo_flash":"Receita Federal = arrecada, fiscaliza e cobra as contribuições (custeio). INSS = concede e paga benefícios (despesa). A dívida ativa das contribuições é cobrada pela Procuradoria-Geral da Fazenda Nacional.","dica_padrao":"Em competências, Cebraspe troca os órgãos: custeio → Receita Federal; benefícios → INSS; recursos de benefícios → CRPS; recursos de custeio → CARF.","recorrencia":"alta","tags":["Receita Federal","INSS","competência","arrecadação"],"origem":"INSS 2022 · Cebraspe · Técnico · item 72","prova":2022,"desatualizada":false},{"id":"P22-073","disciplina":"Direito Previdenciário","assunto":"Salário de contribuição x renda mensal do benefício","enunciado":"Acerca do reajustamento de benefícios, julgue o item. Os valores do salário de contribuição equivalem à renda mensal dos benefícios previdenciários.","gabarito":"Errado","comentario":"A renda mensal do benefício não é igual ao salário de contribuição. Ela é calculada a partir do salário de benefício (média dos salários de contribuição), sobre o qual se aplica um percentual (coeficiente) que varia conforme o benefício e o tempo de contribuição. Após a EC 103/2019, por exemplo, a aposentadoria parte de 60% da média, com acréscimo de 2% por ano que exceder o tempo mínimo.","legislacao":"Lei 8.213/1991, arts. 28, 29 e 33; EC 103/2019, art. 26.","pegadinha":"Confundir três conceitos diferentes: salário de contribuição (base da contribuição), salário de benefício (média) e renda mensal inicial (valor efetivamente pago).","resumo_flash":"Salário de contribuição = base de cálculo da contribuição mensal. Salário de benefício = média dos salários de contribuição. Renda mensal inicial (RMI) = salário de benefício × coeficiente do benefício. Nenhum benefício substituto do salário pode ser menor que o salário mínimo nem maior que o teto do RGPS.","dica_padrao":"Termos parecidos ('salário de contribuição', 'salário de benefício', 'renda mensal') são trocados pela banca de propósito. Defina cada um antes de julgar.","recorrencia":"alta","tags":["salário de contribuição","salário de benefício","renda mensal inicial"],"origem":"INSS 2022 · Cebraspe · Técnico · item 73","prova":2022,"desatualizada":false},{"id":"P22-074","disciplina":"Direito Previdenciário","assunto":"Reajustamento do salário de contribuição e dos benefícios","enunciado":"Acerca do reajustamento de benefícios, julgue o item. Os valores do salário de contribuição e dos benefícios de prestação continuada da previdência social são reajustados na mesma época e nos mesmos índices.","gabarito":"Certo","comentario":"A Lei 8.212/1991 determina que os valores do salário de contribuição (faixas e limites) sejam reajustados na mesma época e com os mesmos índices do reajustamento dos benefícios de prestação continuada da previdência social. Na prática, todo início de ano a portaria interministerial reajusta, juntos, as faixas de contribuição, o teto e os benefícios acima do mínimo.","legislacao":"Lei 8.212/1991, art. 20, §1º, e art. 28, §5º; Lei 8.213/1991, art. 41-A.","pegadinha":"A expressão 'benefícios de prestação continuada' pode ser confundida com o BPC/LOAS (assistencial). Aqui ela se refere aos benefícios previdenciários pagos mês a mês.","resumo_flash":"Os benefícios previdenciários são reajustados anualmente para preservar o valor real (art. 201, §4º, CF), em regra pelo INPC. As faixas do salário de contribuição e o teto acompanham o mesmo índice e a mesma data.","dica_padrao":"'Benefício de prestação continuada' em texto de lei previdenciária = benefício pago mensalmente pela previdência; BPC da LOAS é outra coisa. Leia o contexto.","recorrencia":"alta","tags":["reajustamento","salário de contribuição","teto"],"origem":"INSS 2022 · Cebraspe · Técnico · item 74","prova":2022,"desatualizada":false},{"id":"P22-075","disciplina":"Direito Previdenciário","assunto":"Decadência do direito de revisão do benefício","enunciado":"Paulo aposentou-se por invalidez em 5 de dezembro de 2015. Considerando essa situação hipotética, julgue o item. Paulo pode solicitar a revisão de sua aposentadoria até o dia 1.º de janeiro de 2026.","gabarito":"Certo","comentario":"O prazo de decadência para o segurado pedir a revisão do ato de concessão é de 10 anos, contado do dia primeiro do mês seguinte ao do recebimento da primeira prestação. Considerando que Paulo recebeu a primeira prestação em dezembro de 2015, o prazo começa em 1º/1/2016 e termina em 1º/1/2026. Observação: se a primeira prestação tivesse sido paga só em janeiro de 2016, o termo inicial mudaria; a banca presumiu o pagamento no próprio mês da aposentadoria.","legislacao":"Lei 8.213/1991, art. 103, caput.","pegadinha":"Fazer o candidato contar os 10 anos a partir da data exata da aposentadoria (5/12/2025), esquecendo que o prazo começa no dia 1º do mês seguinte ao primeiro pagamento.","resumo_flash":"Decadência (segurado): 10 anos para pedir revisão do ato de concessão, a partir do 1º dia do mês seguinte ao primeiro pagamento. Prescrição: 5 anos, atinge só as parcelas atrasadas (cada mês vencido há mais de 5 anos se perde).","dica_padrao":"Em prazos previdenciários, observe o termo inicial: 'dia primeiro do mês seguinte' é um detalhe que a banca usa para montar datas que parecem certas mas não são.","recorrencia":"media","tags":["decadência","revisão","prazo decenal"],"origem":"INSS 2022 · Cebraspe · Técnico · item 75","prova":2022,"desatualizada":false},{"id":"P22-076","disciplina":"Direito Previdenciário","assunto":"Prescrição: imprescritibilidade do direito ao benefício","enunciado":"Jonas encontra-se impossibilitado de trabalhar por haver adquirido doença incapacitante. Considerando essa situação hipotética, julgue o item. Jonas deve solicitar o benefício previdenciário em até cinco anos, contados da data em que ele foi acometido pela doença incapacitante.","gabarito":"Errado","comentario":"Não há prazo para requerer o benefício: o direito ao benefício em si (o 'fundo de direito') não prescreve. O prazo de 5 anos da Lei 8.213/1991 atinge apenas as prestações vencidas ou diferenças, ou seja, os valores mensais anteriores aos 5 anos do pedido. Mas atenção: nos benefícios por incapacidade, se o requerimento demorar mais de 30 dias, o benefício só é pago a partir da data do requerimento.","legislacao":"Lei 8.213/1991, art. 103, parágrafo único, e arts. 43 e 60; STF, RE 626.489 (tema 313).","pegadinha":"Transformar o prazo prescricional de 5 anos (que atinge parcelas) em prazo para requerer o benefício.","resumo_flash":"O direito de pedir o benefício não se perde com o tempo, desde que os requisitos estejam cumpridos. O que prescreve em 5 anos são as parcelas mensais atrasadas. Já a revisão do ato de concessão tem decadência de 10 anos.","dica_padrao":"Separe sempre: concessão (sem prazo), revisão (10 anos de decadência) e parcelas atrasadas (5 anos de prescrição).","recorrencia":"media","tags":["prescrição","fundo de direito","benefício por incapacidade"],"origem":"INSS 2022 · Cebraspe · Técnico · item 76","prova":2022,"desatualizada":false},{"id":"P22-077","disciplina":"Direito Previdenciário","assunto":"Decadência da Administração para anular benefício: má-fé","enunciado":"Joaquim obteve, fraudulentamente, benefício previdenciário em 5 de dezembro de 2015. Considerando essa situação hipotética, julgue o item. A previdência social pode cassar o benefício de Joaquim até o dia 5 de dezembro de 2025.","gabarito":"Errado","comentario":"A previdência tem 10 anos para anular atos administrativos de que decorram efeitos favoráveis aos beneficiários, SALVO comprovada má-fé. Como Joaquim obteve o benefício mediante fraude (má-fé), não corre esse prazo decadencial: o benefício pode ser cassado a qualquer tempo, inclusive depois de 5/12/2025.","legislacao":"Lei 8.213/1991, art. 103-A; Lei 9.784/1999, art. 54.","pegadinha":"Aplicar o prazo decenal da Administração sem perceber a palavra 'fraudulentamente', que caracteriza a má-fé e afasta a decadência.","resumo_flash":"Prazo da previdência para rever/anular benefício concedido: 10 anos, contados da data do ato. Exceção: comprovada má-fé (fraude), caso em que não há prazo decadencial.","dica_padrao":"Palavras como 'fraude', 'fraudulentamente' ou 'má-fé' no enunciado costumam ser a chave da questão: elas afastam prazos de decadência a favor do beneficiário.","recorrencia":"media","tags":["decadência","anulação","má-fé","fraude"],"origem":"INSS 2022 · Cebraspe · Técnico · item 77","prova":2022,"desatualizada":false},{"id":"P22-078","disciplina":"Direito Previdenciário","assunto":"Prescrição das ações por acidente do trabalho","enunciado":"Matias sofreu acidente de trabalho em 5 de dezembro de 2015. Considerando essa situação hipotética, julgue o item. Matias pôde solicitar o benefício acidentário até o dia 5 de dezembro de 2020.","gabarito":"Certo","comentario":"A banca aplicou a letra do art. 104 da Lei 8.213/1991: as ações referentes à prestação por acidente do trabalho prescrevem em 5 anos, contados da data do acidente (quando dele resultar morte ou incapacidade temporária) ou da data em que a previdência reconhecer a incapacidade permanente ou o agravamento das sequelas. Atenção: a jurisprudência entende que o direito ao benefício em si não prescreve, só as parcelas; o item foi considerado Certo porque o verbo 'pôde' não afirma que ele SÓ poderia pedir até essa data, e porque a banca segue o texto literal do art. 104.","legislacao":"Lei 8.213/1991, art. 104, I e II.","pegadinha":"Criar conflito com o item sobre Jonas: aqui o prazo de 5 anos foi aceito porque existe regra específica, na letra da lei, para as ações acidentárias.","resumo_flash":"Para acidente do trabalho, o art. 104 da Lei 8.213/1991 traz prazo prescricional de 5 anos, contado do acidente (morte ou incapacidade temporária) ou do reconhecimento da incapacidade permanente/agravamento pela previdência.","dica_padrao":"Quando houver regra específica na lei (como o art. 104 para acidentes), Cebraspe costuma seguir a literalidade, mesmo que a jurisprudência seja mais flexível.","recorrencia":"media","tags":["prescrição","acidente do trabalho","art. 104"],"origem":"INSS 2022 · Cebraspe · Técnico · item 78","prova":2022,"desatualizada":false},{"id":"P22-079","disciplina":"Direito Previdenciário","assunto":"Crimes previdenciários: apropriação indébita","enunciado":"A empresa W descontou a contribuição previdenciária devida pelos trabalhadores e não a repassou à previdência social. Nessa situação hipotética, a empresa W cometeu apropriação indébita previdenciária.","gabarito":"Certo","comentario":"O art. 168-A do Código Penal tipifica como apropriação indébita previdenciária deixar de repassar à previdência social as contribuições recolhidas dos contribuintes, no prazo e forma legal ou convencional. Descontar do salário do trabalhador e não repassar é o exemplo clássico desse crime (pena de reclusão de 2 a 5 anos e multa). Tecnicamente, quem responde penalmente são os administradores da empresa, não a pessoa jurídica.","legislacao":"Código Penal, art. 168-A.","pegadinha":"Confundir com sonegação (art. 337-A): na apropriação indébita o dinheiro foi descontado e não repassado; na sonegação há fraude para reduzir ou suprimir a contribuição.","resumo_flash":"Apropriação indébita previdenciária (CP, art. 168-A) = descontou do trabalhador e não repassou. Sonegação de contribuição previdenciária (CP, art. 337-A) = suprimiu ou reduziu a contribuição por meio de omissão ou fraude em folha de pagamento, declaração ou contabilidade.","dica_padrao":"Associe: 'descontou e não repassou' = 168-A; 'omitiu, declarou a menor, não lançou' = 337-A.","recorrencia":"media","tags":["crimes previdenciários","apropriação indébita","art. 168-A"],"origem":"INSS 2022 · Cebraspe · Técnico · item 79","prova":2022,"desatualizada":false},{"id":"P22-080","disciplina":"Direito Previdenciário","assunto":"Crimes previdenciários: sonegação de contribuição (gabarito controverso)","enunciado":"A empresa X deixou de recolher as contribuições previdenciárias devidas, por estar passando por dificuldades financeiras. Nessa situação hipotética, a empresa X praticou o delito de sonegação previdenciária.","gabarito":"Certo","comentario":"Gabarito oficial: Certo, mantido no definitivo. Atenção: pela letra do art. 337-A do CP, a sonegação exige suprimir ou reduzir contribuição MEDIANTE omissão ou fraude (omitir segurados da folha, não lançar valores na contabilidade, omitir remunerações ou receitas); o simples não pagamento de contribuição declarada não é crime, e a jurisprudência ainda admite a dificuldade financeira grave como excludente de culpabilidade (inexigibilidade de conduta diversa). A banca parece ter usado 'sonegação' no sentido leigo de 'deixar de recolher'. Para a prova, saiba a regra legal: sem desconto do empregado e sem fraude, não há 337-A; se houve desconto e não repasse, é 168-A.","legislacao":"Código Penal, arts. 168-A e 337-A.","pegadinha":"A banca considerou o mero inadimplemento como sonegação, contrariando a exigência legal de fraude ou omissão; o detalhe da 'dificuldade financeira' induz o candidato a pensar em excludente de culpabilidade.","resumo_flash":"Sonegação de contribuição previdenciária (CP, art. 337-A): suprimir ou reduzir contribuição mediante (I) omitir segurados da folha ou do documento de informações à previdência; (II) deixar de lançar na contabilidade as quantias descontadas ou devidas; (III) omitir receitas, lucros ou remunerações pagas. Pena: reclusão de 2 a 5 anos e multa.","dica_padrao":"Na maioria das questões, Cebraspe segue a letra da lei: sonegação exige uma das condutas fraudulentas do art. 337-A. Este item é exceção controversa; não generalize o gabarito, mas lembre que esta banca já considerou 'deixar de recolher' como sonegação.","recorrencia":"media","tags":["crimes previdenciários","sonegação","art. 337-A","gabarito controverso"],"origem":"INSS 2022 · Cebraspe · Técnico · item 80","prova":2022,"desatualizada":false},{"id":"P22-081","disciplina":"Direito Previdenciário","assunto":"Crimes previdenciários: sonegação de contribuição (gabarito controverso)","enunciado":"A empresa Y declarou salário de trabalhador inferior ao efetivamente pago, para reduzir contribuição previdenciária devida. Nessa situação hipotética, a empresa Y cometeu o delito de sonegação previdenciária.","gabarito":"Errado","comentario":"Gabarito oficial: Errado, mantido no definitivo. Atenção: pela letra do art. 337-A, III, do CP, omitir total ou parcialmente remunerações pagas para reduzir contribuição É sonegação previdenciária, e declarar salário menor do que o pago se encaixa exatamente nessa conduta. A única justificativa técnica possível é que a sonegação é crime material (STF e STJ exigem a constituição definitiva do crédito tributário, na linha da Súmula Vinculante 24), e o enunciado não diz que houve lançamento definitivo; ainda assim, o gabarito parece trocado com o do item 80. Para a prova, saiba a regra legal: declarar remuneração a menor para pagar menos contribuição = art. 337-A.","legislacao":"Código Penal, art. 337-A, III; Súmula Vinculante 24 do STF (aplicada por analogia).","pegadinha":"O item descreve literalmente a conduta do art. 337-A, III, mas o gabarito oficial foi Errado; o candidato que seguiu a lei perdeu o ponto.","resumo_flash":"Declarar ao fisco/previdência remuneração menor do que a efetivamente paga, com o objetivo de reduzir a contribuição, é uma das formas típicas de sonegação de contribuição previdenciária (CP, art. 337-A, III). A extinção da punibilidade ocorre se o agente, espontaneamente, declara e confessa antes do início da ação fiscal.","dica_padrao":"Itens sobre crimes previdenciários costumam seguir a literalidade dos arts. 168-A e 337-A. Este item é exceção controversa: em outras provas, a mesma conduta tende a ser considerada sonegação.","recorrencia":"media","tags":["crimes previdenciários","sonegação","art. 337-A","gabarito controverso"],"origem":"INSS 2022 · Cebraspe · Técnico · item 81","prova":2022,"desatualizada":false},{"id":"P22-082","disciplina":"Direito Previdenciário","assunto":"Crimes previdenciários: extinção da punibilidade pelo pagamento","enunciado":"A empresa Z pagou quantia anteriormente devida e subtraída à previdência social antes da prolação de sentença de primeiro grau. Nessa situação hipotética, a empresa Z tem direito à extinção da punibilidade, pelo pagamento da quantia anteriormente subtraída à previdência social.","gabarito":"Errado","comentario":"Pela letra do Código Penal, a extinção da punibilidade exige que o agente, espontaneamente, declare, confesse e pague as contribuições ANTES do início da ação fiscal (art. 168-A, §2º; art. 337-A, §1º). Se o pagamento ocorre depois do início da ação fiscal e antes de oferecida a denúncia, o juiz apenas PODE deixar de aplicar a pena ou aplicar só multa, se o agente for primário e de bons antecedentes (art. 168-A, §3º, I). Atenção: a jurisprudência do STF e do STJ admite a extinção da punibilidade pelo pagamento integral do débito a qualquer tempo, com base na Lei 10.684/2003 (art. 9º, §2º); a banca seguiu a literalidade do CP.","legislacao":"Código Penal, art. 168-A, §§2º e 3º, e art. 337-A, §1º; Lei 10.684/2003, art. 9º, §2º; Lei 9.430/1996, art. 83.","pegadinha":"Trocar o marco temporal 'antes do início da ação fiscal' por 'antes da sentença de primeiro grau'.","resumo_flash":"No CP, para os crimes dos arts. 168-A e 337-A: pagou/confessou espontaneamente antes do início da ação fiscal = extinção da punibilidade. Pagou depois do início da ação fiscal e antes da denúncia = perdão judicial ou só multa (faculdade do juiz). Na jurisprudência, o pagamento integral do débito extingue a punibilidade a qualquer tempo.","dica_padrao":"Em prazos penais-tributários, a banca troca os marcos ('ação fiscal', 'denúncia', 'sentença'). Em prova objetiva do INSS, siga a letra do CP, salvo se o item mencionar expressamente a jurisprudência.","recorrencia":"media","tags":["crimes previdenciários","extinção da punibilidade","pagamento","ação fiscal"],"origem":"INSS 2022 · Cebraspe · Técnico · item 82","prova":2022,"desatualizada":false},{"id":"P22-083","disciplina":"Direito Previdenciário","assunto":"Recursos administrativos: competência do CRPS x CARF","enunciado":"Com relação aos recursos das decisões administrativas no âmbito do procedimento previdenciário, julgue o item. Compete ao Conselho de Recursos da Previdência Social julgar os recursos de ofício interpostos contra decisões que tenham anulado lançamento de crédito previdenciário.","gabarito":"Errado","comentario":"Lançamento de crédito previdenciário é matéria de custeio (contribuições), cuja administração passou à Receita Federal com a Lei 11.457/2007. Os recursos nessa matéria, inclusive os recursos de ofício contra decisões que exoneram o contribuinte, são julgados no contencioso administrativo fiscal federal, pelo Conselho Administrativo de Recursos Fiscais (CARF). O CRPS julga recursos relativos a benefícios e outras matérias previdenciárias não tributárias.","legislacao":"Lei 11.457/2007; Decreto 70.235/1972; Decreto 3.048/1999, art. 303.","pegadinha":"Usar o nome 'crédito previdenciário' para fazer parecer que o assunto é do CRPS, quando é tributário e vai ao CARF.","resumo_flash":"CRPS (Conselho de Recursos da Previdência Social) = recursos contra decisões do INSS sobre benefícios, FAP, compensação entre regimes e supervisão de RPPS. CARF = recursos sobre contribuições e lançamentos tributários (custeio), administrados pela Receita Federal.","dica_padrao":"Benefício → INSS → CRPS. Contribuição/lançamento → Receita Federal → CARF. A banca troca os órgãos.","recorrencia":"media","tags":["CRPS","CARF","recurso de ofício","lançamento"],"origem":"INSS 2022 · Cebraspe · Técnico · item 83","prova":2022,"desatualizada":false},{"id":"P22-084","disciplina":"Direito Previdenciário","assunto":"Recursos administrativos: competência do CRPS (RPPS)","enunciado":"Com relação aos recursos das decisões administrativas no âmbito do procedimento previdenciário, julgue o item. Compete ao Conselho de Recursos da Previdência Social julgar os recursos interpostos contra decisões proferidas em processos de supervisão e de fiscalização de regimes próprios de previdência social.","gabarito":"Certo","comentario":"O Decreto 3.048/1999 atribui ao CRPS, entre outras competências, o julgamento dos recursos das decisões proferidas nos processos de compensação financeira entre regimes e nos processos de supervisão e fiscalização dos regimes próprios de previdência social. Além disso, o CRPS julga os recursos das decisões do INSS sobre benefícios e as contestações relativas ao FAP.","legislacao":"Decreto 3.048/1999, art. 303 (redação do Decreto 10.410/2020).","pegadinha":"O candidato tende a achar que o CRPS só julga benefícios do RGPS e marca Errado ao ver 'regimes próprios'.","resumo_flash":"O CRPS é órgão colegiado de controle jurisdicional administrativo vinculado ao Ministério da Previdência. Julga: recursos contra decisões do INSS sobre benefícios; contestações do FAP; recursos sobre compensação financeira entre regimes; e recursos em processos de supervisão e fiscalização de RPPS.","dica_padrao":"Competências 'surpreendentes' que constam no regulamento são cobradas justamente porque parecem erradas. Decore a lista completa do art. 303 do Decreto 3.048.","recorrencia":"media","tags":["CRPS","RPPS","recursos administrativos"],"origem":"INSS 2022 · Cebraspe · Técnico · item 84","prova":2022,"desatualizada":false},{"id":"P22-085","disciplina":"Direito Previdenciário","assunto":"Recursos administrativos: ação judicial e desistência do recurso","enunciado":"Com relação aos recursos das decisões administrativas no âmbito do procedimento previdenciário, julgue o item. Se o recorrente propuser ação com objeto idêntico ao do recurso interposto por ele perante o Conselho de Recursos da Previdência Social, será automática a sua desistência do recurso.","gabarito":"Certo","comentario":"Segundo o Decreto 3.048/1999, a propositura de ação judicial com objeto idêntico ao do processo administrativo importa renúncia ao direito de recorrer na esfera administrativa e desistência do recurso já interposto. Como o Judiciário dará a palavra final, não faz sentido manter a discussão em paralelo na via administrativa.","legislacao":"Decreto 3.048/1999, art. 307.","pegadinha":"Levar o candidato a pensar que as duas vias podem correr juntas ou que a desistência dependeria de pedido expresso.","resumo_flash":"Escolheu o Judiciário com o mesmo pedido? Considera-se que renunciou ao recurso administrativo e desistiu do recurso pendente. O prazo para recorrer ao CRPS é de 30 dias, contados da ciência da decisão.","dica_padrao":"Via judicial com objeto idêntico prevalece e encerra a via administrativa. Itens que dizem que as duas seguem simultaneamente tendem a estar errados.","recorrencia":"media","tags":["CRPS","recurso administrativo","ação judicial","desistência"],"origem":"INSS 2022 · Cebraspe · Técnico · item 85","prova":2022,"desatualizada":false},{"id":"P22-086","disciplina":"Direito Previdenciário","assunto":"Pensão por morte: perda do direito do dependente que matou o segurado","enunciado":"No que diz respeito ao plano de benefícios da previdência social: não faz jus à pensão por morte o pretenso beneficiário que tenha sido condenado criminalmente, por sentença transitada em julgado, pela prática de crime que tenha dolosamente causado a morte do segurado.","gabarito":"Certo","comentario":"Correto. A Lei 8.213/1991 determina que perde o direito à pensão por morte o condenado criminalmente, por sentença com trânsito em julgado, como autor, coautor ou partícipe de homicídio doloso (ou tentativa) contra o segurado, ressalvados os absolutamente incapazes e os inimputáveis. A ideia é simples: ninguém pode se beneficiar da própria conduta criminosa.","legislacao":"Lei 8.213/1991, art. 74, § 1º (redação da Lei 13.846/2019).","pegadinha":"A banca apenas parafraseia a lei ('crime que tenha dolosamente causado a morte'); o candidato pode estranhar a redação e achar que falta algo. Fique atento: a exigência é de crime DOLOSO e de condenação TRANSITADA EM JULGADO.","resumo_flash":"O dependente que mata dolosamente o segurado (como autor, coautor ou partícipe) e é condenado com trânsito em julgado perde o direito à pensão por morte. Crime culposo (sem intenção) não gera essa perda. Inimputáveis e absolutamente incapazes ficam ressalvados.","dica_padrao":"Itens que reproduzem a lei com outras palavras costumam ser Certos. A pegadinha usual seria trocar 'doloso' por 'culposo' ou dispensar o trânsito em julgado.","recorrencia":"alta","tags":["pensão por morte","dependentes","perda do direito","homicídio doloso"],"origem":"INSS 2022 · Cebraspe · Técnico · item 86","prova":2022,"desatualizada":false},{"id":"P22-087","disciplina":"Direito Previdenciário","assunto":"Pensão por morte: concubinato (Tema 526/STF)","enunciado":"No que diz respeito ao plano de benefícios da previdência social: é constitucional o reconhecimento do direito previdenciário à pensão por morte para a pessoa que tenha mantido, durante longo período e com aparência familiar, união com pessoa casada, porquanto o concubinato se equipara, para fins de proteção estatal, às uniões afetivas resultantes do casamento e da união estável.","gabarito":"Errado","comentario":"O STF fixou que é INCOMPATÍVEL com a Constituição o reconhecimento de direitos previdenciários (pensão por morte) à pessoa que manteve, por longo período e com aparência familiar, união com pessoa casada, pois o concubinato não se equipara ao casamento nem à união estável (Tema 526). No mesmo sentido, o STF não admite o reconhecimento de duas uniões estáveis simultâneas para rateio de pensão (Tema 529).","legislacao":"STF, RE 883.168 (Tema 526 da repercussão geral) e RE 1.045.273 (Tema 529); CF, art. 226, § 3º; Lei 8.213/1991, art. 16, I.","pegadinha":"O item copia quase literalmente a tese do STF, mas inverte a conclusão ('é constitucional' no lugar de 'é incompatível') e afirma que o concubinato se equipara às uniões protegidas.","resumo_flash":"Concubinato é a relação não eventual entre pessoas impedidas de casar (por exemplo, com alguém casado e não separado de fato). Para o STF, ele NÃO gera pensão por morte, mesmo que dure muito tempo e tenha 'aparência de família'. Só cônjuge e companheiro(a) em união estável são dependentes de 1ª classe.","dica_padrao":"A Cebraspe gosta de reescrever teses de repercussão geral trocando apenas o sentido ('constitucional' x 'incompatível'). Memorize a conclusão da tese, não só o tema.","recorrencia":"alta","tags":["pensão por morte","concubinato","STF","Tema 526","união estável"],"origem":"INSS 2022 · Cebraspe · Técnico · item 87","prova":2022,"desatualizada":false},{"id":"P22-088","disciplina":"Direito Previdenciário","assunto":"Tempo de contribuição fictício: vedação","enunciado":"No que diz respeito ao plano de benefícios da previdência social: para fins de concessão dos benefícios previdenciários e de contagem recíproca, é admitida a contagem de tempo de contribuição fictício.","gabarito":"Errado","comentario":"A Constituição, desde a EC 103/2019, veda expressamente a contagem de tempo de contribuição fictício para efeito de concessão dos benefícios previdenciários e de contagem recíproca. Tempo fictício é aquele contado sem atividade e sem contribuição correspondente (ex.: licença-prêmio contada em dobro).","legislacao":"CF, art. 201, § 14 (incluído pela EC 103/2019); para servidores, CF, art. 40, § 10.","pegadinha":"A banca transformou uma vedação constitucional em permissão ('é admitida').","resumo_flash":"Tempo fictício é tempo 'de mentira': contado para aposentadoria sem que tenha havido trabalho e contribuição. A EC 103/2019 levou para a Constituição a proibição de usá-lo tanto para conceder benefícios do RGPS quanto para a contagem recíproca entre regimes.","dica_padrao":"Troca de 'é vedado' por 'é admitido' é uma das pegadinhas mais frequentes. Sempre que aparecer 'fictício' em previdência, pense em vedação.","recorrencia":"media","tags":["tempo fictício","contagem recíproca","EC103","art. 201 CF"],"origem":"INSS 2022 · Cebraspe · Técnico · item 88","prova":2022,"desatualizada":false},{"id":"P22-089","disciplina":"Direito Previdenciário","assunto":"Salário de benefício: limites mínimo e máximo","enunciado":"No que diz respeito ao plano de benefícios da previdência social: o valor do salário de benefício não pode ser inferior ao de um salário mínimo nem superior ao do limite máximo do salário de contribuição na data de início do benefício.","gabarito":"Certo","comentario":"Correto. A Lei 8.213/1991 estabelece que o salário de benefício não será inferior a um salário mínimo nem superior ao limite máximo do salário de contribuição (teto do RGPS) na data de início do benefício. Após a EC 103/2019, o salário de benefício passou a ser a média de 100% dos salários de contribuição desde julho/1994, mas esses limites continuam valendo.","legislacao":"Lei 8.213/1991, art. 29, § 2º; EC 103/2019, art. 26 (cálculo pela média).","pegadinha":"Não há troca: o item é a literalidade da lei. O risco é o candidato confundir salário de benefício com renda mensal inicial (RMI), que pode ser inferior em certos benefícios (ex.: auxílio-acidente, 50% do salário de benefício).","resumo_flash":"Salário de benefício é a base de cálculo dos benefícios: a média dos salários de contribuição. Ele fica sempre entre o salário mínimo e o teto do RGPS. Depois, aplica-se um percentual (a alíquota do benefício) para chegar à renda mensal inicial.","dica_padrao":"Diferencie 'salário de contribuição', 'salário de benefício' e 'renda mensal inicial'. A banca troca esses conceitos para gerar itens errados.","recorrencia":"alta","tags":["salário de benefício","teto RGPS","cálculo de benefícios"],"origem":"INSS 2022 · Cebraspe · Técnico · item 89","prova":2022,"desatualizada":false},{"id":"P22-090","disciplina":"Direito Previdenciário","assunto":"Carência: finalidade","enunciado":"No que diz respeito ao plano de benefícios da previdência social: o período de carência visa resguardar o equilíbrio financeiro e atuarial do sistema previdenciário.","gabarito":"Certo","comentario":"Correto. Carência é o número mínimo de contribuições mensais indispensáveis para que o beneficiário faça jus ao benefício. Ela existe para evitar que a pessoa se filie e contribua pouco apenas para receber logo um benefício, protegendo o equilíbrio financeiro e atuarial exigido pelo art. 201 da CF.","legislacao":"CF, art. 201, caput (caráter contributivo e equilíbrio financeiro e atuarial); Lei 8.213/1991, art. 24.","pegadinha":"Item conceitual; o candidato pode desconfiar por não ver um número de artigo, mas a afirmação é doutrinariamente correta.","resumo_flash":"Carência = número mínimo de contribuições mensais para ter direito a certos benefícios (ex.: 12 para auxílio por incapacidade temporária, 180 para aposentadoria programada). Sua razão de ser é proteger as contas do sistema contra filiações oportunistas.","dica_padrao":"Itens conceituais que ligam um instituto à sua finalidade lógica costumam ser Certos. Desconfie quando aparecerem palavras absolutas ('sempre', 'em qualquer caso').","recorrencia":"alta","tags":["carência","equilíbrio financeiro e atuarial"],"origem":"INSS 2022 · Cebraspe · Técnico · item 90","prova":2022,"desatualizada":false},{"id":"P22-091","disciplina":"Direito Previdenciário","assunto":"Salário de benefício: atividades concomitantes","enunciado":"No que diz respeito ao plano de benefícios da previdência social: o salário de benefício do segurado que contribui em razão de atividades concomitantes é calculado com base na soma dos salários de contribuição das atividades exercidas na data do requerimento ou do óbito, ou no período básico de cálculo.","gabarito":"Certo","comentario":"Correto. Desde a Lei 13.846/2019, o art. 32 da Lei 8.213/1991 manda SOMAR os salários de contribuição das atividades concomitantes (exercidas na data do requerimento ou do óbito, ou no período básico de cálculo), respeitado o teto. Antes havia a regra de 'atividade principal e secundária', que foi abandonada.","legislacao":"Lei 8.213/1991, art. 32 (redação da Lei 13.846/2019); Decreto 3.048/1999, art. 34.","pegadinha":"Quem estudou por material antigo lembra da regra de atividade principal/secundária e marca Errado.","resumo_flash":"Atividades concomitantes são dois ou mais trabalhos ao mesmo tempo (ex.: empregado em uma empresa e contribuinte individual). Hoje, os salários de contribuição dessas atividades são somados para o cálculo do benefício, sempre limitados ao teto do RGPS.","dica_padrao":"A banca explora mudanças legislativas recentes: regras antigas aparecem como pegadinha para quem estudou por material desatualizado.","recorrencia":"alta","tags":["salário de benefício","atividades concomitantes","Lei 13.846/2019"],"origem":"INSS 2022 · Cebraspe · Técnico · item 91","prova":2022,"desatualizada":false},{"id":"P22-092","disciplina":"Direito Previdenciário","assunto":"Qualidade de segurado: segurado em gozo de benefício","enunciado":"Quanto à manutenção, à perda e ao restabelecimento da qualidade de segurado: aquele que esteja em gozo de benefício, exceto do auxílio-acidente, perde a qualidade de segurado, independentemente de contribuições, sem limite de prazo.","gabarito":"Errado","comentario":"A lei diz o contrário: quem está em gozo de benefício, exceto auxílio-acidente, MANTÉM a qualidade de segurado, independentemente de contribuições, sem limite de prazo. O item trocou 'mantém' por 'perde'.","legislacao":"Lei 8.213/1991, art. 15, I (redação da Lei 13.846/2019).","pegadinha":"Troca de um único verbo ('mantém' → 'perde'), preservando todo o resto da redação legal, inclusive a exceção do auxílio-acidente.","resumo_flash":"Período de graça é o tempo em que a pessoa continua segurada mesmo sem contribuir. Quem recebe benefício (exceto auxílio-acidente) fica segurado sem limite de prazo enquanto durar o benefício. O auxílio-acidente foi excluído porque pode ser recebido junto com o trabalho.","dica_padrao":"Leia o verbo principal com atenção: a Cebraspe copia a lei inteira e troca só o núcleo (mantém/perde, pode/deve, é vedado/é permitido).","recorrencia":"alta","tags":["qualidade de segurado","período de graça","auxílio-acidente"],"origem":"INSS 2022 · Cebraspe · Técnico · item 92","prova":2022,"desatualizada":false},{"id":"P22-093","disciplina":"Direito Previdenciário","assunto":"Período de graça: segurado facultativo","enunciado":"Quanto à manutenção, à perda e ao restabelecimento da qualidade de segurado: o segurado facultativo mantém essa qualidade por, no máximo, três meses após a cessação das contribuições.","gabarito":"Errado","comentario":"O segurado facultativo mantém a qualidade de segurado por até 6 (seis) meses após a cessação das contribuições, e não 3 meses. O prazo de 3 meses aparece em outra hipótese: o segurado incorporado às Forças Armadas, contado do licenciamento.","legislacao":"Lei 8.213/1991, art. 15, V e VI.","pegadinha":"Troca do prazo (6 por 3 meses), usando um número que existe em outro inciso do mesmo artigo.","resumo_flash":"Prazos do período de graça (art. 15): sem limite para quem recebe benefício (exceto auxílio-acidente); 12 meses após cessar as contribuições (regra geral, prorrogável para 24 e +12 se desempregado); 12 meses após cessar a segregação (doença de segregação compulsória) e após o livramento (recluso); 3 meses após o licenciamento (militar); 6 meses para o facultativo.","dica_padrao":"Prazos numéricos são alvo clássico: a banca usa o número de outro inciso do mesmo artigo. Monte uma tabela com cada prazo e sua hipótese.","recorrencia":"alta","tags":["período de graça","segurado facultativo","prazos"],"origem":"INSS 2022 · Cebraspe · Técnico · item 93","prova":2022,"desatualizada":false},{"id":"P22-094","disciplina":"Direito Previdenciário","assunto":"Período de graça: direitos conservados","enunciado":"Quanto à manutenção, à perda e ao restabelecimento da qualidade de segurado: durante o período de graça, o segurado conserva todos os direitos perante a previdência social.","gabarito":"Certo","comentario":"Correto. A Lei 8.213/1991 dispõe que, durante os prazos do art. 15 (período de graça), o segurado conserva todos os seus direitos perante a Previdência Social. Assim, se ficar incapaz ou morrer nesse período, ele ou seus dependentes podem receber benefícios.","legislacao":"Lei 8.213/1991, art. 15, § 3º.","pegadinha":"A palavra 'todos' pode assustar quem aprendeu que termos absolutos indicam erro, mas aqui é a literalidade da lei.","resumo_flash":"No período de graça a pessoa não contribui, mas continua coberta: mantém todos os direitos, como se estivesse contribuindo. Atenção: esse tempo, em regra, não conta como tempo de contribuição nem como carência.","dica_padrao":"Nem toda palavra absoluta torna o item errado: se for a letra da lei, está certo. Conheça os dispositivos que usam 'todos', 'sempre' e 'qualquer'.","recorrencia":"alta","tags":["período de graça","qualidade de segurado"],"origem":"INSS 2022 · Cebraspe · Técnico · item 94","prova":2022,"desatualizada":false},{"id":"P22-095","disciplina":"Direito Previdenciário","assunto":"Serviço social do INSS","enunciado":"Em relação aos serviços previdenciários: ao serviço social compete esclarecer aos beneficiários seus direitos sociais e os meios de exercê-los, bem como estabelecer, juntamente com eles, o processo de solução dos problemas que emergirem da sua relação com a previdência social, no âmbito interno da instituição e na dinâmica da sociedade.","gabarito":"Certo","comentario":"Correto. O item reproduz o art. 88 da Lei 8.213/1991, que define a competência do serviço social. Ele é um dos serviços prestados pela Previdência Social, ao lado da habilitação e reabilitação profissional.","legislacao":"Lei 8.213/1991, art. 88; Decreto 3.048/1999, art. 161.","pegadinha":"Texto longo e literal; a banca aposta que o candidato não conhece o artigo e marca Errado por insegurança.","resumo_flash":"O RGPS oferece prestações de dois tipos: benefícios (pagamentos em dinheiro) e serviços. Os serviços são o serviço social e a habilitação/reabilitação profissional. O serviço social orienta os beneficiários sobre seus direitos e ajuda a resolver problemas na relação com a Previdência.","dica_padrao":"Itens longos e cheios de detalhes que soam razoáveis costumam ser a literalidade da lei. Procure a palavra trocada; se não achar, tende a ser Certo.","recorrencia":"media","tags":["serviço social","serviços previdenciários"],"origem":"INSS 2022 · Cebraspe · Técnico · item 95","prova":2022,"desatualizada":false},{"id":"P22-096","disciplina":"Direito Previdenciário","assunto":"Reabilitação profissional: auxílio para tratamento fora do domicílio","enunciado":"Em relação aos serviços previdenciários: na hipótese de habilitação e reabilitação profissional, é vedada a concessão de auxílio para tratamento ou exame fora do domicílio do beneficiário.","gabarito":"Errado","comentario":"A lei determina o contrário: será concedido, no caso de habilitação e reabilitação profissional, auxílio para tratamento ou exame fora do domicílio do beneficiário, conforme dispuser o regulamento. Não há vedação.","legislacao":"Lei 8.213/1991, art. 91; Decreto 3.048/1999, art. 171.","pegadinha":"Transformou uma concessão legal ('será concedido') em proibição ('é vedada').","resumo_flash":"A habilitação e reabilitação profissional é o serviço que prepara o segurado incapacitado para voltar ao mercado de trabalho. Para isso, a Previdência pode fornecer próteses, órteses, instrumentos de trabalho, transporte e auxílio para tratamento ou exame fora do domicílio.","dica_padrao":"Toda vez que o item usar 'é vedado' para um direito de apoio ao beneficiário, desconfie: a Cebraspe adora inverter permissões.","recorrencia":"media","tags":["reabilitação profissional","serviços previdenciários"],"origem":"INSS 2022 · Cebraspe · Técnico · item 96","prova":2022,"desatualizada":false},{"id":"P22-097","disciplina":"Direito Previdenciário","assunto":"Pensão especial: síndrome da talidomida","enunciado":"Acerca dos benefícios decorrentes de legislações especiais e do seguro-defeso: a pensão especial concedida às pessoas com deficiência física conhecida como síndrome da talidomida, ressalvado o direito à opção, é acumulável com rendimento ou remuneração que, a qualquer título, venha a ser pago pela União a seus beneficiários, salvo a indenização por dano moral concedida por lei específica.","gabarito":"Errado","comentario":"A Lei 7.070/1982 diz que a pensão especial da talidomida, ressalvado o direito de opção, NÃO é acumulável com rendimento ou indenização que, a qualquer título, venha a ser pago pela União a seus beneficiários, salvo a indenização por dano moral concedida por lei específica (Lei 12.190/2010). Ou seja, a regra é a inacumulabilidade, com exceção da indenização por dano moral.","legislacao":"Lei 7.070/1982 (pensão especial da talidomida); Lei 12.190/2010 (indenização por dano moral).","pegadinha":"Retirou o 'não' da frase ('é acumulável'), mantendo a ressalva final: que só faz sentido se a regra for de NÃO acumulação.","resumo_flash":"A pensão da talidomida é paga a pessoas com deficiência causada pelo uso do medicamento talidomida pela mãe na gestação. Ela não se acumula com outros valores pagos pela União, exceto a indenização por dano moral prevista em lei específica. Ela também não impede benefícios previdenciários.","dica_padrao":"Quando o item traz uma ressalva ('salvo...'), verifique se ela é coerente com a regra: uma exceção de acumulação só existe se a regra for proibir a acumulação.","recorrencia":"media","tags":["legislação especial","talidomida","pensão especial","acumulação"],"origem":"INSS 2022 · Cebraspe · Técnico · item 97","prova":2022,"desatualizada":false},{"id":"P22-098","disciplina":"Direito Previdenciário","assunto":"Pensão vitalícia dos seringueiros (soldados da borracha)","enunciado":"Acerca dos benefícios decorrentes de legislações especiais e do seguro-defeso: os seringueiros que trabalharam nos seringais da região amazônica durante a Segunda Guerra Mundial, ainda que possuam meios para a sua subsistência e a da sua família, têm direito ao pagamento de pensão mensal vitalícia correspondente ao valor de dois salários mínimos vigentes no país.","gabarito":"Errado","comentario":"O ADCT garante pensão mensal vitalícia de dois salários mínimos aos seringueiros recrutados (ou que colaboraram) no esforço de guerra na Amazônia durante a Segunda Guerra, mas somente QUANDO CARENTES, isto é, quando não possuírem meios para a própria subsistência e a da família. O valor de dois salários mínimos está correto; o erro é dispensar a carência econômica.","legislacao":"ADCT, art. 54; Lei 7.986/1989.","pegadinha":"Manteve o valor certo (dois salários mínimos) para dar credibilidade e inseriu 'ainda que possuam meios', eliminando o requisito da necessidade.","resumo_flash":"Os 'soldados da borracha' trabalharam na extração de borracha na Amazônia para o esforço de guerra aliado. A Constituição (ADCT) lhes garante pensão vitalícia de 2 salários mínimos, desde que sejam carentes. Os dependentes também podem ter direito, conforme a lei.","dica_padrao":"Itens com o número correto e um requisito suprimido ou invertido são clássicos. Confira os requisitos, não só o valor.","recorrencia":"media","tags":["legislação especial","seringueiros","soldado da borracha","ADCT"],"origem":"INSS 2022 · Cebraspe · Técnico · item 98","prova":2022,"desatualizada":false},{"id":"P22-099","disciplina":"Direito Previdenciário","assunto":"Pensão especial dos ex-combatentes da Segunda Guerra","enunciado":"Acerca dos benefícios decorrentes de legislações especiais e do seguro-defeso: a pensão especial devida aos ex-combatentes da Segunda Guerra Mundial e a seus dependentes corresponde à pensão militar deixada por segundo-tenente das Forças Armadas.","gabarito":"Certo","comentario":"Correto. O ADCT assegura ao ex-combatente que tenha efetivamente participado de operações bélicas na Segunda Guerra pensão especial correspondente à deixada por segundo-tenente das Forças Armadas, que pode ser requerida a qualquer tempo e é inacumulável com quaisquer rendimentos dos cofres públicos, salvo os benefícios previdenciários. Em caso de morte, a pensão é transferida a dependentes, na forma da lei.","legislacao":"ADCT, art. 53, II e III; Lei 8.059/1990.","pegadinha":"A banca poderia trocar o posto (ex.: 'segundo-sargento' ou 'capitão'); aqui manteve o correto.","resumo_flash":"O ex-combatente da Segunda Guerra que participou efetivamente de operações bélicas tem direito à pensão especial no valor da pensão militar de segundo-tenente. Ela se transmite a dependentes (diferentemente de várias outras pensões especiais, que são personalíssimas).","dica_padrao":"Em legislação especial, decore o 'número-chave' de cada benefício: segundo-tenente (ex-combatente), 2 salários mínimos (seringueiro), 1 salário mínimo (zika, na Lei 13.985/2020).","recorrencia":"media","tags":["legislação especial","ex-combatente","ADCT"],"origem":"INSS 2022 · Cebraspe · Técnico · item 99","prova":2022,"desatualizada":false},{"id":"P22-100","disciplina":"Direito Previdenciário","assunto":"Pensão especial: vítimas da hemodiálise de Caruaru","enunciado":"Acerca dos benefícios decorrentes de legislações especiais e do seguro-defeso: a pensão especial concedida às vítimas da hemodiálise de Caruaru não será transmitida aos seus sucessores.","gabarito":"Certo","comentario":"Correto. A pensão especial às vítimas do evento de Caruaru (PE, 1996), em que pacientes de hemodiálise foram contaminados, é personalíssima: não se transmite a herdeiros ou sucessores, extinguindo-se com a morte do beneficiário.","legislacao":"Lei 9.422/1996.","pegadinha":"O candidato pode confundir com a pensão do ex-combatente, que se transmite a dependentes.","resumo_flash":"A pensão de Caruaru é um benefício indenizatório pago pela União às vítimas (ou a herdeiros de quem morreu no evento, conforme a lei) da contaminação em clínica de hemodiálise. Ela é personalíssima: quando o beneficiário morre, o pagamento acaba.","dica_padrao":"Nas pensões especiais indenizatórias (Caruaru, Goiânia, talidomida, hanseníase, zika), a regra é ser personalíssima/intransferível. A banca costuma afirmar que se transmite.","recorrencia":"media","tags":["legislação especial","Caruaru","hemodiálise","pensão especial"],"origem":"INSS 2022 · Cebraspe · Técnico · item 100","prova":2022,"desatualizada":false},{"id":"P22-101","disciplina":"Direito Previdenciário","assunto":"Pensão especial: vítimas do césio-137 em Goiânia","enunciado":"Acerca dos benefícios decorrentes de legislações especiais e do seguro-defeso: a pensão especial concedida às vítimas do acidente nuclear ocorrido em Goiânia (GO) é transmissível ao cônjuge sobrevivente ou aos herdeiros, em caso de morte do beneficiário.","gabarito":"Errado","comentario":"A pensão especial às vítimas do acidente com o césio-137 em Goiânia (1
