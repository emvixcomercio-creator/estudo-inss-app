 ou em situação urgente. Não está presente em todos os atos (ex.: a cobrança forçada de multa exige execução judicial).","Imperatividade: impõe obrigações a terceiros independentemente de concordância; não existe nos atos negociais (licença, autorização) nem nos enunciativos (certidão, atestado).","Vícios sanáveis (permitem convalidação): de competência (salvo competência exclusiva) e de forma (salvo forma essencial). Vícios de motivo, objeto e finalidade são insanáveis.","Silêncio administrativo não é ato administrativo; é um fato que só produz efeitos se a lei atribuir."],"pegadinhas":["Dizer que a presunção de legitimidade é absoluta: é relativa (juris tantum).","Afirmar que todos os atos administrativos são autoexecutórios ou imperativos.","Dizer que a finalidade ou a competência podem ser discricionárias.","Confundir motivo (fato) com motivação (exposição) ou dizer que a teoria dos motivos determinantes só vale para atos vinculados."],"base_legal":"Lei 4.717/1965, art. 2º; Lei 9.784/1999, arts. 50 e 55; doutrina.","questoes":["ADM-001"]},{"id":"da-05","disciplina":"Direito Administrativo","topico":"Ato administrativo: espécies, classificações e extinção (anulação, revogação, cassação, convalidação)","recorrencia":"alta","provas":[2012,2022],"resumo":"Os atos administrativos se dividem em espécies (normativos, ordinatórios, negociais, enunciativos e punitivos) e se extinguem por várias formas. A diferença entre anulação e revogação é uma das questões mais clássicas de concurso.","pontos":["Normativos: decretos, regulamentos, instruções normativas, regimentos, resoluções. Ordinatórios: portarias, circulares, avisos, ordens de serviço, ofícios, despachos (organizam o funcionamento interno).","Negociais: licença (vinculada e, em regra, definitiva, ex.: licença para construir), autorização (discricionária e precária, ex.: porte de arma), permissão, aprovação, homologação (vinculada e posterior), visto, admissão.","Enunciativos: certidões, atestados, pareceres e apostilas (declaram ou opinam). Punitivos: multas, interdições, advertências.","Ato simples: uma só vontade (de um órgão, singular ou colegiado). Complexo: vontades de órgãos diferentes se fundem num único ato. Composto: um ato principal e outro acessório (ex.: visto, aprovação) do mesmo órgão.","Anulação: por ilegalidade; efeitos retroativos (ex tunc); feita pela própria administração (autotutela) ou pelo Judiciário.","Prazo para a administração anular atos de que decorram efeitos favoráveis aos destinatários: 5 anos da data em que foram praticados, salvo comprovada má-fé (Lei 9.784/1999, art. 54).","Revogação: por conveniência e oportunidade (mérito); efeitos não retroativos (ex nunc); só pela própria administração que praticou o ato: o Judiciário só revoga seus próprios atos administrativos.","Não podem ser revogados: atos vinculados, atos que já exauriram seus efeitos (consumados), atos que geraram direitos adquiridos, atos enunciativos e atos de procedimento já superados (preclusos).","Cassação: extinção porque o beneficiário deixou de cumprir as condições (ex.: licença de funcionamento de hotel usado como casa de jogo). Caducidade: lei nova torna o ato incompatível. Contraposição: ato posterior com efeitos opostos.","Convalidação (art. 55 da Lei 9.784/1999): atos com defeitos sanáveis podem ser convalidados pela administração quando não acarretarem lesão ao interesse público nem prejuízo a terceiros."],"pegadinhas":["Dizer que o Judiciário pode revogar ato do Executivo por inconveniência: ele só anula por ilegalidade.","Inverter os efeitos: anulação é ex tunc; revogação é ex nunc.","Afirmar que a licença é discricionária e precária: essas são características da autorização.","Esquecer a exceção da má-fé no prazo de 5 anos do art. 54 da Lei 9.784/1999."],"base_legal":"Lei 9.784/1999, arts. 53 a 55; Súmulas 346 e 473 do STF; doutrina.","questoes":["ADM-002"]},{"id":"da-06","disciplina":"Direito Administrativo","topico":"Organização administrativa: administração direta e indireta, descentralização e desconcentração","recorrencia":"alta","provas":[2012,2022],"resumo":"A administração se organiza em direta (os próprios entes federativos e seus órgãos) e indireta (entidades com personalidade própria criadas pelo ente). O INSS, por exemplo, é uma autarquia federal. A banca cobra a diferença entre descentralização e desconcentração e as características de cada entidade.","pontos":["Desconcentração: distribuição de competências DENTRO da mesma pessoa jurídica, criando órgãos (sem personalidade jurídica), com hierarquia. Ex.: ministérios, secretarias, superintendências do INSS.","Descentralização: transferência de competência de uma pessoa para OUTRA pessoa (física ou jurídica). Por outorga/serviços: lei cria ou autoriza entidade e transfere a titularidade e a execução. Por delegação/colaboração: contrato ou ato transfere só a execução (concessionárias e permissionárias).","Órgãos públicos não têm personalidade jurídica (teoria do órgão ou da imputação: a atuação do agente é imputada à pessoa jurídica); alguns órgãos independentes e autônomos têm capacidade processual para defender suas prerrogativas.","Administração indireta: autarquias, fundações públicas, empresas públicas e sociedades de economia mista (art. 37, XIX, CF). Há supervisão ministerial (controle finalístico/tutela), e não hierarquia.","Autarquia: pessoa jurídica de direito público, criada por lei específica, para atividades típicas de Estado; tem prerrogativas da Fazenda Pública. Ex.: INSS. Agências reguladoras são autarquias de regime especial (Lei 13.848/2019).","Fundação pública: criação autorizada por lei específica; lei complementar define suas áreas de atuação. Se de direito público, é espécie de autarquia (autarquia fundacional).","Empresa pública: pessoa jurídica de direito privado, capital exclusivamente público, qualquer forma societária. Sociedade de economia mista: direito privado, obrigatoriamente sociedade anônima, maioria do capital votante pertencente ao ente público. Ambas têm criação autorizada por lei e regime da Lei 13.303/2016.","Criação de subsidiárias de estatais depende de autorização legislativa, que pode ser genérica (STF).","Delegação de serviços públicos (art. 175, CF): concessão ou permissão, sempre precedidas de licitação (Lei 8.987/1995).","PPP (Lei 11.079/2004): concessão patrocinada (tarifa do usuário + contraprestação pública) e concessão administrativa (a administração é a usuária direta ou indireta do serviço). Prazo de 5 a 35 anos.","Entidades do terceiro setor (OS, OSCIP, serviços sociais autônomos) não integram a administração pública; são paraestatais/entes de cooperação."],"pegadinhas":["Chamar de desconcentração a transferência de competência entre pessoas jurídicas: isso é descentralização.","Dizer que órgão público tem personalidade jurídica.","Afirmar que autarquia tem criação apenas autorizada por lei ou que empresa pública é criada diretamente por lei: autarquia é criada por lei; estatais e fundações têm criação autorizada.","Dizer que há subordinação hierárquica entre a autarquia e o ministério supervisor.","Trocar concessão patrocinada (há tarifa do usuário) com concessão administrativa (administração é usuária)."],"base_legal":"CF/1988, arts. 37, XIX e XX, e 175; Decreto-Lei 200/1967; Lei 13.303/2016; Lei 8.987/1995; Lei 11.079/2004; Lei 13.848/2019.","questoes":["P22-031","P22-038"]},{"id":"da-07","disciplina":"Direito Administrativo","topico":"Agentes públicos e regras gerais da Lei 8.112/1990 (provimento, posse, exercício, vacância)","recorrencia":"media","provas":[2022],"resumo":"Agente público é toda pessoa que exerce, ainda que temporariamente ou sem remuneração, uma função pública. O conceito é amplo e inclui desde o Presidente até um mesário. A Lei 8.112/1990 é o estatuto dos servidores federais: inclusive dos servidores do INSS.","pontos":["Espécies de agentes públicos: agentes políticos; servidores públicos (estatutários, empregados públicos celetistas e temporários do art. 37, IX, CF); militares; particulares em colaboração com o Estado.","Particulares em colaboração: por requisição/nomeação (jurados, mesários, convocados para o serviço militar), por delegação (concessionários, notários) e voluntários (gestores de negócio). Jurados SÃO agentes públicos.","Requisitos básicos para investidura (Lei 8.112, art. 5º): nacionalidade brasileira, gozo dos direitos políticos, quitação com obrigações militares e eleitorais, nível de escolaridade exigido, idade mínima de 18 anos e aptidão física e mental. Às pessoas com deficiência é assegurada reserva de até 20% das vagas.","Formas de provimento (art. 8º): nomeação, promoção, readaptação, reversão, aproveitamento, reintegração e recondução.","Posse: em até 30 dias da publicação do ato de provimento (pode ser por procuração específica); sem posse no prazo, o ato de provimento fica sem efeito. Exercício: em até 15 dias da posse; sem exercício, o servidor é exonerado.","Estágio probatório: a Lei 8.112 fala em 24 meses, mas, após a EC 19/1998, a jurisprudência alinhou o estágio ao prazo de 3 anos da estabilidade (art. 41, CF).","Vacância (art. 33): exoneração, demissão, promoção, readaptação, aposentadoria, posse em outro cargo inacumulável e falecimento.","Ser acionista, cotista ou comanditário de sociedade privada NÃO impede a posse; o que é proibido é participar da gerência ou administração da sociedade ou exercer o comércio (art. 117, X).","Ocupante de cargo temporário ou exclusivamente em comissão: vinculado ao RGPS (art. 40, § 13, CF)."],"pegadinhas":["Dizer que jurados, mesários ou outros colaboradores eventuais não são agentes públicos.","Trocar os prazos: posse em 30 dias; exercício em 15 dias.","Afirmar que a condição de sócio ou acionista impede a posse.","Incluir 'transferência' ou 'ascensão' como formas de provimento: foram retiradas do ordenamento por inconstitucionalidade."],"base_legal":"CF/1988, arts. 37 a 41; Lei 8.112/1990, arts. 3º a 33 e 117, X.","questoes":["P22-030","P22-034","P22-036"]},{"id":"da-08","disciplina":"Direito Administrativo","topico":"Responsabilidade civil do Estado","recorrencia":"alta","provas":[2012,2022],"resumo":"Quando um agente público causa dano a alguém agindo nessa qualidade, o Estado indeniza sem que a vítima precise provar culpa (responsabilidade objetiva). Depois, o Estado pode cobrar do agente se ele agiu com dolo ou culpa. A banca cobra as teorias, as excludentes e quem responde.","pontos":["Art. 37, § 6º, CF: as pessoas jurídicas de direito público e as de direito privado PRESTADORAS DE SERVIÇO PÚBLICO respondem pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa.","Regra: teoria do risco administrativo (responsabilidade objetiva): a vítima prova conduta, dano e nexo causal, sem precisar provar culpa.","Excludentes ou atenuantes: culpa exclusiva da vítima, caso fortuito ou força maior e fato exclusivo de terceiro excluem; culpa concorrente da vítima reduz a indenização.","Teoria do risco integral (não admite excludentes): hipóteses excepcionais, como dano nuclear e dano ambiental.","Omissão estatal: em regra, responsabilidade subjetiva (culpa anônima ou falta do serviço); quando há dever específico de agir (ex.: custódia de preso), o STF reconhece responsabilidade objetiva (Tema 592: morte de detento).","A concessionária de serviço público responde objetivamente também perante terceiros não usuários do serviço (STF).","Tese da dupla garantia (STF, Tema 940): a vítima deve acionar o Estado ou a prestadora, e não diretamente o agente; o agente responde depois, em ação regressiva.","Empresas estatais que exploram atividade econômica respondem pelas regras do direito privado (não se aplica o art. 37, § 6º).","Atos legislativos e judiciais, em regra, não geram indenização, salvo exceções: erro judiciário e prisão além do tempo fixado (art. 5º, LXXV), leis de efeitos concretos e leis declaradas inconstitucionais que causem dano.","Prazo para ação de indenização contra a Fazenda Pública: 5 anos (Decreto 20.910/1932)."],"pegadinhas":["Dizer que a vítima precisa provar dolo ou culpa do agente para ser indenizada pelo Estado.","Afirmar que a responsabilidade objetiva é absoluta e não admite excludentes (isso é risco integral).","Dizer que o regresso contra o agente independe de dolo ou culpa.","Incluir estatal exploradora de atividade econômica no art. 37, § 6º."],"base_legal":"CF/1988, art. 37, § 6º, e art. 5º, LXXV; Código Civil, art. 43; Decreto 20.910/1932; STF, Temas 592 e 940.","questoes":[]},{"id":"da-09","disciplina":"Direito Administrativo","topico":"Controle da administração pública","recorrencia":"media","provas":[2022],"resumo":"Controle é o poder de fiscalizar e corrigir a atuação administrativa. Pode ser feito pela própria administração, pelo Legislativo (com o Tribunal de Contas), pelo Judiciário e pela sociedade. A banca cobra quem controla o quê e com quais limites.","pontos":["Quanto ao órgão: administrativo (a própria administração), legislativo e judicial. Quanto à posição: interno (dentro do mesmo Poder) ou externo (um Poder sobre outro). Quanto ao momento: prévio, concomitante ou posterior.","Controle administrativo: autotutela (anular e revogar os próprios atos: Súmula 473 STF), recursos administrativos, direito de petição e representação, supervisão ministerial (tutela) sobre a indireta. Abrange legalidade e mérito.","O direito de petição (art. 5º, XXXIV, a, CF) é meio de provocar o controle administrativo.","Controle legislativo: o Congresso, com auxílio do TCU, faz a fiscalização contábil, financeira, orçamentária, operacional e patrimonial (arts. 70 e 71, CF); pode sustar atos normativos do Executivo que exorbitem do poder regulamentar (art. 49, V); CPIs.","TCU: aprecia as contas do Presidente mediante parecer prévio (quem JULGA é o Congresso); julga as contas dos demais administradores; aprecia, para registro, admissões (exceto cargos em comissão) e concessões de aposentadorias, reformas e pensões; suas decisões que imputam débito ou multa têm eficácia de título executivo.","TCU pode sustar ATO irregular não corrigido; a sustação de CONTRATO cabe ao Congresso: se este não agir em 90 dias, o TCU decide (art. 71, §§ 1º e 2º).","Súmula Vinculante 3: nos processos no TCU, asseguram-se contraditório e ampla defesa quando a decisão puder anular ou revogar ato que beneficie o interessado, exceto na apreciação da legalidade do ato de concessão inicial de aposentadoria, reforma e pensão.","Controle judicial: só de legalidade e legitimidade (inclui razoabilidade e proporcionalidade), nunca do mérito; depende de provocação; instrumentos: mandado de segurança, ação popular, ação civil pública, habeas data, ação de improbidade.","Controle social: participação do cidadão (ação popular, denúncia ao Tribunal de Contas: art. 74, § 2º, CF, ouvidorias, acesso à informação pela Lei 12.527/2011)."],"pegadinhas":["Dizer que o Judiciário pode controlar o mérito (conveniência e oportunidade) do ato administrativo.","Afirmar que o TCU julga as contas do Presidente da República: ele só emite parecer prévio.","Dizer que o controle administrativo depende de provocação: ele pode ser feito de ofício.","Afirmar que o TCU pode sustar diretamente qualquer contrato."],"base_legal":"CF/1988, arts. 5º, XXXIV e LXXIII, 49, V, 70 a 75; Súmula 473 STF; Súmula Vinculante 3; Lei 9.784/1999.","questoes":["P22-040","ADM-002"]},{"id":"da-10","disciplina":"Direito Administrativo","topico":"Processo administrativo federal (Lei 9.784/1999)","recorrencia":"media","provas":[2022],"resumo":"A Lei 9.784/1999 regula o processo administrativo na administração pública federal: é a lei que rege, por exemplo, pedidos e recursos dentro de órgãos federais. É muito cobrada pela literalidade: prazos, delegação, impedimento e recursos.","pontos":["Aplica-se à administração federal direta e indireta e aos Poderes Legislativo e Judiciário da União quando exercem função administrativa; processos com lei própria seguem a lei específica, aplicando-se a 9.784 subsidiariamente (art. 69).","Critérios do art. 2º: atuação conforme a lei e o Direito; objetividade; divulgação oficial dos atos; adequação entre meios e fins; formas simples; gratuidade (vedada cobrança de despesas, salvo previsão legal); impulsão de ofício; interpretação que melhor garanta o fim público, vedada a aplicação retroativa de nova interpretação.","Competência é irrenunciável. Pode haver DELEGAÇÃO parcial a outros órgãos ou titulares, AINDA QUE NÃO lhes sejam hierarquicamente subordinados (art. 12). A delegação é revogável a qualquer tempo e o ato delegado considera-se editado pelo delegado.","Não podem ser delegados (art. 13): edição de atos de caráter normativo, decisão de recursos administrativos e matérias de competência exclusiva do órgão ou autoridade.","Avocação: temporária, excepcional e por motivos relevantes devidamente justificados, de competência de órgão hierarquicamente inferior (art. 15).","Impedimento (art. 18: presunção absoluta): ter interesse direto ou indireto na matéria; ter participado ou vir a participar como perito, testemunha ou representante (ou se tais situações ocorrem com cônjuge, companheiro ou parente até o 3º grau); estar em litígio com o interessado. Suspeição (art. 20): amizade íntima ou inimizade notória.","Prazos: atos do processo em 5 dias, salvo força maior (art. 24); intimação com antecedência mínima de 3 dias úteis (art. 26); alegações finais em 10 dias após a instrução (art. 44); decisão em até 30 dias após a instrução, prorrogável por igual período (art. 49).","Recurso: prazo de 10 dias; dirigido à autoridade que decidiu, que pode reconsiderar em 5 dias, senão encaminha à superior; decisão em até 30 dias (prorrogável por igual período); tramita por no máximo 3 instâncias; em regra, sem efeito suspensivo.","Não se exige caução para recorrer (a exigência de depósito prévio é inconstitucional: Súmula Vinculante 21). No recurso, a decisão pode ser agravada (reformatio in pejus), desde que o recorrente seja cientificado para alegar antes; na REVISÃO (a qualquer tempo, por fatos novos), não pode haver agravamento.","Dever de motivação (art. 50) para atos que neguem, limitem ou afetem direitos, imponham deveres ou sanções, decidam recursos, anulem, revoguem, suspendam ou convalidem atos, entre outros.","Decadência: 5 anos para anular atos com efeitos favoráveis, salvo má-fé (art. 54). Convalidação de defeitos sanáveis (art. 55).","Prioridade de tramitação (art. 69-A): pessoa com 60 anos ou mais, pessoa com deficiência e portadores de doenças graves listadas na lei."],"pegadinhas":["Dizer que a delegação depende de subordinação hierárquica: a lei admite delegação a órgão não subordinado.","Incluir a decisão de recurso entre as matérias delegáveis.","Trocar prazos: recurso em 10 dias; reconsideração em 5 dias; decisão em 30 dias.","Afirmar que o recurso administrativo sempre tem efeito suspensivo ou exige depósito prévio.","Dizer que a revisão do processo sancionador pode agravar a sanção."],"base_legal":"Lei 9.784/1999 (arts. 1º, 2º, 11 a 15, 18 a 21, 24, 26, 44, 49, 50, 53 a 65 e 69-A); Súmula Vinculante 21.","questoes":["P22-037"]},{"id":"da-11","disciplina":"Direito Administrativo","topico":"Improbidade administrativa (Lei 8.429/1992, com as mudanças da Lei 14.230/2021)","recorrencia":"alta","provas":[2012,2022],"resumo":"Improbidade é a desonestidade qualificada do agente público que gera enriquecimento ilícito, prejuízo ao erário ou viola princípios da administração. Desde a Lei 14.230/2021, só existe improbidade DOLOSA. A ação é civil (não é crime), embora possa coexistir com processo penal.","pontos":["Só há improbidade com DOLO: vontade livre e consciente de alcançar o resultado ilícito; não basta a voluntariedade do agente nem o mero exercício da função (art. 1º, §§ 1º a 3º). A modalidade culposa foi extinta.","Três espécies: enriquecimento ilícito (art. 9º), prejuízo ao erário (art. 10) e violação aos princípios da administração (art. 11). O rol do art. 11 passou a ser taxativo.","Sanções do art. 9º: perda dos bens acrescidos ilicitamente, perda da função pública, suspensão dos direitos políticos até 14 anos, multa equivalente ao valor do acréscimo patrimonial e proibição de contratar com o poder público ou receber benefícios fiscais até 14 anos.","Sanções do art. 10: perda dos bens acrescidos (se houver), perda da função, suspensão dos direitos políticos até 12 anos, multa equivalente ao valor do dano e proibição de contratar até 12 anos.","Sanções do art. 11: multa de até 24 vezes a remuneração do agente e proibição de contratar até 4 anos: não há suspensão de direitos políticos nem perda da função.","Sujeito ativo: agente público em sentido amplo (inclusive quem exerce função transitoriamente ou sem remuneração) e o particular que induza ou concorra dolosamente para o ato.","A ação é de natureza civil (não penal), segue o procedimento comum do CPC e pode ser proposta pelo Ministério Público; o STF (ADIs 7042 e 7043) restabeleceu também a legitimidade da pessoa jurídica interessada.","Prescrição: 8 anos contados da ocorrência do fato (ou do dia em que cessou a permanência); após a interrupção, o prazo corre pela metade (4 anos: prescrição intercorrente). A ação de ressarcimento por ato DOLOSO de improbidade é imprescritível (STF, Tema 897).","Retroatividade (STF, Tema 1.199): a extinção da modalidade culposa alcança atos culposos sem condenação transitada em julgado; o novo regime de prescrição não retroage.","Indisponibilidade de bens: exige demonstração de perigo de dano irreparável ou risco ao resultado útil do processo. Admite-se acordo de não persecução civil (art. 17-B).","A CF (art. 37, § 4º) prevê para a improbidade: suspensão dos direitos políticos, perda da função pública, indisponibilidade dos bens e ressarcimento ao erário, sem prejuízo da ação penal cabível."],"pegadinhas":["Chamar improbidade de crime: a Lei 8.429/1992 trata de ilícito civil-administrativo.","Dizer que basta a voluntariedade ou a culpa para configurar improbidade: após a Lei 14.230/2021, é indispensável o dolo específico.","Atribuir suspensão de direitos políticos aos atos do art. 11.","Usar prazos antigos (5 anos após o fim do mandato) ou dizer que a ação só pode ser proposta pelo MP sem considerar a decisão do STF.","Dizer que toda ação de ressarcimento ao erário é imprescritível: só a decorrente de ato doloso de improbidade."],"base_legal":"CF/1988, art. 37, § 4º e § 5º; Lei 8.429/1992 com redação da Lei 14.230/2021 (arts. 1º, 2º, 3º, 9º a 12, 16, 17, 17-B e 23); STF, ARE 843.989 (Tema 1.199), ADIs 7042 e 7043, RE 852.475 (Tema 897).","questoes":["P22-039"]},{"id":"et-01","disciplina":"Ética no Serviço Público","topico":"Ética e moral","recorrencia":"baixa","provas":[],"resumo":"Ética e moral são parecidas, mas não iguais: a moral é o conjunto de regras e costumes que um grupo pratica; a ética é a reflexão crítica, filosófica, sobre essas regras. A banca costuma cobrar essa distinção e a diferença entre moral e direito.","pontos":["Etimologia: ética vem do grego ethos (caráter, modo de ser); moral vem do latim mos/mores (costumes).","Moral: conjunto de normas, valores e costumes que orientam o comportamento de um grupo em determinada época: é prática, histórica, cultural e mutável.","Ética: ramo da filosofia que estuda e fundamenta a moral; é teórica, reflexiva e busca princípios de validade mais universal.","Moral x Direito: as normas jurídicas são impostas pelo Estado e têm coercibilidade (sanção institucionalizada); a sanção moral é interna (consciência) ou social (reprovação). Nem tudo que é legal é moral.","Valores e virtudes: valores são aquilo que se considera desejável (justiça, honestidade); virtudes são disposições habituais de agir bem (Aristóteles).","Correntes clássicas: ética das virtudes (Aristóteles), ética do dever/deontológica (Kant: agir por dever, imperativo categórico) e ética consequencialista/utilitarista (avaliar a ação pelas consequências, maior bem para o maior número).","Deontologia profissional: conjunto de deveres de uma profissão, expresso em códigos de ética (ex.: Decreto 1.171/1994 para servidores federais)."],"pegadinhas":["Dizer que ética e moral são sinônimos perfeitos ou inverter os conceitos (ética prática x moral teórica).","Afirmar que a moral é imutável e universal.","Confundir sanção moral (interna/social) com sanção jurídica (imposta pelo Estado)."],"base_legal":"Doutrina (Aristóteles, Kant, Adolfo Sánchez Vázquez).","questoes":[]},{"id":"et-02","disciplina":"Ética no Serviço Público","topico":"Ética e função pública","recorrencia":"media","provas":[2022],"resumo":"No serviço público, a ética deixa de ser só escolha pessoal: vira dever jurídico, ligado ao princípio da moralidade (art. 37 da CF) e à ideia de que o servidor está a serviço do bem comum, pago pelos tributos de todos.","pontos":["A moralidade administrativa é princípio constitucional expresso (art. 37, caput) e seu desrespeito pode gerar anulação do ato, sanções disciplinares e improbidade.","Decreto 1.171/1994: a dignidade, o decoro, o zelo, a eficácia e a consciência dos princípios morais são primados maiores que devem nortear o servidor, no cargo ou fora dele.","A moralidade não se limita à distinção entre o bem e o mal: deve-se acrescentar a ideia de que o fim é sempre o bem comum.","A remuneração do servidor é paga pelos tributos de todos, inclusive dele próprio; por isso exige-se que a moralidade administrativa integre o Direito.","A função pública se integra à vida particular: fatos e atos da vida privada podem acrescer ou diminuir o bom conceito do servidor na vida funcional.","Tratar mal uma pessoa que paga seus tributos direta ou indiretamente significa causar-lhe dano moral; deixar alguém à espera de solução por fila ou atraso caracteriza conduta desumana e grave dano moral.","Conflito de interesses: Lei 12.813/2013: situações em que o interesse privado pode comprometer o interesse coletivo; inclui impedimento (quarentena) de 6 meses após deixar certos cargos.","Transparência e acesso à informação (Lei 12.527/2011: LAI): publicidade é regra; sigilo, exceção."],"pegadinhas":["Afirmar que a conduta do servidor na vida privada é irrelevante para sua vida funcional.","Dizer que maltratar o cidadão é apenas falta de educação, sem caracterizar dano moral segundo o Código de Ética.","Tratar a ética do servidor como mera recomendação, sem força jurídica."],"base_legal":"CF/1988, art. 37; Decreto 1.171/1994 (Anexo, regras I a XIII); Lei 12.813/2013; Lei 12.527/2011.","questoes":["P22-015"]},{"id":"et-03","disciplina":"Ética no Serviço Público","topico":"Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal (Decreto 1.171/1994)","recorrencia":"media","provas":[2022],"resumo":"O Decreto 1.171/1994 aprova o Código de Ética do servidor federal. Ele traz regras deontológicas (valores), deveres fundamentais, vedações e regras sobre as Comissões de Ética. A banca cobra a literalidade, principalmente deveres, vedações e a pena de censura.","pontos":["Estrutura do Anexo: Capítulo I - Seção I (regras deontológicas), Seção II (principais deveres do servidor, item XIV), Seção III (vedações, item XV); Capítulo II - Comissões de Ética.","Regras deontológicas marcantes: toda pessoa tem direito à verdade, que o servidor não pode omitir ou falsear, ainda que contrária aos interesses da própria pessoa ou da administração; a publicidade de qualquer ato administrativo constitui requisito de eficácia e moralidade; toda ausência injustificada do servidor é fator de desmoralização do serviço público.","Deveres (XIV), entre outros: desempenhar com rapidez e rendimento; ser probo, reto, leal e justo; ser cortês e atencioso; respeitar a hierarquia sem temor de representar contra comprometimento indevido; resistir a pressões ilegais; ser assíduo; comunicar imediatamente ao superior ato contrário ao interesse público; manter-se atualizado; apresentar-se com vestimentas adequadas.","Também é DEVER participar dos movimentos e estudos que se relacionem com a melhoria do exercício de suas funções, tendo por escopo a realização do bem comum.","Vedações (XV), entre outras: usar o cargo para obter favorecimento; prejudicar deliberadamente a reputação de colegas ou cidadãos; ser conivente com erro ou infração; usar artifícios para procrastinar; deixar de utilizar avanços técnicos; permitir perseguições e simpatias; pleitear ou receber presentes ou vantagens; alterar ou deturpar documentos; desviar servidor para atendimento particular; retirar documentos da repartição sem autorização; usar informações privilegiadas.","Mais vedações: apresentar-se embriagado no serviço ou fora dele habitualmente; dar seu concurso a instituição que atente contra a moral; exercer atividade profissional aética ou ligar seu nome a empreendimentos de cunho duvidoso.","Comissão de Ética deve ser criada em todos os órgãos e entidades da administração federal direta, indireta autárquica e fundacional, ou em qualquer órgão que exerça atribuições delegadas pelo poder público.","Penalidade aplicável pela Comissão de Ética: CENSURA, com fundamentação em parecer assinado por todos os integrantes e ciência do faltoso (XXII).","A Comissão fornece aos órgãos de pessoal os registros sobre a conduta ética do servidor, para instruir promoções e demais procedimentos da carreira.","Conceito amplo de servidor (XXIV): todo aquele que, por força de lei, contrato ou qualquer ato jurídico, preste serviços de natureza permanente, temporária ou excepcional, ainda que sem retribuição financeira, ligado direta ou indiretamente a órgão do poder estatal (autarquias, fundações, empresas públicas, sociedades de economia mista ou qualquer setor em que prevaleça o interesse do Estado)."],"pegadinhas":["Dizer que participar de estudos para melhoria do serviço é facultativo: é dever fundamental.","Afirmar que a Comissão de Ética pode aplicar advertência, suspensão ou demissão: pelo Código, a pena é a censura; as sanções disciplinares são da Lei 8.112/1990.","Dizer que basta cumprir os deveres no ambiente de trabalho para poder ligar o nome a empreendimentos de cunho duvidoso: continua vedado.","Restringir o conceito de servidor do Código aos estatutários efetivos e remunerados."],"base_legal":"Decreto 1.171/1994, Anexo (regras I a XXV).","questoes":["ADM-003","P22-015","P22-016","P22-017"]},{"id":"et-04","disciplina":"Ética no Serviço Público","topico":"Sistema de Gestão da Ética do Poder Executivo Federal (Decreto 6.029/2007)","recorrencia":"media","provas":[2022],"resumo":"O Decreto 6.029/2007 organiza o Sistema de Gestão da Ética do Executivo federal, com a Comissão de Ética Pública (CEP) no topo e as comissões de ética de cada órgão. Cai bastante: composição, competências da CEP e regras do procedimento ético.","pontos":["Integram o Sistema: a Comissão de Ética Pública (CEP); as Comissões de Ética do Decreto 1.171/1994; e as demais Comissões de Ética e equivalentes nos órgãos e entidades do Executivo federal.","Finalidades: integrar órgãos, programas e ações de promoção da ética; contribuir para políticas públicas com transparência e acesso à informação; compatibilizar normas de conduta; articular ações para padrões de conduta ética.","CEP: 7 brasileiros de idoneidade moral, reputação ilibada e notória experiência em administração pública, designados pelo Presidente da República, com mandato de 3 anos não coincidentes, permitida uma única recondução. A atuação não é remunerada e é considerada prestação de relevante serviço público.","Competências da CEP: atuar como instância CONSULTIVA do Presidente da República e dos Ministros de Estado em matéria de ética pública; administrar a aplicação do Código de Conduta da Alta Administração Federal; dirimir dúvidas de interpretação de suas normas e do Decreto 1.171/1994; coordenar, avaliar e supervisionar o Sistema.","Comissões de Ética setoriais: 3 membros titulares e respectivos suplentes, escolhidos entre servidores e empregados do quadro permanente, designados pelo dirigente máximo do órgão, para mandatos de 3 anos não coincidentes.","Qualquer cidadão, agente público, pessoa jurídica de direito privado, associação ou entidade de classe pode provocar a CEP ou a Comissão de Ética para apurar infração ética.","O procedimento é instaurado de ofício ou por denúncia fundamentada, com contraditório e ampla defesa; até a conclusão, os expedientes têm a chancela de 'reservado'.","As autoridades não podem alegar sigilo para deixar de prestar informações solicitadas pelas Comissões de Ética; os órgãos devem dar tratamento prioritário a essas solicitações.","Cabe às instâncias superiores dos órgãos e entidades garantir os recursos humanos, materiais e financeiros para que as Comissões cumpram suas atribuições: não há cobrança por pareceres.","Constatada falta ética, a comissão pode aplicar censura (ou, no caso da CEP e do Código de Conduta da Alta Administração, advertência para quem está no cargo e censura ética para quem já o deixou), sugerir exoneração de cargo ou função de confiança, encaminhar o caso à corregedoria/CGU e recomendar processo disciplinar; pode também firmar Acordo de Conduta Pessoal e Profissional (ACPP)."],"pegadinhas":["Dizer que a consulta de Ministro de Estado sobre ética deve ir à comissão setorial do ministério: a instância consultiva dos Ministros é a CEP.","Afirmar que autoridades podem invocar sigilo para negar informação às comissões.","Dizer que as comissões se mantêm com recursos próprios ou cobrança de pareceres.","Trocar a composição: CEP tem 7 membros designados pelo Presidente; comissões setoriais têm 3 titulares e suplentes."],"base_legal":"Decreto 6.029/2007; Decreto 1.171/1994; Código de Conduta da Alta Administração Federal (Exposição de Motivos de 2000).","questoes":["ADM-004","P22-018","P22-019","P22-020"]},{"id":"et-05","disciplina":"Ética no Serviço Público","topico":"Regime disciplinar da Lei 8.112/1990: deveres, proibições, acumulação e responsabilidades","recorrencia":"media","provas":[],"resumo":"O regime disciplinar da Lei 8.112/1990 diz o que o servidor federal deve fazer (art. 116), o que não pode fazer (art. 117), quando pode acumular cargos e como responde por seus atos. Cada proibição está ligada a uma penalidade específica: a banca adora essa ligação.","pontos":["Deveres (art. 116), entre outros: exercer com zelo e dedicação; ser leal às instituições; cumprir ordens superiores, EXCETO quando manifestamente ilegais; atender com presteza o público; levar irregularidades ao conhecimento da autoridade superior (ou de outra autoridade, se houver suspeita de envolvimento daquela); guardar sigilo; ser assíduo e pontual; tratar as pessoas com urbanidade; representar contra ilegalidade, omissão ou abuso de poder.","Proibições punidas com ADVERTÊNCIA (art. 117, I a VIII e XIX): ausentar-se do serviço sem autorização do chefe; retirar documento sem anuência; recusar fé a documentos públicos; opor resistência injustificada; promover manifestação de apreço ou desapreço no recinto; cometer a estranho encargo próprio; coagir subordinado a filiar-se a sindicato ou partido; manter sob chefia imediata cônjuge, companheiro ou parente até o 2º grau civil; recusar-se a atualizar dados cadastrais.","Proibições punidas com DEMISSÃO (art. 117, IX a XVI): valer-se do cargo para proveito pessoal ou de outrem; participar de gerência ou administração de sociedade privada ou exercer comércio (exceto como acionista, cotista ou comanditário); atuar como procurador ou intermediário junto a repartições (salvo benefícios previdenciários ou assistenciais de parentes até o 2º grau e de cônjuge ou companheiro); receber propina ou presente; aceitar emprego ou pensão de Estado estrangeiro; praticar usura; proceder com desídia; usar pessoal ou recursos da repartição em serviços particulares.","Proibições punidas com SUSPENSÃO (art. 117, XVII e XVIII): cometer a outro servidor atribuições estranhas ao cargo (salvo emergência e transitoriedade); exercer atividades incompatíveis com o cargo ou o horário de trabalho.","A vedação de gerência não se aplica à participação em conselhos de empresas em que a União tenha participação, nem durante licença para tratar de interesses particulares (observada a legislação de conflito de interesses).","Acumulação ilegal: detectada, o servidor é notificado para optar; a opção até o último dia do prazo de defesa configura boa-fé e vira pedido de exoneração do outro cargo; se comprovada má-fé, é demitido de ambos (apurada em rito sumário).","Responsabilidades civil, penal e administrativa são independentes entre si e podem se acumular (arts. 121 e 125).","A responsabilidade civil decorre de ato omissivo ou comissivo, doloso ou culposo, que cause prejuízo ao erário ou a terceiros; perante terceiros, o servidor responde em ação regressiva; a obrigação de reparar se estende aos sucessores até o limite da herança.","A responsabilidade administrativa é afastada se a absolvição criminal negar a existência do fato ou a sua autoria (art. 126). Absolvição por falta de provas não afasta a punição administrativa.","Nenhum servidor pode ser responsabilizado por dar ciência à autoridade superior ou competente de informação sobre crimes ou improbidade (art. 126-A)."],"pegadinhas":["Dizer que o servidor deve cumprir qualquer ordem superior: não as manifestamente ilegais.","Afirmar que ser acionista ou cotista é proibido: proibida é a gerência ou administração.","Trocar o grau de parentesco: nepotismo do art. 117, VIII, é até o 2º grau civil (diferente da SV 13, que vai até o 3º grau).","Dizer que qualquer absolvição penal impede a punição administrativa: só a que nega o fato ou a autoria."],"base_legal":"Lei 8.112/1990, arts. 116 a 126-A e 133.","questoes":["P22-036"]},{"id":"et-06","disciplina":"Ética no Serviço Público","topico":"Regime disciplinar da Lei 8.112/1990: penalidades, prescrição, sindicância e PAD","recorrencia":"media","provas":[],"resumo":"Quando o servidor federal comete infração, a administração é obrigada a apurar por sindicância ou processo administrativo disciplinar (PAD) e pode aplicar penalidades que vão da advertência à demissão. Prazos de prescrição, de PAD e de defesa são campeões de cobrança.","pontos":["Penalidades (art. 127): advertência, suspensão, demissão, cassação de aposentadoria ou disponibilidade, destituição de cargo em comissão e destituição de função comissionada.","Advertência: por escrito. Suspensão: até 90 dias (reincidência em faltas de advertência e outras violações não sujeitas a demissão); até 15 dias para quem recusar inspeção médica; pode ser convertida em multa de 50% por dia de remuneração, com o servidor em serviço.","Registros cancelados após 3 anos (advertência) e 5 anos (suspensão) de efetivo exercício sem nova infração, sem efeitos retroativos.","Demissão (art. 132), entre outros casos: crime contra a administração pública; abandono de cargo (ausência intencional por mais de 30 dias consecutivos); inassiduidade habitual (faltas sem causa justificada por 60 dias, interpoladamente, em 12 meses); improbidade administrativa; incontinência pública e conduta escandalosa na repartição; insubordinação grave; ofensa física em serviço (salvo legítima defesa); revelação de segredo; lesão aos cofres públicos; corrupção; acumulação ilegal; incisos IX a XVI do art. 117.","Demissão ou destituição por valer-se do cargo (117, IX) ou atuar como intermediário (117, XI) impede nova investidura em cargo federal por 5 anos (art. 137). O impedimento perpétuo do parágrafo único do art. 137 foi declarado inconstitucional pelo STF (ADI 2975).","Prescrição da ação disciplinar (art. 142): 5 anos (demissão, cassação, destituição de cargo em comissão); 2 anos (suspensão); 180 dias (advertência), contados da data em que o fato se tornou conhecido. Infrações também capituladas como crime seguem os prazos da lei penal.","A abertura de sindicância ou a instauração de PAD interrompe a prescrição; pela Súmula 635 do STJ, o prazo volta a correr por inteiro após 140 dias da interrupção.","Sindicância: prazo de 30 dias, prorrogável por igual período; pode resultar em arquivamento, advertência ou suspensão de até 30 dias, ou instauração de PAD. PAD é obrigatório quando cabível suspensão superior a 30 dias, demissão, cassação ou destituição.","PAD: comissão de 3 servidores ESTÁVEIS; o presidente deve ocupar cargo efetivo superior ou de mesmo nível, ou ter escolaridade igual ou superior à do indiciado. Prazo de 60 dias, prorrogável por igual período. Fases: instauração, inquérito (instrução, defesa e relatório) e julgamento (em 20 dias).","Afastamento preventivo: até 60 dias, prorrogável por igual prazo, sem prejuízo da remuneração. Defesa escrita: 10 dias (um indiciado), 20 dias (dois ou mais, prazo comum), 15 dias se citado por edital.","Rito sumário (acumulação ilegal, abandono de cargo e inassiduidade habitual): comissão de 2 servidores estáveis, conclusão em até 30 dias, prorrogável por até 15.","Súmula Vinculante 5: a falta de defesa técnica por advogado no PAD não ofende a Constituição. A revisão do PAD pode ocorrer a qualquer tempo, diante de fatos novos, mas não pode agravar a penalidade."],"pegadinhas":["Trocar os prazos de prescrição (5 anos / 2 anos / 180 dias) ou dizer que contam da data do fato: contam da data em que o fato se tornou conhecido.","Dizer que a sindicância pode resultar em demissão ou em suspensão de 60 dias.","Afirmar que o afastamento preventivo é sem remuneração ou que a comissão do PAD pode ter servidores não estáveis.","Confundir abandono (30 dias consecutivos) com inassiduidade habitual (60 dias interpolados em 12 meses).","Dizer que o PAD é nulo por falta de advogado."],"base_legal":"Lei 8.112/1990, arts. 127 a 182; Súmula Vinculante 5; Súmula 635 do STJ; STF, ADI 2975.","questoes":[]}]</script>
<script id="dados-textos" type="application/json">[{"id":"CB1A1-I","titulo":"Texto CB1A1-I (trabalho por conta própria e previdência)","fonte":"Internet: <www.cut.org.br> (com adaptações).","texto":"As pessoas que driblaram o desemprego trabalhando por conta própria desde o início da pandemia estão ganhando 31% menos em comparação com as que optaram por esse tipo de trabalho dois anos antes da covid-19. Entre estas, o rendimento médio mensal era de R$ 2.074, enquanto, entre aquelas, o rendimento é de R$ 1.434. Os dados, publicados no Boletim Emprego em Pauta, são do Departamento Intersindical de Estatística e Estudos Socioeconômicos (DIEESE) e foram obtidos a partir de uma análise comparativa que levou em conta os resultados referentes ao quarto trimestre de 2021 da Pesquisa Nacional por Amostra de Domicílio, realizada pelo Instituto Brasileiro de Geografia e Estatística.\n\nAo final de 2021, o número de trabalhadores por conta própria havia crescido 6,6%. A maioria não tem nenhuma proteção social, o que confirma a precarização do trabalho até mesmo para quem conseguiu se manter no mercado por conta própria. Três em cada quatro pessoas que trabalham por conta própria deixam de contribuir para a previdência social, ou seja, apenas 12,7% desses trabalhadores conseguem pagar a contribuição previdenciária para o Instituto Nacional do Seguro Social (INSS), para terem alguma segurança no futuro com a aposentadoria e outros benefícios. Entre os mais antigos, o percentual era de 58,3%.\n\nOs técnicos do DIEESE sugerem as seguintes hipóteses para explicar esse percentual menor de inscrição no cadastro nacional da pessoa jurídica (CNPJ) entre aqueles que começaram a trabalhar mais recentemente por conta própria: a baixa remuneração e a incerteza do negócio, assim como a preocupação com o endividamento que a regularização do trabalho pode gerar."},{"id":"UM-ANO-DE-MENOS","titulo":"Um ano de menos","fonte":"Rachel de Queiroz. Um ano de menos. In: O Cruzeiro, Rio de Janeiro, dez./1951 (com adaptações).","texto":"Ora, graças a Deus, lá se foi mais um. Um ano, quero dizer. Menos um na conta, mais uma prestação paga. E tem quem fique melancólico. Tem quem deteste ver à porta a cara do mascate em cada primeiro do mês, cobrando o vencido. Quando compram fiado, têm a sensação de que o homem deu de presente, e se esquecem das prestações, que serão, cada uma, uma facada. Nem se lembram dessa outra prestação que se paga a toda hora, tabela Price insaciável comendo juros de vida, todo dia um pouquinho mais; um cabelo que fica branco, mais um milímetro de pele que enruga, uma camada infinitesimal acrescentada à artéria que endurece, um pouco mais de fadiga no coração, que também é carne e se cansa com aquele bater sem folga. E o olho que enxerga menos, e o dente que caria e trata de abrir lugar primeiro para o pivô, depois para a dentadura completa.\n\nO engraçado é que muito poucos reconhecem isso. Convencem-se de que a morte chega de repente, que não houve desgaste preparatório, e nos apanha em plena flor da juventude, ou em plena frutificação da maturidade; se imaginam uma rosa que foi colhida em plena beleza desabrochada. Mas a rosa, se a não apanha o jardineiro, que será ela no dia seguinte, após o mormaço do sol e a friagem do sereno? A hora da colheita não interessa ― de qualquer modo, o destino dela era murchar, perder as pétalas, secar, sumir-se.\n\nA gente, porém, não pode pensar muito nessas coisas. Tem que pensar em alegrias, sugestionar-se, sugestionar os outros. Vamos dar festas, vamos aguardar o ano novo com esperanças e risadas e beijos congratulatórios. Desejar uns aos outros saúde, riqueza e venturas. Fazer de conta que não se sabe; sim, como se a gente nem desconfiasse. Tudo que nos espera: dentro do corpo o que vai sangrar, doer, inflamar, envelhecer. As cólicas de fígado, as dores de cabeça, as azias, os reumatismos, as gripes com febre, quem sabe o tifo, o atropelamento. Tudo escondido, esperando. Sem falar nos que vão ficar tuberculosos, nas mulheres que vão fazer cesariana. Os que vão perder o emprego, os que se verão doidos com as dívidas, os que hão de esperar nas filas ― que seremos quase todos. E os que, não morrendo, hão de ver a morte lhes entrando de casa adentro, carregando o filho, pai, amor, amizade. As missas de sétimo dia, as cartas de rompimento, os bilhetes de despedida. E até guerra, quem sabe? Desgostos, desgostos de toda espécie. Qual de nós passa um dia, dois dias, sem um desgosto? Quanto mais um ano!"}]</script>
<script>
(function () {
  "use strict";
  const QUESTOES = JSON.parse(document.getElementById("dados-questoes").textContent);
  const CRONO = JSON.parse(document.getElementById("dados-cronograma").textContent);
  const TEORIA = JSON.parse(document.getElementById("dados-teoria").textContent);
  const TEXTOS = Object.fromEntries(JSON.parse(document.getElementById("dados-textos").textContent).map(t => [t.id, t]));
  const QMAP = Object.fromEntries(QUESTOES.map(q => [q.id, q]));
  const INTERVALOS = { 1: 1, 2: 3, 3: 7, 4: 14, 5: 30 };
  const ORDEM_DISC = ["Direito Previdenciário", "Português", "Raciocínio Lógico-Matemático", "Informática", "Direito Constitucional", "Direito Administrativo", "Ética no Serviço Público"];
  // tópicos de teoria ligados a cada questão (para enriquecer os dias do cronograma)
  const TOPICOS_DA_Q = {};
  TEORIA.forEach(t => (t.questoes || []).forEach(id => (TOPICOS_DA_Q[id] = TOPICOS_DA_Q[id] || []).push(t)));
  const DE_PROVA = id => !!(QMAP[id] && QMAP[id].prova);
  const ORDEM_REC = { alta: 0, media: 1, baixa: 2 };
  const LOCAL_KEY = "estudo-inss-estado-v1";

  // ---------- estado ----------
  let estado = vazio();
  let docRef = null;
  let modoSync = "local"; // local | nuvem | erro
  let salvando = false, sujo = false;
  let aba = "hoje";
  let sessao = null; // { titulo, fila:[ids], i, fase:'intro'|'questao'|'feedback'|'fim', acertos, erros, resposta, dia, revisao }
  let filtroDisc = "Todas";
  let filtroOrigem = "todas"; // todas | prova | autorais
  let teoriaDisc = "Direito Previdenciário";
  let teoriaAberto = null;

  function vazio() { return { cartoes: {}, dias: {}, log: {}, stats: {}, lidos: {} }; }
  function normalizar(d) {
    const v = vazio();
    // os dados vindos da nuvem chegam congelados (somente leitura): trabalhar sempre numa cópia
    try { d = JSON.parse(JSON.stringify(d || {})); } catch (e) { d = {}; }
    if (d && typeof d === "object") {
      for (const k of Object.keys(v)) if (d[k] && typeof d[k] === "object") v[k] = d[k];
    }
    return v;
  }
  function hojeISO(off = 0) {
    const d = new Date(); d.setDate(d.getDate() + off);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function lerLocal() { try { const s = localStorage.getItem(LOCAL_KEY); return s ? normalizar(JSON.parse(s)) : null; } catch (e) { return null; } }
  function gravarLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(estado)); } catch (e) {} }

  function setSync(tipo, txt) {
    const el = document.getElementById("sync");
    el.className = "sync " + (tipo === "nuvem" ? "ok" : "warn");
    el.querySelector("span").textContent = txt;
  }

  async function salvar() {
    gravarLocal();
    if (!docRef) return;
    if (salvando) { sujo = true; return; }
    salvando = true;
    try {
      do { sujo = false; await docRef.set(JSON.parse(JSON.stringify(estado))); } while (sujo);
      setSync("nuvem", "Salvo na nuvem");
    } catch (e) {
      setSync("erro", "Salvo só neste aparelho");
    } finally { salvando = false; }
  }

  async function conectar() {
    const local = lerLocal();
    if (local) estado = local;
    render();
    const c = window.claude;
    if (!c || typeof c.use !== "function") { setSync("local", "Salvo só neste aparelho"); return; }
    const timer = setTimeout(() => setSync("erro", "Sem conexão: salvando no aparelho"), 10000);
    try {
      const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
      const id = user ? await user.id() : null;
      if (!db || !id) { clearTimeout(timer); setSync("local", "Entre no claude.ai para salvar na nuvem"); return; }
      docRef = db.doc("data/users/" + id + "/estado");
      let primeira = true;
      docRef.onSnapshot(snap => {
        if (!snap.metadata.fromCache) clearTimeout(timer);
        if (snap.exists) {
          estado = normalizar(snap.data());
          gravarLocal();
        } else if (primeira && !snap.metadata.fromCache && local && Object.keys(local.log).length) {
          salvar(); // leva para a nuvem o que já estava no aparelho
        }
        primeira = false;
        if (!snap.metadata.fromCache) setSync("nuvem", "Salvo na nuvem");
        if (!sessao || sessao.fase === "fim") render(); else atualizarBadge();

  // ---------- lógica de estudo ----------
  function pendentesHoje() {
    const h = hojeISO();

  }
  function registrar(id, acertou) {
    const q = QMAP[id];
    const c = estado.cartoes[id] || { cx: 1, prox: hojeISO(), a: 0, e: 0, seq: 0 };
    if (acertou) { c.a++; c.seq++; c.cx = Math.min(c.cx + 1, 5); }
    else { c.e++; c.seq = 0; c.cx = 1; }
    c.prox = hojeISO(INTERVALOS[c.cx]);
    estado.cartoes[id] = c;
    const h = hojeISO();
    const l = estado.log[h] || { a: 0, e: 0 };
    acertou ? l.a++ : l.e++;
    estado.log[h] = l;
    const s = estado.stats[q.disciplina] || { a: 0, e: 0 };

  function proximoDia() {

      return embaralhar([...new Set([...semana, ...pendentesHoje()])]);
    }
    const base = d.questoes.filter(id => QMAP[id]);
    // acrescenta itens reais da prova 2022 sobre o mesmo assunto
    const extras = [];
    topicosDoDia(d).forEach(t => (t.questoes || []).forEach(id => { if (DE_PROVA(id) && !base.includes(id) && !extras.includes(id)) extras.push(id); }));
    return base.concat(extras.slice(0, 8));
  }
  function topicosDoDia(d) {

    return n;
  }

          h("span", { class: "verdict" }, (s.acertos - s.erros) + " pontos"),
          h("span", { class: "small" }, "Certos menos errados. Chutar quando não sabe custa ponto: use o branco.")) : null,
        d && !estado.dias[d.dia] ? h("button", { class: "btn primary block", onclick: () => { estado.dias[d.dia] = hojeISO(); salvar(); sessao = null; aba = "hoje"; toast("Dia " + d.dia + " concluído."); render(); } }, "Marcar dia " + d.dia + " como concluído") : null,
        h("button", { class: "btn block", onclick: () => { sessao = null; render(); } }, "Voltar")
      ));
      return;
    }
    const id = s.fila[s.i], q = QMAP[id];
    view.append(h("div", { class: "sessbar" },
      h("button", { class: "linkbtn", onclick: () => { sessao = s.acertos + s.erros ? Object.assign(s, { fase: "fim" }) : null; render(); } }, "✕ Sair"),
      h("div", { class: "progress" }, h("div", { style: "width:" + (s.i / s.fila.length * 100) + "%" })),
      h("span", { class: "small muted mono" }, (s.i + 1) + "/" + s.fila.length)
    ));
    const card = h("section", { class: "card ficha" },
      h("div", { class: "meta" }, h("span", { class: "eyebrow" }, q.disciplina), q.prova ? h("span", { class: "pill alta" }, "Caiu na prova " + q.prova) : pillRec(q.recorrencia)),
      h("h2", {}, q.assunto)
    );
    if (q.origem) card.append(h("span", { class: "small muted mono" }, q.origem));
    if (q.texto_base && TEXTOS[q.texto_base] && s.fase !== "intro") {
      const tx = TEXTOS[q.texto_base];
      card.append(h("details", { class: "box flash", open: s.textoAberto === q.texto_base ? "" : null, ontoggle: e => { if (e.target.open) s.textoAberto = q.texto_base; } },
        h("summary", { class: "linkbtn" }, "Ler o texto: " + (tx.titulo || tx.id)),
        ...tx.texto.split(/\n\n+/).map(p => h("p", { style: "margin:8px 0 0" }, p)),
        tx.fonte ? h("p", { class: "small muted", style: "margin:8px 0 0" }, tx.fonte) : null));
    }
    view.append(card);

    if (s.fase === "intro") {
      card.append(
        h("div", { class: "box flash" }, h("span", { class: "eyebrow" }, "Resumo flash"), h("div", {}, q.resumo_flash || "Sem resumo cadastrado.")),
        h("div", { class: "box dica" }, h("span", { class: "eyebrow" }, "Atenção à pegadinha"), h("div", {}, q.dica_padrao || "Sem dica cadastrada.")),
        h("button", { class: "btn primary block", onclick: () => { s.fase = "questao"; render(); window.scrollTo(0, 0); } }, "Ir para a questão")
      );
      return;
    }
    card.append(
      h("div", { class: "row" }, h("span", { class: "mono muted" }, id), h("span", { class: "small muted" }, "Julgue o item: Certo ou Errado")),
      h("div", { class: "enunciado" }, q.enunciado)
    );
    if (s.fase === "questao") {
      card.append(h("div", { class: "answer" },
        h("button", { class: "btn c", onclick: () => responder("Certo") }, "CERTO"),
        h("button", { class: "btn e", onclick: () => responder("Errado") }, "ERRADO")
      ));
      if (s.cebraspe) card.append(h("button", { class: "btn block", onclick: () => { s.brancos = (s.brancos || 0) + 1; proxima(); } }, "Deixar em branco (não sei)"));
      if (!q.resumo_flash) return;
      const det = h("details", {}, h("summary", { class: "linkbtn" }, "Ver resumo antes de responder"),
        h("div", { class: "box flash", style: "margin-top:8px" }, h("div", {}, q.resumo_flash)));
      card.append(det);
      return;
    }
    const ok = s.resposta === q.gabarito;
    view.append(h("section", { class: "card" },
      h("div", { class: "box " + (ok ? "ok" : "bad") },
        h("span", { class: "verdict" }, ok ? "Correto" : "Incorreto"),
        h("span", {}, "Você marcou " + s.resposta + ". Gabarito: " + q.gabarito + ".")),
      h("div", { class: "dl" },
        h("div", {}, h("b", {}, "Comentário"), q.comentario),
        h("div", {}, h("b", {}, "Legislação"), q.legislacao),
        h("div", { class: "box dica" }, h("span", { class: "eyebrow" }, "Pegadinha da banca"), h("div", {}, q.pegadinha))
      ),
      h("button", { class: "btn primary block", onclick: proxima }, s.i + 1 < s.fila.length ? "Próxima questão" : "Ver resultado")
    ));
  }

  function responder(r) {
    const s = sessao, q = QMAP[s.fila[s.i]];
    s.resposta = r; s.fase = "feedback";
    const ok = r === q.gabarito;
    ok ? s.acertos++ : s.erros++;
    try { registrar(q.id, ok); } catch (e) { setSync("erro", "Não salvou esta resposta"); }
    render();
    const fb = view.querySelector(".box.ok, .box.bad");
    if (fb) fb.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function proxima() {
    const s = sessao;
    s.i++; s.resposta = null;
    if (s.i >= s.fila.length) s.fase = "fim";
    else s.fase = s.semResumo ? "questao" : "intro";
    render(); window.scrollTo(0, 0);
  }

  // ---------- tema (Automático → Claro → Escuro), lembrado neste aparelho ----------
  const TEMAS = {
    auto: { rotulo: "Auto", icone: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>' },
    claro: { rotulo: "Claro", icone: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' },
    escuro: { rotulo: "Escuro", icone: '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>' }
  };
  function aplicarTema(t) {
    if (!TEMAS[t]) t = "auto";
    if (t === "auto") document.documentElement.removeAttribute("data-tema");
    else document.documentElement.setAttribute("data-tema", t);
    const b = document.getElementById("tema");
    b.innerHTML = TEMAS[t].icone + "<span>" + TEMAS[t].rotulo + "</span>";
    b.setAttribute("aria-label", "Tema: " + TEMAS[t].rotulo + ". Toque para mudar");
    b.dataset.t = t;
  }
  let temaSalvo = "auto";
  try { temaSalvo = localStorage.getItem("estudo-inss-tema") || "auto"; } catch (e) {}
  aplicarTema(temaSalvo);
  document.getElementById("tema").addEventListener("click", () => {
    const ordem = ["auto", "claro", "escuro"];
    const prox = ordem[(ordem.indexOf(document.getElementById("tema").dataset.t) + 1) % 3];
    aplicarTema(prox);
    try { localStorage.setItem("estudo-inss-tema", prox); } catch (e) {}
    toast("Tema: " + (prox === "auto" ? "automático (segue o celular)" : TEMAS[prox].rotulo.toLowerCase()));
  });

  document.getElementById("tabs").addEventListener("click", e => {
    const b = e.target.closest(".tab"); if (!b) return;
    sessao = null; // respostas já ficam salvas a cada questão
    aba = b.dataset.tab;
    render(); window.scrollTo(0, 0);
  });

  conectar();
})();
</script>
</body></html>
