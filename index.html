ags":["custeio","contribuição patronal"]},{"id":"DP-033","disciplina":"Direito Previdenciário","assunto":"Custeio - alíquota progressiva do segurado empregado","enunciado":"A contribuição do segurado empregado, do doméstico e do trabalhador avulso é calculada mediante aplicação de alíquota progressiva, incidente de forma não cumulativa sobre o salário de contribuição, de acordo com faixas salariais definidas em ato do Poder Executivo, reajustadas anualmente.","gabarito":"Certo","comentario":"Correto. Desde a Lei 13.982/2020, a contribuição do empregado/doméstico/avulso segue tabela progressiva por faixas salariais (semelhante à do Imposto de Renda), reajustada anualmente, e não mais uma alíquota única sobre todo o salário.","legislacao":"Lei 8.212/1991, art. 20, com redação dada pela Lei 13.982/2020.","pegadinha":"Pode afirmar que a alíquota é única e fixa (ex.: sempre 11%) sobre todo o salário: hoje a contribuição do empregado segue uma tabela progressiva por faixas.","resumo_flash":"Desde 2020, a contribuição do empregado/doméstico/avulso não usa mais uma alíquota única: é uma tabela progressiva por faixas de salário (parecido com o Imposto de Renda), reajustada todo ano por ato do Poder Executivo.","dica_padrao":"Se a questão falar em 'alíquota única de X%' sobre o salário do empregado, desconfie: hoje a lógica é de faixas progressivas, não taxa fixa.","recorrencia":"alta","tags":["custeio","alíquota progressiva"]},{"id":"P22-001","disciplina":"Português","assunto":"Interpretação de texto: extrapolação","enunciado":"Em relação às ideias do texto CB1A1-I: conclui-se da leitura do texto que os benefícios da previdência social no Brasil são pouco vantajosos para os trabalhadores autônomos, em razão do possível endividamento decorrente da regularização do trabalho e da baixa remuneração prevista para a aposentadoria.","texto_base":"CB1A1-I","gabarito":"Errado","comentario":"O texto não avalia se os benefícios previdenciários são vantajosos. A baixa remuneração e o medo de endividamento aparecem como hipóteses do DIEESE para explicar a menor inscrição no CNPJ entre os novos trabalhadores por conta própria. E a 'baixa remuneração' citada é a renda atual desses trabalhadores, não o valor da aposentadoria. O item extrapola e distorce o texto.","legislacao":"Não se aplica (interpretação de texto).","pegadinha":"Usa palavras que estão no texto (endividamento, regularização, baixa remuneração), mas liga essas palavras a uma conclusão que o texto não tira: a de que a previdência seria pouco vantajosa.","resumo_flash":"Em 'conclui-se do texto', só vale o que o texto afirma ou permite deduzir com segurança. Se o item acrescenta uma opinião ou relação de causa que o autor não fez, é extrapolação.","dica_padrao":"Cebraspe monta itens de interpretação com vocabulário do próprio texto e muda a relação entre as ideias (causa, consequência, a quem se refere). Confira a quem e a que cada informação se refere no original.","recorrencia":"alta","tags":["interpretação","extrapolação","texto CB1A1-I"],"origem":"INSS 2022 · Cebraspe · Técnico · item 1","prova":2022,"desatualizada":false},{"id":"P22-002","disciplina":"Português","assunto":"Interpretação de texto: compreensão de dados","enunciado":"De acordo com as informações do texto CB1A1-I, o rendimento médio mensal das pessoas que passaram a trabalhar por conta própria desde o início da pandemia de covid-19 é menor que o rendimento que tinham as pessoas que optaram por esse tipo de trabalho dois anos antes dessa pandemia.","texto_base":"CB1A1-I","gabarito":"Certo","comentario":"O texto diz que quem começou a trabalhar por conta própria na pandemia ganha 31% menos que quem começou dois anos antes. Pelos pronomes 'estas' (o grupo mencionado por último, os mais antigos: R$ 2.074) e 'aquelas' (o grupo mencionado primeiro, os da pandemia: R$ 1.434), o rendimento dos novos é menor. O item reescreve corretamente essa informação.","legislacao":"Não se aplica (interpretação de texto).","pegadinha":"O leitor pode se confundir com 'estas' e 'aquelas' e trocar os valores entre os grupos.","resumo_flash":"'Este/esta' retoma o termo mais próximo (citado por último); 'aquele/aquela' retoma o mais distante (citado primeiro). Aqui: estas = quem começou antes da covid (R$ 2.074); aquelas = quem começou na pandemia (R$ 1.434).","dica_padrao":"Quando o texto usa 'este' x 'aquele' para retomar dois termos, a banca testa se você sabe qual é qual. Mais próximo = este; mais distante = aquele.","recorrencia":"alta","tags":["interpretação","pronomes demonstrativos","texto CB1A1-I"],"origem":"INSS 2022 · Cebraspe · Técnico · item 2","prova":2022,"desatualizada":false},{"id":"P22-003","disciplina":"Português","assunto":"Interpretação de texto: argumentação","enunciado":"No texto CB1A1-I, os dados indicativos de que a maioria das pessoas que trabalha por conta própria não contribui para a previdência social são utilizados como argumento para comprovar a precarização do trabalho, no Brasil, desde o início da pandemia de covid-19 até o final de 2021.","texto_base":"CB1A1-I","gabarito":"Certo","comentario":"O segundo parágrafo diz que a maioria não tem proteção social, 'o que confirma a precarização do trabalho', e em seguida apresenta o dado: três em cada quatro não contribuem para a previdência. O dado sobre a falta de contribuição serve, portanto, de argumento para a tese da precarização no período analisado (da pandemia até o fim de 2021).","legislacao":"Não se aplica (interpretação de texto).","pegadinha":"O item parece exagerar com 'comprovar' e com o recorte temporal, levando o candidato a marcar Errado por excesso de desconfiança.","resumo_flash":"Em textos argumentativos, os dados numéricos costumam sustentar uma tese. Identifique a tese (aqui, a precarização do trabalho) e veja quais dados o autor usa para apoiá-la.","dica_padrao":"Nem todo item com palavra forte ('comprovar', 'confirmar') está errado. Confira se o próprio texto usa um verbo equivalente: aqui o texto diz 'confirma'.","recorrencia":"alta","tags":["interpretação","argumentação","texto CB1A1-I"],"origem":"INSS 2022 · Cebraspe · Técnico · item 3","prova":2022,"desatualizada":false},{"id":"P22-004","disciplina":"Português","assunto":"Crase e regência: reescrita","enunciado":"Com relação a aspectos linguísticos do texto CB1A1-I, cujo primeiro período é “As pessoas que driblaram o desemprego trabalhando por conta própria desde o início da pandemia estão ganhando 31% menos em comparação com as que optaram por esse tipo de trabalho dois anos antes da covid-19”: estariam mantidos os sentidos e a correção gramatical do texto caso se substituísse, no primeiro período do texto, o segmento “em comparação com as” por quando comparadas as.","texto_base":"CB1A1-I","gabarito":"Errado","comentario":"'Comparadas' rege a preposição 'a' (ou 'com'): comparadas a algo. Com 'quando comparadas', a preposição 'a' se junta ao artigo 'as' (as [pessoas] que optaram...), e o certo seria 'quando comparadas às'. Sem o acento grave, a reescrita fica gramaticalmente incorreta.","legislacao":"Não se aplica (gramática: regência nominal/verbal e crase).","pegadinha":"Tirar o acento da crase numa reescrita que, à primeira vista, parece manter o sentido.","resumo_flash":"Crase = preposição 'a' + artigo 'a(s)'. Ocorre quando a palavra anterior exige a preposição 'a' (comparar a, referir-se a, ir a) e a palavra seguinte é feminina e aceita artigo.","dica_padrao":"Em itens de reescrita, confira três coisas: sentido, regência (a preposição exigida) e sinais como a crase. Um único acento faltando torna o item Errado.","recorrencia":"alta","tags":["crase","regência","reescrita","texto CB1A1-I"],"origem":"INSS 2022 · Cebraspe · Técnico · item 4","prova":2022,"desatualizada":false},{"id":"P22-005","disciplina":"Português","assunto":"Classes de palavras: particípio em locução verbal","enunciado":"Com relação a aspectos linguísticos do texto CB1A1-I, no qual se leem os trechos “Os dados [...] foram obtidos a partir de uma análise comparativa” e “Ao final de 2021, o número de trabalhadores por conta própria havia crescido 6,6%”: o vocábulo “obtidos” (terceiro período do primeiro parágrafo) e o vocábulo “crescido” (primeiro período do segundo parágrafo) constituem adjetivos nos contextos sintáticos em que se inserem, haja vista a concordância dos referidos termos, respectivamente, com “dados” (terceiro período do primeiro parágrafo) e com “número” (primeiro período do segundo parágrafo).","texto_base":"CB1A1-I","gabarito":"Errado","comentario":"Os dois particípios são formas verbais, não adjetivos. 'Foram obtidos' é uma locução verbal na voz passiva (ser + particípio), e 'havia crescido' é um tempo composto (haver + particípio). Além disso, em tempo composto o particípio fica invariável: 'crescido' não concorda com 'número'.","legislacao":"Não se aplica (gramática: classes de palavras e vozes verbais).","pegadinha":"A concordância de 'obtidos' com 'dados' faz parecer um adjetivo; e a banca diz que 'crescido' concorda com 'número', o que é falso: o particípio de tempo composto não varia.","resumo_flash":"Particípio após 'ser' forma voz passiva e concorda com o sujeito (os dados foram obtidos). Particípio após 'ter/haver' forma tempo composto e fica invariável (as vendas haviam crescido). Nos dois casos é verbo, não adjetivo.","dica_padrao":"Cebraspe junta uma afirmação parcialmente verdadeira (concordância de 'obtidos') com outra falsa ('crescido' concorda) e uma classificação errada (adjetivo). Basta uma parte errada para o item ser Errado.","recorrencia":"alta","tags":["classes de palavras","particípio","voz passiva","tempo composto"],"origem":"INSS 2022 · Cebraspe · Técnico · item 5","prova":2022,"desatualizada":false},{"id":"P22-006","disciplina":"Português","assunto":"Concordância verbal: porcentagem","enunciado":"Com relação a aspectos linguísticos do texto CB1A1-I, cujo segundo parágrafo termina com o período “Entre os mais antigos, o percentual era de 58,3%”: seria mantida a correção gramatical desse período caso a forma verbal “era” fosse flexionada no plural — eram —, dada a possibilidade de concordância verbal com a expressão de porcentagem que aparece logo em seguida.","texto_base":"CB1A1-I","gabarito":"Errado","comentario":"O sujeito de 'era' é 'o percentual', que está no singular; '58,3%' não é sujeito, mas parte do predicado ('de 58,3%'). Por isso o verbo deve ficar no singular. A regra que permite concordar com o número percentual só vale quando a porcentagem é o próprio sujeito (ex.: '58,3% dos trabalhadores contribuem/contribui').","legislacao":"Não se aplica (gramática: concordância verbal).","pegadinha":"A banca invoca uma regra real (concordância com porcentagem) num caso em que ela não se aplica, porque a porcentagem não é o sujeito.","resumo_flash":"Para concordar o verbo, ache primeiro o sujeito. Com porcentagem como sujeito, o verbo pode concordar com o número ou com o termo que o acompanha; mas se o sujeito for outra palavra ('o percentual', 'o índice'), concorde com ela.","dica_padrao":"Itens de concordância costumam citar uma regra verdadeira aplicada ao caso errado. Antes de aceitar a 'possibilidade de concordância', confirme qual é o sujeito.","recorrencia":"alta","tags":["concordância verbal","porcentagem","sujeito"],"origem":"INSS 2022 · Cebraspe · Técnico · item 6","prova":2022,"desatualizada":false},{"id":"P22-007","disciplina":"Português","assunto":"Coesão e coerência: deslocamento de termo","enunciado":"Com relação a aspectos linguísticos do texto CB1A1-I, cujo último parágrafo contém o trecho “[...] entre aqueles que começaram a trabalhar mais recentemente por conta própria: a baixa remuneração e a incerteza do negócio [...]”: estaria preservada a coerência das ideias do último parágrafo do texto caso o segmento “mais recentemente” fosse deslocado para imediatamente depois do termo “própria”.","texto_base":"CB1A1-I","gabarito":"Certo","comentario":"Com o deslocamento, o trecho ficaria 'aqueles que começaram a trabalhar por conta própria mais recentemente'. O adjunto adverbial de tempo continua modificando 'começaram a trabalhar' e o sentido não muda. Adjuntos adverbiais têm mobilidade na frase, desde que não criem ambiguidade.","legislacao":"Não se aplica (gramática: termos acessórios e coesão).","pegadinha":"Esperar que todo deslocamento altere o sentido e marcar Errado por reflexo.","resumo_flash":"O adjunto adverbial (tempo, modo, lugar) pode, em geral, mudar de lugar na oração sem alterar o sentido, desde que continue ligado ao mesmo verbo.","dica_padrao":"Ao avaliar um deslocamento, pergunte: o termo continua se referindo à mesma palavra? Se sim e não surgir ambiguidade, a coerência é mantida.","recorrencia":"alta","tags":["coerência","deslocamento","adjunto adverbial"],"origem":"INSS 2022 · Cebraspe · Técnico · item 7","prova":2022,"desatualizada":false},{"id":"P22-008","disciplina":"Português","assunto":"Interpretação de texto: ironia e ponto de vista","enunciado":"Acerca das ideias do texto “Um ano de menos”, de Rachel de Queiroz: no texto, a autora incentiva uma postura otimista durante a passagem de ano, apesar de manifestar uma visão pessimista quanto ao porvir.","texto_base":"UM-ANO-DE-MENOS","gabarito":"Certo","comentario":"A crônica descreve o futuro como desgaste, doenças, perdas e desgostos (visão pessimista do porvir). Mesmo assim, no último parágrafo, a autora diz que 'a gente não pode pensar muito nessas coisas' e propõe 'vamos dar festas', 'aguardar o ano novo com esperanças', 'desejar uns aos outros saúde'. Ou seja, ela incentiva o otimismo, ainda que como um 'fazer de conta'. O gabarito oficial considerou correta essa leitura.","legislacao":"Não se aplica (interpretação de texto).","pegadinha":"O tom irônico do texto pode levar o candidato a achar que a autora não incentiva nada de otimista. A banca considerou o incentivo explícito ('vamos dar festas') como suficiente.","resumo_flash":"Uma crônica pode combinar uma visão (pessimista sobre o futuro) com uma recomendação oposta (comemorar mesmo assim). Identifique o que o autor pensa e o que ele propõe fazer.","dica_padrao":"Em itens com 'apesar de', a banca junta duas ideias contrastantes. Confira cada metade separadamente no texto.","recorrencia":"alta","tags":["interpretação","crônica","ironia","Rachel de Queiroz"],"origem":"INSS 2022 · Cebraspe · Técnico · item 8","prova":2022,"desatualizada":false},{"id":"P22-009","disciplina":"Português","assunto":"Crase: locução adverbial","enunciado":"Acerca de aspectos linguísticos do texto “Um ano de menos”, cujo primeiro parágrafo contém o período “Tem quem deteste ver à porta a cara do mascate em cada primeiro do mês, cobrando o vencido”: o emprego do sinal indicativo de crase no vocábulo “à”, em “à porta”, justifica-se pela combinação de dois fatores: a regência do verbo “ver” e o gênero feminino da palavra “porta”.","texto_base":"UM-ANO-DE-MENOS","gabarito":"Errado","comentario":"'Ver' é transitivo direto e seu objeto é 'a cara do mascate'; ele não exige preposição. A crase em 'à porta' se explica por se tratar de locução adverbial de lugar formada por palavra feminina (estar/ver à porta = junto à porta). Portanto, a justificativa pela regência de 'ver' está errada.","legislacao":"Não se aplica (gramática: crase).","pegadinha":"Dar uma justificativa falsa (regência de 'ver') para uma crase que está correta no texto.","resumo_flash":"Locuções adverbiais, prepositivas e conjuntivas com palavra feminina levam crase: à porta, às vezes, à noite, à medida que, à custa de. Nesses casos a crase não depende do verbo.","dica_padrao":"Cebraspe muitas vezes pergunta o MOTIVO da crase, não se ela está certa. A crase pode estar correta e a justificativa errada.","recorrencia":"alta","tags":["crase","locução adverbial","regência"],"origem":"INSS 2022 · Cebraspe · Técnico · item 9","prova":2022,"desatualizada":false},{"id":"P22-010","disciplina":"Português","assunto":"Semântica: enumeração e progressão","enunciado":"Acerca de aspectos linguísticos do texto “Um ano de menos”, cujo segundo parágrafo termina com “A hora da colheita não interessa ― de qualquer modo, o destino dela era murchar, perder as pétalas, secar, sumir-se”: no trecho “murchar, perder as pétalas, secar, sumir-se”, os verbos, dispostos em enumeração, expressam uma sequência lógica de acontecimentos.","texto_base":"UM-ANO-DE-MENOS","gabarito":"Certo","comentario":"Os verbos descrevem, em ordem, o processo de decadência da rosa: primeiro murcha, depois perde as pétalas, seca e por fim desaparece. A enumeração segue uma progressão lógica e temporal (gradação), reforçando a ideia do desgaste contínuo da vida.","legislacao":"Não se aplica (semântica/estilística).","pegadinha":"Levar o candidato a pensar que é uma enumeração aleatória de sinônimos.","resumo_flash":"Enumeração em gradação apresenta termos em ordem crescente ou numa sequência de etapas. Veja se a ordem dos termos poderia ser trocada sem prejudicar o sentido: se não puder, há sequência lógica.","dica_padrao":"Em itens sobre enumeração, teste a ordem: se faz sentido como etapas de um processo, a banca costuma considerar 'sequência lógica' correta.","recorrencia":"alta","tags":["semântica","gradação","enumeração"],"origem":"INSS 2022 · Cebraspe · Técnico · item 10","prova":2022,"desatualizada":false},{"id":"P22-011","disciplina":"Português","assunto":"Funções do 'se': pronome integrante e partícula apassivadora","enunciado":"Acerca de aspectos linguísticos do texto “Um ano de menos”: em ambas as orações presentes no trecho “Nem se lembram dessa outra prestação que se paga a toda hora” (sétimo período do primeiro parágrafo), a intenção de indefinir quem realiza as ações de lembrar e pagar é materializada por meio da estratégia de indeterminação do sujeito sintático pelo emprego do pronome “se”.","texto_base":"UM-ANO-DE-MENOS","gabarito":"Errado","comentario":"Em 'Nem se lembram', o 'se' é parte integrante do verbo pronominal 'lembrar-se', e o sujeito é desinencial ('eles', verbo na 3ª pessoa do plural). Em 'que se paga', o 'se' é partícula apassivadora: voz passiva sintética com sujeito 'que' (= a prestação), que é paga. Em nenhuma das duas o 'se' é índice de indeterminação do sujeito.","legislacao":"Não se aplica (gramática: funções do 'se').","pegadinha":"Atribuir a mesma função ao 'se' nas duas orações, quando cada uma tem uma função diferente e nenhuma é de indeterminação.","resumo_flash":"Índice de indeterminação do sujeito: 'se' com verbo intransitivo, transitivo indireto ou de ligação, sempre na 3ª pessoa do singular (precisa-se de ajudantes). Partícula apassivadora: 'se' com verbo transitivo direto, que concorda com o sujeito (vendem-se casas). Pronome integrante: faz parte de verbos pronominais (lembrar-se, queixar-se).","dica_padrao":"Item com 'em ambas' exige que a afirmação valha para os dois casos. Se um deles falhar, o item é Errado. Teste cada ocorrência do 'se' separadamente.","recorrencia":"alta","tags":["funções do se","partícula apassivadora","indeterminação do sujeito","verbo pronominal"],"origem":"INSS 2022 · Cebraspe · Técnico · item 11","prova":2022,"desatualizada":false},{"id":"P22-012","disciplina":"Português","assunto":"Coesão referencial: pronomes","enunciado":"Da leitura do segundo parágrafo do texto “Um ano de menos”: “Mas a rosa, se a não apanha o jardineiro, que será ela no dia seguinte, após o mormaço do sol e a friagem do sereno? A hora da colheita não interessa ― de qualquer modo, o destino dela era murchar, perder as pétalas, secar, sumir-se”, entende-se que o pronome “ela”, em “dela” (último período), refere-se a “rosa” (penúltimo período).","texto_base":"UM-ANO-DE-MENOS","gabarito":"Certo","comentario":"O último período continua a reflexão sobre a rosa: o destino dela (da rosa) era murchar, perder as pétalas, secar, sumir-se. Só a rosa pode perder pétalas e murchar, o que confirma a retomada. O pronome é, portanto, um elemento de coesão que retoma 'rosa'.","legislacao":"Não se aplica (coesão textual).","pegadinha":"'Dela' aparece logo depois de 'a hora da colheita', termo feminino mais próximo, que poderia parecer o referente.","resumo_flash":"Para achar o referente de um pronome, não basta pegar o substantivo mais próximo: teste a substituição e veja se faz sentido (o destino da rosa x o destino da hora da colheita).","dica_padrao":"Itens de referência pronominal: substitua o pronome pelo candidato a referente e leia a frase. A banca às vezes coloca outro termo de mesmo gênero e número no meio para confundir.","recorrencia":"alta","tags":["coesão","referência pronominal"],"origem":"INSS 2022 · Cebraspe · Técnico · item 12","prova":2022,"desatualizada":false},{"id":"P22-013","disciplina":"Português","assunto":"Sintaxe do período: oração interrogativa e pontuação","enunciado":"Acerca de aspectos linguísticos do texto “Um ano de menos”, cujo segundo parágrafo contém o período “Mas a rosa, se a não apanha o jardineiro, que será ela no dia seguinte, após o mormaço do sol e a friagem do sereno?”: o segmento “que será ela no dia seguinte” consiste em uma oração adjetiva com sentido explicativo, o que justifica seu isolamento entre vírgulas no texto.","texto_base":"UM-ANO-DE-MENOS","gabarito":"Errado","comentario":"'Que será ela no dia seguinte' é a oração principal do período, de caráter interrogativo: o 'que' é pronome interrogativo (= o que será dela?), e não pronome relativo. Não há termo antecedente sendo explicado, então não é oração adjetiva. As vírgulas isolam, antes, a oração condicional intercalada ('se a não apanha o jardineiro') e, depois, o adjunto adverbial 'após o mormaço do sol...'.","legislacao":"Não se aplica (gramática: período composto e pontuação).","pegadinha":"O 'que' depois de vírgula lembra uma oração adjetiva explicativa, mas aqui ele é interrogativo.","resumo_flash":"Oração adjetiva começa por pronome relativo (que = o qual) e se refere a um substantivo anterior. Se o 'que' inicia uma pergunta (direta ou indireta), é pronome interrogativo e não forma oração adjetiva.","dica_padrao":"Antes de classificar um 'que', tente trocá-lo por 'o qual/a qual'. Se não der, não é relativo e a oração não é adjetiva.","recorrencia":"alta","tags":["orações adjetivas","pronome interrogativo","pontuação"],"origem":"INSS 2022 · Cebraspe · Técnico · item 13","prova":2022,"desatualizada":false},{"id":"P22-014","disciplina":"Português","assunto":"Verbos: locução 'haver de' + infinitivo","enunciado":"Acerca de aspectos linguísticos do texto “Um ano de menos”: no trecho “os que hão de esperar nas filas” (último parágrafo), o termo “hão” corresponde a uma forma abreviada de haverão e, como tal, diz respeito ao tempo futuro.","texto_base":"UM-ANO-DE-MENOS","gabarito":"Errado","comentario":"'Hão' é a 3ª pessoa do plural do presente do indicativo do verbo haver (eu hei, tu hás, ele há, nós havemos, vós haveis, eles hão), e não abreviação de 'haverão'. A ideia de futuro vem da locução 'haver de + infinitivo' como um todo, que indica intenção ou certeza de algo que vai acontecer.","legislacao":"Não se aplica (gramática: conjugação verbal).","pegadinha":"Misturar uma informação verdadeira (o trecho tem ideia de futuro) com uma falsa (que 'hão' seria forma abreviada de 'haverão').","resumo_flash":"Na locução 'haver de + infinitivo' (hei de vencer, hão de esperar), o verbo haver fica no presente, e a locução expressa futuro, obrigação ou firme intenção.","dica_padrao":"Cebraspe gosta de itens com justificativa errada para um efeito de sentido correto. Separe a classificação gramatical do sentido.","recorrencia":"alta","tags":["conjugação verbal","verbo haver","locução verbal"],"origem":"INSS 2022 · Cebraspe · Técnico · item 14","prova":2022,"desatualizada":false},{"id":"P22-015","disciplina":"Ética no Serviço Público","assunto":"Código de Ética (Decreto 1.171/1994): regras deontológicas: tratar mal o usuário","enunciado":"Com base no Decreto n.º 1.171/1994 (Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal): Considere que Jonas, servidor público federal lotado no atendimento ao público de uma repartição federal de recolhimento de tributos, tenha tratado mal, no exercício de suas atribuições de atendimento, uma contribuinte que buscava informações a respeito de suposto débito tributário. Nessa situação hipotética, a atitude de Jonas causou dano moral à contribuinte.","gabarito":"Certo","comentario":"O Código de Ética diz expressamente, nas regras deontológicas, que tratar mal uma pessoa que paga seus tributos direta ou indiretamente significa causar-lhe dano moral. A contribuinte que buscava informações se encaixa exatamente nessa hipótese. O item reproduz a letra do decreto.","legislacao":"Decreto 1.171/1994, Anexo, Capítulo I, Seção I (Regras Deontológicas), inciso IX.","pegadinha":"A situação hipotética usa termos jurídicos (débito tributário, dano moral) que podem fazer o candidato achar que é preciso processo judicial para haver dano moral; o Código já qualifica a conduta como dano moral.","resumo_flash":"O Decreto 1.171/1994 traz três partes no Capítulo I: Regras Deontológicas (princípios), Deveres Fundamentais e Vedações. Duas frases muito cobradas: tratar mal quem paga tributos causa dano moral; deixar alguém esperando em fila ou com atraso na prestação do serviço também causa dano moral.","dica_padrao":"Em Ética, a Cebraspe copia frases literais do Código. Memorize as expressões fortes ('dano moral', 'cunho duvidoso', 'falta de ética') e a quem se referem.","recorrencia":"media","tags":["Decreto 1.171/1994","código de ética","dano moral","regras deontológicas"],"origem":"INSS 2022 · Cebraspe · Técnico · item 15","prova":2022,"desatualizada":false},{"id":"P22-016","disciplina":"Ética no Serviço Público","assunto":"Código de Ética (Decreto 1.171/1994): vedações","enunciado":"Com base no Decreto n.º 1.171/1994 (Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal): É vedado ao servidor público federal ligar seu nome a empreendimentos de cunho duvidoso, mesmo que o servidor respeite, no ambiente de trabalho, todos os deveres fundamentais a ele aplicáveis.","gabarito":"Certo","comentario":"Entre as vedações do Código está a de exercer atividade profissional aética ou ligar o seu nome a empreendimentos de cunho duvidoso. A vedação é autônoma: cumprir os deveres no ambiente de trabalho não autoriza a conduta, até porque o Código lembra que a conduta do servidor na vida privada também se reflete na função pública.","legislacao":"Decreto 1.171/1994, Anexo, Capítulo I, Seção III (Vedações), inciso XV.","pegadinha":"A ressalva 'mesmo que respeite todos os deveres fundamentais' sugere uma compensação que o Código não prevê.","resumo_flash":"Deveres e vedações são listas independentes: cumprir um dever não 'libera' o servidor de uma vedação. O Código também alcança condutas fora do serviço, porque a vida privada do servidor pode afetar a imagem da Administração.","dica_padrao":"Ressalvas do tipo 'desde que', 'mesmo que', 'exceto se' são o lugar preferido da pegadinha. Pergunte se a lei realmente prevê essa condição ou exceção.","recorrencia":"media","tags":["Decreto 1.171/1994","vedações","cunho duvidoso"],"origem":"INSS 2022 · Cebraspe · Técnico · item 16","prova":2022,"desatualizada":false},{"id":"P22-017","disciplina":"Ética no Serviço Público","assunto":"Código de Ética (Decreto 1.171/1994): deveres fundamentais","enunciado":"Com base no Decreto n.º 1.171/1994 (Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal): O servidor público pode, até mesmo injustificadamente, deixar de participar de estudos que se relacionem com a melhoria do exercício de suas funções e que visem à realização do bem comum, pois, apesar de importante, essa ação não constitui dever fundamental dos servidores públicos.","gabarito":"Errado","comentario":"Participar dos movimentos e estudos que se relacionem com a melhoria do exercício de suas funções, tendo por escopo a realização do bem comum, está expressamente na lista de deveres fundamentais do servidor. Portanto, deixar de participar injustificadamente viola um dever.","legislacao":"Decreto 1.171/1994, Anexo, Capítulo I, Seção II (Deveres Fundamentais), inciso XIV.","pegadinha":"A banca reconhece a importância da conduta ('apesar de importante') mas nega que seja dever, invertendo a lei.","resumo_flash":"A lista de deveres fundamentais do Código (inciso XIV) inclui, entre outros: desempenhar com rapidez e rendimento as atribuições, ser assíduo, tratar cuidadosamente os usuários, manter-se atualizado com as normas e participar de estudos para melhorar o exercício das funções.","dica_padrao":"Quando o item diz que algo 'não constitui dever' ou 'é facultativo', desconfie se o tema for melhoria do serviço, cortesia ou atualização profissional: quase sempre é dever no Código.","recorrencia":"media","tags":["Decreto 1.171/1994","deveres fundamentais"],"origem":"INSS 2022 · Cebraspe · Técnico · item 17","prova":2022,"desatualizada":false},{"id":"P22-018","disciplina":"Ética no Serviço Público","assunto":"Decreto 6.029/2007: Comissão de Ética Pública (CEP)","enunciado":"De acordo com o Decreto n.º 6.029/2007 (Sistema de Gestão da Ética do Poder Executivo Federal): Caso determinado ministro de Estado pretenda realizar consulta a respeito de matéria de ética pública, a referida consulta deverá ser dirigida à Comissão de Ética Pública (CEP), que integra o Sistema de Gestão da Ética do Poder Executivo Federal.","gabarito":"Certo","comentario":"Compete à CEP atuar como instância consultiva do Presidente da República e dos Ministros de Estado em matéria de ética pública. Além disso, a CEP integra o Sistema de Gestão da Ética, junto com as comissões de ética dos órgãos e entidades e as demais comissões setoriais. O item está correto nas duas partes.","legislacao":"Decreto 6.029/2007, arts. 2º e 4º.","pegadinha":"O candidato pode achar que o ministro consultaria a comissão de ética do próprio ministério, e não a CEP.","resumo_flash":"O Sistema de Gestão da Ética é formado pela CEP (no topo, vinculada à Presidência da República), pelas Comissões de Ética de cada órgão/entidade e pelas demais comissões. A CEP orienta o Presidente da República e os Ministros de Estado e cuida da conduta da alta administração.","dica_padrao":"Cebraspe gosta de trocar as competências entre a CEP e as comissões setoriais. Lembre: altas autoridades (ministros, cúpula) = CEP.","recorrencia":"media","tags":["Decreto 6.029/2007","CEP","Sistema de Gestão da Ética"],"origem":"INSS 2022 · Cebraspe · Técnico · item 18","prova":2022,"desatualizada":false},{"id":"P22-019","disciplina":"Ética no Serviço Público","assunto":"Decreto 6.029/2007: dever de prestar informações às comissões de ética","enunciado":"De acordo com o Decreto n.º 6.029/2007 (Sistema de Gestão da Ética do Poder Executivo Federal): Dado o teor sensível das informações que transitam na maior parte das entidades do Poder Executivo Federal, as autoridades competentes dessas entidades poderão alegar sigilo para deixar de prestar informação solicitada pelas comissões de ética.","gabarito":"Errado","comentario":"O decreto proíbe expressamente que as autoridades competentes aleguem sigilo para deixar de prestar informação solicitada pelas Comissões de Ética. Os órgãos devem dar tratamento prioritário às solicitações de documentos necessários aos procedimentos de ética. O sigilo pode existir dentro do procedimento ético, mas não serve como desculpa para negar informação à comissão.","legislacao":"Decreto 6.029/2007, art. 20.","pegadinha":"A justificativa ('teor sensível das informações') soa razoável e induz o candidato a aceitar a exceção.","resumo_flash":"As comissões de ética precisam de acesso a informações para apurar condutas. Por isso os órgãos devem atender seus pedidos com prioridade e não podem alegar sigilo para negá-los.","dica_padrao":"Justificativas plausíveis ('dado o teor sensível', 'por razões de segurança') são usadas para vender uma exceção que a lei não prevê. Pergunte: a lei abre essa exceção?","recorrencia":"media","tags":["Decreto 6.029/2007","comissões de ética","sigilo"],"origem":"INSS 2022 · Cebraspe · Técnico · item 19","prova":2022,"desatualizada":false},{"id":"P22-020","disciplina":"Ética no Serviço Público","assunto":"Decreto 6.029/2007: dever das instâncias superiores de dar estrutura à comissão de ética","enunciado":"De acordo com o Decreto n.º 6.029/2007 (Sistema de Gestão da Ética do Poder Executivo Federal): As instâncias superiores dos órgãos e das entidades do Poder Executivo Federal estão dispensadas de garantir os recursos humanos, materiais e financeiros para que a Comissão de Ética cumpra com suas atribuições, uma vez que essas comissões devem ser mantidas por meio de recursos próprios, obtidos mediante cobrança para emissão de pareceres a respeito de questões que envolvam temas relacionados à ética no serviço público.","gabarito":"Errado","comentario":"É o contrário: compete às instâncias superiores dos órgãos e entidades garantir os recursos humanos, materiais e financeiros para que a Comissão de Ética cumpra suas atribuições. Não existe previsão de cobrança por pareceres; as comissões são mantidas pelo próprio órgão.","legislacao":"Decreto 6.029/2007, art. 8º.","pegadinha":"Item longo com uma justificativa inventada (cobrança por pareceres) para tornar a negação mais convincente.","resumo_flash":"As instâncias superiores de cada órgão devem: observar e fazer observar as normas de ética, constituir a Comissão de Ética, garantir-lhe recursos humanos, materiais e financeiros e atender com prioridade às solicitações da CEP.","dica_padrao":"Itens que 'dispensam' a Administração de um dever e inventam uma fonte alternativa (taxa, cobrança, recursos próprios) costumam estar errados.","recorrencia":"media","tags":["Decreto 6.029/2007","comissões de ética","instâncias superiores"],"origem":"INSS 2022 · Cebraspe · Técnico · item 20","prova":2022,"desatualizada":false},{"id":"P22-021","disciplina":"Direito Constitucional","assunto":"Direitos e garantias fundamentais: direito de certidão","enunciado":"A respeito dos direitos e garantias fundamentais, julgue o item. A obtenção de certidões em repartições públicas, para esclarecimento de situação de interesse pessoal, é direito assegurado a todos e independe do pagamento de taxa.","gabarito":"Certo","comentario":"O item reproduz quase literalmente o art. 5º, XXXIV, 'b', da CF: são a todos assegurados, independentemente do pagamento de taxas, a obtenção de certidões em repartições públicas, para defesa de direitos e esclarecimento de situações de interesse pessoal. A gratuidade vale tanto para o direito de petição (alínea 'a') quanto para a obtenção de certidões (alínea 'b').","legislacao":"CF/1988, art. 5º, XXXIV, 'a' e 'b'.","pegadinha":"O candidato pode achar que certidão sempre envolve cobrança de taxa (emolumentos). Para defesa de direitos e esclarecimento de interesse pessoal, a CF garante a gratuidade.","resumo_flash":"O art. 5º, XXXIV, da CF garante a todos, sem pagar taxa: (a) o direito de petição aos Poderes Públicos, em defesa de direitos ou contra ilegalidade ou abuso de poder; e (b) a obtenção de certidões em repartições públicas, para defesa de direitos e esclarecimento de situações de interesse pessoal.","dica_padrao":"Itens que copiam a literalidade do art. 5º costumam ser Certos; desconfie quando a banca acrescenta 'mediante pagamento de taxa' ou restringe o titular (ex.: 'somente aos brasileiros').","recorrencia":"alta","tags":["direitos fundamentais","direito de certidão","direito de petição","gratuidade"],"origem":"INSS 2022 · Cebraspe · Técnico · item 21","prova":2022,"desatualizada":false},{"id":"P22-022","disciplina":"Direito Constitucional","assunto":"Direitos fundamentais: controle judicial de políticas públicas","enunciado":"A respeito dos direitos e garantias fundamentais, julgue o item. O Poder Judiciário pode determinar a implantação de políticas públicas relacionadas a direitos e garantias fundamentais, sem que isso ofenda o princípio da separação dos poderes.","gabarito":"Certo","comentario":"O STF tem jurisprudência firme de que o Judiciário, em situações excepcionais de omissão ou deficiência grave do Poder Público, pode determinar a implementação de políticas públicas para assegurar direitos fundamentais, sem violar a separação dos poderes (ex.: RE 592.581, sobre reforma de presídios; Tema 698 da repercussão geral). No Tema 698 (RE 684.612, 2023), o STF fixou que a decisão deve, em regra, apontar as finalidades a alcançar e determinar que a Administração apresente um plano, em vez de definir ela mesma as medidas concretas. Por isso, o item é correto.","legislacao":"CF/1988, arts. 2º e 5º, XXXV e § 1º; STF, RE 592.581 (Tema 220) e RE 684.612 (Tema 698).","pegadinha":"Fazer o candidato pensar que qualquer interferência judicial em políticas públicas viola automaticamente a separação dos poderes.","resumo_flash":"Políticas públicas são, em regra, escolhas do Executivo e do Legislativo. Mas, quando a omissão do Estado viola direitos fundamentais (saúde, educação, dignidade de presos), o Judiciário pode mandar agir. O STF entende que isso não fere a separação dos poderes, desde que em caráter excepcional.","dica_padrao":"O Cebraspe costuma cobrar posições consolidadas do STF; a palavra 'pode' (possibilidade) tende a tornar o item Certo, enquanto 'deve sempre' ou 'em qualquer hipótese' tende a torná-lo Errado.","recorrencia":"alta","tags":["direitos fundamentais","separação dos poderes","políticas públicas","ativismo judicial","STF"],"origem":"INSS 2022 · Cebraspe · Técnico · item 22","prova":2022,"desatualizada":false},{"id":"P22-023","disciplina":"Direito Constitucional","assunto":"Direitos sociais: direitos dos trabalhadores urbanos e rurais (FGTS)","enunciado":"Acerca dos direitos sociais, julgue o item. O Fundo de Garantia do Tempo de Serviço é direito tanto dos trabalhadores urbanos quanto dos trabalhadores rurais.","gabarito":"Certo","comentario":"O caput do art. 7º da CF lista os direitos 'dos trabalhadores urbanos e rurais', e o inciso III inclui expressamente o fundo de garantia do tempo de serviço. A CF de 1988 igualou os direitos trabalhistas de urbanos e rurais. O FGTS também foi estendido aos empregados domésticos (art. 7º, parágrafo único, com a EC 72/2013, regulamentada pela LC 150/2015).","legislacao":"CF/1988, art. 7º, caput e III; art. 7º, parágrafo único (EC 72/2013).","pegadinha":"Sugerir, implicitamente, que o trabalhador rural teria um rol de direitos menor que o urbano.","resumo_flash":"O art. 7º da CF traz os direitos sociais dos trabalhadores urbanos e rurais, em igualdade: seguro-desemprego, FGTS, salário mínimo, 13º salário, férias com 1/3 a mais, licença-maternidade de 120 dias, entre outros.","dica_padrao":"Quando a banca tenta separar urbanos e rurais nos direitos do art. 7º, lembre: desde 1988 a regra é a igualdade.","recorrencia":"alta","tags":["direitos sociais","art. 7º","FGTS","trabalhador rural"],"origem":"INSS 2022 · Cebraspe · Técnico · item 23","prova":2022,"desatualizada":false},{"id":"P22-024","disciplina":"Direito Constitucional","assunto":"Direitos sociais: liberdade sindical e negociação coletiva","enunciado":"Acerca dos direitos sociais, julgue o item. A participação dos sindicatos nas negociações coletivas de trabalho pode ser dispensada mediante manifestação da maioria dos filiados.","gabarito":"Errado","comentario":"Segundo o art. 8º, VI, da CF, é obrigatória a participação dos sindicatos nas negociações coletivas de trabalho. A Constituição não prevê nenhuma hipótese de dispensa por votação dos filiados, por isso o item está errado.","legislacao":"CF/1988, art. 8º, VI.","pegadinha":"Criar uma exceção que não existe ('mediante manifestação da maioria dos filiados') para uma regra que a CF trata como obrigatória.","resumo_flash":"O art. 8º da CF trata da liberdade sindical: ninguém é obrigado a se filiar ou a se manter filiado; só pode existir um sindicato da mesma categoria na mesma base territorial (unicidade sindical), que não pode ser inferior à área de um município; e a participação do sindicato nas negociações coletivas é obrigatória.","dica_padrao":"Desconfie de exceções 'inventadas' (por votação, por acordo, por decisão da maioria) acrescentadas a regras que a CF declara obrigatórias.","recorrencia":"alta","tags":["direitos sociais","art. 8º","sindicato","negociação coletiva"],"origem":"INSS 2022 · Cebraspe · Técnico · item 24","prova":2022,"desatualizada":false},{"id":"P22-025","disciplina":"Direito Constitucional","assunto":"Direitos políticos: desincompatibilização","enunciado":"Acerca da garantia dos direitos políticos, julgue o item. No caso de senador que pretenda concorrer a outro cargo eletivo, não se exige a renúncia ao mandato atual.","gabarito":"Certo","comentario":"A CF exige renúncia até seis meses antes do pleito apenas dos chefes do Poder Executivo (Presidente, Governadores e Prefeitos) que queiram concorrer a outros cargos (art. 14, § 6º). Parlamentares, como senadores, deputados e vereadores, podem disputar outro cargo sem renunciar ao mandato. Por isso, o item é correto.","legislacao":"CF/1988, art. 14, § 6º.","pegadinha":"Estender ao parlamentar a exigência de renúncia (desincompatibilização), que a CF impõe somente aos chefes do Executivo.","resumo_flash":"Desincompatibilização é o afastamento exigido para alguém poder se candidatar. Pela CF, Presidente, Governadores e Prefeitos que quiserem concorrer a OUTROS cargos devem renunciar aos mandatos até 6 meses antes da eleição. Para a reeleição ao mesmo cargo (um único período subsequente) não precisam renunciar. Parlamentares não precisam renunciar.","dica_padrao":"A banca troca o sujeito da regra: o que vale para o Executivo (renúncia 6 meses antes) é aplicado a parlamentares, ou vice-versa.","recorrencia":"alta","tags":["direitos políticos","desincompatibilização","art. 14","senador"],"origem":"INSS 2022 · Cebraspe · Técnico · item 25","prova":2022,"desatualizada":false},{"id":"P22-026","disciplina":"Direito Constitucional","assunto":"Nacionalidade: naturalização extraordinária","enunciado":"Acerca da nacionalidade, julgue o item. A nacionalidade brasileira será concedida de ofício aos estrangeiros de qualquer nacionalidade que residam no Brasil há mais de quinze anos e que não possuam condenação penal.","gabarito":"Errado","comentario":"A naturalização extraordinária (art. 12, II, 'b', da CF) é concedida aos estrangeiros de qualquer nacionalidade residentes no Brasil há mais de 15 anos ininterruptos e sem condenação penal, 'desde que requeiram a nacionalidade brasileira'. Não é de ofício: depende de pedido do interessado. Preenchidos os requisitos, o estrangeiro tem direito a ela (ato vinculado), mas precisa requerê-la.","legislacao":"CF/1988, art. 12, II, 'b'; Lei 13.445/2017 (Lei de Migração).","pegadinha":"Trocar 'desde que requeiram' por 'de ofício' e omitir que a residência deve ser ininterrupta.","resumo_flash":"Brasileiro naturalizado é quem adquire a nacionalidade a pedido. Há duas hipóteses na CF: (a) originários de países de língua portuguesa: 1 ano ininterrupto de residência e idoneidade moral; (b) estrangeiros de qualquer nacionalidade: mais de 15 anos ininterruptos de residência, sem condenação penal. Nos dois casos é preciso requerer.","dica_padrao":"Fique atento a expressões como 'de ofício', 'automaticamente' ou 'independentemente de requerimento': a banca as usa para estragar itens que na lei exigem pedido.","recorrencia":"alta","tags":["nacionalidade","naturalização extraordinária","art. 12"],"origem":"INSS 2022 · Cebraspe · Técnico · item 26","prova":2022,"desatualizada":false},{"id":"P22-027","disciplina":"Direito Constitucional","assunto":"Administração pública na CF: acesso a cargos públicos por estrangeiros","enunciado":"Considerando as disposições da Constituição Federal de 1988 quanto à administração pública, julgue o item. É vedado a estrangeiros o acesso a cargos públicos.","gabarito":"Errado","comentario":"O art. 37, I, da CF (redação da EC 19/1998) dispõe que os cargos, empregos e funções públicas são acessíveis aos brasileiros que preencham os requisitos legais, assim como aos estrangeiros, na forma da lei. Não há vedação absoluta: o acesso de estrangeiros depende de lei que o regulamente (é o caso, por exemplo, de professores e pesquisadores em universidades federais). Apenas alguns cargos são privativos de brasileiros natos (art. 12, § 3º).","legislacao":"CF/1988, art. 37, I; art. 207, § 1º; Lei 8.112/1990, art. 5º, § 3º.","pegadinha":"Transformar uma permissão condicionada ('na forma da lei') em uma proibição absoluta.","resumo_flash":"Pela CF, brasileiros que cumpram os requisitos da lei e também estrangeiros, na forma da lei, podem ocupar cargos, empregos e funções públicas. A investidura em cargo efetivo depende de concurso público (art. 37, II).","dica_padrao":"Palavras absolutas como 'é vedado', 'nunca', 'em nenhuma hipótese' costumam indicar item Errado no Cebraspe, principalmente quando a lei tem exceção.","recorrencia":"alta","tags":["administração pública","art. 37","estrangeiros","cargos públicos"],"origem":"INSS 2022 · Cebraspe · Técnico · item 27","prova":2022,"desatualizada":false},{"id":"P22-028","disciplina":"Direito Constitucional","assunto":"Administração pública na CF: servidor no exercício de mandato eletivo (vereador)","enunciado":"Considerando as disposições da Constituição Federal de 1988 quanto à administração pública, julgue o item. Servidor público da administração indireta investido no mandato de vereador poderá acumular as vantagens do emprego com a remuneração do cargo eletivo, se houver compatibilidade de horários.","gabarito":"Certo","comentario":"O art. 38, III, da CF dispõe que o servidor investido no mandato de vereador, havendo compatibilidade de horários, perceberá as vantagens de seu cargo, emprego ou função, sem prejuízo da remuneração do cargo eletivo. Sem compatibilidade, afasta-se do cargo e pode optar pela remuneração. O art. 38 se aplica aos servidores da administração direta, autárquica e fundacional; o gabarito oficial aceitou a formulação genérica 'administração indireta'.","legislacao":"CF/1988, art. 38, I a III.","pegadinha":"Fazer o candidato aplicar ao vereador a regra do prefeito (afastamento obrigatório com opção de remuneração) ou dos mandatos federais/estaduais (afastamento obrigatório).","resumo_flash":"Servidor que ganha mandato eletivo: (1) mandato federal, estadual ou distrital: afasta-se do cargo; (2) prefeito: afasta-se e pode escolher a remuneração; (3) vereador: se houver compatibilidade de horários, acumula cargo e mandato e recebe as duas remunerações; se não houver, segue a regra do prefeito.","dica_padrao":"Mandato eletivo de servidor é cobrado comparando as três situações (federal/estadual, prefeito, vereador). Memorize que só o vereador pode acumular.","recorrencia":"alta","tags":["administração pública","art. 38","mandato eletivo","vereador","acumulação"],"origem":"INSS 2022 · Cebraspe · Técnico · item 28","prova":2022,"desatualizada":false},{"id":"P22-029","disciplina":"Direito Constitucional","assunto":"Administração pública na CF: limite de vencimentos entre os Poderes","enunciado":"Considerando as disposições da Constituição Federal de 1988 quanto à administração pública, julgue o item. Os vencimentos dos cargos integrantes dos Poderes Legislativo e Judiciário não poderão exceder os pagos aos cargos do Poder Executivo.","gabarito":"Certo","comentario":"Reprodução literal do art. 37, XII, da CF: 'os vencimentos dos cargos do Poder Legislativo e do Poder Judiciário não poderão ser superiores aos pagos pelo Poder Executivo'. O Executivo funciona como parâmetro para os demais Poderes. Não confundir com o teto remuneratório geral do art. 37, XI (subsídio dos ministros do STF).","legislacao":"CF/1988, art. 37, XII (e, para comparação, art. 37, XI).","pegadinha":"Inverter a referência (dizer que o Executivo não pode superar o Judiciário) ou confundir esta regra com o teto do art. 37, XI.","resumo_flash":"A CF usa o Poder Executivo como referência: cargos do Legislativo e do Judiciário não podem ter vencimentos maiores que os pagos pelo Executivo (art. 37, XII). Já o teto geral do serviço público é o subsídio dos ministros do STF (art. 37, XI).","dica_padrao":"Itens de literalidade da CF são frequentes; a banca costuma inverter o parâmetro de comparação. Grave quem é a referência.","recorrencia":"alta","tags":["administração pública","art. 37","remuneração","vencimentos"],"origem":"INSS 2022 · Cebraspe · Técnico · item 29","prova":2022,"desatualizada":false},{"id":"P22-030","disciplina":"Direito Constitucional","assunto":"Servidores públicos: regime previdenciário do ocupante de cargo temporário","enunciado":"Considerando as disposições da Constituição Federal de 1988 quanto à administração pública, julgue o item. Agente público ocupante de cargo temporário não está submetido ao Regime Geral de Previdência Social.","gabarito":"Errado","comentario":"O art. 40, § 13, da CF (redação da EC 103/2019) determina que ao agente público ocupante, exclusivamente, de cargo em comissão declarado em lei de livre nomeação e exoneração, de outro cargo temporário, inclusive mandato eletivo, ou de emprego público, aplica-se o Regime Geral de Previdência Social. Portanto, o ocupante de cargo temporário está, sim, vinculado ao RGPS.","legislacao":"CF/1988, art. 40, § 13 (redação da EC 103/2019); Lei 8.213/1991, art. 11, I, 'g'.","pegadinha":"Fazer o candidato associar todo agente público ao regime próprio (RPPS), quando o RPPS é exclusivo dos servidores titulares de cargo efetivo.","resumo_flash":"O regime próprio (RPPS) é só para servidores titulares de cargo efetivo. Quem ocupa apenas cargo em comissão, cargo temporário, mandato eletivo ou emprego público contribui para o RGPS, administrado pelo INSS.","dica_padrao":"Tema que une Constitucional e Previdenciário: sempre que aparecer 'cargo em comissão', 'temporário', 'mandato eletivo' ou 'emprego público' (sem cargo efetivo), pense em RGPS.","recorrencia":"alta","tags":["servidor público","art. 40","RGPS","RPPS","cargo temporário","EC103"],"origem":"INSS 2022 · Cebraspe · Técnico · item 30","prova":2022,"desatualizada":false},{"id":"P22-031","disciplina":"Direito Administrativo","assunto":"Organização administrativa: desconcentração x descentralização","enunciado":"A respeito da organização administrativa, julgue o item. A transmissão de competência de uma pessoa jurídica de direito público para outra configura a descontração.","gabarito":"Errado","comentario":"A palavra 'descontração' na prova é, quase certamente, um erro de digitação de 'desconcentração'; o item continua errado em qualquer leitura. Desconcentração é a distribuição interna de competências DENTRO de uma mesma pessoa jurídica, criando órgãos sem personalidade jurídica e com hierarquia (ex.: a União criando ministérios). Já a transferência de competência de uma pessoa jurídica para OUTRA pessoa (ex.: da União para uma autarquia como o INSS) é descentralização.","legislacao":"Decreto-Lei 200/1967, arts. 4º e 10; Lei 9.784/1999, art. 1º, § 2º (conceitos de órgão e entidade).","pegadinha":"Trocar descentralização (entre pessoas jurídicas diferentes) por desconcentração (dentro da mesma pessoa jurídica).","resumo_flash":"Desconcentração: divisão interna, dentro da mesma pessoa jurídica, gerando órgãos (sem personalidade jurídica), com hierarquia. Descentralização: a atividade passa para outra pessoa (física ou jurídica), por outorga (lei cria entidade, ex.: autarquia INSS) ou por delegação (contrato/ato, ex.: concessionária); não há hierarquia, só controle/tutela.","dica_padrao":"Truque de memória: desCONcentração fica CONcentrada na mesma pessoa jurídica; desCENTRALIZAÇÃO sai do 'centro' e vai para outra pessoa. A banca troca um pelo outro com frequência.","recorrencia":"alta","tags":["organização administrativa","desconcentração","descentralização","órgão","entidade"],"origem":"INSS 2022 · Cebraspe · Técnico · item 31","prova":2022,"desatualizada":false},{"id":"P22-032","disciplina":"Direito Administrativo","assunto":"Administração pública: sentidos orgânico (subjetivo) e material (objetivo)","enunciado":"A respeito da administração pública e do direito administrativo, julgue o item. O ato administrativo praticado por agente público no exercício da sua função expressa o sentido orgânico da administração pública.","gabarito":"Errado","comentario":"Em sentido orgânico (subjetivo ou formal), a administração pública é o conjunto de órgãos, entidades e agentes que exercem a função administrativa: responde a 'QUEM'. Em sentido material (objetivo ou funcional), é a própria atividade administrativa exercida: responde a 'O QUÊ'. O ato praticado pelo agente no exercício da função é atividade, ou seja, expressa o sentido material/objetivo, e não o orgânico.","legislacao":"Conceito doutrinário (Di Pietro, Carvalho Filho); CF/1988, art. 37, caput.","pegadinha":"Associar o ato (atividade) ao sentido orgânico só porque foi praticado por um agente (que integra o sentido orgânico).","resumo_flash":"Administração pública tem dois sentidos: (1) subjetivo/orgânico/formal = os sujeitos (órgãos, entidades e agentes); costuma ser escrita com iniciais maiúsculas: 'Administração Pública'; (2) objetivo/material/funcional = a atividade (fomento, polícia administrativa, serviço público, intervenção); costuma ser escrita com iniciais minúsculas.","dica_padrao":"Pergunte 'quem?' ou 'o quê?': se o item fala de quem faz, é sentido subjetivo/orgânico; se fala do que é feito (ato, atividade, função), é sentido objetivo/material.","recorrencia":"alta","tags":["administração pública","sentido orgânico","sentido material","conceitos"],"origem":"INSS 2022 · Cebraspe · Técnico · item 32","prova":2022,"desatualizada":false},{"id":"P22-033","disciplina":"Direito Administrativo","assunto":"Administração pública em sentido material: intervenção no domínio econômico","enunciado":"A respeito da administração pública e do direito administrativo, julgue o item. A regulamentação e a fiscalização de atividade econômica de natureza privada pela administração pública caracterizam a intervenção.","gabarito":"Certo","comentario":"Na classificação doutrinária (Maria Sylvia Di Pietro), a administração pública em sentido material abrange quatro atividades: fomento, polícia administrativa, serviço público e intervenção. A intervenção compreende a regulamentação e a fiscalização da atividade econômica de natureza privada (intervenção indireta) e a atuação direta do Estado no domínio econômico, em regra por meio de empresas estatais (art. 173 da CF).","legislacao":"CF/1988, arts. 173 e 174; doutrina (Di Pietro).","pegadinha":"Confundir intervenção com fomento (incentivo à iniciativa privada) ou com poder de polícia em sentido amplo.","resumo_flash":"Atividades da administração em sentido material: fomento (incentivar o particular, ex.: subvenções e financiamentos); polícia administrativa (limitar direitos individuais em prol do interesse público); serviço público (prestar utilidades à coletividade); intervenção (regular e fiscalizar a economia privada ou atuar diretamente nela).","dica_padrao":"Grave as quatro atividades (fomento, polícia, serviço público, intervenção) com o exemplo típico de cada uma; a banca troca exemplo e categoria.","recorrencia":"alta","tags":["administração pública","sentido material","intervenção","fomento","polícia administrativa"],"origem":"INSS 2022 · Cebraspe · Técnico · item 33","prova":2022,"desatualizada":false},{"id":"P22-034","disciplina":"Direito Administrativo","assunto":"Agentes públicos: particulares em colaboração (jurados)","enunciado":"A respeito dos agentes públicos, julgue o item. Os jurados, embora colaborem temporariamente com a administração pública, não podem ser considerados agentes públicos.","gabarito":"Errado","comentario":"Agente público é toda pessoa que exerce função pública, ainda que transitoriamente ou sem remuneração. Os jurados, mesários eleitorais e conscritos são particulares em colaboração com o Poder Público (na classificação de Hely Lopes Meirelles, agentes honoríficos) e, portanto, são agentes públicos. Esse conceito amplo aparece, por exemplo, no art. 2º da Lei 8.429/1992 e no art. 327 do Código Penal.","legislacao":"Lei 8.429/1992, art. 2º (redação da Lei 14.230/2021); Código Penal, art. 327; CPP, arts. 436 a 446 (serviço do júri).","pegadinha":"Usar o caráter temporário e não remunerado da função para sugerir que o jurado não é agente público.","resumo_flash":"Agente público é gênero: inclui agentes políticos (ex.: parlamentares, ministros), servidores públicos (estatutários, empregados públicos e temporários), militares e particulares em colaboração (jurados, mesários, notários e registradores, conscritos). Basta exercer função pública, mesmo de forma temporária e gratuita.","dica_padrao":"Quando a banca restringe o conceito de agente público (por ser temporário, não remunerado ou sem vínculo), o item tende a estar Errado: o conceito é o mais amplo possível.","recorrencia":"alta","tags":["agentes públicos","particulares em colaboração","jurados","agentes honoríficos"],"origem":"INSS 2022 · Cebraspe · Técnico · item 34","prova":2022,"desatualizada":false},{"id":"P22-035","disciplina":"Direito Administrativo","assunto":"Poderes administrativos: poder regulamentar","enunciado":"A respeito dos poderes administrativos, julgue o item. Por meio do poder regulamentar, cabe à administração pública criar mecanismos de complementação das leis, a fim de possibilitar a sua efetiva aplicabilidade.","gabarito":"Certo","comentario":"O poder regulamentar (ou normativo) permite ao chefe do Executivo expedir decretos e regulamentos para a fiel execução das leis (art. 84, IV, da CF), detalhando e complementando o texto legal para que ele possa ser aplicado. O regulamento executivo não pode inovar na ordem jurídica, criando direitos ou obrigações não previstos em lei. Exceção: o decreto autônomo do art. 84, VI, da CF.","legislacao":"CF/1988, art. 84, IV e VI; art. 49, V (Congresso susta atos que exorbitem do poder regulamentar).","pegadinha":"O candidato pode achar que 'complementar' significa inovar. Complementar aqui é detalhar a lei para viabilizar sua execução, sem contrariá-la.","resumo_flash":"Poder regulamentar é a competência do chefe do Executivo para editar decretos e regulamentos que explicam e detalham as leis. Ex.: o Decreto 3.048/1999 (Regulamento da Previdência Social) detalha as Leis 8.212 e 8.213/1991. O regulamento não pode contrariar a lei nem ir além dela.","dica_padrao":"Itens sobre poder regulamentar ficam Errados quando dizem que o decreto pode 'criar obrigações', 'inovar' ou 'revogar lei'; ficam Certos quando falam em 'fiel execução' ou 'complementação' da lei.","recorrencia":"alta","tags":["poderes administrativos","poder regulamentar","decreto","art. 84"],"origem":"INSS 2022 · Cebraspe · Técnico · item 35","prova":2022,"desatualizada":false},{"id":"P22-036","disciplina":"Direito Administrativo","assunto":"Lei 8.112/1990: proibições ao servidor (participação em sociedade privada)","enunciado":"A respeito do regime jurídico único dos servidores públicos federais, julgue o item. A condição de acionista de sociedade privada impede a posse em cargo público.","gabarito":"Errado","comentario":"O art. 117, X, da Lei 8.112/1990 proíbe o servidor de participar de gerência ou administração de sociedade privada, personificada ou não, e de exercer o comércio, EXCETO na qualidade de acionista, cotista ou comanditário. Ser apenas acionista é permitido e, portanto, não impede a posse. O que é vedado é atuar como gerente ou administrador (com as exceções do parágrafo único do art. 117).","legislacao":"Lei 8.112/1990, art. 117, X e parágrafo único.","pegadinha":"Confundir a condição de sócio/acionista (permitida) com a de gerente ou administrador (vedada).","resumo_flash":"O servidor federal pode ser sócio, acionista ou cotista de empresa privada. O que ele não pode é gerenciar ou administrar a empresa nem exercer o comércio. Exceções: participar de conselhos de empresas em que a União tenha participação ou de cooperativas, e gerenciar durante licença para tratar de interesses particulares, observada a legislação de conflito de interesses.","dica_padrao":"Em proibições da Lei 8.112, a banca costuma omitir a exceção expressa da lei. Sempre pergunte: há uma ressalva ('exceto', 'salvo')?","recorrencia":"media","tags":["Lei 8.112","proibições","acionista","posse","regime jurídico único"],"origem":"INSS 2022 · Cebraspe · Técnico · item 36","prova":2022,"desatualizada":false},{"id":"P22-037","disciplina":"Direito Administrativo","assunto":"Processo administrativo (Lei 9.784/1999): delegação de competência","enunciado":"A respeito do processo administrativo, julgue o item. A delegação de competência de um titular a outro depende da existência de subordinação hierárquica.","gabarito":"Errado","comentario":"O art. 12 da Lei 9.784/1999 permite que um órgão administrativo e seu titular deleguem parte de sua competência a outros órgãos ou titulares, 'ainda que estes não lhe sejam hierarquicamente subordinados', quando conveniente em razão de circunstâncias técnicas, sociais, econômicas, jurídicas ou territoriais. A delegação não depende de hierarquia. Já a avocação (art. 15) pressupõe hierarquia: o superior avoca competência do subordinado.","legislacao":"Lei 9.784/1999, arts. 11 a 15.","pegadinha":"Exigir hierarquia para a delegação, requisito que a lei afasta expressamente (e que vale para a avocação).","resumo_flash":"Delegação: transferir parte da competência a outro órgão/agente, mesmo sem hierarquia; é revogável a qualquer tempo e o ato delegado é considerado editado pelo delegado. Não podem ser delegados: atos normativos, decisão de recursos administrativos e matérias de competência exclusiva (regra 'NO-DE-CE'). Avocação: o superior chama para si competência do subordinado, de forma excepcional e temporária.","dica_padrao":"Delegação x avocação é par clássico: delegação dispensa hierarquia; avocação exige hierarquia. Decore também o 'NO-DE-CE' (normativos, decisão de recursos, competência exclusiva).","recorrencia":"alta","tags":["processo administrativo","Lei 9.784","delegação","avocação","hierarquia"],"origem":"INSS 2022 · Cebraspe · Técnico · item 37","prova":2022,"desatualizada":false},{"id":"P22-038","disciplina":"Direito Administrativo","assunto":"Serviços públicos: PPP: concessão administrativa","enunciado":"A respeito dos serviços públicos, julgue o item. A concessão administrativa se dá quando seu objeto é a prestação de serviço do qual a administração pública seja a usuária, ainda que indireta.","gabarito":"Certo","comentario":"A Lei 11.079/2004 (Lei das PPPs) define concessão administrativa como o contrato de prestação de serviços de que a Administração Pública seja a usuária direta ou indireta, ainda que envolva execução de obra ou fornecimento e instalação de bens (art. 2º, § 2º). Na concessão administrativa, a remuneração vem do próprio parceiro público, sem cobrança de tarifa do usuário. O item reproduz corretamente o conceito.","legislacao":"Lei 11.079/2004, art. 2º, §§ 1º a 4º.","pegadinha":"Confundir concessão administrativa com concessão patrocinada (tarifa paga pelos usuários + contraprestação pública) ou com a concessão comum da Lei 8.987/1995.","resumo_flash":"PPP é uma concessão especial, com duas modalidades: (1) patrocinada: o parceiro privado recebe tarifa dos usuários + contraprestação do poder público; (2) administrativa: a própria Administração é usuária, direta ou indireta, do serviço e paga por ele. É vedada PPP com valor inferior a R$ 10 milhões, prazo inferior a 5 ou superior a 35 anos, ou que tenha como objeto único o fornecimento de mão de obra, de equipamentos ou a execução de obra.","dica_padrao":"A banca troca as definições de concessão patrocinada e administrativa. Lembre: administrativa = Administração é a usuária; patrocinada = tem tarifa + 'patrocínio' do poder público.","recorrencia":"alta","tags":["serviços públicos","PPP","concessão administrativa","Lei 11.079"],"origem":"INSS 2022 · Cebraspe · Técnico · item 38","prova":2022,"desatualizada":false},{"id":"P22-039","disciplina":"Direito Administrativo","assunto":"Improbidade administrativa: exigência de dolo (Lei 14.230/2021)","enunciado":"A respeito da improbidade administrativa, julgue o item. A voluntariedade do agente é suficiente para caracterizar a conduta ilícita como crime de improbidade administrativa.","gabarito":"Errado","comentario":"Após a Lei 14.230/2021, todos os atos de improbidade exigem dolo, entendido como a vontade livre e consciente de alcançar o resultado ilícito tipificado nos arts. 9º, 10 e 11, 'não bastando a voluntariedade do agente' (art. 1º, § 2º, da Lei 8.429/1992). A lei também exclui a modalidade culposa e afasta a responsabilidade pelo mero exercício da função sem comprovação de ato doloso com fim ilícito (art. 1º, § 3º). Além disso, improbidade não é crime: é ilícito de natureza civil, com sanções aplicadas sem prejuízo da ação penal cabível (art. 37, § 4º, da CF). O STF confirmou a exigência de dolo no Tema 1.199 (ARE 843.989).","legislacao":"Lei 8.429/1992, art. 1º, §§ 1º a 3º, e art. 17-D (redação da Lei 14.230/2021); CF/1988, art. 37, § 4º; STF, ARE 843.989 (Tema 1.199).","pegadinha":"Dois erros no mesmo item: (1) dizer que basta a voluntariedade, quando a lei exige dolo específico; (2) chamar improbidade de 'crime', quando se trata de ilícito civil/administrativo.","resumo_flash":"Improbidade administrativa é a conduta desonesta do agente público que gera enriquecimento ilícito (art. 9º), prejuízo ao erário (art. 10) ou viola princípios da administração (art. 11). Desde a Lei 14.230/2021, só existe improbidade dolosa: é preciso provar que o agente quis o resultado ilícito. As sanções (perda da função, suspensão dos direitos políticos, multa, ressarcimento) são civis, e não penais.","dica_padrao":"Em improbidade, desconfie de 'culpa', 'mera voluntariedade' ou 'crime de improbidade'. Pós-2021, a palavra-chave é dolo (vontade livre e consciente de alcançar o resultado ilícito).","recorrencia":"alta","tags":["improbidade administrativa","Lei 8.429","Lei 14.230","dolo","Tema 1199"],"origem":"INSS 2022 · Cebraspe · Técnico · item 39","prova":2022,"desatualizada":false},{"id":"P22-040","disciplina":"Direito Administrativo","assunto":"Controle da administração: direito de petição como controle administrativo","enunciado":"A respeito do controle da administração, julgue o item. O direito de petição, por meio do qual as pessoas podem formular postulações aos órgãos públicos, é um meio de controle administrativo.","gabarito":"Certo","comentario":"Controle administrativo é aquele que a própria Administração exerce sobre seus atos, de ofício (autotutela) ou mediante provocação do interessado. O direito de petição (art. 5º, XXXIV, 'a', da CF) é um dos meios de provocação desse controle, ao lado da representação, da reclamação administrativa, do pedido de reconsideração e dos recursos administrativos.","legislacao":"CF/1988, art. 5º, XXXIV, 'a'; Lei 9.784/1999, arts. 53 a 65; Súmula 473 do STF.","pegadinha":"Fazer o candidato pensar que o direito de petição seria meio de controle judicial ou mero direito individual sem relação com o controle da Administração.","resumo_flash":"A Administração controla seus próprios atos (autotutela): pode anular os ilegais e revogar os inconvenientes ou inoportunos (Súmula 473 do STF). Esse controle pode ser provocado pelo cidadão, por meio do direito de petição, de reclamações, de representações e de recursos administrativos.","dica_padrao":"Classifique o controle por quem o exerce: a própria Administração (administrativo), o Legislativo com o auxílio do TCU (legislativo) ou o Judiciário (judicial). O meio usado (petição, recurso) indica o tipo de controle.","recorrencia":"alta","tags":["controle da administração","controle administrativo","direito de petição","autotutela"],"origem":"INSS 2022 · Cebraspe · Técnico · item 40","prova":2022,"desatualizada":false},{"id":"P22-041","disciplina":"Informática","assunto":"Windows 10: Segurança do Windows e Microsoft Defender Antivírus","enunciado":"Julgue o item, relativo a noções de informática. No Windows 10, a Segurança do Windows verifica continuamente a existência de malwares e vírus e inclui um programa antivírus chamado Microsoft Defender Antivírus.","gabarito":"Certo","comentario":"A Segurança do Windows (Windows Security) é a central de proteção nativa do Windows 10 e do Windows 11. Ela inclui o Microsoft Defender Antivírus, que oferece proteção em tempo real, verificando continuamente a existência de vírus, malwares e outras ameaças, além de reunir o firewall, a proteção de conta e o controle de aplicativos e navegador. Observação: o suporte gratuito ao Windows 10 terminou em outubro de 2025, mas o conceito vale igualmente para o Windows 11.","legislacao":"Não se aplica (conteúdo técnico: documentação da Microsoft sobre a Segurança do Windows).","pegadinha":"O candidato pode achar que o Windows não tem antivírus próprio e depende de software de terceiros.","resumo_flash":"A 'Segurança do Windows' é o painel central de proteção do sistema. Principais áreas: Proteção contra vírus e ameaças (Microsoft Defender Antivírus, com proteção em tempo real), Proteção de conta, Firewall e proteção de rede, Controle de aplicativos e navegador, Segurança do dispositivo e Desempenho e integridade do dispositivo.","dica_padrao":"A banca cobra a função de cada componente da Segurança do Windows: antivírus combate malware; firewall filtra tráfego de rede; BitLocker/EFS criptografam. Atribuir função errada é a pegadinha clássica.","recorrencia":"alta","tags":["Windows","Segurança do Windows","Microsoft Defender","antivírus","malware"],"origem":"INSS 2022 · Cebraspe · Técnico · item 41","prova":2022,"desatualizada":false},{"id":"P22-043","disciplina":"Informática","assunto":"Windows 10: firewall x criptografia (BitLocker/EFS)","enunciado":"Julgue o item, relativo a noções de informática. Com a finalidade de proteger os seus arquivos no Windows 10, o usuário pode criptografá-los pelo aplicativo Windows Defender Firewall, no painel Segurança do Windows.","gabarito":"Errado","comentario":"O Windows Defender Firewall não criptografa arquivos: sua função é monitorar e filtrar o tráfego de rede, bloqueando ou permitindo conexões de entrada e saída conforme regras. Para criptografar no Windows 10, usam-se o BitLocker (criptografia de unidade inteira, nas edições Pro, Enterprise e Education) ou o EFS (Encrypting File System, criptografia de arquivos e pastas pelas propriedades avançadas, em volumes NTFS).","legislacao":"Não se aplica (conteúdo técnico: documentação da Microsoft sobre Windows Defender Firewall, BitLocker e EFS).","pegadinha":"Atribuir ao firewall uma função (criptografia) que pertence a outro recurso do Windows.","resumo_flash":"Firewall = 'porteiro' da rede: controla o que entra e sai pela conexão. Antivírus = detecta e remove malware. Criptografia = torna os dados ilegíveis para quem não tem a chave; no Windows, é feita pelo BitLocker (disco/unidade) ou pelo EFS (arquivos/pastas).","dica_padrao":"Associe cada ferramenta de segurança a uma única função principal. Se o item dá ao firewall, ao antivírus ou ao backup uma função de outra ferramenta, está Errado.","recorrencia":"alta","tags":["Windows","firewall","criptografia","BitLocker","EFS","segurança da informação"],"origem":"INSS 2022 · Cebraspe · Técnico · item 43","prova":2022,"desatualizada":false},{"id":"P22-046","disciplina":"Raciocínio Lógico-Matemático","assunto":"Lógica proposicional: sentenças abertas","enunciado":"Considere a proposição P: “Se me mandou mensagem, meu filho lembrou-se de mim e quer ser lembrado por mim”. Na proposição P, permitindo-se variar, em certo conjunto de pessoas, o sujeito e o objeto de cada verbo de suas proposições simples constituintes, tem-se uma sentença aberta, que também pode ser expressa por quem mandou mensagem, lembrou-se e quer ser lembrado.","gabarito":"Certo","comentario":"Uma proposição precisa ter sujeito e complementos determinados para ser julgada verdadeira ou falsa. Em P, o sujeito é 'meu filho' e o objeto é 'mim'. Se esses termos passam a variar num conjunto de pessoas, eles viram variáveis, e a frase deixa de ter valor lógico definido: torna-se uma sentença aberta. A banca aceitou que essa sentença generalizada pode ser expressa por 'quem mandou mensagem, lembrou-se e quer ser lembrado', em que 'quem' faz o papel da variável.","legislacao":"Não se aplica (raciocínio lógico).","pegadinha":"Item conceitual com redação difícil, que leva o candidato a marcar Errado por estranhar a reescrita informal da sentença aberta.","resumo_flash":"Sentença aberta é uma frase com variável (x, 'ele', 'quem'), que só vira verdadeira ou falsa quando a variável é substituída por um valor. Ex.: 'x + 2 = 5' ou 'Ele é servidor'. Proposição é frase declarativa com valor lógico definido.","dica_padrao":"Se o item troca termos fixos (nomes, 'meu filho', 'eu') por termos variáveis ('alguém', 'quem', 'x'), a frase vira sentença aberta e deixa de ser proposição.","recorrencia":"alta","tags":["lógica proposicional","sentença aberta","proposição"],"origem":"INSS 2022 · Cebraspe · Técnico · item 46","prova":2022,"desatualizada":false},{"id":"P22-047","disciplina":"Raciocínio Lógico-Matemático","assunto":"Lógica proposicional: número de linhas da tabela-verdade","enunciado":"Considere a proposição P: “Se me mandou mensagem, meu filho lembrou-se de mim e quer ser lembrado por mim”. A tabela-verdade da proposição P possui 16 linhas.","gabarito":"Errado","comentario":"P tem três proposições simples: p = 'me mandou mensagem', q = 'meu filho lembrou-se de mim' e r = 'meu filho quer ser lembrado por mim'. A forma é p → (q ∧ r). O número de linhas é 2^n, com n proposições simples distintas: 2³ = 8 linhas, e não 16.","legislacao":"Não se aplica (raciocínio lógico).","pegadinha":"Induzir o candidato a contar quatro proposições, separando, por exemplo, 'lembrou-se' e 'lembrado' em mais partes ou contando o sujeito 'meu filho' à parte.","resumo_flash":"Tabela-verdade tem 2^n linhas, em que n é o número de proposições simples DIFERENTES. 1 proposição = 2 linhas; 2 = 4; 3 = 8; 4 = 16.","dica_padrao":"Conte com cuidado as proposições simples: cada verbo com seu complemento normalmente é uma. Proposições repetidas contam uma vez só.","recorrencia":"alta","tags":["tabela-verdade","proposições compostas","condicional"],"origem":"INSS 2022 · Cebraspe · Técnico · item 47","prova":2022,"desatualizada":false},{"id":"P22-048","disciplina":"Raciocínio Lógico-Matemático","assunto":"Lógica proposicional: negação da conjunção (De Morgan)","enunciado":"Considere a proposição P: “Se me mandou mensagem, meu filho lembrou-se de mim e quer ser lembrado por mim”. A negação da proposição “meu filho lembrou-se de mim e quer ser lembrado por mim” pode ser expressa por meu filho não se lembrou de mim nem quer ser lembrado por mim.","gabarito":"Errado","comentario":"A proposição é uma conjunção (q ∧ r). Pela lei de De Morgan, sua negação é ~q ∨ ~r: 'meu filho não se lembrou de mim OU não quer ser lembrado por mim'. A forma com 'nem' equivale a ~q ∧ ~r (não lembrou E não quer), que é mais forte que a negação e não equivale a ela.","legislacao":"Não se aplica (raciocínio lógico).","pegadinha":"Negar as duas partes mas manter o conectivo 'e' (disfarçado de 'nem'), esquecendo de trocar 'e' por 'ou'.","resumo_flash":"Leis de De Morgan: ~(p ∧ q) = ~p ∨ ~q; ~(p ∨ q) = ~p ∧ ~q. Para negar 'e', negue as duas partes e troque por 'ou'. 'Nem... nem' significa 'não... e não...'.","dica_padrao":"Atenção ao 'nem': ele equivale a 'e não'. Negação de conjunção com 'nem' está sempre errada.","recorrencia":"alta","tags":["negação","De Morgan","conjunção"],"origem":"INSS 2022 · Cebraspe · Técnico · item 48","prova":2022,"desatualizada":false},{"id":"P22-049","disciplina":"Raciocínio Lógico-Matemático","assunto":"Conjuntos e porcentagem: união e interseção","enunciado":"Entre os servidores de certa repartição do INSS, sabe-se que 65% gostam de trabalhar com atendimento ao público e, desses, 30% gostam também de trabalhos administrativos. Se todos os servidores da repartição gostam de pelo menos uma das modalidades de trabalho mencionadas, então mais de 30% deles gostam de trabalhos administrativos.","gabarito":"Certo","comentario":"Atendimento (A) = 65%. Os que gostam das duas = 30% de 65% = 19,5% do total. Se todos gostam de pelo menos uma, então 35% gostam só de trabalho administrativo. Total que gosta de administrativo = 35% + 19,5% = 54,5%, que é mais de 30%.","legislacao":"Não se aplica (raciocínio lógico-matemático).","pegadinha":"O número 30% aparece no enunciado, mas é porcentagem relativa ao grupo do atendimento, não ao total de servidores.","resumo_flash":"Use a fórmula n(A ∪ B) = n(A) + n(B) − n(A ∩ B). Se todos estão em pelo menos um grupo, n(A ∪ B) = 100%. Aqui: 100% = 65% + B − 19,5%, logo B = 54,5%.","dica_padrao":"Observe 'desses': a porcentagem incide sobre um subgrupo, não sobre o total. Calcule 'porcentagem de porcentagem' multiplicando (30% × 65%).","recorrencia":"alta","tags":["conjuntos","porcentagem","diagrama de Venn"],"origem":"INSS 2022 · Cebraspe · Técnico · item 49","prova":2022,"desatualizada":false},{"id":"P22-050","disciplina":"Raciocínio Lógico-Matemático","assunto":"Porcentagem: porcentagem de porcentagem","enunciado":"Entre os servidores de certa repartição do INSS, sabe-se que 65% gostam de trabalhar com atendimento ao público e, desses, 30% gostam também de trabalhos administrativos. Entre todos os servidores da repartição, mais de 20% gostam das duas modalidades de trabalho mencionadas.","gabarito":"Errado","comentario":"Os que gostam das duas modalidades são 30% dos que gostam de atendimento, que são 65% do total: 0,30 × 0,65 = 0,195 = 19,5% do total. Como 19,5% é menor que 20%, o item está errado.","legislacao":"Não se aplica (raciocínio lógico-matemático).","pegadinha":"O valor real (19,5%) fica muito próximo de 20%, para pegar quem arredonda ou faz a conta de cabeça sem precisão.","resumo_flash":"Porcentagem de porcentagem se calcula multiplicando: 30% de 65% = 0,30 × 0,65 = 19,5%. Para facilitar: 10% de 65 = 6,5; vezes 3 = 19,5.","dica_padrao":"Cebraspe coloca o resultado logo abaixo ou acima do limite do item (19,5% x 20%). Faça a conta completa, sem arredondar.","recorrencia":"alta","tags":["porcentagem","conjuntos","interseção"],"origem":"INSS 2022 · Cebraspe · Técnico · item 50","prova":2022,"desatualizada":false},{"id":"P22-051","disciplina":"Direito Previdenciário","assunto":"Fontes do direito previdenciário","enunciado":"Acerca das fontes da legislação previdenciária, julgue o item. A Constituição Federal é considerada uma fonte formal primária do direito previdenciário brasileiro.","gabarito":"Certo","comentario":"Fontes formais primárias são as que criam direitos e obrigações diretamente: a Constituição, as emendas constitucionais, as leis complementares e ordinárias e as medidas provisórias. A CF/1988 traz a base de todo o sistema (arts. 194 a 204 e art. 40), por isso é a principal fonte primária. Decretos, instruções normativas e portarias são fontes secundárias, pois apenas regulamentam a lei.","legislacao":"CF/1988, arts. 194 a 204; CF, art. 59 (espécies normativas).","pegadinha":"Nenhuma armadilha forte: a banca apenas testa se o candidato sabe separar fonte primária (CF e leis) de fonte secundária (decretos e atos infralegais).","resumo_flash":"Fonte primária = norma que inova no ordenamento (CF, EC, LC, lei ordinária, MP). Fonte secundária = norma que só detalha a lei (Decreto 3.048/1999, instruções normativas do INSS, portarias). A Constituição está no topo das fontes primárias.","dica_padrao":"Quando a banca perguntar se um decr
