<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5c8a"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Estudo INSS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de uma coluna para celular, barra de abas fixa embaixo, cartão de questão como "ficha" do processo */
:root {
  --bg: #eef2f3;
  --surface: #ffffff;
  --ink: #12263a;
  --muted: #5b6b7a;
  --line: #d5dde2;
  --accent: #0b5c8a;
  --accent-soft: #dcebf4;
  --stamp: #c98a12;
  --stamp-soft: #fbf0d9;
  --ok: #1d7a46;
  --ok-soft: #dff2e6;
  --bad: #b3261e;
  --bad-soft: #f9e0de;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d161f; --surface: #152331; --ink: #e6edf2; --muted: #93a4b3; --line: #26384a;
    --accent: #6cb7e6; --accent-soft: #17354b; --stamp: #e5b04a; --stamp-soft: #3a2d12;
    --ok: #5fcf8c; --ok-soft: #143323; --bad: #f08a80; --bad-soft: #3d1a18; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d161f; --surface: #152331; --ink: #e6edf2; --muted: #93a4b3; --line: #26384a;
  --accent: #6cb7e6; --accent-soft: #17354b; --stamp: #e5b04a; --stamp-soft: #3a2d12;
  --ok: #5fcf8c; --ok-soft: #143323; --bad: #f08a80; --bad-soft: #3d1a18; color-scheme: dark;
}
/* Escolha manual feita no próprio app (botão de tema): vence o tema do sistema */
:root[data-tema="claro"] {
  --bg: #eef2f3; --surface: #ffffff; --ink: #12263a; --muted: #5b6b7a; --line: #d5dde2;
  --accent: #0b5c8a; --accent-soft: #dcebf4; --stamp: #c98a12; --stamp-soft: #fbf0d9;
  --ok: #1d7a46; --ok-soft: #dff2e6; --bad: #b3261e; --bad-soft: #f9e0de; color-scheme: light;
}
:root[data-tema="escuro"] {
  --bg: #0d161f; --surface: #152331; --ink: #e6edf2; --muted: #93a4b3; --line: #26384a;
  --accent: #6cb7e6; --accent-soft: #17354b; --stamp: #e5b04a; --stamp-soft: #3a2d12;
  --ok: #5fcf8c; --ok-soft: #143323; --bad: #f08a80; --bad-soft: #3d1a18; color-scheme: dark;
}
* { box-sizing: border-box; }
.top-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tema { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 10px; font: 600 0.8rem var(--font-body); cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tema svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tema:focus-visible { outline: 3px solid var(--stamp); outline-offset: 2px; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(88px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px; }
header.top h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
header.top h1 span { color: var(--accent); }
.sync { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync { min-width: 0; }
.sync span { overflow: hidden; text-overflow: ellipsis; }
.sync i { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.ok i { background: var(--ok); }
.sync.warn i { background: var(--stamp); }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; margin: 0; text-wrap: balance; }
.eyebrow { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 1rem var(--font-body); padding: 12px 16px; border-radius: 10px; cursor: pointer; min-height: 48px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.block { width: 100%; }
.btn:focus-visible, .tab:focus-visible, .chip:focus-visible { outline: 3px solid var(--stamp); outline-offset: 2px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 600 0.85rem var(--font-body); cursor: pointer; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill { font-size: 0.74rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.alta { background: var(--stamp-soft); color: var(--stamp); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.mono { font-family: var(--font-mono); font-size: 0.8rem; }

/* Hoje */
.today-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.daynum { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.daynum small { font-size: 1rem; color: var(--muted); font-weight: 600; }
.progress { height: 8px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); border-radius: 999px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.steps li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.steps li .n { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 0.8rem; font-weight: 700; color: var(--muted); }
.steps li.done .n { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.steps li .t { min-width: 0; }
.steps li .t b { display: block; font-size: 0.98rem; }
.steps li .t span { font-size: 0.84rem; color: var(--muted); }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 0.78rem; color: var(--muted); }

/* Questão */
.ficha { border-top: 4px solid var(--accent); }
.ficha .meta { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.box { border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.box.flash { background: var(--accent-soft); }
.box.dica { background: var(--stamp-soft); }
.box.ok { background: var(--ok-soft); }
.box.bad { background: var(--bad-soft); }
.box .eyebrow { color: inherit; opacity: 0.85; }
.box.dica .eyebrow { color: var(--stamp); opacity: 1; }
.box.flash .eyebrow { color: var(--accent); opacity: 1; }
.enunciado { font-size: 1.08rem; line-height: 1.55; }
.answer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.answer .btn { min-height: 60px; font-size: 1.1rem; font-family: var(--font-display); letter-spacing: 0.02em; }
.answer .c { border: 2px solid var(--ok); color: var(--ok); }
.answer .e { border: 2px solid var(--bad); color: var(--bad); }
.verdict { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; }
.box.ok .verdict { color: var(--ok); }
.box.bad .verdict { color: var(--bad); }
.dl { display: flex; flex-direction: column; gap: 10px; }
.dl b { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.sessbar { display: flex; align-items: center; gap: 10px; }
.sessbar .progress { flex: 1; }
.lista { margin: 4px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
details summary { cursor: pointer; }
.linkbtn { appearance: none; background: none; border: 0; color: var(--accent); font: 600 0.92rem var(--font-body); padding: 6px 0; cursor: pointer; text-align: left; }

/* Cronograma */
.week { display: flex; flex-direction: column; gap: 8px; }
.daylist { display: flex; flex-direction: column; gap: 6px; }
.dayrow { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
.dayrow .d { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.dayrow.done .d { color: var(--ok); }
.dayrow.next { border: 2px solid var(--accent); }
.dayrow.next .d { color: var(--accent); }
.dayrow .t { min-width: 0; }
.dayrow .t b { display: block; font-size: 0.82rem; color: var(--muted); font-weight: 600; }
.dayrow .t span { font-size: 0.95rem; }

/* Desempenho */
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 0.92rem; }
.bar .track { grid-column: 1 / -1; height: 10px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
.bar .track div { height: 100%; border-radius: 999px; background: var(--accent); }
.bar .track div.low { background: var(--bad); }
.bar .track div.mid { background: var(--stamp); }
.bar .v { font-variant-numeric: tabular-nums; font-weight: 700; }
.leitner { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; }
.leitner div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px; }
.leitner b { display: block; font-family: var(--font-display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.leitner span { font-size: 0.72rem; color: var(--muted); }
.spark { display: flex; align-items: flex-end; gap: 4px; height: 70px; }
.spark div { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
.spark div.zero { background: var(--line); }
.sparklbl { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); }

/* Questões */
.qlist { display: flex; flex-direction: column; gap: 6px; }
.qrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.qrow .t { min-width: 0; font-size: 0.92rem; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips .chip { flex: 0 0 auto; }

/* Abas */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tab { appearance: none; background: none; border: 0; color: var(--muted); font: 600 0.72rem var(--font-body); padding: 8px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; position: relative; }
.tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--accent); }
.tab .badge { position: absolute; top: 4px; left: calc(50% + 6px); background: var(--bad); color: var(--surface); font-size: 0.66rem; font-weight: 700; border-radius: 999px; padding: 0 5px; min-width: 16px; line-height: 16px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 0.92rem; z-index: 9; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) {
  .card, .box { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<div class="app" id="app">
  <header class="top">
    <h1>Estudo <span>INSS</span></h1>
    <div class="top-right">
      <div class="sync" id="sync"><i></i><span>Conectando…</span></div>
      <button class="tema" id="tema" type="button" aria-label="Mudar tema"></button>
    </div>
  </header>
  <main id="view" style="display:flex;flex-direction:column;gap:16px"></main>
</div>
<div class="toast" id="toast" hidden></div>

<nav class="tabs" id="tabs">
  <button class="tab" data-tab="hoje"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Hoje</button>
  <button class="tab" data-tab="teoria"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6"/></svg>Teoria</button>
  <button class="tab" data-tab="questoes"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Questões</button>

  <button class="tab" data-tab="desempenho"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Desempenho</button>
</nav>

<script id="dados-questoes" type="application/json">[{"id":"DP-001","disciplina":"Direito Previdenciário","assunto":"EC 103/2019 - Regra geral (novos segurados)","enunciado":"Considerando a Emenda Constitucional nº 103/2019, é correto afirmar que, para os segurados filiados ao RGPS após a data de promulgação da referida emenda, a aposentadoria por idade exige idade mínima de 62 anos para a mulher e 65 anos para o homem, mantido o tempo mínimo de contribuição de 15 anos para ambos os sexos.","gabarito":"Errado","comentario":"Na regra geral pós-EC 103/2019, a idade mínima é de fato 62 anos (mulher) e 65 anos (homem), mas o tempo mínimo de contribuição NÃO é igual para os dois sexos: a mulher precisa de 15 anos de contribuição, enquanto o homem precisa de 20 anos.","legislacao":"EC 103/2019, art. 19 (nova redação ao art. 201, §7º, da CF) e art. 26 da Lei 8.213/1991.","pegadinha":"A banca iguala o tempo de contribuição dos dois sexos (15 anos) quando na regra geral o homem precisa de 20 anos.","resumo_flash":"Para quem se filiou ao RGPS após 13/11/2019 (regra geral, sem transição), a aposentadoria por idade exige 62 anos + 15 anos de contribuição para mulheres e 65 anos + 20 anos de contribuição para homens. A idade é diferente E o tempo de contribuição também.","dica_padrao":"A banca adora igualar valores que na lei são diferentes entre homem e mulher (idade, tempo de contribuição, pontos). Sempre confira os dois números, não só um deles.","recorrencia":"alta","tags":["EC103","aposentadoria por idade","regra geral"]},{"id":"DP-002","disciplina":"Direito Previdenciário","assunto":"EC 103/2019 - Regra de transição por pontos","enunciado":"Pela regra de transição por pontos, instituída pela EC 103/2019, a soma da idade com o tempo de contribuição exigida em 2019 era de 86 pontos para mulheres e 96 pontos para homens, havendo acréscimo de um ponto a cada ano até atingir o limite de 100 pontos para mulheres e 105 pontos para homens.","gabarito":"Certo","comentario":"Correto. A regra de transição por pontos (também chamada 86/96 progressivo) começou em 2019 com 86 pontos (mulher) e 96 pontos (homem), subindo um ponto por ano até estabilizar em 100 pontos (mulher) e 105 pontos (homem).","legislacao":"EC 103/2019, art. 15.","pegadinha":"Costuma trocar os números entre si (ex.: inverter 86/96) ou alterar o teto final (100/105): leia os números com atenção.","resumo_flash":"Quem já era filiado ao RGPS antes da EC103/2019 pode usar a regra de transição por pontos: soma de idade + tempo de contribuição. Começou em 86 pontos (mulher) e 96 (homem) em 2019, subindo 1 ponto por ano até 100 (mulher) e 105 (homem).","dica_padrao":"A banca troca os números-base (86/96) ou o teto final (100/105) entre si, ou inverte qual número é da mulher e qual é do homem.","recorrencia":"alta","tags":["EC103","regra de transição","sistema de pontos"]},{"id":"DP-003","disciplina":"Direito Previdenciário","assunto":"EC 103/2019 - Pedágio de 100%","enunciado":"Na regra de transição do pedágio de 100%, o segurado deverá cumprir, além do tempo que faltava para completar o tempo de contribuição na data de entrada em vigor da EC 103/2019, um período adicional equivalente, exigindo-se ainda idade mínima de 57 anos para a mulher e 60 anos para o homem.","gabarito":"Certo","comentario":"Correto. O pedágio de 100% exige o cumprimento de um período adicional idêntico ao tempo que faltava em 13/11/2019, somado à idade mínima de 57 anos (mulher) e 60 anos (homem).","legislacao":"EC 103/2019, art. 20.","pegadinha":"Pode confundir com o pedágio de 50% (que não exige idade mínima, apenas o tempo de contribuição integralizado + 50% do tempo faltante).","resumo_flash":"No pedágio de 100%, quem faltava pouco tempo para se aposentar em 13/11/2019 pode cumprir o dobro do tempo que faltava (o tempo faltante + um pedágio de 100% dele), desde que também atinja idade mínima de 57 anos (mulher) ou 60 anos (homem).","dica_padrao":"Não confunda com o pedágio de 50% (sem exigência de idade mínima): a banca gosta de trocar os dois pedágios entre si ou trocar as idades mínimas.","recorrencia":"alta","tags":["EC103","pedágio 100%","regra de transição"]},{"id":"DP-004","disciplina":"Direito Previdenciário","assunto":"Nomenclatura dos benefícios por incapacidade","enunciado":"A reforma da previdência alterou a nomenclatura do antigo auxílio-doença, que passou a ser denominado auxílio por incapacidade temporária, mantendo-se, contudo, a antiga denominação 'aposentadoria por invalidez', que não sofreu qualquer alteração terminológica.","gabarito":"Errado","comentario":"A aposentadoria por invalidez também teve sua nomenclatura alterada, passando a se chamar aposentadoria por incapacidade permanente. Portanto, a afirmação de que essa denominação não mudou está incorreta.","legislacao":"Lei 8.213/1991, arts. 42 e 59, com redação dada pela Lei 13.846/2019.","pegadinha":"Afirma que só o auxílio-doença mudou de nome, escondendo que a aposentadoria por invalidez também foi renomeada.","resumo_flash":"A reforma trocou os nomes de dois benefícios: auxílio-doença virou 'auxílio por incapacidade temporária' e aposentadoria por invalidez virou 'aposentadoria por incapacidade permanente'. É mudança de nome: as regras de concessão continuam parecidas.","dica_padrao":"A banca costuma afirmar que só um dos dois benefícios mudou de nome, escondendo que os DOIS foram renomeados.","recorrencia":"alta","tags":["nomenclatura","incapacidade","benefícios por incapacidade"]},{"id":"DP-005","disciplina":"Direito Previdenciário","assunto":"Cálculo da renda mensal inicial (RMI)","enunciado":"Para os benefícios concedidos após a EC 103/2019, a renda mensal inicial da aposentadoria será calculada com base na média aritmética de todos os salários de contribuição, correspondendo a 60% dessa média, acrescida de 2 pontos percentuais para cada ano de contribuição que exceder 20 anos, tanto para homens quanto para mulheres.","gabarito":"Errado","comentario":"O acréscimo de 2 pontos percentuais por ano excedente incide sobre 20 anos de contribuição para o homem, mas sobre apenas 15 anos de contribuição para a mulher. A questão erra ao igualar o marco para os dois sexos.","legislacao":"Lei 8.213/1991, art. 26, com redação dada pela EC 103/2019.","pegadinha":"Iguala o marco de 20 anos para ambos os sexos; para a mulher o marco excedente é 15 anos.","resumo_flash":"A renda mensal do benefício é 60% da média de todos os salários de contribuição, mais 2% para cada ano que exceder o tempo mínimo: esse tempo mínimo é 20 anos para o homem e 15 anos para a mulher (números diferentes).","dica_padrao":"A pegadinha clássica é usar '20 anos' para os dois sexos, escondendo que a mulher tem um marco menor (15 anos).","recorrencia":"alta","tags":["RMI","cálculo do benefício","EC103"]},{"id":"DP-006","disciplina":"Direito Previdenciário","assunto":"Benefício de Prestação Continuada (BPC/LOAS)","enunciado":"O Benefício de Prestação Continuada (BPC/LOAS) é devido ao idoso com 65 anos de idade ou mais e à pessoa com deficiência, desde que comprovada a incapacidade de prover a própria manutenção, com renda familiar per capita inferior a 1/4 do salário-mínimo, sendo benefício de natureza previdenciária que exige carência de contribuições.","gabarito":"Errado","comentario":"O BPC/LOAS é benefício de natureza ASSISTENCIAL (não previdenciária), custeado pela Assistência Social, e não exige contribuição prévia (carência) nem filiação ao RGPS.","legislacao":"CF/1988, art. 203, V; Lei 8.742/1993 (LOAS), art. 20.","pegadinha":"Classifica o BPC como benefício previdenciário com exigência de carência: na verdade é assistencial e não contributivo.","resumo_flash":"O BPC/LOAS é um benefício ASSISTENCIAL (não previdenciário): não exige contribuição prévia nem carência. É pago a idoso (65+) ou pessoa com deficiência com renda familiar per capita de até 1/4 do salário mínimo.","dica_padrao":"A banca gosta de chamar o BPC de 'benefício previdenciário' ou de exigir 'carência': ambos são erros, pois o BPC é assistencial e não contributivo.","recorrencia":"alta","tags":["BPC","LOAS","assistência social"]},{"id":"PT-001","disciplina":"Português","assunto":"Pronomes relativos","enunciado":"No trecho 'As normas previdenciárias, que sofreram alterações significativas, aplicam-se a todos os segurados', o pronome relativo 'que' poderia ser substituído por 'as quais' sem prejuízo da correção gramatical e do sentido original do texto.","gabarito":"Certo","comentario":"O pronome relativo 'que' retoma 'normas' (substantivo feminino plural); 'as quais' concorda corretamente em gênero e número com o antecedente, sendo substituição gramaticalmente válida.","legislacao":"Não se aplica (questão de língua portuguesa).","pegadinha":"Bancas costumam trocar o pronome substituto por um que não concorde em gênero/número com o antecedente.","resumo_flash":"O pronome relativo 'que' pode, em geral, ser substituído por 'o(a) qual/os(as) quais', desde que a concordância de gênero e número com o antecedente seja respeitada.","dica_padrao":"A banca troca o substituto por uma forma que não concorda em gênero/número com a palavra que ele retoma: sempre confira essa concordância.","recorrencia":"media","tags":["pronome relativo","concordância"]},{"id":"PT-002","disciplina":"Português","assunto":"Crase","enunciado":"Na frase 'A aposentadoria refere-se à segurados que atingiram a idade mínima', o emprego do acento indicativo de crase está correto, pois há regência nominal exigindo a preposição 'a' combinada com o artigo feminino que precede o substantivo 'segurados'.","gabarito":"Errado","comentario":"Não há crase antes de substantivo masculino ('segurados'). A crase somente ocorre com a fusão da preposição 'a' com artigo feminino 'a(s)'; o correto seria 'refere-se a segurados', sem acento indicativo de crase.","legislacao":"Não se aplica (questão de língua portuguesa).","pegadinha":"Justifica a crase com uma regra genérica de regência, ignorando que o substantivo seguinte é masculino.","resumo_flash":"Crase é a fusão da preposição 'a' com o artigo feminino 'a(s)'. Ela nunca ocorre antes de palavra masculina: precisa haver artigo feminino exigido pela regência do termo anterior.","dica_padrao":"A banca 'justifica' uma crase inventando uma regência, mas ignora que a palavra seguinte é masculina: sempre olhe o gênero da palavra depois do 'a'.","recorrencia":"media","tags":["crase"]},{"id":"RLM-001","disciplina":"Raciocínio Lógico-Matemático","assunto":"Lógica proposicional - silogismo","enunciado":"Se todos os servidores do INSS são concursados, e João é servidor do INSS, então, pela lógica, é correto concluir que João é concursado.","gabarito":"Certo","comentario":"Trata-se de um silogismo válido (modus ponens): premissa universal + caso particular leva à conclusão necessariamente verdadeira.","legislacao":"Não se aplica (questão de raciocínio lógico).","pegadinha":"Bancas costumam inverter a premissa ('todo concursado é servidor do INSS') para induzir a uma falsa generalização.","resumo_flash":"Num silogismo válido, se a premissa geral é verdadeira ('todo A é B') e um caso particular se encaixa nela ('X é A'), a conclusão ('X é B') é necessariamente verdadeira.","dica_padrao":"A banca inverte a premissa (trocando 'todo A é B' por 'todo B é A') para induzir uma generalização falsa: cuidado com o sentido da implicação.","recorrencia":"media","tags":["silogismo","lógica proposicional"]},{"id":"RLM-002","disciplina":"Raciocínio Lógico-Matemático","assunto":"Conectivos lógicos - conjunção","enunciado":"Considere a proposição composta 'P e Q'. Se P é falsa e Q é verdadeira, então a proposição composta 'P e Q' é verdadeira.","gabarito":"Errado","comentario":"A conjunção ('E') só é verdadeira quando AMBAS as proposições simples são verdadeiras. Sendo P falsa, 'P e Q' é necessariamente falsa, independentemente do valor de Q.","legislacao":"Não se aplica (questão de raciocínio lógico).","pegadinha":"Confunde a tabela-verdade da conjunção (E) com a da disjunção (OU), que seria verdadeira nesse caso.","resumo_flash":"Na lógica, a conjunção 'E' só é verdadeira quando AMBAS as partes são verdadeiras. Basta uma ser falsa para a proposição composta inteira ser falsa.","dica_padrao":"A banca troca a tabela-verdade do 'E' com a do 'OU': lembre-se: 'E' é mais exigente (precisa das duas), 'OU' basta uma.","recorrencia":"media","tags":["tabela-verdade","conjunção"]},{"id":"INF-001","disciplina":"Informática","assunto":"Excel - função SE","enunciado":"No Microsoft Excel, a fórmula =SE(A1>10;\"Aprovado\";\"Reprovado\") retornará o texto 'Aprovado' caso o valor contido na célula A1 seja maior que 10, e 'Reprovado', caso contrário.","gabarito":"Certo","comentario":"A função SE(teste_lógico; valor_se_verdadeiro; valor_se_falso) funciona exatamente conforme descrito: avalia a condição A1>10 e retorna um dos dois textos conforme o resultado.","legislacao":"Não se aplica (questão de informática).","pegadinha":"Pode inverter a ordem dos parâmetros ou trocar o operador de comparação para testar atenção ao detalhe.","resumo_flash":"A função =SE(teste;valor_se_verdadeiro;valor_se_falso) do Excel avalia uma condição lógica e retorna um valor diferente dependendo do resultado ser verdadeiro ou falso.","dica_padrao":"A banca troca a ordem dos parâmetros ou o operador de comparação (> por >=, por exemplo): leia a fórmula com atenção a cada símbolo.","recorrencia":"media","tags":["excel","função SE"]},{"id":"INF-002","disciplina":"Informática","assunto":"Becape (backup) incremental","enunciado":"Um becape (backup) incremental copia apenas os arquivos que foram alterados desde o último becape (completo ou incremental), sendo sempre necessário apenas o becape completo mais recente para a restauração total dos dados, independentemente da quantidade de becapes incrementais realizados posteriormente.","gabarito":"Errado","comentario":"Para restaurar totalmente os dados a partir de becapes incrementais, é necessário o último becape completo E TODOS os becapes incrementais realizados em sequência após ele: não apenas o completo mais recente.","legislacao":"Não se aplica (questão de informática).","pegadinha":"Omite a necessidade de aplicar todos os incrementais em sequência, confundindo com a lógica do becape diferencial.","resumo_flash":"Para restaurar totalmente os dados a partir de becapes incrementais, você precisa do último becape COMPLETO mais TODOS os incrementais feitos depois dele, em sequência: não só do mais recente.","dica_padrao":"A banca afirma que basta o becape completo mais recente, escondendo a necessidade de aplicar todos os incrementais na ordem certa.","recorrencia":"media","tags":["backup","becape incremental"]},{"id":"ADM-001","disciplina":"Direito Administrativo","assunto":"Atributos do ato administrativo - autoexecutoriedade","enunciado":"Constitui atributo do ato administrativo a autoexecutoriedade, que consiste na possibilidade de a administração pública executar suas decisões e, se necessário, empregar meios diretos de coação, independentemente de prévia autorização judicial, exigindo-se, todavia, previsão legal expressa ou situação de urgência.","gabarito":"Certo","comentario":"Correto. A autoexecutoriedade permite à Administração executar seus próprios atos sem necessidade de intervenção judicial prévia, mas depende de previsão legal expressa ou de situação de urgência que justifique a atuação imediata.","legislacao":"Doutrina de Direito Administrativo (atributos do ato administrativo: presunção de legitimidade, imperatividade, autoexecutoriedade e tipicidade).","pegadinha":"Pode omitir a exigência de previsão legal/urgência, fazendo parecer que a autoexecutoriedade é absoluta e incondicionada.","resumo_flash":"Autoexecutoriedade é a Administração poder executar suas próprias decisões sem pedir autorização prévia ao Judiciário: mas só quando há lei permitindo isso ou numa situação de urgência.","dica_padrao":"A banca costuma tirar a condição ('previsão legal ou urgência') e apresentar a autoexecutoriedade como um poder absoluto e sem limites.","recorrencia":"media","tags":["ato administrativo","autoexecutoriedade"]},{"id":"ADM-002","disciplina":"Direito Administrativo","assunto":"Princípio da autotutela","enunciado":"O princípio da autotutela autoriza a administração pública a rever seus próprios atos, anulando-os quando ilegais ou revogando-os quando inconvenientes ou inoportunos, sendo tal entendimento consagrado nas Súmulas 346 e 473 do STF.","gabarito":"Certo","comentario":"Correto. A autotutela permite à Administração anular atos ilegais e revogar atos inconvenientes/inoportunos, independentemente de provocação do Judiciário, conforme consagrado nas Súmulas 346 e 473 do STF.","legislacao":"Súmulas 346 e 473 do STF; Lei 9.784/1999, art. 53.","pegadinha":"Pode trocar 'anular' por 'revogar' (ou vice-versa) nas hipóteses de ilegalidade x inconveniência, invertendo os conceitos.","resumo_flash":"Pela autotutela, a Administração pode rever seus próprios atos: ANULA os ilegais e REVOGA os inconvenientes/inoportunos: sem precisar ir à Justiça (Súmulas 346 e 473 do STF).","dica_padrao":"A pegadinha clássica troca 'anular' por 'revogar' (ou o contrário): anular é por ILEGALIDADE, revogar é por CONVENIÊNCIA.","recorrencia":"media","tags":["autotutela","anulação","revogação"]},{"id":"CONST-001","disciplina":"Direito Constitucional","assunto":"Seguridade Social - financiamento","enunciado":"A seguridade social, nos termos do art. 194 da Constituição Federal, compreende um conjunto integrado de ações de iniciativa exclusiva dos poderes públicos, destinadas a assegurar os direitos relativos à saúde, à previdência e à assistência social, sendo vedada a participação da sociedade civil em sua organização e financiamento.","gabarito":"Errado","comentario":"O art. 194 da CF prevê expressamente que a seguridade social é organizada com base na iniciativa dos PODERES PÚBLICOS E DA SOCIEDADE, e o financiamento é tripartite (governo, empresas e trabalhadores), conforme art. 195 da CF.","legislacao":"CF/1988, arts. 194 e 195.","pegadinha":"Afirma exclusividade do poder público e veda a participação da sociedade, contrariando o texto expresso do art. 194 da CF.","resumo_flash":"A seguridade social (art. 194 CF) é organizada pelo Poder Público E pela sociedade: o financiamento é tripartite: governo, empresas e trabalhadores (art. 195 CF), não é exclusividade do Estado.","dica_padrao":"A banca afirma que só o poder público participa/financia a seguridade social, escondendo a participação expressa da sociedade prevista na CF.","recorrencia":"alta","tags":["seguridade social","art. 194","financiamento tripartite"]},{"id":"CONST-002","disciplina":"Direito Constitucional","assunto":"Regime Geral de Previdência Social - caráter contributivo","enunciado":"Nos termos do art. 201 da Constituição Federal, com redação dada pela EC 103/2019, o Regime Geral de Previdência Social tem caráter contributivo e de filiação obrigatória, observados critérios que preservem o equilíbrio financeiro e atuarial.","gabarito":"Certo","comentario":"Correto, reprodução praticamente literal do caput do art. 201 da CF/1988, que consagra o RGPS como regime contributivo, de filiação obrigatória, organizado sob a lógica do equilíbrio financeiro e atuarial.","legislacao":"CF/1988, art. 201, caput, com redação dada pela EC 103/2019.","pegadinha":"Pode substituir 'equilíbrio financeiro e atuarial' por outro critério (ex.: 'superávit orçamentário') para testar memorização literal do texto constitucional.","resumo_flash":"O RGPS (art. 201 CF) é contributivo e de filiação obrigatória, organizado para preservar o equilíbrio financeiro e atuarial do sistema: essa é praticamente a redação literal do artigo.","dica_padrao":"A banca troca 'equilíbrio financeiro e atuarial' por outro critério parecido (ex.: 'superávit orçamentário') para testar decoreba do texto constitucional.","recorrencia":"alta","tags":["RGPS","art. 201","equilíbrio financeiro e atuarial"]},{"id":"DP-007","disciplina":"Direito Previdenciário","assunto":"Benefícios de legislação especial - Seringueiros","enunciado":"Os seringueiros que trabalharam nos seringais da Amazônia durante a Segunda Guerra Mundial têm direito ao pagamento de pensão mensal vitalícia correspondente a dois salários mínimos, sendo essa pensão devida independentemente de comprovação de necessidade econômica atual do beneficiário.","gabarito":"Certo","comentario":"Correto. A pensão especial aos seringueiros ('Soldados da Borracha') independe de comprovação de miserabilidade atual, sendo devida vitaliciamente no valor de dois salários mínimos, em reconhecimento ao serviço prestado ao país durante a 2ª Guerra Mundial.","legislacao":"Lei 7.986/1989.","pegadinha":"Pode inserir a exigência de comprovação de necessidade econômica atual, que na verdade não existe para este benefício específico.","resumo_flash":"Os 'Soldados da Borracha' (seringueiros que trabalharam na Amazônia durante a 2ª Guerra) têm direito a uma pensão vitalícia de 2 salários mínimos, sem precisar provar que ainda precisam do dinheiro hoje.","dica_padrao":"A banca tenta inventar uma exigência de comprovação de necessidade atual que não existe para este benefício específico.","recorrencia":"media","tags":["legislação especial","seringueiros","pensão especial"]},{"id":"DP-008","disciplina":"Direito Previdenciário","assunto":"Benefícios de legislação especial - Hemodiálise de Caruaru","enunciado":"A pensão especial concedida às vítimas do incidente de contaminação por hemodiálise ocorrido em Caruaru/PE não é transmissível aos seus sucessores em caso de falecimento do beneficiário.","gabarito":"Certo","comentario":"Correto. Diferentemente da pensão especial das vítimas do acidente radioativo de Goiânia (que É transmissível), a pensão das vítimas de Caruaru é pessoal e se extingue com o falecimento do beneficiário.","legislacao":"Lei 9.422/1996.","pegadinha":"Costuma trocar a regra de transmissibilidade com a da pensão de Goiânia, que segue lógica oposta.","resumo_flash":"As vítimas da tragédia da hemodiálise contaminada em Caruaru/PE recebem pensão especial PESSOAL: não passa para os herdeiros quando o beneficiário morre.","dica_padrao":"Não confunda com a pensão de Goiânia, que tem a regra oposta (é transmissível). A banca adora trocar as duas entre si.","recorrencia":"media","tags":["legislação especial","Caruaru","pensão especial"]},{"id":"DP-009","disciplina":"Direito Previdenciário","assunto":"Benefícios de legislação especial - Acidente de Goiânia","enunciado":"A pensão especial concedida às vítimas do acidente radioativo ocorrido em Goiânia/GO, ao contrário da pensão devida às vítimas de Caruaru, é transmissível ao cônjuge sobrevivente ou aos herdeiros em caso de morte do beneficiário.","gabarito":"Certo","comentario":"Correto. A pensão especial das vítimas do acidente radioativo de Goiânia é transmissível aos sucessores, ao contrário da pensão das vítimas de Caruaru, que se extingue com o óbito do beneficiário.","legislacao":"Lei 9.425/1996.","pegadinha":"Pode inverter as regras de transmissibilidade entre as pensões de Goiânia e de Caruaru.","resumo_flash":"As vítimas do acidente radioativo de Goiânia/GO recebem pensão especial que É transmissível ao cônjuge ou herdeiros em caso de morte do beneficiário: ao contrário da pensão de Caruaru.","dica_padrao":"A banca inverte a regra de transmissibilidade entre Goiânia e Caruaru: decore que só Goiânia transmite.","recorrencia":"media","tags":["legislação especial","Goiânia","pensão especial"]},{"id":"DP-010","disciplina":"Direito Previdenciário","assunto":"Benefícios de legislação especial - Síndrome da talidomida","enunciado":"A pensão especial devida às pessoas com deficiência física decorrente do uso da talidomida tem seu valor calculado com base em número de pontos correspondente ao tipo e grau da deformidade física, sendo reajustada nas mesmas épocas e critérios dos benefícios do RGPS.","gabarito":"Certo","comentario":"Correto. A Lei 7.070/1982 instituiu sistema de pontuação conforme o tipo e o grau da deformidade física causada pela talidomida para cálculo do valor da pensão especial, reajustada junto com os demais benefícios do RGPS.","legislacao":"Lei 7.070/1982, art. 2º.","pegadinha":"Pode afirmar que o valor é fixo e igual para todos os beneficiários, ignorando o sistema de pontuação por grau de deformidade.","resumo_flash":"A pensão da síndrome da talidomida não tem valor fixo: é calculada por pontos, de acordo com o tipo e o grau da deformidade física de cada pessoa, e reajustada junto com os benefícios do RGPS.","dica_padrao":"A banca pode insinuar que o valor é igual para todos: na verdade varia conforme uma tabela de pontuação por gravidade.","recorrencia":"media","tags":["legislação especial","talidomida","pensão especial"]},{"id":"DP-011","disciplina":"Direito Previdenciário","assunto":"Benefícios de legislação especial - Hanseníase","enunciado":"A pensão especial mensal, vitalícia e indenizatória devida às pessoas atingidas pela hanseníase que foram submetidas a isolamento e internação compulsórios em hospitais-colônia até 1986 é acumulável com o benefício de aposentadoria concedido pelo RGPS.","gabarito":"Certo","comentario":"Correto. Por ter caráter indenizatório, a pensão especial da hanseníase é cumulável com quaisquer outros benefícios previdenciários ou assistenciais recebidos pelo beneficiário, inclusive aposentadoria.","legislacao":"Lei 11.520/2007.","pegadinha":"Pode afirmar que o benefício é substitutivo da aposentadoria (não acumulável), quando na verdade tem natureza indenizatória e cumulativa.","resumo_flash":"A pensão especial das pessoas isoladas compulsoriamente por hanseníase (até 1986) tem natureza indenizatória, por isso PODE ser acumulada com aposentadoria e outros benefícios do RGPS.","dica_padrao":"A banca tenta fazer parecer que é um benefício substitutivo (não cumulável): mas, por ser indenização, a regra é a cumulação.","recorrencia":"media","tags":["legislação especial","hanseníase","pensão especial"]},{"id":"DP-012","disciplina":"Direito Previdenciário","assunto":"Benefícios de legislação especial - Síndrome congênita do zika vírus","enunciado":"A pensão especial destinada às crianças com síndrome congênita do zika vírus, nascidas entre 1º de janeiro de 2015 e 31 de dezembro de 2019, é mensal, vitalícia, intransferível e cumulável com o Benefício de Prestação Continuada (BPC), quando a criança também preencher os requisitos deste último.","gabarito":"Certo","comentario":"Correto. A Lei 13.985/2020 instituiu essa pensão especial, que é cumulável com o BPC/LOAS, diferentemente de outros benefícios assistenciais que costumam ter regra de não cumulação.","legislacao":"Lei 13.985/2020.","pegadinha":"Pode afirmar que a pensão é incompatível com o BPC, seguindo a regra geral de não cumulação de benefícios assistenciais: mas este é um caso excepcional de cumulação expressamente prevista em lei.","resumo_flash":"Crianças com síndrome congênita do zika (nascidas entre 2015 e 2019) têm pensão especial vitalícia e intransferível que, excepcionalmente, PODE ser acumulada com o BPC, se a criança também preencher os requisitos do BPC.","dica_padrao":"A regra geral é que benefícios assistenciais não acumulam entre si: esta é uma exceção expressa em lei, e a banca gosta de testar se você sabe da exceção.","recorrencia":"media","tags":["legislação especial","zika","pensão especial","BPC"]},{"id":"DP-013","disciplina":"Direito Previdenciário","assunto":"Anistiados políticos","enunciado":"O regime do anistiado político compreende, entre outros direitos, a reparação econômica de caráter indenizatório, podendo ser paga em prestação única ou em prestação mensal, permanente e continuada, sendo vedadas a readmissão e a promoção do anistiado na inatividade.","gabarito":"Certo","comentario":"Correto. A Lei 10.559/2002 prevê a reparação econômica ao anistiado político em prestação única ou mensal permanente, vedando expressamente a readmissão ao serviço público e a promoção na inatividade.","legislacao":"Lei 10.559/2002, art. 1º.","pegadinha":"Pode afirmar que a readmissão e a promoção na inatividade são permitidas, contrariando a vedação expressa da lei.","resumo_flash":"O anistiado político recebe reparação econômica (única ou mensal e permanente), mas fica proibido de voltar ao cargo (readmissão) ou de ser promovido enquanto inativo.","dica_padrao":"A banca pode inverter e dizer que a readmissão/promoção são permitidas: decore que ambas são vedadas.","recorrencia":"baixa","tags":["legislação especial","anistiado político"]},{"id":"DP-014","disciplina":"Direito Previdenciário","assunto":"Crimes previdenciários - Apropriação indébita","enunciado":"Comete o crime de apropriação indébita previdenciária a empresa que desconta a contribuição previdenciária devida pelo trabalhador sobre seu salário, mas deixa de repassar o valor descontado à Previdência Social.","gabarito":"Certo","comentario":"Correto. A apropriação indébita previdenciária ocorre quando a empresa desconta a contribuição do segurado (que já saiu do patrimônio do trabalhador) e não repassa o valor ao INSS/Receita Federal.","legislacao":"Código Penal, art. 168-A.","pegadinha":"Costuma confundir com sonegação de contribuição, que ocorre quando a empresa deixa de recolher contribuição de sua própria responsabilidade, sem ter descontado de terceiro.","resumo_flash":"Apropriação indébita previdenciária = a empresa DESCONTA a contribuição do salário do empregado, mas não repassa esse valor ao INSS/Receita Federal. O dinheiro já saiu do bolso do trabalhador.","dica_padrao":"A banca troca esse crime com sonegação: a diferença-chave é: houve desconto prévio do trabalhador que não foi repassado?","recorrencia":"media","tags":["crimes previdenciários","apropriação indébita"]},{"id":"DP-015","disciplina":"Direito Previdenciário","assunto":"Crimes previdenciários - Sonegação de contribuição","enunciado":"Constitui sonegação de contribuição previdenciária, e não apropriação indébita, a conduta da empresa que declara valor de salário do trabalhador inferior ao efetivamente pago, com o objetivo de reduzir o valor da contribuição devida.","gabarito":"Certo","comentario":"Correto. A sonegação de contribuição previdenciária (art. 337-A do Código Penal) envolve omitir ou fraudar informações para suprimir ou reduzir contribuição, diferentemente da apropriação indébita, que pressupõe desconto prévio não repassado.","legislacao":"Código Penal, art. 337-A.","pegadinha":"Pode trocar os nomes dos dois crimes entre si, invertendo os conceitos de sonegação e apropriação indébita.","resumo_flash":"Sonegação de contribuição previdenciária = a empresa omite ou falsifica informações (ex.: declara salário menor) para pagar menos contribuição própria: não envolve desconto de terceiro não repassado.","dica_padrao":"Se a questão fala em 'descontar do empregado e não repassar', é apropriação indébita, não sonegação: cuidado para não trocar os dois.","recorrencia":"media","tags":["crimes previdenciários","sonegação"]},{"id":"DP-016","disciplina":"Direito Previdenciário","assunto":"Pensão por morte - Cota familiar","enunciado":"Na sistemática atual da pensão por morte do RGPS, o valor do benefício corresponde a uma cota familiar de 50% do valor da aposentadoria que o segurado recebia ou teria direito, acrescida de 10 pontos percentuais por dependente, até o limite de 100%.","gabarito":"Certo","comentario":"Correto. Desde a Lei 13.135/2015, a pensão por morte não é mais igual a 100% do benefício automaticamente: é uma cota familiar de 50%, acrescida de 10% por dependente habilitado, até atingir 100% com 5 dependentes ou mais.","legislacao":"Lei 8.213/1991, art. 75, com redação dada pela Lei 13.135/2015.","pegadinha":"Pode afirmar que a pensão corresponde sempre a 100% do benefício do instituidor, independentemente do número de dependentes: regra antiga (pré-2015), hoje incorreta.","resumo_flash":"Desde 2015, a pensão por morte NÃO é mais 100% automático: é uma cota familiar de 50% do benefício do falecido, mais 10% por dependente, até o teto de 100% (com 5 dependentes ou mais).","dica_padrao":"A banca adora usar a regra antiga (100% sempre) como se ainda valesse: desconfie de questões que dizem 'pensão integral' sem falar em cota.","recorrencia":"alta","tags":["pensão por morte","cota familiar"]},{"id":"DP-017","disciplina":"Direito Previdenciário","assunto":"Pensão por morte - Duração para cônjuge/companheiro","enunciado":"A duração do pagamento da pensão por morte ao cônjuge ou companheiro é vitalícia em qualquer hipótese, independentemente do tempo de casamento ou união estável e da idade do dependente na data do óbito do segurado.","gabarito":"Errado","comentario":"A duração vitalícia só é garantida se, cumpridos os requisitos mínimos de casamento/união estável (regra geral: 2 anos) e de contribuições (18 contribuições mensais do instituidor), a idade do dependente no óbito for igual ou superior a 44 anos; para idades menores, a duração é limitada por faixas de anos, conforme tabela legal.","legislacao":"Lei 8.213/1991, art. 77, §2º, V, com redação dada pela Lei 13.135/2015.","pegadinha":"Generaliza a vitaliciedade para 'qualquer hipótese', ignorando as regras de duração vinculadas à idade do dependente e ao tempo de relação conjugal.","resumo_flash":"A pensão por morte para cônjuge/companheiro só é vitalícia se, cumpridos os requisitos mínimos (2 anos de casamento/união + 18 contribuições do falecido), o dependente tinha 44 anos ou mais na data do óbito. Para idade menor, a duração é por faixas de anos.","dica_padrao":"A banca afirma vitaliciedade 'em qualquer hipótese': sempre cheque a idade do dependente e o tempo de relação antes de aceitar isso.","recorrencia":"alta","tags":["pensão por morte","duração do benefício"]},{"id":"DP-018","disciplina":"Direito Previdenciário","assunto":"BPC/LOAS - Auxílio-inclusão","enunciado":"O auxílio-inclusão, benefício previdenciário destinado à pessoa com deficiência que deixa de receber o BPC em razão do início de atividade remunerada, pode ser acumulado com o próprio Benefício de Prestação Continuada durante o período de transição.","gabarito":"Errado","comentario":"O auxílio-inclusão substitui o BPC quando a pessoa com deficiência passa a exercer atividade remunerada; o pagamento do auxílio-inclusão NÃO é acumulável com o pagamento do BPC: são benefícios mutuamente excludentes.","legislacao":"Lei 8.742/1993 (LOAS), art. 26, com redação dada pela Lei 14.176/2021.","pegadinha":"Afirma cumulação entre BPC e auxílio-inclusão, quando a lei estabelece que um substitui o outro.","resumo_flash":"O auxílio-inclusão substitui o BPC quando a pessoa com deficiência começa a trabalhar: os dois benefícios NÃO podem ser recebidos ao mesmo tempo.","dica_padrao":"A banca tenta insinuar que dá para acumular BPC + auxílio-inclusão durante uma 'transição': não existe essa acumulação.","recorrencia":"alta","tags":["BPC","auxílio-inclusão"]},{"id":"DP-019","disciplina":"Direito Previdenciário","assunto":"Segurado especial - Comprovação da atividade rural","enunciado":"José exerce atividade rural em regime de parceria, sem empregados, contando apenas com a ajuda de familiares para cultivo de subsistência. Nessa situação, José é enquadrado como segurado especial da Previdência Social, sendo que, para fins de aposentadoria por idade, a comprovação do exercício da atividade rural prescinde de início de prova documental, bastando prova testemunhal isolada.","gabarito":"Errado","comentario":"A classificação de José como segurado especial está correta. Porém, a comprovação do tempo de atividade rural exige início de prova material (documental), não sendo admitida prova exclusivamente testemunhal, conforme entendimento sumulado do STJ.","legislacao":"Lei 8.213/1991, art. 11, VII; Súmula 149 do STJ.","pegadinha":"A primeira parte da assertiva está correta (segurado especial), o que pode induzir o candidato a marcar Certo sem notar o erro na segunda parte, sobre a prova exclusivamente testemunhal.","resumo_flash":"Trabalhador rural em regime de economia familiar, sem empregados, é segurado especial. Mas para comprovar esse tempo (ex.: aposentadoria por idade), a lei exige um INÍCIO DE PROVA DOCUMENTAL: só testemunha não basta (Súmula 149 STJ).","dica_padrao":"Questões costumam acertar a classificação (segurado especial) mas errar dizendo que só prova testemunhal já resolve: sempre separe as duas partes da afirmação.","recorrencia":"alta","tags":["segurado especial","prova de atividade rural","Súmula 149 STJ"]},{"id":"DP-020","disciplina":"Direito Previdenciário","assunto":"Contribuinte individual - Administrador não empregado","enunciado":"O administrador não empregado de sociedade limitada, que recebe remuneração pelos serviços prestados à empresa, é enquadrado, para fins previdenciários, como contribuinte individual.","gabarito":"Certo","comentario":"Correto. O administrador não empregado (sem vínculo empregatício, ainda que sócio ou não) que recebe pró-labore ou remuneração pelos serviços é segurado obrigatório na categoria de contribuinte individual.","legislacao":"Lei 8.212/1991, art. 12, V, alínea 'f'.","pegadinha":"Pode classificá-lo erroneamente como segurado facultativo ou como não segurado.","resumo_flash":"Administrador de empresa que NÃO é empregado (ex.: sócio-administrador ou administrador contratado sem vínculo CLT) e recebe remuneração pelos serviços é enquadrado como contribuinte individual perante o INSS.","dica_padrao":"A banca pode tentar classificá-lo como facultativo ou como não segurado: decore que remuneração por serviço prestado, sem vínculo empregatício, é contribuinte individual.","recorrencia":"alta","tags":["contribuinte individual","segurados"]},{"id":"DP-021","disciplina":"Direito Previdenciário","assunto":"Aposentadoria especial - Regra pós-EC 103/2019","enunciado":"A aposentadoria especial é devida ao segurado que comprove, cumulativamente, tempo mínimo de contribuição em atividade especial e exposição a agentes nocivos à saúde ou à integridade física, sendo exigida, após a EC 103/2019, idade mínima de 55, 58 ou 60 anos, conforme o grau de exposição ao risco, para os novos segurados.","gabarito":"Certo","comentario":"Correto. Diferentemente da regra anterior (sem idade mínima), a EC 103/2019 passou a exigir idade mínima para a aposentadoria especial dos novos segurados, variável conforme o grau de exposição ao agente nocivo (15, 20 ou 25 anos de atividade especial correspondem, respectivamente, a 55, 58 ou 60 anos de idade mínima).","legislacao":"EC 103/2019, art. 19, §1º-B e §2º.","pegadinha":"Pode afirmar que não há exigência de idade mínima, reproduzindo a regra anterior à reforma, hoje válida apenas em regras de transição específicas.","resumo_flash":"Depois da EC103/2019, a aposentadoria especial passou a exigir também idade mínima (55, 58 ou 60 anos, conforme o grau de exposição ao agente nocivo), além do tempo mínimo na atividade especial: antes não havia essa exigência de idade.","dica_padrao":"Questões baseadas em regras antigas dizem que não há idade mínima: isso só vale para quem já tinha direito adquirido antes da reforma.","recorrencia":"alta","tags":["aposentadoria especial","EC103","agentes nocivos"]},{"id":"DP-022","disciplina":"Direito Previdenciário","assunto":"RPPS - Contribuição extraordinária pós-EC 103/2019","enunciado":"Após a EC 103/2019, os regimes próprios de previdência social (RPPS) dos servidores públicos passaram a admitir a instituição de contribuição extraordinária, além da contribuição ordinária, para custeio de déficit atuarial, mediante lei de iniciativa do respectivo Poder Executivo.","gabarito":"Certo","comentario":"Correto. A EC 103/2019 incluiu na CF a possibilidade de contribuição extraordinária nos RPPS, destinada ao equacionamento de déficit atuarial, cobrada de servidores ativos, aposentados e pensionistas, por prazo determinado.","legislacao":"CF/1988, art. 149, §1º-A, com redação dada pela EC 103/2019.","pegadinha":"Pode afirmar que só é admitida contribuição ordinária nos RPPS, ignorando a novidade trazida pela EC103 quanto à contribuição extraordinária.","resumo_flash":"A EC103/2019 permitiu que os regimes próprios de previdência dos servidores (RPPS) cobrem uma contribuição EXTRAORDINÁRIA, além da normal, para cobrir déficit atuarial, por tempo determinado e via lei específica.","dica_padrao":"A banca pode negar a existência dessa contribuição extra: ela é uma novidade trazida justamente pela reforma.","recorrencia":"media","tags":["RPPS","EC103","contribuição extraordinária"]},{"id":"ADM-003","disciplina":"Direito Administrativo","assunto":"Ética no serviço público - Decreto 1.171/1994","enunciado":"Conforme o Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal (Decreto nº 1.171/1994), constitui dever fundamental do servidor participar dos movimentos e estudos que se relacionem com a melhoria do exercício de suas funções, tendo por escopo a realização do bem comum.","gabarito":"Certo","comentario":"Correto. O Decreto 1.171/1994 lista, entre os deveres fundamentais do servidor público, a participação em movimentos e estudos ligados à melhoria do exercício funcional, voltados à realização do bem comum.","legislacao":"Decreto 1.171/1994, Anexo, Seção II, XIV.","pegadinha":"Pode afirmar que essa participação é facultativa ou dispensável, quando na verdade é listada expressamente como dever fundamental do servidor.","resumo_flash":"O Código de Ética do servidor federal (Decreto 1.171/1994) lista deveres fundamentais, entre eles: participar de estudos e movimentos voltados à melhoria do exercício da função, visando o bem comum.","dica_padrao":"A banca tenta apresentar esse dever como algo facultativo/dispensável: é dever fundamental, não é opcional.","recorrencia":"media","tags":["ética","Decreto 1.171/1994"]},{"id":"ADM-004","disciplina":"Direito Administrativo","assunto":"Sistema de Gestão da Ética - Decreto 6.029/2007","enunciado":"Compete à Comissão de Ética Pública (CEP) apreciar consultas formuladas por ministros de Estado a respeito de matéria de ética pública, sendo esse órgão integrante do Sistema de Gestão da Ética do Poder Executivo Federal.","gabarito":"Certo","comentario":"Correto. A CEP integra o Sistema de Gestão da Ética do Poder Executivo Federal e é o órgão consultivo competente para apreciar consultas de autoridades de alto escalão, como ministros de Estado, sobre matéria de ética pública.","legislacao":"Decreto 6.029/2007, art. 3º, III.","pegadinha":"Pode atribuir essa competência a uma comissão de ética setorial, quando na verdade é atribuição específica da CEP.","resumo_flash":"A Comissão de Ética Pública (CEP) é o órgão consultivo máximo do Sistema de Gestão da Ética do Executivo Federal: é ela quem aprecia consultas de autoridades de alto escalão, como ministros de Estado.","dica_padrao":"A banca pode atribuir essa competência a uma comissão de ética 'comum' de um órgão: decore que consultas de ministros vão para a CEP.","recorrencia":"media","tags":["ética","Decreto 6.029/2007","Comissão de Ética Pública"]},{"id":"PT-003","disciplina":"Português","assunto":"Tipologia textual - narração x dissertação","enunciado":"Um texto predominantemente narrativo caracteriza-se pela apresentação de fatos organizados numa sequência temporal, com personagens, tempo e espaço definidos, diferindo do texto dissertativo-argumentativo, cujo objetivo central é defender um ponto de vista por meio de argumentos.","gabarito":"Certo","comentario":"Correto. A narração organiza fatos numa sequência temporal com personagens, tempo e espaço; a dissertação-argumentativa tem como objetivo central defender uma tese por meio de argumentos.","legislacao":"Não se aplica (questão de língua portuguesa).","pegadinha":"Pode inverter as características dos dois tipos textuais, atribuindo a defesa de ponto de vista ao texto narrativo.","resumo_flash":"Texto narrativo conta uma sequência de fatos (com personagens, tempo, espaço). Texto dissertativo-argumentativo defende um ponto de vista com argumentos. Texto descritivo apresenta características de algo/alguém, sem sequência de ações.","dica_padrao":"A banca troca as características entre os tipos textuais (ex.: atribuir 'defesa de ponto de vista' à narração): sempre identifique a finalidade do texto antes de julgar.","recorrencia":"alta","tags":["tipologia textual","interpretação de texto"]},{"id":"PT-004","disciplina":"Português","assunto":"Coesão x coerência textual","enunciado":"Em um texto, o uso de um pronome anafórico, que retoma um termo já mencionado anteriormente, é um recurso de coerência textual que evita a repetição desnecessária de palavras.","gabarito":"Errado","comentario":"O uso de pronome anafórico é um recurso de COESÃO (conexão gramatical entre as partes do texto), e não de coerência (que se refere ao sentido lógico do texto como um todo). São conceitos diferentes.","legislacao":"Não se aplica (questão de língua portuguesa).","pegadinha":"Troca 'coesão' por 'coerência': são conceitos diferentes: coesão é a conexão gramatical (pronomes, conjunções); coerência é o sentido lógico geral do texto.","resumo_flash":"Coesão = a 'costura' gramatical entre as partes do texto (pronomes, conjunções, repetições evitadas). Coerência = o sentido lógico do texto fazer sentido como um todo. São conceitos diferentes, e a banca gosta de trocar um pelo outro.","dica_padrao":"Sempre que a questão falar em pronome, conjunção ou repetição evitada, é COESÃO. Se falar em sentido lógico geral do texto, é COERÊNCIA.","recorrencia":"media","tags":["coesão","coerência"]},{"id":"PT-005","disciplina":"Português","assunto":"Regência verbal","enunciado":"Na frase 'O segurado aspira a uma vida financeira mais tranquila após a aposentadoria', o verbo 'aspirar', no sentido de desejar, está empregado com a regência adequada, exigindo a preposição 'a'.","gabarito":"Certo","comentario":"Correto. No sentido de 'desejar', o verbo 'aspirar' é transitivo indireto e exige a preposição 'a' ('aspirar a algo'). Só é transitivo direto (sem preposição) no sentido de 'sorver, inspirar ar'.","legislacao":"Não se aplica (questão de língua portuguesa).","pegadinha":"Pode usar 'aspirar' como transitivo direto (sem preposição) no sentido de 'desejar', o que só é correto no sentido de 'sorver ar'.","resumo_flash":"'Aspirar' no sentido de 'desejar' é transitivo INDIRETO, pede a preposição 'a' (aspirar A algo). Só é transitivo direto (sem preposição) no sentido de 'sorver, inspirar ar'.","dica_padrao":"Sempre confira o SENTIDO do verbo antes de julgar a regência: o mesmo verbo pode mudar de regência conforme o sentido (aspirar, assistir, visar são clássicos).","recorrencia":"media","tags":["regência verbal"]},{"id":"PT-006","disciplina":"Português","assunto":"Pontuação - vírgula entre sujeito e predicado","enunciado":"É obrigatório o uso de vírgula para separar o sujeito de seu predicado, ainda que ambos sejam curtos e não haja qualquer termo intercalado entre eles.","gabarito":"Errado","comentario":"Pelo contrário: é um erro gramatical clássico separar sujeito e predicado por vírgula. A vírgula só aparece nesse ponto quando há um termo intercalado (aposto, oração adjetiva explicativa etc.), isolado por duas vírgulas.","legislacao":"Não se aplica (questão de língua portuguesa).","pegadinha":"Afirma a obrigatoriedade da vírgula entre sujeito e predicado: é o contrário: essa separação é incorreta, salvo quando há termo intercalado.","resumo_flash":"Regra de ouro da pontuação: NUNCA se separa sujeito de predicado com vírgula (nem verbo do seu objeto). A única exceção é quando há um termo intercalado (aposto, oração explicativa) entre eles, isolado por duas vírgulas.","dica_padrao":"Toda vez que a questão disser que 'é obrigatório' separar sujeito e predicado com vírgula, desconfie: a regra é exatamente o oposto.","recorrencia":"alta","tags":["pontuação","vírgula"]},{"id":"CONST-003","disciplina":"Direito Constitucional","assunto":"Remédios constitucionais - habeas data","enunciado":"O habeas data é o remédio constitucional adequado para assegurar o conhecimento de informações relativas à pessoa do impetrante constantes de registros ou bancos de dados de entidades governamentais ou de caráter público, bem como para a retificação desses dados, quando não se prefira fazê-lo por processo sigiloso, judicial ou administrativo.","gabarito":"Certo","comentario":"Correto, reprodução do art. 5º, LXXII, da CF. O habeas data serve para conhecer e retificar dados pessoais em bancos de dados públicos ou de caráter público.","legislacao":"CF/1988, art. 5º, LXXII.","pegadinha":"Pode trocar o habeas data pelo mandado de segurança ou pelo habeas corpus: decore: habeas data = dados pessoais; habeas corpus = liberdade de locomoção; mandado de segurança = qualquer outro direito líquido e certo.","resumo_flash":"Habeas corpus protege a liberdade de locomoção. Habeas data garante acesso/retificação de dados pessoais em bancos de dados públicos. Mandado de segurança protege qualquer outro direito líquido e certo não amparado pelos dois primeiros.","dica_padrao":"Identifique primeiro O QUE está sendo protegido (locomoção, dados pessoais ou outro direito) para escolher o remédio certo.","recorrencia":"alta","tags":["remédios constitucionais","habeas data","direitos fundamentais"]},{"id":"CONST-004","disciplina":"Direito Constitucional","assunto":"Direitos fundamentais - direito de petição e certidão","enunciado":"São a todos assegurados, independentemente do pagamento de taxas, o direito de petição aos poderes públicos em defesa de direitos ou contra ilegalidade ou abuso de poder, e a obtenção de certidões em repartições públicas, para defesa de direitos e esclarecimento de situações de interesse pessoal.","gabarito":"Certo","comentario":"Correto, praticamente literal ao art. 5º, XXXIV, da CF: ambos os direitos (petição e certidão) são gratuitos, independem de pagamento de taxas.","legislacao":"CF/1988, art. 5º, XXXIV.","pegadinha":"Pode inserir a cobrança de taxa para um desses direitos: ambos são gratuitos por expressa previsão constitucional.","resumo_flash":"O direito de petição (reclamar aos poderes públicos) e o direito à certidão (para defesa de direitos ou esclarecimento pessoal) são gratuitos: a CF veda expressamente a cobrança de taxas para os dois.","dica_padrao":"Sempre que a questão inserir cobrança de taxa para petição ou certidão, está errada: a gratuidade é regra constitucional expressa.","recorrencia":"alta","tags":["direitos fundamentais","direito de petição","certidão"]},{"id":"DP-023","disciplina":"Direito Previdenciário","assunto":"Fontes do direito previdenciário - hierarquia normativa","enunciado":"As instruções normativas expedidas pelo INSS constituem fonte formal secundária do direito previdenciário, pois têm a função de esclarecer a aplicação de normas já existentes, sem inovar originariamente na ordem jurídica.","gabarito":"Certo","comentario":"Correto. Instrução normativa, portaria e decreto regulamentar são fontes secundárias: detalham e esclarecem normas já existentes, mas não podem criar direitos ou obrigações novas por si só: isso é papel das fontes primárias (CF, leis, medidas provisórias).","legislacao":"Doutrina de Direito Previdenciário; LINDB.","pegadinha":"Pode classificar instrução normativa como fonte primária: decore que só CF, leis e atos com força de lei (MP, lei delegada) são fontes primárias.","resumo_flash":"Fontes primárias do direito previdenciário podem criar direitos/obrigações (CF, leis, medidas provisórias). Fontes secundárias (decretos regulamentares, instruções normativas, portarias) só esclarecem/detalham, sem inovar na ordem jurídica.","dica_padrao":"A banca tenta chamar instrução normativa ou portaria de 'fonte primária': essas são sempre secundárias.","recorrencia":"media","tags":["fontes do direito","hierarquia normativa"]},{"id":"DP-024","disciplina":"Direito Previdenciário","assunto":"Carência - regra geral","enunciado":"Em regra, a carência para a concessão de aposentadoria por idade é de 180 contribuições mensais, sendo essa mesma regra aplicável ao auxílio por incapacidade temporária, que também exige 180 contribuições mensais para sua concessão.","gabarito":"Errado","comentario":"A aposentadoria por idade exige, em regra, 180 contribuições mensais de carência, mas o auxílio por incapacidade temporária exige apenas 12 contribuições mensais. A questão erra ao igualar as carências dos dois benefícios.","legislacao":"Lei 8.213/1991, art. 25.","pegadinha":"A banca iguala a carência de todos os benefícios: na verdade cada um tem a sua: 180 para aposentadorias em geral, 12 para auxílio/aposentadoria por incapacidade, 10 meses para salário-maternidade (regra específica).","resumo_flash":"Carência é o número mínimo de contribuições mensais para ter direito ao benefício. A regra geral das aposentadorias é 180 contribuições, mas cada benefício tem a sua própria: auxílio por incapacidade temporária e aposentadoria por incapacidade permanente exigem só 12.","dica_padrao":"Nunca assuma que todo benefício usa a mesma carência: sempre identifique qual benefício está sendo cobrado antes de aplicar o número.","recorrencia":"alta","tags":["carência"]},{"id":"DP-025","disciplina":"Direito Previdenciário","assunto":"Carência - hipóteses de dispensa","enunciado":"Independem de carência a concessão de auxílio por incapacidade temporária e de aposentadoria por incapacidade permanente nos casos de acidente de qualquer natureza ou causa e de doença profissional, bem como nos casos das doenças e afecções especificadas em lista elaborada pelos Ministérios da Saúde e da Previdência Social.","gabarito":"Certo","comentario":"Correto, conforme o art. 26, II, da Lei 8.213/1991. A dispensa de carência vale para acidente de QUALQUER natureza (não só de trabalho), doença profissional e doenças graves listadas oficialmente (ex.: câncer, tuberculose ativa, hanseníase, AIDS, entre outras).","legislacao":"Lei 8.213/1991, art. 26, II.","pegadinha":"Pode restringir a dispensa apenas a 'acidente de trabalho', escondendo que vale para acidente de qualquer natureza, e também para as doenças graves da lista oficial.","resumo_flash":"Algumas situações dispensam carência: acidente de qualquer natureza/causa (não só de trabalho), doença profissional, e doenças graves de uma lista oficial (ex.: câncer, tuberculose ativa, hanseníase, AIDS): nesses casos o benefício por incapacidade é concedido sem cumprir os 12 meses.","dica_padrao":"Sempre que a questão restringir a dispensa de carência só a 'acidente de trabalho', desconfie: a regra é mais ampla (qualquer natureza).","recorrencia":"alta","tags":["carência","dispensa de carência"]},{"id":"DP-026","disciplina":"Direito Previdenciário","assunto":"Manutenção da qualidade de segurado - período de graça padrão","enunciado":"O segurado que deixa de exercer atividade remunerada mantém a qualidade de segurado por 12 meses após a cessação das contribuições, prazo que é prorrogado para 24 meses se o segurado já tiver pago mais de 120 contribuições mensais sem interrupção que acarrete perda dessa qualidade.","gabarito":"Certo","comentario":"Correto, conforme o art. 15, I e §1º, da Lei 8.213/1991. O período de graça padrão é de 12 meses, estendido para 24 meses quando o segurado já tinha mais de 120 contribuições mensais sem interrupção que gerasse perda da qualidade de segurado.","legislacao":"Lei 8.213/1991, art. 15, I e §1º.","pegadinha":"Pode trocar os números (12/24 meses, 120 contribuições) ou esquecer de mencionar a condição de não ter havido interrupção que gere perda da qualidade de segurado.","resumo_flash":"Período de graça padrão: 12 meses sem contribuir e você ainda é segurado. Se já tinha mais de 120 contribuições seguidas (sem interrupção que causasse perda da qualidade), esse prazo dobra para 24 meses.","dica_padrao":"Sempre confira se a questão menciona a condição das 120 contribuições SEM interrupção: sem essa condição, o prazo estendido de 24 meses não se aplica.","recorrencia":"alta","tags":["qualidade de segurado","período de graça"]},{"id":"DP-027","disciplina":"Direito Previdenciário","assunto":"Manutenção da qualidade de segurado - desempregado","enunciado":"O prazo do período de graça de 12 meses é acrescido de mais 12 meses para o segurado desempregado, desde que comprovada essa situação pelo registro no órgão próprio do Ministério do Trabalho e Emprego, totalizando até 24 meses.","gabarito":"Certo","comentario":"Correto, conforme o art. 15, §2º, da Lei 8.213/1991. O segurado desempregado tem direito a mais 12 meses de período de graça, desde que comprove essa condição no órgão próprio.","legislacao":"Lei 8.213/1991, art. 15, §2º.","pegadinha":"Pode dispensar a exigência de comprovação do desemprego no órgão próprio: essa comprovação é condição para o prazo estendido, não basta alegar que está desempregado.","resumo_flash":"Quem está desempregado tem direito a mais 12 meses de período de graça (total até 24 meses), mas precisa comprovar a situação de desemprego perante o órgão próprio: não basta alegar que está desempregado.","dica_padrao":"Repare se a questão exige a comprovação formal do desemprego: sem ela, o benefício do prazo estendido não se aplica.","recorrencia":"media","tags":["qualidade de segurado","período de graça","desemprego"]},{"id":"DP-028","disciplina":"Direito Previdenciário","assunto":"Auxílio-acidente","enunciado":"O auxílio-acidente tem natureza indenizatória e é devido ao segurado empregado, ao trabalhador avulso e ao segurado especial quando, após a consolidação das lesões decorrentes de acidente de qualquer natureza, resultarem sequelas que impliquem redução da capacidade para o trabalho que habitualmente exercia.","gabarito":"Certo","comentario":"Correto, conforme o art. 86 da Lei 8.213/1991. O auxílio-acidente é indenizatório e devido a empregado, avulso e segurado especial quando há sequela definitiva que reduz a capacidade laboral.","legislacao":"Lei 8.213/1991, art. 86.","pegadinha":"Pode incluir contribuinte individual e segurado facultativo entre os beneficiários do auxílio-acidente: esses NÃO têm direito a esse benefício, exclusivo de empregado, avulso e segurado especial.","resumo_flash":"Auxílio-acidente é indenizatório, pago quando sobra sequela que reduz a capacidade de trabalho após um acidente. Só empregado, avulso e segurado especial têm direito: contribuinte individual e facultativo NÃO recebem esse benefício.","dica_padrao":"Sempre confira a categoria do segurado na situação hipotética: contribuinte individual e facultativo são a pegadinha clássica desse benefício.","recorrencia":"alta","tags":["auxílio-acidente"]},{"id":"DP-029","disciplina":"Direito Previdenciário","assunto":"Auxílio-reclusão - regra pós-Lei 13.846/2019","enunciado":"Desde a Lei 13.846/2019, o auxílio-reclusão é devido aos dependentes do segurado de baixa renda recolhido à prisão em regime fechado, sendo pago desde a data da prisão apenas se o requerimento for feito em até 180 dias contados dessa data; após esse prazo, o benefício é devido a partir da data do requerimento.","gabarito":"Certo","comentario":"Correto. A reforma restringiu o auxílio-reclusão ao regime FECHADO (antes cabia também no semiaberto) e mantido de baixa renda. O requerimento em até 180 dias da prisão gera pagamento retroativo à data da prisão; passado esse prazo, só a partir do requerimento.","legislacao":"Lei 8.213/1991, art. 80, com redação dada pela Lei 13.846/2019; Decreto 3.048/1999, art. 116.","pegadinha":"Pode esquecer que hoje o benefício só existe para regime FECHADO (a reforma restringiu, antes cabia em regimes fechado e semiaberto), ou trocar o prazo de 180 dias.","resumo_flash":"Auxílio-reclusão só é devido para presos em regime FECHADO (desde a Lei 13.846/2019) e é pago aos dependentes de segurado de baixa renda. Requerimento em até 180 dias da prisão = paga retroativo à prisão; depois disso, só a partir do pedido.","dica_padrao":"Confira sempre o regime prisional mencionado na questão: semiaberto ou aberto já não dão mais direito ao benefício.","recorrencia":"media","tags":["auxílio-reclusão","EC103"]},{"id":"DP-030","disciplina":"Direito Previdenciário","assunto":"Dependentes - classes e presunção de dependência","enunciado":"São dependentes do segurado, na primeira classe, o cônjuge, a companheira ou o companheiro e o filho não emancipado de qualquer condição, menor de 21 anos ou inválido, presumindo-se a dependência econômica desses em relação ao segurado, dispensada a comprovação.","gabarito":"Certo","comentario":"Correto, conforme o art. 16, I e §4º, da Lei 8.213/1991. Os dependentes de primeira classe têm dependência econômica presumida por lei, não precisando comprová-la.","legislacao":"Lei 8.213/1991, art. 16, I e §4º.","pegadinha":"Pode exigir comprovação de dependência econômica também para a primeira classe: só a partir da segunda classe (pais) e terceira classe (irmãos) é que a dependência precisa ser comprovada.","resumo_flash":"Existem 3 classes de dependentes: 1ª (cônjuge/companheiro e filhos até 21 anos ou inválidos) tem dependência PRESUMIDA, não precisa provar; 2ª (pais) e 3ª (irmãos) precisam COMPROVAR a dependência econômica.","dica_padrao":"Sempre identifique a classe do dependente na questão antes de decidir se a dependência precisa ser comprovada ou é presumida.","recorrencia":"alta","tags":["dependentes","classes de dependentes"]},{"id":"DP-031","disciplina":"Direito Previdenciário","assunto":"Dependentes - concorrência entre classes","enunciado":"A existência de dependente de qualquer das classes exclui do direito ao benefício os das classes seguintes, sendo os dependentes de uma mesma classe considerados em concorrência, sem ordem de preferência entre eles.","gabarito":"Certo","comentario":"Correto, conforme o art. 16, §1º, da Lei 8.213/1991. Classe anterior exclui a seguinte; dentro da mesma classe, todos concorrem igualmente ao benefício, sem ordem de preferência.","legislacao":"Lei 8.213/1991, art. 16, §1º.","pegadinha":"Pode afirmar que há ordem de preferência DENTRO da mesma classe (ex.: cônjuge antes dos filhos): não há: todos da mesma classe concorrem juntos e dividem o benefício.","resumo_flash":"Entre classes diferentes, a classe anterior exclui a seguinte (1ª exclui a 2ª, que exclui a 3ª). Mas DENTRO da mesma classe, todos concorrem juntos, sem ordem de preferência entre eles.","dica_padrao":"Separe sempre 'entre classes' (exclusão) de 'dentro da mesma classe' (concorrência igualitária): a banca adora misturar os dois.","recorrencia":"media","tags":["dependentes","classes de dependentes"]},{"id":"DP-032","disciplina":"Direito Previdenciário","assunto":"Custeio - contribuição patronal","enunciado":"A contribuição da empresa destinada à Seguridade Social incide, entre outras bases, sobre a folha de salários e demais rendimentos do trabalho pagos ou creditados a qualquer título à pessoa física que lhe preste serviço, ainda que sem vínculo empregatício.","gabarito":"Certo","comentario":"Correto, conforme o art. 195, I, 'a', da CF, e o art. 22, I, da Lei 8.212/1991. A contribuição patronal incide sobre a folha de salários e também sobre pagamentos a qualquer pessoa física que preste serviço à empresa, mesmo sem vínculo empregatício.","legislacao":"CF/1988, art. 195, I, 'a'; Lei 8.212/1991, art. 22, I.","pegadinha":"Pode restringir a base de cálculo apenas aos 'salários dos empregados', escondendo que a contribuição patronal também incide sobre pagamentos a quem presta serviço sem vínculo empregatício (ex.: contribuinte individual contratado).","resumo_flash":"A empresa contribui para a Seguridade Social sobre a folha de salários e também sobre pagamentos a qualquer pessoa física que preste serviço a ela, MESMO sem vínculo empregatício (ex.: autônomos contratados).","dica_padrao":"Não restrinja mentalmente a contribuição patronal só aos empregados CLT: ela alcança qualquer pessoa física prestadora de serviço.","recorrencia":"alta","t
