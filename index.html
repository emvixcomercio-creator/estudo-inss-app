l (art. 31).","Empregador doméstico: 8% de contribuição previdenciária + 0,8% de seguro contra acidentes (além de 8% de FGTS e 3,2% de indenização compensatória), pagos no DAE do eSocial (LC 150/2015, art. 34).","Produtor rural pessoa física empregador: 1,2% + 0,1% sobre a receita da comercialização (Lei 8.212, art. 25); agroindústria: 2,5% + 0,1%; clubes de futebol profissional: 5% da receita bruta dos espetáculos desportivos.","Desoneração da folha (CPRB, Lei 12.546/2011): em extinção gradual pela Lei 14.973/2024, com volta progressiva da contribuição sobre a folha até 2028.","Contribuições sobre receita/faturamento e lucro: COFINS, PIS/PASEP e CSLL; com a reforma tributária (EC 132/2023 e LC 214/2025), a CBS substitui gradualmente PIS/COFINS.","Outras fontes: concursos de prognósticos (loterias) e importador de bens/serviços (PIS/COFINS-Importação).","Imunidade: entidades beneficentes de assistência social certificadas (CF, art. 195, §7º; LC 187/2021): não alcança igrejas pelo simples fato de serem templos.","Contribuições a terceiros (Sistema S, salário-educação, INCRA) são arrecadadas junto, mas NÃO financiam a Seguridade."],"pegadinhas":["Dizer que igrejas são isentas de contribuição para a seguridade (P22-067: Errado).","Dizer que devedores da previdência podem receber incentivos fiscais ou creditícios (P22-068: Certo que não podem).","Esquecer que o resultado de leilões de bens apreendidos pela Receita é receita da seguridade (P22-070: Certo).","Confundir a alíquota do RAT (1%/2%/3%) com o adicional da aposentadoria especial (6%/9%/12%)."],"base_legal":"CF/1988, art. 195, I, III, IV, V e §§3º, 7º e 9º; Lei 8.212/1991, arts. 22, 22-A, 23, 25, 27 e 31; LC 150/2015, art. 34; Lei 12.546/2011; Lei 14.973/2024; LC 187/2021.","questoes":["CONST-001","DP-032","P22-067","P22-068","P22-070"]},{"id":"dp-17","disciplina":"Direito Previdenciário","topico":"Custeio III: arrecadação, recolhimento e obrigações acessórias","recorrencia":"alta","provas":[2012,2022],"resumo":"Além de pagar (obrigação principal), empresas e segurados têm deveres formais: descontar, declarar, escriturar e prestar informações ao fisco (obrigações acessórias). A Receita Federal fiscaliza e cobra. A prova cobra prazos de recolhimento, quem é responsável pelo desconto e a CND.","pontos":["A empresa é OBRIGADA a descontar a contribuição dos empregados e avulsos e dos CI a seu serviço e a recolhê-la, junto com a sua, até o dia 20 do mês seguinte ao da competência (antecipa para o dia útil anterior se não houver expediente bancário).","CI (por conta própria) e facultativo: recolhem por iniciativa própria até o dia 15 do mês seguinte (prorroga para o dia útil seguinte).","Empregador doméstico: recolhe pelo DAE (eSocial) até o dia 7 do mês seguinte (LC 150/2015, art. 35).","O desconto da contribuição se presume sempre feito oportuna e regularmente; a empresa é diretamente responsável e não pode alegar omissão (Lei 8.212, art. 33, §5º). Descontar e não repassar pode configurar apropriação indébita previdenciária (CP, art. 168-A).","Obrigações acessórias (Lei 8.212, art. 32): preparar folha de pagamento; lançar mensalmente na contabilidade os fatos geradores; prestar informações à Receita Federal (hoje via eSocial, EFD-Reinf e DCTFWeb, que substituíram a GFIP); exibir documentos à fiscalização.","Matrícula: empresas pelo CNPJ; obras de construção civil no Cadastro Nacional de Obras (CNO).","Responsabilidade solidária: empresas do mesmo grupo econômico; proprietário/dono da obra com o construtor; OGMO e operador portuário quanto aos avulsos portuários.","CND (Certidão Negativa de Débito) exigida, entre outros casos, para contratar com o Poder Público, receber benefícios/incentivos fiscais e alienar ou onerar bem imóvel da empresa (Lei 8.212, art. 47).","Competência: a Receita Federal fiscaliza, arrecada e cobra; a PGFN inscreve em dívida ativa; o INSS não arrecada contribuições.","Decadência e prescrição das contribuições: 5 anos, conforme o CTN: os arts. 45 e 46 da Lei 8.212 (10 anos) são inconstitucionais (Súmula Vinculante 8).","Parcelamento de contribuições: no máximo 60 meses (CF, art. 195, §11)."],"pegadinhas":["Dizer que o avulso, como o CI e o facultativo, recolhe por conta própria (P22-071: Errado).","Atribuir ao INSS a fiscalização e a arrecadação das contribuições (P22-072: Errado).","Trocar os prazos: empresa dia 20, CI/facultativo dia 15, doméstico dia 7.","Aplicar prazo decadencial de 10 anos às contribuições: é de 5 anos (SV 8)."],"base_legal":"Lei 8.212/1991, arts. 30 a 33 e 47; Lei 11.457/2007; LC 150/2015, art. 35; CTN, arts. 173 e 174; Súmula Vinculante 8; CP, arts. 168-A e 337-A.","questoes":["DP-014","DP-032","P22-071","P22-072","P22-079"]},{"id":"dp-20","disciplina":"Direito Previdenciário","topico":"Aposentadoria programada (por idade) e aposentadorias da pessoa com deficiência","recorrencia":"alta","provas":[2012,2022],"resumo":"Depois da EC 103/2019 (vigente desde 13/11/2019), a aposentadoria 'comum' do RGPS passou a exigir idade mínima E tempo de contribuição: é a aposentadoria programada. A antiga aposentadoria por tempo de contribuição sem idade mínima acabou para quem não tinha direito adquirido. É o benefício mais cobrado em prova, quase sempre comparando regra nova x regra antiga.","pontos":["Regra geral (art. 201, §7º, I, CF + art. 19 da EC 103): 65 anos (homem) e 62 anos (mulher).","Tempo de contribuição mínimo: mulher 15 anos; homem 20 anos se filiado ao RGPS DEPOIS da EC 103 (13/11/2019). Homem filiado ATÉ 13/11/2019 continua precisando de apenas 15 anos (regra de transição do art. 18).","Carência: 180 contribuições mensais (art. 25, II, Lei 8.213/1991).","Trabalhador rural e segurado especial (inclusive pescador artesanal): 60 anos (homem) e 55 anos (mulher), com 15 anos de atividade rural: a EC 103 NÃO aumentou essas idades.","Professor da educação infantil, ensino fundamental e médio: 60 anos (homem) e 57 anos (mulher) + 25 anos de efetivo exercício do magistério. Professor universitário não tem regra especial.","Valor (RMI): 60% da média de todos os salários de contribuição desde julho/1994 + 2 pontos percentuais por ano que exceder 20 anos de contribuição (homem) ou 15 anos (mulher).","Aposentadoria por tempo de contribuição 'pura' (35 H / 30 M, sem idade) só existe para quem completou os requisitos até 13/11/2019 (direito adquirido) ou pelas regras de transição.","Pessoa com deficiência (LC 142/2013, mantida pelo art. 22 da EC 103): por tempo, 25 anos (H) / 20 (M) se deficiência grave; 29/24 se moderada; 33/28 se leve; por idade, 60 anos (H) / 55 (M) com 15 anos de contribuição na condição de pessoa com deficiência.","Aposentadoria da pessoa com deficiência por tempo = 100% do salário de benefício; por idade = 70% + 1% a cada 12 contribuições, até 100%.","A aposentadoria programada é irreversível e irrenunciável depois do recebimento do primeiro pagamento ou do saque do FGTS/PIS (Decreto 3.048/1999). A 'desaposentação' foi rejeitada pelo STF (Tema 503)."],"pegadinhas":["Dizer que, após a EC 103, o homem precisa de 20 anos de contribuição em QUALQUER caso: vale só para quem se filiou depois de 13/11/2019.","Afirmar que a reforma elevou a idade do trabalhador rural para 62/65 anos: continua 55 (M) / 60 (H).","Trocar 'idade mínima' por 'pontos' ou atribuir 62 anos ao homem e 65 à mulher (inversão de números).","Dizer que o professor universitário tem redução de idade: só educação infantil, fundamental e médio."],"base_legal":"CF, art. 201, §7º; EC 103/2019, arts. 18, 19, 22 e 26; Lei 8.213/1991, arts. 25, 48 a 51; LC 142/2013; Decreto 3.048/1999.","questoes":["DP-001","DP-024","DP-005"]},{"id":"dp-21","disciplina":"Direito Previdenciário","topico":"Regras de transição da EC 103/2019 (aposentadoria por tempo e por idade)","recorrencia":"alta","provas":[2022],"resumo":"Quem já era filiado ao RGPS em 13/11/2019 pode escolher a regra de transição mais vantajosa entre várias. Cada regra tem uma 'chave' diferente (pontos, idade progressiva, pedágio de 50% ou de 100%) e um cálculo de valor próprio. A banca adora trocar os números entre as regras.","pontos":["Pontos (art. 15 EC 103): 35 anos de contribuição (H) / 30 (M) + soma idade + tempo de 96 (H) / 86 (M) em 2019, subindo 1 ponto por ano até 105 (H, em 2028) / 100 (M, em 2033). Em 2026: 103 (H) e 93 (M).","Idade mínima progressiva (art. 16): 35/30 anos de contribuição + idade de 61 (H) / 56 (M) em 2019, subindo 6 meses por ano até 65 (H) / 62 (M). Em 2026: 64 anos e 6 meses (H) e 59 anos e 6 meses (M).","Pedágio de 50% (art. 17): só para quem, em 13/11/2019, estava a no máximo 2 anos de completar 35 (H) / 30 (M) anos de contribuição; cumpre o tempo que faltava + 50% desse tempo; NÃO exige idade mínima; valor = média × fator previdenciário.","Pedágio de 100% (art. 20): idade mínima de 60 (H) / 57 (M) + 35/30 anos de contribuição + período adicional igual ao tempo que faltava em 13/11/2019; valor = 100% da média (sem o redutor de 60%).","Transição da aposentadoria por idade (art. 18): homem 65 anos e mulher 60 anos em 2019, com +6 meses por ano até 62 (atingido em 2023); 15 anos de contribuição para ambos.","Nas regras de pontos, idade progressiva e idade (arts. 15, 16 e 18), o valor segue a regra geral: 60% + 2% por ano acima de 20 (H) / 15 (M) anos de contribuição.","Professores têm versões próprias das regras de pontos e idade progressiva, com 5 anos a menos de contribuição.","Direito adquirido: quem completou os requisitos até 13/11/2019 pode se aposentar pelas regras antigas a qualquer tempo (inclusive pela regra 86/96 sem fator).","O fator previdenciário só continua aplicado na regra do pedágio de 50% (e nos casos de direito adquirido)."],"pegadinhas":["Trocar os percentuais de pedágio: a regra de 50% NÃO tem idade mínima; a de 100% exige 60/57 anos.","Dizer que o pedágio de 50% vale para qualquer segurado: só para quem estava a até 2 anos de completar o tempo em 13/11/2019.","Atribuir ao pedágio de 100% o cálculo de 60% + 2%: nele o valor é 100% da média.","Errar a pontuação do ano (ex.: dizer que a pontuação feminina também para em 105)."],"base_legal":"EC 103/2019, arts. 15, 16, 17, 18, 20 e 26; Lei 8.213/1991, art. 29 (fator previdenciário).","questoes":["DP-002","DP-003","DP-001"]},{"id":"dp-22","disciplina":"Direito Previdenciário","topico":"Aposentadoria especial","recorrencia":"alta","provas":[2012,2022],"resumo":"É devida a quem trabalha exposto, de forma efetiva e permanente, a agentes químicos, físicos ou biológicos prejudiciais à saúde. A EC 103 passou a exigir idade mínima também para ela e proibiu a conversão de tempo especial em comum para períodos posteriores à reforma.","pontos":["Regra permanente pós-EC 103 (art. 19, §1º, I): 55 anos de idade + 15 anos de exposição (ex.: mineração subterrânea em frente de produção); 58 anos + 20 anos; 60 anos + 25 anos (maioria dos casos).","Transição para quem já era filiado (art. 21): pontos (idade + tempo de contribuição) de 66 / 76 / 86, com 15 / 20 / 25 anos de efetiva exposição, respectivamente.","Carência: 180 contribuições.","CF, art. 201, §1º, II: exige efetiva exposição a agentes nocivos, VEDADA a caracterização por categoria profissional ou ocupação.","Comprovação: Perfil Profissiográfico Previdenciário (PPP), emitido pela empresa com base no LTCAT (laudo técnico).","Valor: 60% + 2% por ano acima de 20 anos de contribuição; no caso de 15 anos de exposição (e para mulheres), o acréscimo conta a partir de 15 anos.","Vedada a conversão de tempo especial em comum para períodos trabalhados após 13/11/2019 (art. 25, §2º, EC 103). Períodos anteriores podem ser convertidos.","Beneficiários: empregado, trabalhador avulso e contribuinte individual cooperado filiado a cooperativa de trabalho ou de produção.","Quem continua ou volta a trabalhar exposto a agente nocivo tem o benefício cessado/suspenso (art. 57, §8º, Lei 8.213; STF Tema 709).","EPI eficaz descaracteriza a atividade especial, salvo no caso de ruído acima dos limites (STF, Tema 555)."],"pegadinhas":["Dizer que basta pertencer a uma categoria profissional (ex.: 'motorista', 'vigilante') para ter direito: é vedado o enquadramento por categoria.","Afirmar que a aposentadoria especial continua sem idade mínima após a EC 103.","Dizer que o aposentado especial pode continuar trabalhando na mesma atividade nociva.","Afirmar que todo tempo especial pode ser convertido em comum, inclusive após 2019."],"base_legal":"CF, art. 201, §1º, II; EC 103/2019, arts. 19, §1º, I, 21, 25, §2º, e 26; Lei 8.213/1991, arts. 57 e 58; Decreto 3.048/1999.","questoes":["DP-021"]},{"id":"dp-23","disciplina":"Direito Previdenciário","topico":"Aposentadoria por incapacidade permanente (antiga aposentadoria por invalidez)","recorrencia":"alta","provas":[2012,2022],"resumo":"É devida ao segurado considerado incapaz para o trabalho e insuscetível de reabilitação para atividade que lhe garanta a subsistência. A EC 103 mudou o nome e o cálculo: só a decorrente de acidente do trabalho ou doença ocupacional continua com 100% da média.","pontos":["Requisitos: qualidade de segurado + incapacidade total e permanente (verificada em perícia médica do INSS) + carência de 12 contribuições, quando exigida.","Carência dispensada: acidente de qualquer natureza ou causa, doença profissional ou do trabalho, e doenças graves da lista oficial (art. 26, II, e art. 151 da Lei 8.213).","Valor comum: 60% da média + 2% por ano acima de 20 (H) / 15 (M) anos de contribuição.","Valor quando a incapacidade decorre de acidente do trabalho, doença profissional ou doença do trabalho: 100% da média (art. 26, §3º, II, EC 103).","Acréscimo de 25% ('grande invalidez') para quem necessita de assistência permanente de outra pessoa; pode ultrapassar o teto; cessa com a morte e NÃO passa para a pensão (art. 45).","Doença ou lesão anterior à filiação não gera o benefício, salvo se a incapacidade decorrer de progressão ou agravamento.","O aposentado que volta voluntariamente a trabalhar tem a aposentadoria cancelada a partir do retorno (art. 46).","O benefício não é definitivo: o segurado pode ser convocado para revisão médica; ficam dispensados, entre outros, os maiores de 60 anos e os maiores de 55 anos com 15 anos ou mais de benefício (art. 101).","Em caso de recuperação, há pagamento decrescente por um período (mensalidades de recuperação, art. 47)."],"pegadinhas":["Usar a nomenclatura antiga como se ainda fosse a oficial ('aposentadoria por invalidez') ou afirmar que o cálculo continua 100% para todos.","Dizer que o adicional de 25% fica limitado ao teto do RGPS ou se incorpora à pensão por morte.","Afirmar que é benefício vitalício e definitivo, sem possibilidade de revisão.","Dizer que toda incapacidade exige 12 contribuições, esquecendo as hipóteses de dispensa."],"base_legal":"CF, art. 201, I; EC 103/2019, art. 26, §§2º e 3º; Lei 8.213/1991, arts. 25, I, 26, II, 42 a 47, 101 e 151.","questoes":["DP-004","DP-025"]},{"id":"dp-24","disciplina":"Direito Previdenciário","topico":"Salário de benefício e cálculo da renda mensal inicial (RMI) pós-EC 103","recorrencia":"alta","provas":[2012,2022],"resumo":"O salário de benefício (SB) é a média dos salários de contribuição; a RMI é o valor que o segurado efetivamente recebe, aplicando-se ao SB um percentual que depende do benefício. Entender a sequência 'média → percentual → limites' resolve a maioria das questões de cálculo.","pontos":["Média: 100% dos salários de contribuição desde julho/1994 (ou desde o início das contribuições), corrigidos: a reforma acabou com o descarte automático dos 20% menores (art. 26 da EC 103).","O segurado pode excluir contribuições que reduzam a média, desde que mantenha o tempo mínimo exigido; o período excluído não conta para nada (art. 26, §6º).","Limites: o SB não pode ser inferior a 1 salário mínimo nem superior ao teto do RGPS (art. 29, §2º, Lei 8.213).","Benefícios que substituem a renda nunca são inferiores ao salário mínimo (art. 201, §2º, CF); o auxílio-acidente, por ser indenizatório, pode ser menor.","Percentuais: aposentadorias em geral 60% + 2%/ano excedente; incapacidade permanente acidentária 100%; pedágio de 100% = 100%; auxílio por incapacidade temporária 91%; auxílio-acidente 50%.","Atividades concomitantes: o SB é calculado com base na SOMA dos salários de contribuição das atividades, respeitado o teto (art. 32, Lei 8.213, com redação da Lei 13.846/2019).","Fator previdenciário: só aplicado na transição do pedágio de 50% e nas aposentadorias com direito adquirido que optem por ele.","Reajuste: benefícios e salários de contribuição são reajustados na mesma época e pelos mesmos índices dos benefícios do RGPS (art. 20, §1º, Lei 8.212). Salário de contribuição NÃO é igual à renda do benefício.","Revisão da vida toda: o STF, ao julgar as ADIs 2110 e 2111 (2024), considerou obrigatória a regra de transição da Lei 9.876/1999, inviabilizando a tese."],"pegadinhas":["Dizer que o salário de benefício pode ser inferior ao salário mínimo ou superior ao teto.","Afirmar que a média ainda descarta os 20% menores salários.","Dizer que, nas atividades concomitantes, considera-se só a atividade principal.","Confundir salário de contribuição com valor do benefício."],"base_legal":"CF, art. 201, §§2º e 4º; EC 103/2019, art. 26; Lei 8.213/1991, arts. 28 a 33; Lei 8.212/1991, art. 20; Lei 9.876/1999.","questoes":["DP-005","P22-073","P22-074","P22-089","P22-091"]},{"id":"dp-25","disciplina":"Direito Previdenciário","topico":"Auxílio por incapacidade temporária (antigo auxílio-doença)","recorrencia":"alta","provas":[2012,2022],"resumo":"Protege o segurado que fica temporariamente incapaz para o seu trabalho habitual por mais de 15 dias consecutivos. É o benefício mais concedido no INSS e aparece muito em situações hipotéticas envolvendo carência e responsabilidade da empresa pelos primeiros dias.","pontos":["Requisitos: qualidade de segurado + incapacidade para o trabalho ou atividade habitual por mais de 15 dias consecutivos + carência de 12 contribuições (dispensada nas mesmas hipóteses da incapacidade permanente).","Empregado (exceto doméstico): a empresa paga os 15 primeiros dias de afastamento; o INSS paga a partir do 16º dia. Demais segurados, inclusive doméstico: desde o início da incapacidade (se requerido em até 30 dias).","Valor: 91% do salário de benefício, limitado à média dos 12 últimos salários de contribuição (art. 29, §10).","Prazo: a concessão deve fixar a data de cessação (DCB); se não fixada, cessa após 120 dias, salvo pedido de prorrogação (art. 60, §§8º e 9º).","Pode ser concedido por análise documental, sem perícia presencial, nos termos da lei e do regulamento (ex.: Atestmed).","O segurado empregado em gozo do benefício é considerado licenciado pela empresa.","Segurado insuscetível de recuperação para a atividade habitual deve ser encaminhado à reabilitação profissional; o benefício continua até a reabilitação ou a conversão em aposentadoria por incapacidade permanente (art. 62).","Doença preexistente à filiação não dá direito, salvo agravamento.","Não acumula com aposentadoria do RGPS nem com outro auxílio por incapacidade temporária."],"pegadinhas":["Dizer que o INSS paga desde o primeiro dia para o empregado urbano: os 15 primeiros dias são da empresa.","Trocar o percentual (91%) com o do auxílio-acidente (50%).","Usar 'auxílio-doença' como nome atual ou dizer que exige incapacidade para QUALQUER trabalho (isso é da incapacidade permanente)."],"base_legal":"CF, art. 201, I; EC 103/2019 (nomenclatura); Lei 8.213/1991, arts. 25, I, 26, II, 29, §10, 59 a 63; Decreto 3.048/1999.","questoes":["DP-004","DP-025"]},{"id":"dp-26","disciplina":"Direito Previdenciário","topico":"Auxílio-acidente","recorrencia":"alta","provas":[2012,2022],"resumo":"Benefício de natureza indenizatória pago a quem, após a consolidação das lesões de um acidente de qualquer natureza, fica com sequela que reduz a capacidade para o trabalho habitual. O segurado continua trabalhando e recebendo salário: por isso ele pode ser inferior ao salário mínimo.","pontos":["Natureza indenizatória (não substitui o salário).","Devido apenas a: empregado, empregado doméstico (desde a LC 150/2015), trabalhador avulso e segurado especial. NÃO é devido a contribuinte individual nem a facultativo.","Independe de carência.","Valor: 50% do salário de benefício; pode ser inferior ao salário mínimo.","Começa no dia seguinte ao da cessação do auxílio por incapacidade temporária.","Cessa com a concessão de qualquer aposentadoria ou com o óbito; é vedada a acumulação com aposentadoria (desde a Lei 9.528/1997).","O valor mensal do auxílio-acidente integra o salário de contribuição para cálculo da futura aposentadoria (art. 31).","Pode ser acumulado com salário e com outros benefícios, exceto aposentadoria e outro auxílio-acidente.","O 'acidente de qualquer natureza' inclui acidentes fora do trabalho (ex.: acidente doméstico, de trânsito)."],"pegadinhas":["Incluir o contribuinte individual ou o facultativo entre os beneficiários.","Dizer que exige carência de 12 contribuições.","Afirmar que é acumulável com aposentadoria ou que não pode ser inferior ao salário mínimo.","Dizer que só cabe em acidente do trabalho."],"base_legal":"Lei 8.213/1991, arts. 18, §1º, 26, I, 31 e 86; LC 150/2015.","questoes":["DP-028"]},{"id":"dp-27","disciplina":"Direito Previdenciário","topico":"Auxílio-reclusão","recorrencia":"media","provas":[],"resumo":"Benefício pago aos DEPENDENTES do segurado de baixa renda preso em regime fechado. Foi bastante restringido pela Lei 13.846/2019 e pela EC 103, e a banca costuma cobrar justamente essas mudanças.","pontos":["Beneficiários: os dependentes (não o preso).","Segurado preso em regime FECHADO (o semiaberto deixou de dar direito com a Lei 13.846/2019).","Carência: 24 contribuições mensais (art. 25, IV).","Baixa renda: aferida pela média dos salários de contribuição dos 12 meses anteriores à prisão, comparada ao limite fixado anualmente por portaria.","Valor: calculado como a pensão por morte, mas não pode exceder 1 salário mínimo (art. 27, §1º, EC 103).","Não é devido se o segurado recebe remuneração da empresa, pensão por morte, salário-maternidade, aposentadoria, abono de permanência ou auxílio por incapacidade temporária.","Requerimento instruído com certidão judicial de recolhimento à prisão, com prova periódica de que o segurado continua preso.","Fuga suspende o benefício; se o segurado morre preso, converte-se em pensão por morte.","Para a duração em relação a cônjuge/companheiro, aplicam-se as regras da pensão por morte."],"pegadinhas":["Dizer que o benefício é devido ao próprio preso ou que vale para regime semiaberto.","Afirmar que independe de carência (regra antiga, anterior a 2019).","Dizer que o valor pode chegar ao teto do RGPS."],"base_legal":"CF, art. 201, IV; EC 103/2019, art. 27; Lei 8.213/1991, arts. 25, IV, e 80; Lei 13.846/2019.","questoes":["DP-029"]},{"id":"dp-28","disciplina":"Direito Previdenciário","topico":"Salário-maternidade","recorrencia":"media","provas":[2012],"resumo":"Substitui a remuneração da segurada (ou do segurado, em caso de adoção) durante o afastamento por parto, adoção ou guarda para adoção. Cai bastante com detalhes sobre quem paga, prazo e carência.","pontos":["Duração: 120 dias, podendo começar até 28 dias antes do parto.","Adoção ou guarda judicial para fins de adoção: 120 dias, qualquer que seja a idade da criança (até 12 anos); é devido também ao segurado HOMEM que adota.","Aborto não criminoso: 2 semanas. Natimorto: 120 dias.","Carência: dispensada para empregada, doméstica e avulsa. A lei previa 10 contribuições para contribuinte individual e facultativa, mas o STF (ADIs 2110 e 2111, 2024) declarou inconstitucional essa exigência. A segurada especial comprova atividade rural.","Valor: empregada e avulsa = remuneração integral (sem limitação ao teto do RGPS, mas limitada ao subsídio dos Ministros do STF); doméstica = último salário de contribuição; contribuinte individual/facultativa = 1/12 da soma dos 12 últimos salários de contribuição; segurada especial = 1 salário mínimo.","Quem paga: a empresa paga à empregada e compensa nas contribuições; nos demais casos (doméstica, avulsa, CI, facultativa, especial e adoção), paga o INSS diretamente.","Morte da segurada: o cônjuge ou companheiro sobrevivente segurado recebe o tempo restante (art. 71-B).","Internação hospitalar longa da mãe ou do bebê: o STF (ADI 6.327) fixou que o termo inicial se conta da alta hospitalar.","Não pode ser concedido a mais de um segurado pela mesma criança no mesmo processo de adoção."],"pegadinhas":["Dizer que, na adoção, o prazo varia conforme a idade da criança (regra antiga revogada).","Afirmar que o salário-maternidade é exclusivo de mulheres.","Dizer que a empregada recebe limitado ao teto do RGPS.","Cobrar carência de empregada ou doméstica."],"base_legal":"CF, art. 7º, XVIII, e art. 201, II; Lei 8.213/1991, arts. 25, III, 26, VI, 71 a 73; STF ADIs 2110 e 2111; STF ADI 6.327.","questoes":[]},{"id":"dp-29","disciplina":"Direito Previdenciário","topico":"Salário-família","recorrencia":"media","provas":[2012],"resumo":"Pago ao segurado de baixa renda, por filho ou equiparado de até 14 anos ou inválido. Não é benefício para os dependentes, e sim para o segurado, e não se incorpora ao salário.","pontos":["Devido ao empregado (inclusive doméstico) e ao trabalhador avulso de baixa renda, e ao aposentado por incapacidade permanente ou por idade e aos demais aposentados com 65 anos (H) ou 60 anos (M).","NÃO é devido a contribuinte individual, facultativo nem segurado especial.","Uma cota por filho ou equiparado (enteado, menor tutelado) de até 14 anos ou inválido de qualquer idade.","Baixa renda e valor da cota: fixados anualmente por portaria (EC 103, art. 27, define o critério).","Independe de carência.","Pago pela empresa ou pelo empregador doméstico junto com o salário (com compensação nas contribuições); ao avulso, pelo sindicato ou órgão gestor de mão de obra, mediante convênio; ao aposentado, pelo INSS.","Exige certidão de nascimento, atestado anual de vacinação obrigatória e comprovação de frequência escolar do filho.","Se pai e mãe forem segurados de baixa renda, ambos recebem.","Não se incorpora ao salário nem ao benefício, para nenhum efeito."],"pegadinhas":["Dizer que vale para filho até 21 anos (confusão com dependente para pensão).","Incluir contribuinte individual ou facultativo.","Afirmar que exige carência ou que integra o salário de contribuição."],"base_legal":"CF, art. 7º, XII, e art. 201, IV; EC 103/2019, art. 27; Lei 8.213/1991, arts. 65 a 70; Decreto 3.048/1999.","questoes":[]},{"id":"dp-30","disciplina":"Direito Previdenciário","topico":"Dependentes do segurado","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Dependentes são as pessoas que recebem pensão por morte e auxílio-reclusão. Estão divididos em três classes; a existência de alguém em uma classe exclui as seguintes. É tema campeão em situações hipotéticas de família.","pontos":["Classe I: cônjuge, companheiro(a) e filho não emancipado menor de 21 anos ou inválido ou com deficiência intelectual, mental ou grave: dependência econômica PRESUMIDA.","Classe II: pais: precisam comprovar dependência econômica.","Classe III: irmão não emancipado menor de 21 anos ou inválido ou com deficiência intelectual, mental ou grave: precisa comprovar dependência econômica.","A existência de dependente de uma classe exclui do direito os das classes seguintes; dentro da mesma classe, divide-se em partes iguais.","Equiparam-se a filho: o enteado e o menor tutelado, mediante declaração do segurado e comprovação de dependência econômica (art. 16, §2º; EC 103, art. 23, §6º).","Filho universitário NÃO tem direito após 21 anos (jurisprudência do STJ).","União estável e dependência econômica exigem início de prova material contemporânea, produzida em período não superior a 24 meses antes do óbito ou da prisão; prova só testemunhal não basta, salvo força maior ou caso fortuito (Lei 13.846/2019).","O cônjuge divorciado ou separado que recebia pensão alimentícia concorre em igualdade com os dependentes da classe I.","Concubinato (relação com pessoa casada) não gera pensão, e não se reconhecem uniões estáveis simultâneas (STF, Temas 526 e 529).","O dependente pode se inscrever no momento do requerimento do benefício."],"pegadinhas":["Incluir o 'menor sob guarda' como equiparado a filho (a lei atual cita só enteado e menor tutelado).","Dizer que o filho estudante universitário é dependente até 24 anos.","Afirmar que os pais concorrem com o cônjuge.","Dizer que irmão ou pais têm dependência presumida.","Afirmar que o concubinato se equipara à união estável."],"base_legal":"Lei 8.213/1991, arts. 16 e 17; EC 103/2019, art. 23, §6º; Lei 13.846/2019; STF Temas 526 e 529.","questoes":["DP-030","DP-031","P22-057","P22-113","P22-114","P22-087"]},{"id":"dp-31","disciplina":"Direito Previdenciário","topico":"Pensão por morte","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Benefício pago ao conjunto de dependentes do segurado que morre (aposentado ou não). Depois das Leis 13.135/2015 e 13.846/2019 e da EC 103, ela deixou de ser automaticamente integral e vitalícia: o valor é por cotas e a duração depende da idade do cônjuge.","pontos":["Independe de carência; exige qualidade de segurado do falecido (ou direito adquirido a aposentadoria).","Início: na data do óbito, se requerida em até 180 dias (filhos menores de 16 anos) ou 90 dias (demais dependentes); depois disso, na data do requerimento. Morte presumida: da decisão judicial.","Valor (EC 103, art. 23): cota familiar de 50% da aposentadoria que o segurado recebia (ou da que teria por incapacidade permanente) + 10% por dependente, até 100%.","As cotas NÃO revertem aos demais dependentes quando um deles perde o direito.","Se houver dependente inválido ou com deficiência intelectual, mental ou grave: 100% da aposentadoria, até o teto.","Cônjuge/companheiro: 4 meses se o óbito ocorrer antes de 18 contribuições ou com menos de 2 anos de casamento/união (salvo acidente ou doença profissional/do trabalho).","Cumpridos 18 contribuições e 2 anos de união, a duração depende da idade do cônjuge no óbito: menos de 22 anos = 3 anos; 22 a 27 = 6 anos; 28 a 30 = 10 anos; 31 a 41 = 15 anos; 42 a 44 = 20 anos; 45 ou mais = vitalícia.","Perde o direito quem for condenado, por sentença transitada em julgado, por crime doloso que causou a morte do segurado (art. 74, §1º), e o cônjuge cujo casamento/união foi simulado para obter o benefício.","Acumulação de pensão com aposentadoria (EC 103, art. 24): recebe 100% do benefício mais vantajoso + parte do outro: 60% do que exceder 1 até 2 SM; 40% de 2 a 3 SM; 20% de 3 a 4 SM; 10% acima de 4 SM.","Vedado receber mais de uma pensão deixada por cônjuge/companheiro no RGPS (ressalvadas as de regimes diferentes)."],"pegadinhas":["Afirmar que a pensão é sempre vitalícia e integral para o cônjuge.","Dizer que as cotas dos dependentes que saem são redistribuídas aos demais.","Exigir carência para a pensão.","Afirmar que o homicida doloso do segurado pode receber a pensão.","Dizer que a acumulação pensão + aposentadoria é proibida (ela é permitida, com redução)."],"base_legal":"CF, art. 201, V; EC 103/2019, arts. 23 e 24; Lei 8.213/1991, arts. 74 a 79; Leis 13.135/2015 e 13.846/2019.","questoes":["DP-016","DP-017","P22-086","P22-087"]},{"id":"dp-32","disciplina":"Direito Previdenciário","topico":"Decadência e prescrição no direito previdenciário","recorrencia":"media","provas":[2012,2022],"resumo":"Decadência é a perda do próprio direito de revisar um ato (prazo para 'mexer' no benefício concedido); prescrição é a perda do direito de cobrar parcelas atrasadas. O direito de pedir o benefício em si (fundo de direito) não se perde com o tempo.","pontos":["Decadência do segurado: 10 anos para pedir a revisão do ato de concessão, contados do dia 1º do mês seguinte ao do recebimento da primeira prestação ou da ciência da decisão de indeferimento definitiva no âmbito administrativo (art. 103).","Não há prazo para requerer um benefício: o fundo de direito não decai (STF, ADI 6096, afastou a decadência que a Lei 13.846/2019 tentou criar para indeferimento e cessação).","Prescrição: 5 anos para cobrar prestações vencidas, restituições ou diferenças, contados da data em que deveriam ter sido pagas (art. 103, parágrafo único). Não corre contra menores, incapazes e ausentes.","Decadência do INSS para anular atos favoráveis ao beneficiário: 10 anos, contados da data em que foram praticados, SALVO comprovada má-fé (art. 103-A). Em caso de fraude, não há prazo.","Acidente do trabalho: as ações prescrevem em 5 anos, contados da data do acidente (morte ou incapacidade temporária) ou do reconhecimento da incapacidade permanente/agravamento (art. 104).","Custeio: o prazo para a Receita constituir créditos de contribuições é de 5 anos (CTN; Súmula Vinculante 8 do STF declarou inconstitucionais os prazos de 10 anos da Lei 8.212).","Exemplo de prova: aposentadoria com primeiro pagamento em dezembro/2015 → revisão até 1º/1/2026."],"pegadinhas":["Dizer que o segurado tem prazo de 5 (ou 10) anos para requerer o benefício contado do início da doença.","Afirmar que o INSS só pode cassar benefício fraudulento em até 10 anos (havendo má-fé, não há prazo).","Trocar os prazos: decadência de revisão = 10 anos; prescrição de parcelas = 5 anos.","Contar a decadência da data da concessão, e não do 1º dia do mês seguinte ao primeiro pagamento."],"base_legal":"Lei 8.213/1991, arts. 103, 103-A e 104; STF ADI 6096; Súmula Vinculante 8; CTN, arts. 173 e 174.","questoes":["P22-075","P22-076","P22-077","P22-078"]},{"id":"dp-33","disciplina":"Direito Previdenciário","topico":"Recursos administrativos: Conselho de Recursos da Previdência Social (CRPS)","recorrencia":"media","provas":[2012,2022],"resumo":"O CRPS é o órgão colegiado que julga, na esfera administrativa, os recursos contra decisões do INSS sobre benefícios. Integra a estrutura do Ministério da Previdência Social, não do INSS, e garante o controle das decisões sem necessidade de ir ao Judiciário.","pontos":["Natureza: órgão colegiado de controle jurisdicional administrativo, vinculado ao Ministério da Previdência Social.","Estrutura: Juntas de Recursos (1ª instância recursal), Câmaras de Julgamento (2ª instância), Conselho Pleno (uniformiza a jurisprudência por enunciados) e Presidência.","Composição tripartite nas Juntas e Câmaras: representantes do governo, das empresas e dos trabalhadores.","Prazo para recorrer e para contrarrazões: 30 dias (Decreto 3.048/1999, art. 305).","Recurso ordinário: contra decisão do INSS, julgado pela Junta. Recurso especial: contra decisão da Junta, julgado pela Câmara.","Antes de enviar o recurso, o INSS pode rever sua decisão e reconhecer o direito (reforma pelo próprio órgão).","Propor ação judicial com o mesmo objeto do recurso significa renúncia/desistência automática do recurso administrativo (art. 126, §3º, Lei 8.213).","Não se exige depósito prévio para recorrer (Súmula Vinculante 21).","Contribuições previdenciárias (crédito tributário) NÃO são julgadas pelo CRPS desde a Lei 11.457/2007: o contencioso fica com a Receita Federal e o CARF.","Compete ao CRPS julgar também recursos de processos de interesse dos RPPS (supervisão e fiscalização), conforme o regulamento."],"pegadinhas":["Dizer que o CRPS julga recursos sobre lançamento de crédito de contribuições (é o CARF).","Afirmar que o CRPS integra o INSS.","Dizer que é possível manter recurso administrativo e ação judicial idênticos ao mesmo tempo.","Afirmar que o recurso exige depósito ou arrolamento de bens."],"base_legal":"Lei 8.213/1991, art. 126; Decreto 3.048/1999, arts. 303 a 310; Lei 11.457/2007; Súmula Vinculante 21.","questoes":["P22-083","P22-084","P22-085"]},{"id":"dp-34","disciplina":"Direito Previdenciário","topico":"Crimes previdenciários","recorrencia":"media","provas":[2022],"resumo":"São crimes do Código Penal que protegem o patrimônio da Previdência. Os dois mais cobrados são a apropriação indébita previdenciária (descontar e não repassar) e a sonegação de contribuição (omitir ou reduzir mediante fraude em declarações).","pontos":["Apropriação indébita previdenciária (CP, art. 168-A): deixar de repassar à previdência as contribuições recolhidas (descontadas) dos contribuintes, no prazo e forma legal. Pena: reclusão de 2 a 5 anos e multa.","Sonegação de contribuição previdenciária (CP, art. 337-A): suprimir ou reduzir contribuição omitindo segurados da folha, deixando de lançar na contabilidade ou omitindo receitas/fatos geradores. Pena: reclusão de 2 a 5 anos e multa.","Extinção da punibilidade no 168-A: declarar, confessar e PAGAR espontaneamente antes do início da ação fiscal (§2º).","Extinção da punibilidade no 337-A: declarar e confessar espontaneamente, prestando as informações, antes do início da ação fiscal: não exige pagamento (§1º).","Pagamento integral do débito, a qualquer tempo, também extingue a punibilidade (Lei 10.684/2003, art. 9º); o parcelamento antes do recebimento da denúncia suspende a pretensão punitiva (Lei 9.430/1996, art. 83).","Perdão judicial ou só multa: réu primário e de bons antecedentes que paga após a ação fiscal e antes da denúncia, ou débito igual/inferior ao mínimo para ajuizar execução fiscal (art. 168-A, §3º).","Inserção de dados falsos em sistema de informações (art. 313-A): funcionário autorizado; reclusão de 2 a 12 anos.","Estelionato contra o INSS: art. 171, §3º, CP: pena aumentada de 1/3 (entidade de direito público).","Falsificação de documento público inclui inserir dados falsos em folha de pagamento, CTPS ou documentos de informações à previdência (art. 297, §§3º e 4º).","Competência: Justiça Federal."],"pegadinhas":["Trocar os dois crimes: descontou e não repassou = apropriação indébita (168-A); omitiu/fraudou declaração = sonegação (337-A).","Exigir pagamento para a extinção da punibilidade da sonegação na hipótese do §1º.","Dizer que esses crimes são de competência da Justiça Estadual."],"base_legal":"Código Penal, arts. 168-A, 171, §3º, 297, §§3º e 4º, 313-A, 313-B e 337-A; Lei 10.684/2003, art. 9º; Lei 9.430/1996, art. 83.","questoes":["DP-014","DP-015","P22-079","P22-080","P22-081","P22-082"]},{"id":"dp-35","disciplina":"Direito Previdenciário","topico":"BPC/LOAS e auxílio-inclusão","recorrencia":"alta","provas":[2016,2022],"resumo":"O Benefício de Prestação Continuada (BPC) é assistencial, não previdenciário: garante 1 salário mínimo ao idoso e à pessoa com deficiência pobres, sem exigir contribuição. O auxílio-inclusão incentiva a pessoa com deficiência que recebe BPC a entrar no mercado de trabalho.","pontos":["BPC: 1 salário mínimo mensal à pessoa com deficiência e ao idoso com 65 anos ou mais que comprovem não ter meios de prover a própria manutenção nem de tê-la provida pela família (CF, art. 203, V; LOAS, art. 20).","Critério de renda: renda familiar mensal per capita igual ou inferior a 1/4 do salário mínimo; a lei permite ampliar até 1/2 SM conforme regulamento e fatores de vulnerabilidade.","Pessoa com deficiência: impedimento de longo prazo (mínimo de 2 anos), avaliado por perícia médica e avaliação social (biopsicossocial) no INSS.","Benefício de 1 SM (BPC ou previdenciário) recebido por outro idoso ou pessoa com deficiência da família não entra no cálculo da renda (art. 20, §14).","Exige inscrição atualizada no CadÚnico (e cadastro biométrico, conforme Lei 15.077/2024).","Quem operacionaliza (concede, mantém, revisa) é o INSS; a coordenação da política é do Ministério do Desenvolvimento e Assistência Social.","Não é vitalício: deve ser revisto a cada 2 anos; não gera pensão por morte nem paga 13º (abono anual).","Não pode ser acumulado com outro benefício da seguridade ou de outro regime, salvo assistência médica, pensão especial de natureza indenizatória e remuneração de aprendiz (limitada a 2 anos).","Auxílio-inclusão (LOAS, art. 26-A, Lei 14.176/2021): para a pessoa com deficiência moderada ou grave que recebe BPC (ou recebeu nos últimos 5 anos) e passa a exercer atividade remunerada de até 2 salários mínimos, filiada ao RGPS ou a RPPS.","Valor do auxílio-inclusão: 50% do BPC (meio salário mínimo). Não acumula com o BPC (que é suspenso), nem com aposentadoria, pensão, benefício por incapacidade ou seguro-desemprego."],"pegadinhas":["Chamar o BPC ou o auxílio-inclusão de benefício previdenciário (ambos são assistenciais).","Dizer que o BPC exige contribuição ou que gera pensão por morte para a família.","Afirmar que o idoso tem direito a partir dos 60 anos (é a partir dos 65).","Dizer que o auxílio-inclusão é acumulável com o BPC.","Trocar o critério de renda (1/4 do SM per capita) por 1/2 SM como regra geral."],"base_legal":"CF, art. 203, V; Lei 8.742/1993 (LOAS), arts. 20, 21, 21-A e 26-A a 26-H; Lei 14.176/2021; Lei 15.077/2024.","questoes":["DP-006","DP-018","P22-116","P22-117","P22-118"]},{"id":"dp-36","disciplina":"Direito Previdenciário","topico":"Legislação especial: pensões especiais, anistiados e seguro-defeso","recorrencia":"media","provas":[2022],"resumo":"São benefícios criados por leis específicas, pagos pelo Tesouro e operacionalizados pelo INSS. A prova de 2022 dedicou um bloco inteiro a eles, sempre testando três coisas: valor, se é transmissível a herdeiros e se acumula com outros benefícios.","pontos":["Seringueiros / 'soldados da borracha' (ADCT, art. 54; Lei 7.986/1989): pensão vitalícia de 2 salários mínimos a quem trabalhou nos seringais da Amazônia na 2ª Guerra e NÃO possui meios de subsistência; transferível aos dependentes reconhecidamente carentes. A EC 78/2014 acrescentou indenização de R$ 25 mil (ADCT, art. 54-A).","Ex-combatentes da 2ª Guerra (ADCT, art. 53; Lei 8.059/1990): pensão especial igual à pensão militar deixada por segundo-tenente das Forças Armadas; transmissível aos dependentes.","Talidomida (Lei 7.070/1982): pensão vitalícia calculada por pontos conforme o grau de deficiência; ressalvado o direito de opção, NÃO acumula com rendimento ou indenização paga pela União a seus beneficiários por esse motivo.","Hemodiálise de Caruaru (Lei 9.422/1996): pensão especial vitalícia às vítimas; NÃO se transmite aos sucessores.","Césio-137 em Goiânia (Lei 9.425/1996): pensão especial vitalícia às vítimas, pessoal e intransferível (não passa ao cônjuge ou herdeiros).","Hanseníase (Lei 11.520/2007): pensão especial mensal, vitalícia e intransferível às pessoas internadas compulsoriamente em hospitais-colônia até 31/12/1986; ressalvado o direito de opção, não acumula com indenizações da União pelos mesmos fatos (mas não impede benefícios previdenciários).","Zika vírus: a Lei 13.985/2020 criou pensão de 1 salário mínimo, mensal, vitalícia e intransferível, para crianças com a síndrome congênita nascidas entre 1º/1/2015 e 31/12/2019 que recebiam BPC (substitui o BPC). ATUALIZAÇÃO: a Lei 15.156/2025 criou uma nova pensão especial, mensal e vitalícia, no valor do teto do RGPS, sem recorte de data de nascimento, acumulável com o BPC, mais indenização de R$ 50 mil por dano moral.","Anistiados políticos (Lei 10.559/2002): reparação econômica de caráter indenizatório, em prestação única ou em prestação mensal, permanente e continuada; valores isentos de imposto de renda.","Seguro-defeso (Lei 10.779/2003): seguro-desemprego de 1 salário mínimo ao pescador profissional artesanal durante o período de defeso (proibição de pesca); é PESSOAL e INTRANSFERÍVEL; o INSS recebe e processa os requerimentos."],"pegadinhas":["Dizer que o seringueiro tem direito mesmo possuindo meios de subsistência.","Afirmar que as pensões de Caruaru ou de Goiânia passam aos herdeiros.","Dizer que a pensão da talidomida acumula com indenização da União pelo mesmo fato.","Afirmar que o seguro-defeso é transferível ou que é benefício previdenciário comum.","Trocar o valor de referência dos ex-combatentes (segundo-tenente) por outro posto.","Zika: questão sobre a Lei 13.985/2020 fala em 1 salário mínimo e nascidos de 2015 a 2019; a regra nova (Lei 15.156/2025) paga o teto do RGPS e acumula com o BPC. Veja qual lei o item cita."],"base_legal":"ADCT, arts. 53, 54 e 54-A; Leis 7.070/1982, 7.986/1989, 8.059/1990, 9.422/1996, 9.425/1996, 10.559/2002, 10.779/2003, 11.520/2007 e 13.985/2020.; Lei 15.156/2025 (zika)","questoes":["DP-007","DP-008","DP-009","DP-010","DP-011","DP-012","DP-013","P22-097","P22-098","P22-099","P22-100","P22-101","P22-102","P22-103","P22-104","P22-105"]},{"id":"dp-37","disciplina":"Direito Previdenciário","topico":"RPPS x RGPS, contagem recíproca, CTC e compensação previdenciária","recorrencia":"media","provas":[2012,2022],"resumo":"O Brasil tem regimes diferentes: o RGPS (INSS) para trabalhadores em geral e os RPPS para servidores efetivos. A contagem recíproca permite somar o tempo de contribuição de um regime no outro, documentado pela Certidão de Tempo de Contribuição (CTC), e os regimes acertam contas pela compensação financeira.","pontos":["RPPS: só para servidores titulares de cargo efetivo (CF, art. 40). Ocupante exclusivamente de cargo em comissão, cargo temporário ou emprego público é segurado obrigatório do RGPS (art. 40, §13).","Após a EC 103: vedada a criação de novos RPPS; entes com RPPS devem ter previdência complementar; possibilidade de contribuição extraordinária para cobrir déficit atuarial (art. 149, §1º-B).","Servidor da União (regra geral pós-EC 103): 65 anos (H) / 62 (M), 25 anos de contribuição, 10 anos de serviço público e 5 no cargo.","Participante de RPPS não pode se filiar ao RGPS como facultativo, salvo afastamento sem vencimentos sem contribuição ao RPPS.","Contagem recíproca (CF, art. 201, §9º): soma do tempo de contribuição na administração pública e na atividade privada, rural e urbana, com compensação financeira entre os regimes.","É vedada a contagem de tempo de contribuição FICTÍCIO para benefícios e para contagem recíproca (CF, art. 40, §10, e art. 201, §14).","Vedações da Lei 8.213 (art. 96): não se conta tempo em dobro ou em condições especiais; não se conta tempo concomitante; tempo já usado para aposentadoria em um regime não pode ser usado em outro.","CTC: emitida pelo INSS (para o RGPS); é admitida a emissão de CTC de períodos de contribuição posteriores à aposentadoria no RGPS (Decreto 3.048/1999). Tempo de contribuinte individual em débito só entra após indenização.","Compensação financeira (Lei 9.796/1999): o regime de origem paga ao regime instituidor (o que concede o benefício), apenas quando há contagem recíproca de tempo NÃO concomitante.","Tempo de serviço militar também entra na contagem recíproca com compensação (CF, art. 201, §9º-A)."],"pegadinhas":["Dizer que o servidor ocupante só de cargo em comissão é vinculado ao RPPS.","Afirmar que é possível contar tempo fictício na contagem recíproca.","Dizer que é vedada a emissão de CTC de períodos posteriores à aposentadoria no RGPS.","Afirmar que a compensação financeira abrange tempo concomitante."],"base_legal":"CF, arts. 40 e 201, §§9º, 9º-A e 14; EC 103/2019; Lei 8.213/1991, arts. 94 a 99; Lei 9.796/1999; Decreto 3.048/1999, arts. 125 a 130.","questoes":["DP-022","P22-061","P22-088","P22-111","P22-112","P22-119","P22-120"]},{"id":"dp-38","disciplina":"Direito Previdenciário","topico":"Serviços: serviço social, habilitação e reabilitação profissional","recorrencia":"baixa","provas":[2022],"resumo":"Além de benefícios (dinheiro), o RGPS presta serviços: o serviço social e a habilitação e reabilitação profissional. Eles atendem segurados e dependentes e caem com a literalidade dos arts. 88 a 93 da Lei 8.213.","pontos":["Serviços do RGPS (art. 18, III): serviço social e reabilitação profissional: devidos ao segurado e ao dependente.","Serviço social (art. 88): esclarecer aos beneficiários seus direitos sociais e os meios de exercê-los e estabelecer, junto com eles, o processo de solução dos problemas que emergirem da sua relação com a Previdência, tanto no âmbito interno da instituição como na dinâmica da sociedade.","Prioridade do serviço social: segurados em benefício por incapacidade temporária e atenção especial a aposentados e pensionistas; pode emitir parecer social e usar intervenção técnica, assistência material e recursos da comunidade.","Habilitação e reabilitação (art. 89): proporcionar meios de (re)educação e (re)adaptação profissional e social para o beneficiário incapacitado parcial ou totalmente e para a pessoa com deficiência.","Inclui fornecimento de prótese, órtese e instrumentos de auxílio para locomoção, sua reparação ou substituição, e transporte do acidentado do trabalho, quando necessário.","É devida em caráter obrigatório aos segurados, inclusive aposentados, e, na medida das possibilidades, aos dependentes (art. 90).","Pode haver auxílio para tratamento ou exame fora do domicílio do beneficiário (art. 91).","Ao final, o INSS emite certificado individual indicando as atividades que o reabilitado pode exercer (art. 92).","Cotas (art. 93): empresa com 100 ou mais empregados deve preencher 2% (até 200), 3% (201 a 500), 4% (501 a 1.000) ou 5% (mais de 1.000) dos cargos com reabilitados ou pessoas com deficiência habilitadas.","Recusa injustificada do segurado em se submeter à reabilitação leva à suspensão do benefício por incapacidade (art. 101)."],"pegadinhas":["Dizer que é vedado auxílio para tratamento ou exame fora do domicílio.","Afirmar que a reabilitação é só para segurados ativos (aposentados também têm direito).","Trocar os percentuais ou o número mínimo de empregados (100) da cota."],"base_legal":"Lei 8.213/1991, arts. 18, III, 62, 88 a 93 e 101; Decreto 3.048/1999.","questoes":["P22-095","P22-096"]},{"id":"pt-01","disciplina":"Português","topico":"Compreensão e interpretação de textos","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Compreender é identificar o que o texto diz expressamente; interpretar é tirar conclusões (inferências) autorizadas pelo texto. No Cebraspe, quase metade dos itens de Português depende de ler com atenção o que o autor afirmou e o que ele NÃO afirmou.","pontos":["Compreensão = informação explícita (está escrita). Interpretação = inferência lógica a partir do que está escrito (está implícito, mas autorizado).","Três erros clássicos do item: extrapolação (vai além do texto), redução (pega só parte da ideia e a apresenta como o todo) e contradição (afirma o oposto do texto).","Atenção a palavras absolutas: sempre, nunca, todos, nenhum, apenas, somente, exclusivamente. Um texto que diz ‘a maioria’ não autoriza ‘todos’.","Diferencie fato (dado verificável: ‘o rendimento era de R$ 2.074’) de opinião/hipótese (‘os técnicos sugerem as seguintes hipóteses’).","Identifique a tese (ideia central) e os argumentos que a sustentam: dados estatísticos, exemplos, citação de autoridade, comparação.","Em comparações numéricas, confira quem é comparado com quem (ex.: ‘31% menos em comparação com as que optaram dois anos antes’ = os novos ganham menos que os antigos).","Em textos literários (crônica, conto), separe a voz do autor/narrador da opinião atribuída a terceiros (‘tem quem fique melancólico’ não é a opinião da autora).","Item de reescrita (‘estariam mantidos os sentidos e a correção gramatical’) exige DUAS coisas: mesmo sentido E gramática correta; falhou uma, o item está errado.","Expressões como ‘conclui-se’, ‘infere-se’, ‘depreende-se’ pedem inferência segura; ‘sugere’, ‘dá a entender’ aceitam inferência mais aberta.","Leia o comando do item (‘de acordo com o texto’, ‘no texto, a autora...’): a resposta deve vir do texto, não do seu conhecimento de mundo."],"pegadinhas":["Juntar duas informações verdadeiras do texto numa relação de causa e consequência que o texto não estabelece (P22-001).","Trocar ‘a maioria’ por ‘todos’, ou ‘pode’ por ‘deve’.","Atribuir ao autor a opinião de pessoas citadas no texto.","Usar uma informação verdadeira no mundo real, mas ausente do texto, para tentar fazer você marcar Certo."],"base_legal":"Não se aplica (conteúdo de Língua Portuguesa).","questoes":["P22-001","P22-002","P22-003","P22-008","P22-010","P22-012"]},{"id":"pt-02","disciplina":"Português","topico":"Tipologia e gênero textual","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Tipo textual é o modo de organizar o texto (narrar, descrever, argumentar, expor, instruir); gênero é a forma concreta e social do texto (notícia, crônica, ofício, receita). Um mesmo gênero pode misturar vários tipos.","pontos":["Narração: fatos em sequência temporal, com personagens, tempo, espaço e narrador; verbos de ação, geralmente no pretérito perfeito.","Descrição: retrato de seres, objetos ou ambientes; predominam adjetivos e verbos de estado/ligação; tempo ‘congelado’.","Dissertação expositiva: apresenta e explica informações de modo neutro (ex.: texto didático, verbete).","Dissertação argumentativa: defende uma tese com argumentos (dados, exemplos, autoridade, causa e consequência) para convencer o leitor.","Injunção (instrucional): orienta o leitor a fazer algo; verbos no imperativo ou infinitivo (manual, receita, edital).","Gêneros comuns em prova: notícia/reportagem (informativos), artigo de opinião e editorial (argumentativos), crônica (texto curto, linguagem leve, reflexão sobre o cotidiano), ofício (correspondência oficial).","Um gênero pode ter vários tipos: uma crônica pode narrar um fato e, ao mesmo tempo, argumentar sobre ele (ex.: ‘Um ano de menos’, de Rachel de Queiroz).","Texto com dados estatísticos e explicação de hipóteses (como o texto do DIEESE na prova de 2022) é predominantemente expositivo/informativo, mesmo trazendo uma conclusão (‘o que confirma a precarização’).","Função de linguagem predominante: referencial (informar), emotiva (1ª pessoa, sentimentos), apelativa/conativa (convencer o leitor, 2ª pessoa/imperativo), poética, metalinguística, fática."],"pegadinhas":["Afirmar que o texto é ‘exclusivamente narrativo’ só porque há um trecho narrativo.","Confundir gênero (crônica, notícia) com tipo (narração, dissertação).","Dizer que todo texto em 1ª pessoa é narrativo: artigos de opinião e crônicas reflexivas também usam 1ª pessoa."],"base_legal":"Não se aplica (conteúdo de Língua Portuguesa).","questoes":["PT-003","P22-008","P22-003"]},{"id":"pt-03","disciplina":"Português","topico":"Ortografia oficial","recorrencia":"media","provas":[2012,2016,2022],"resumo":"Ortografia é a grafia correta das palavras segundo o Novo Acordo Ortográfico (obrigatório no Brasil desde 1º/1/2016). Em prova Cebraspe aparece sobretudo em itens de reescrita e nos pares que confundem (porque/por que, mal/mau, há/a, hífen).","pontos":["Porquês: ‘por que’ = pergunta ou ‘pelo qual’ (Por que saiu? / O motivo por que saiu); ‘porque’ = explicação/causa (Saiu porque choveu); ‘por quê’ = no fim da frase (Saiu por quê?); ‘porquê’ = substantivo, vem com artigo (o porquê da saída).","Mal x mau: mal é oposto de bem (passou mal); mau é oposto de bom (mau humor).","Há x a: ‘há’ indica tempo passado (= faz: saiu há dois dias); ‘a’ indica tempo futuro ou distância (daqui a dois dias; a 5 km).","Afim (semelhante: áreas afins) x a fim de (com o objetivo de).","Senão (caso contrário / a não ser) x se não (caso não: se não chover, iremos).","Onde (lugar fixo: onde você mora) x aonde (movimento, com verbos que pedem ‘a’: aonde você vai).","Hífen com prefixos: vogal igual separa (micro-ondas, anti-inflamatório); vogal diferente junta (autoescola, infraestrutura); prefixo terminado em vogal + r ou s dobra a consoante (antirrugas, minissaia, ultrassom); antes de h há hífen (anti-higiênico, super-homem).","Prefixo ‘co’ em regra se junta (coautor, cooperar, coerdeiro); ‘não’ como prefixo não leva hífen (não fumante); ex-, vice-, pós-, pré-, pró- (tônicos) levam hífen (ex-diretor, vice-presidente, pós-graduação).","Trema foi abolido (frequente, linguiça), mantido só em nomes estrangeiros e derivados (Müller, mülleriano).","Sufixos: -ês/-esa para origem e títulos (português, princesa); -ez/-eza para substantivos abstratos derivados de adjetivos (rapidez, beleza)."],"pegadinhas":["Usar ‘porque’ junto em pergunta direta (‘Porque você faltou?’): o certo é ‘Por que’.","Trocar ‘há dois anos’ por ‘a dois anos’ em reescritas de tempo passado.","Escrever ‘auto-escola’, ‘anti-rugas’ ou ‘micro-empresa’ (grafias anteriores ao Acordo) como corretas."],"base_legal":"Acordo Ortográfico da Língua Portuguesa (Decreto 6.583/2008; vigência obrigatória a partir de 2016, Decreto 7.875/2012); Vocabulário Ortográfico da Língua Portuguesa (VOLP/ABL).","questoes":[]},{"id":"pt-04","disciplina":"Português","topico":"Acentuação gráfica","recorrencia":"media","provas":[2012,2016,2022],"resumo":"As regras de acento dependem da sílaba tônica (oxítona, paroxítona, proparoxítona) e da terminação da palavra. O Cebraspe costuma pedir a justificativa do acento (‘as palavras X e Y são acentuadas pela mesma regra’).","pontos":["Proparoxítonas: TODAS são acentuadas (público, técnico, lâmpada).","Oxítonas: acentuam-se as terminadas em a(s), e(s), o(s), em, ens (sofá, café, avô, também, parabéns).","Paroxítonas: acentuam-se as terminadas em l, n, r, x, ps, ã(s), ão(s), i(s), u(s), um, uns e ditongo oral (fácil, hífen, caráter, tórax, bíceps, órfã, órgão, júri, vírus, álbum, história, série).","Paroxítonas terminadas em a, e, o, em, ens NÃO têm acento (casa, jovem, itens, hifens: sem acento no plural).","Monossílabos tônicos terminados em a(s), e(s), o(s) são acentuados (pá, pé, nós, três).","Hiato: i e u tônicos, sozinhos na sílaba ou com s, levam acento (saída, saúde, baú, país); não levam se seguidos de nh (rainha) ou se a sílaba tiver outra letra (ruim, juiz).","Acordo: caiu o acento dos ditongos abertos ei/oi em PAROXÍTONAS (ideia, assembleia, heroico, jiboia); continua em oxítonas e monossílabos (papéis, herói, dói, céu).","Acordo: caiu o acento de ‘oo’ e ‘ee’ (voo, enjoo, leem, creem, veem) e do i/u tônico após ditongo em paroxítona (feiura, baiuca).","Acentos diferenciais que ficaram: pôde (passado) x pode (presente); pôr (verbo) x por (preposição); têm/vêm (plural) x tem/vem (singular). Caíram: para (verbo), pelo, pera, polo.","Derivados de ter/vir no plural levam acento agudo: ele mantém / eles mantêm; ele intervém / eles intervêm."],"pegadinhas":["Dizer que ‘ideia’ deve ter acento (regra antiga) ou que ‘herói’ perdeu o acento (oxítona, mantém).","Afirmar que ‘saúde’ e ‘baú’ seguem regras diferentes: ambas são acentuadas pela regra do hiato.","Agrupar ‘café’ (oxítona) e ‘fácil’ (paroxítona) como se fossem da mesma regra."],"base_legal":"Acordo Ortográfico da Língua Portuguesa (Decreto 6.583/2008).","questoes":[]},{"id":"pt-05","disciplina":"Português","topico":"Classes de palavras","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"São 10 classes gramaticais. O Cebraspe raramente pede só o nome da classe: costuma perguntar a função da palavra no contexto (o ‘que’ é pronome relativo ou conjunção? o particípio é adjetivo ou verbo?).","pontos":["Variáveis (flexionam): substantivo, adjetivo, artigo, numeral, pronome e verbo. Invariáveis: advérbio, preposição, conjunção e interjeição.","Particípio em tempo composto (ter/haver + particípio) é VERBO e fica invariável: ‘o número havia crescido’. Particípio na voz passiva (ser + particípio) concorda com o sujeito: ‘os dados foram obtidos’.","‘Que’ pronome relativo: retoma um termo e pode ser trocado por ‘o qual/a qual’ (a prestação que se paga = a qual se paga). ‘Que’ conjunção integrante: introduz oração substantiva e pode ser trocado por ‘isso’ (Sei que virá = Sei isso).","‘Se’ pode ser: partícula apassivadora (VTD + se: vendem-se casas), índice de indeterminação do sujeito (VTI/VI + se: precisa-se de ajuda), pronome reflexivo (ele se feriu), parte integrante do verbo pronominal (lembrar-se, queixar-se) ou conjunção (condicional ou integrante).","Locução verbal ‘haver de + infinitivo’ indica intenção/futuro, mas ‘hão’ é presente do indicativo de haver (eles hão de esperar), não forma abreviada de ‘haverão’.","Pronomes demonstrativos: ‘este’ anuncia o que vem (catafórico) ou se refere ao mais próximo; ‘esse’ retoma o que já foi dito (anafórico); ‘aquele’ indica o mais distante.","Conjunções adversativas: mas, porém, contudo, todavia, entretanto, no entanto. Conclusivas: logo, portanto, por isso, pois (depois do verbo). Explicativas: pois (antes do verbo), porque, que.","Conjunções concessivas (embora, ainda que, conquanto, mesmo que) pedem subjuntivo: ‘Embora chovesse, saiu’.","Advérbio modifica verbo, adjetivo ou outro advérbio e é invariável (‘meio cansada’: meio = um pouco, não varia).","Substantivação: qualquer palavra vira substantivo com artigo (o porquê, o sim, o amanhã)."],"pegadinhas":["Classificar particípio de tempo composto como adjetivo concordando com o substantivo (P22-005).","Dizer que ‘hão’ é forma abreviada de ‘haverão’ (P22-014).","Trocar ‘que’ relativo por conjunção integrante ou vice-versa nos itens de classificação.","Trocar conectivo adversativo por concessivo sem ajustar o modo verbal (‘mas chovia’ → ‘embora chovia’ está errado)."],"base_legal":"Não se aplica (conteúdo de Língua Portuguesa).","questoes":["PT-001","P22-005","P22-011","P22-014"]},{"id":"pt-06","disciplina":"Português","topico":"Sintaxe da oração e do período","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Sintaxe estuda a função das palavras na frase (sujeito, objeto, adjunto) e a relação entre as orações (coordenação e subordinação). É a base para acertar concordância, regência, crase e pontuação.","pontos":["Termos essenciais: sujeito e predicado. Integrantes: objeto direto, objeto indireto, complemento nominal, agente da passiva. Acessórios: adjunto adnominal, adjunto adverbial, aposto. Vocativo é isolado (chamamento).","Tipos de sujeito: simples, composto, oculto/desinencial (Saímos cedo), indeterminado (3ª pessoa do plural sem referente, ‘Roubaram meu carro’, ou VTI/VI + se, ‘Precisa-se de técnicos’) e oração sem sujeito.","Oração sem sujeito: haver no sentido de existir/ocorrer (Havia problemas), fazer/haver indicando tempo (Faz dois anos), fenômenos da natureza (Choveu). O verbo fica no singular.","Voz passiva analítica: ser + particípio (Os dados foram obtidos pelo DIEESE). Voz passiva sintética: VTD + se (Paga-se a prestação = A prestação é paga): aqui o termo é SUJEITO, e o verbo concorda com ele.","Objeto direto liga-se ao verbo sem preposição obrigatória; objeto indireto, com preposição exigida pelo verbo; complemento nominal completa nome (substantivo, adjetivo, advérbio) com preposição (respeito às leis).","Período composto por coordenação: orações independentes (aditivas, adversativas, alternativas, conclusivas, explicativas).","Período composto por subordinação: orações substantivas (função de sujeito, objeto etc.), adjetivas (introduzidas por pronome relativo) e adverbiais (causa, condição, concessão, finalidade, tempo, consequência, comparação, conformidade, proporção).","Oração adjetiva restritiva (sem vírgulas) limita o termo: ‘Os servidores que faltaram serão punidos’ (só alguns). Explicativa (entre vírgulas) generaliza: ‘Os servidores, que faltaram, serão punidos’ (todos).","Pergunta direta com ‘que’ interrogativo (‘que será ela no dia seguinte?’) NÃO é oração adjetiva.","Orações reduzidas: sem conectivo, com verbo no infinitivo, gerúndio ou particípio (‘Terminada a reunião, saímos’ = Quando terminou a reunião)."],"pegadinhas":["Dizer que há indeterminação do sujeito quando o ‘se’ é parte do verbo pronominal (lembrar-se) ou partícula apassivadora (P22-011).","Classificar oração interrogativa como adjetiva explicativa só porque está entre vírgulas (P22-013).","Trocar oração adjetiva restritiva por explicativa (inserindo vírgulas) e afirmar que o sentido se mantém."],"base_legal":"Não se aplica (conteúdo de Língua Portuguesa).","questoes":["PT-001","P22-011","P22-013","P22-005"]},{"id":"pt-07","disciplina":"Português","topico":"Emprego do sinal indicativo de crase","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Crase é a fusão da preposição ‘a’ com o artigo feminino ‘a’ (ou com o ‘a’ inicial de aquele/aquela/aquilo), marcada pelo acento grave. Teste básico: troque a palavra feminina por uma masculina; se aparecer ‘ao’, há crase.","pontos":["Regra geral: termo que exige preposição ‘a’ + palavra feminina que aceita artigo ‘a’ → à. ‘Vou à reunião’ (Vou ao encontro). ‘Refiro-me à servidora’ (ao servidor).","OBRIGATÓRIA em locuções adverbiais, prepositivas e conjuntivas femininas: às vezes, à noite, à tarde, à vista, à porta, à medida que, à custa de, à procura de.","OBRIGATÓRIA na indicação de horas determinadas: às 14h, à uma hora (mas ‘desde as 8h’, ‘após as 10h’: sem crase, porque não há preposição ‘a’).","OBRIGATÓRIA com ‘à moda de/à maneira de’, mesmo antes de masculino, quando subentendida: bife à milanesa, gol à Pelé.","OBRIGATÓRIA com aquele(s)/aquela(s)/aquilo quando há preposição ‘a’: ‘Refiro-me àquele processo’.","PROIBIDA antes de palavra masculina (andar a pé), de verbo (começou a chover), de pronomes pessoais e da maioria dos pronomes de tratamento (a ela, a Vossa Excelência: exceto senhora, senhorita, dona com determinante), de pronomes indefinidos e demonstrativos sem ‘a’ (a esta, a qualquer, a ninguém).","PROIBIDA entre palavras repetidas (cara a cara, gota a gota, frente a frente), antes de artigo indefinido ‘uma’ (exceto hora) e quando o ‘a’ está no singular antes de palavra no plural (‘Dirigiu-se a pessoas’: o ‘a’ sozinho é só preposição).","Nomes de lugar: use o teste ‘Volto DA → vou À; volto DE → vou A’. ‘Vou à Bahia’ (volto da Bahia); ‘Vou a Brasília’ (volto de Brasília); com determinante, há crase: ‘Vou à Brasília de JK’.","Casa (lar) e terra (oposto de bordo) sem determinante: sem crase (‘Voltei a casa’, ‘Desceram a terra’); com determinante, há crase (‘Voltei à casa dos meus pais’).","FACULTATIVA antes de pronome possessivo feminino singular (à/a minha chefe), de nome próprio feminino de pessoa (à/a Maria) e após ‘até’ (até à/a porta).","Verbo transitivo direto (ver, encontrar, fazer) não exige preposição: se houver ‘à’ depois dele, a crase vem de outra causa (por exemplo, locução adverbial)."],"pegadinhas":["Justificar a crase de ‘ver à porta’ pela regência do verbo ‘ver’: ‘ver’ é transitivo direto; a crase se deve à locução adverbial de lugar ‘à porta’ (P22-009).","Colocar crase antes de verbo (‘começou à chover’) ou antes de masculino (‘pagamento à prazo’: correto: a prazo).","Afirmar que a crase é obrigatória antes de possessivo feminino (é facultativa).","Em reescritas, retirar uma preposição exigida (‘comparadas as’ no lugar de ‘comparadas às’) e manter o item como correto (P22-004)."],"base_legal":"Não se aplica (conteúdo de Língua Portuguesa).","questoes":["PT-002","P22-009","P22-004"]},{"id":"pt-08","disciplina":"Português","topico":"Pontuação","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"A pontuação organiza a sintaxe e pode mudar o sentido. O Cebraspe pergunta se a vírgula é obrigatória, facultativa ou proibida, e se inserir/retirar um sinal altera a correção ou o sentido.","pontos":["PROIBIDO separar com vírgula: sujeito e verbo; verbo e seus complementos (objeto direto/indireto); nome e complemento nominal: mesmo que o sujeito seja longo.","Vírgula OBRIGATÓRIA: para isolar vocativo (‘Senhor Ministro, informo...’), aposto explicativo (‘Rachel de Queiroz, escritora cearense, ...’), oração adjetiva explicativa, expressões explicativas (isto é, ou seja, por exemplo) e para separar itens de enumeração.","Adjunto adverbial deslocado (antes do verbo): vírgula obrigatória se longo; facultativa se curto (‘Ontem(,) saímos cedo’).","Conjunções adversativas e conclusivas deslocadas para o meio da oração ficam entre vírgulas (‘Ele, porém, não veio’).","Antes de ‘e’: em regra não se usa vírgula; usa-se quando os sujeitos são diferentes, quando o ‘e’ tem valor adversativo (= mas) ou quando há polissíndeto (e... e... e...).","Oração adjetiva: com vírgulas = explicativa (generaliza); sem vírgulas = restritiva (limita). Inserir ou retirar as vírgulas MUDA o sentido.","Ponto e vírgula: separa orações coordenadas longas ou que já têm vírgulas internas, e itens de enumeração (incisos de lei).","Dois-pontos: anunciam enumeração, explicação, citação ou conclusão (‘Tudo que nos espera: dentro do corpo...’).","Travessão duplo e parênteses podem substituir vírgulas para isolar intercalações (aposto, comentário); o travessão também marca fala em diálogos.","Oração subordinada adverbial anteposta à principal: vírgula recomendada (‘Se chover, ficaremos’)."],"pegadinhas":["Inserir vírgula entre sujeito longo e verbo e dizer que a correção foi mantida (PT-006).","Afirmar que retirar as vírgulas de oração adjetiva explicativa mantém o sentido.","Justificar vírgulas por uma função sintática que o segmento não tem (ex.: chamar de oração adjetiva uma pergunta direta: P22-013)."],"base_legal":"Não se aplica (conteúdo de Língua Portuguesa).","questoes":["PT-006","P22-013"]},{"id":"pt-09","disciplina":"Português","topico":"Concordância nominal e verbal","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Concordância verbal é o ajuste do verbo ao sujeito (número e pessoa); concordância nominal é o ajuste de artigos, adjetivos, numerais e pronomes ao substantivo (gênero e número). O primeiro passo é sempre achar o sujeito verdadeiro.","pontos":["Regra de ouro: ache o sujeito e ignore o que está entre ele e o verbo. ‘O percentual de pessoas inscritas ERA de 58,3%’: o sujeito é ‘o percentual’, singular.","Haver no sentido de existir/ocorrer e fazer/haver indicando tempo são impessoais: singular (‘Havia muitos problemas’; ‘Faz dois anos’). Em locução, o auxiliar também fica no singular (‘Deve haver soluções’). Já ‘existir’ concorda normalmente (‘Existem soluções’).","Voz passiva sintética (VTD + se): verbo concorda com o sujeito (‘Vendem-se casas’, ‘Alugam-se salas’). Índice de indeterminação (VTI + se): singular (‘Precisa-se de técnicos’, ‘Trata-se de casos graves’).","Sujeito composto antes do verbo: plural (‘O pai e o filho chegaram’). Depois do verbo: plural ou concordância com o mais próximo (‘Chegou o pai e o filho’).","Expressão partitiva (a maioria de, grande parte de, metade de) + plural: verbo no singular ou no plural (‘A maioria dos segurados contribui/contribuem’).","Porcentagem: verbo concorda com o número percentual ou com o termo especificado (‘30% da população votou’ / ‘1% dos eleitores votaram’): mas só quando a porcentagem é o sujeito.","‘Um dos que’: plural é o preferido (‘Ele é um dos que mais trabalham’).","Concordância nominal: adjetivo depois de vários substantivos concorda com o mais próximo ou vai ao plural (‘idioma e cultura portuguesa/portugueses’); adjetivo antes concorda com o mais próximo (‘bela casa e jardim’).","Variáveis (concordam): anexo, incluso, obrigado, mesmo, próprio, quite, bastante (= muitos: ‘bastantes provas’). Invariáveis: menos (‘menos pessoas’), alerta, pseudo, meio como advérbio (‘meio cansada’). ‘Meio’ numeral varia: ‘meia hora’.","É proibido/é necessário/é bom: sem artigo, fica invariável (‘É proibido entrada’); com artigo, concorda (‘É proibida a entrada’)."],"pegadinhas":["Sugerir flexionar o verbo para concordar com uma porcentagem que NÃO é o sujeito (P22-006).","Pluralizar o verbo haver impessoal (‘Haviam muitos candidatos’, errado) ou o auxiliar da locução (‘Devem haver’, errado).","Pôr no plural o verbo com índice de indeterminação (‘Precisam-se de técnicos’: errado).","Concordar o particípio de tempo composto com o substantivo (‘havia crescidos’: errado)."],"base_legal":"Não se aplica (conteúdo de Língua Portuguesa).","questoes":["P22-006","P22-005"]},{"id":"pt-10","disciplina":"Português","topico":"Regência nominal e verbal","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Regência é a relação entre um verbo ou nome e seu complemento, com ou sem preposição. Mudar a preposição pode deixar a frase errada ou alterar o sentido do verbo: e é a base para saber se há crase.","pontos":["Assistir: no sentido de ver/presenciar, pede ‘a’ (assistir ao jogo); no sentido de ajudar, é transitivo direto (o médico assiste o paciente); no sentido de caber, pede ‘a’ (o direito assiste ao segurado).","Aspirar: desejar pede ‘a’ (aspirar ao cargo); inspirar/cheirar é direto (aspirar o ar). Visar: objetivar pede ‘a’ (visar ao lucro: hoje também se aceita sem preposição); mirar ou dar visto é direto (visar o alvo, visar o cheque).","Obedecer/desobedecer pedem ‘a’ (obedecer às normas). Preferir pede ‘a’ e não aceita ‘mais’ nem ‘do que’ (prefiro café a chá).","Ir, chegar, voltar indicam destino com ‘a’ (chegar a Brasília, ir ao banco), não com ‘em’ na norma-padrão.","Implicar (acarretar) é transitivo direto: ‘A falta implica desconto’ (e não ‘implica em’).","Lembrar/esquecer: sem pronome, transitivos diretos (lembrei o fato); pronominais, pedem ‘de’ (lembrei-me do fato). Errado: ‘lembrei do fato’ na norma culta formal.","Pagar e perdoar: objeto direto para coisa, indireto para pessoa (pagar a dívida ao banco; perdoar ao devedor).","Simpatizar e antipatizar pedem ‘com’ e não são pronominais (simpatizo com ele: não ‘me simpatizo’). Namorar é transitivo direto (namorar alguém).","Regência nominal comum: acessível a, apto a/para, compatível com, favorável a, residente em, situado em, obediência a, respeito a/por.","Pronome relativo herda a preposição do verbo: ‘o cargo a que aspiro’, ‘a lei de que precisamos’, ‘a sala em que trabalho’."],"pegadinhas":["Retirar a preposição exigida em reescrita (‘quando comparadas as’ em vez de ‘comparadas às’) e dizer que a correção foi mantida (P22-004).","Usar ‘assistir o filme’ como correto no sentido de ver.","Omitir a preposição antes do pronome relativo (‘o cargo que aspiro’: errado na norma-padrão)."],"base_legal":"Não se aplica (conteúdo de Língua Portuguesa).","questoes":["PT-005","P22-004"]},{"id":"pt-11","disciplina":"Português","topico":"Significação das palavras (sinonímia, antonímia, polissemia)","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Estuda o sentido das palavras no contexto. No Cebraspe aparece como ‘a substituição de X por Y manteria o sentido do texto?’: a resposta depende do contexto, não do dicionário.","pontos":["Sinônimos: sentido igual ou próximo NO CONTEXTO (driblar o desemprego = contornar o desemprego). Antônimos: sentidos opostos (otimista x pessimista).","Polissemia: uma palavra com vários sentidos relacionados (‘prestação’ = parcela de dívida; no texto de Rachel de Queiroz, também o ‘preço’ do envelhecimento).","Denotação: sentido literal, de dicionário. Conotação: sentido figurado (‘tabela Price insaciável comendo juros de vida’).","Homônimos homófonos (mesmo som, grafia diferente): cela/sela, concerto (espetáculo)/conserto (reparo), cessão (ceder)/sessão (reunião)/seção (divisão), acender/ascender.","Homônimos homógrafos (mesma grafia, som diferente): colher (verbo) / colher (talher).","Parônimos (parecidos, sentidos diferentes): descrição/discrição, eminente (ilustre)/iminente (prestes a ocorrer), ratificar (confirmar)/retificar (corrigir), infligir (aplicar pena)/infringir (violar), comprimento (medida)/cumprimento (saudação, execução), deferir (conceder)/diferir (adiar, diferenciar), mandado (ordem judicial)/mandato (período de representação).","Hiperônimo é o termo geral (benefício); hipônimo é o específico (aposentadoria, pensão). Ambos servem para retomar referentes sem repetição.","Figuras comuns: metáfora (comparação implícita: ‘a rosa’ como imagem da vida), metonímia (parte pelo todo: ‘ler Machado’), eufemismo (suavizar: ‘partiu’ = morreu), ironia, hipérbole.","Expressões de tempo e posição podem ser deslocadas sem alterar o sentido se continuarem modificando o mesmo termo (P22-007)."],"pegadinhas":["Propor sinônimo de dicionário que não serve no contexto (ex.: trocar ‘prestação’ por ‘serviço’).","Confundir parônimos em reescritas: ‘retificar’ no lugar de ‘ratificar’, ‘mandato’ no lugar de ‘mandado’.","Afirmar que o deslocamento de um advérbio sempre altera o sentido (ou nunca altera): depende do termo ao qual ele continua ligado."],"base_legal":"Não se aplica (conteúdo de Língua Portuguesa).","questoes":["P22-007","P22-004"]},{"id":"pt-12","disciplina":"Português","topico":"Coesão e coerência textual","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"Coesão é a ligação gramatical entre as partes do texto (pronomes, conectivos, sinônimos); coerência é a lógica do sentido global. Um texto pode ter coesão e ser incoerente, e vice-versa.","pontos":["Coesão referencial: retomar ou antecipar termos com pronomes, sinônimos, hiperônimos ou elipse. Anáfora = retoma o que veio antes; catáfora = anuncia o que vem depois.","Para achar o referente de um pronome, teste a substituição: em ‘o destino dela era murchar’, ‘dela’ = da rosa (P22-012).","‘Estas’ e ‘aquelas’ retomando dois termos: ‘estas’ = o mais próximo (citado por último); ‘aquelas’ = o mais distante (citado primeiro).","Coesão sequencial: conectivos que ligam ideias: adição (e, além disso), oposição (mas, porém, contudo), concessão (embora, apesar de), causa (porque, visto que), conclusão (portanto, logo), condição (se, caso), finalidade (para que, a fim de).","Trocar um conectivo por outro só mantém o sentido se ambos tiverem o MESMO valor lógico (porém = contudo = todavia; mas ≠ portanto).","Elipse: omissão de termo facilmente recuperável (‘Os que vão perder o emprego, os que se verão doidos com as dívidas...’: omite-se ‘Sem falar n...’).","Coerência: compatibilidade entre as ideias, sem contradições internas, e com o conhecimento de mundo; também envolve a progressão (o texto traz informação nova).","Deslocar termos é coerente se a relação entre eles se mantém (P22-007: ‘mais recentemente’ continua ligado a ‘trabalhar por conta própria’).","Relações lógicas entre parágrafos (introdução, desenvolvimento, conclusão) também são objeto de itens de coerência."],"pegadinhas":["Indicar como referente de um pronome um termo do mesmo gênero e número, mas que não faz sentido no contexto.","Trocar conectivo concessivo (embora) por adversativo (mas) sem ajustar a estrutura e dizer que nada mudou.","Inverter o referente de ‘estas/aquelas’ numa comparação entre dois grupos."],"base_legal":"Não se aplica (conteúdo de Língua Portuguesa).","questoes":["PT-004","P22-007","P22-012","PT-001"]},{"id":"pt-13","disciplina":"Português","topico":"Redação de correspondências oficiais (Manual de Redação da Presidência da República)","recorrencia":"alta","provas":[2012,2016,2022],"resumo":"A redação oficial é a forma como o poder público redige seus atos e comunicações. A referência é o Manual de Redação da Presidência da República, 3ª edição (2018), que padronizou os expedientes no chamado ‘padrão ofício’.","pontos":["Atributos da redação oficial (3ª ed.): clareza e precisão, objetividade, concisão, coesão e coerência, impessoalidade, formalidade e padronização, e uso da norma-padrão da língua.","Impessoalidade: o texto é escrito em nome do serviço público, sem impressões pessoais, para qualquer cidadão; não há espaço para gírias, jargões ou linguagem rebuscada desnecessária.","Padrão ofício: a 3ª edição aboliu a distinção entre aviso, ofício e memorando: todos passaram a se chamar ‘ofício’, com a mesma diagramação.","Partes do ofício: cabeçalho (com brasão), identificação do expediente (‘OFÍCIO Nº 123/2026/SIGLA’), local e data (‘Brasília, 9 de novembro de 2026.’), endereçamento, assunto, texto (introdução, desenvolvimento, conclusão), fecho, assinatura com nome e cargo.","Fechos: ‘Respeitosamente,’ para autoridades de hierarquia superior (inclusive o Presidente da República); ‘Atenciosamente,’ para autoridades de mesma hierarquia, inferior ou particulares.","Vocativo: ‘Excelentíssimo Senhor’ + cargo apenas para chefes de Poder (Presidente da República, Presidente do Congresso Nacional, Presidente do STF). Demais autoridades: ‘Senhor’ + cargo (‘Senhor Ministro,’).","Pronomes de tratamento: concordância sempre na 3ª pessoa (‘Vossa Excelência está convidado... sua presença’). Usa-se ‘Vossa’ ao falar COM a autoridade e ‘Sua’ ao falar SO
